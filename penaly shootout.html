<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRKLIVE19 • Penalty Shootout Overlay — Emerald Teal Stadium</title>
<style>
:root{--a:#ffb02e;--b:#f04c69;--gold:#fff0b3;--bg:#102c2a;--panel:rgba(13,43,40,.97);--line:rgba(255,255,255,.18);--accent:#ffb02e;--result:#c52b48;--resultText:#ffffff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:flex;align-items:flex-end;justify-content:center;padding:0 1vw 1.2vh}
.overlay{width:min(980px,96vw);position:relative;flex:0 1 auto;filter:drop-shadow(0 7px 14px #000b);animation:rise .45s ease-out;min-width:0}
.live{position:absolute;right:5px;top:-19px;display:flex;align-items:center;gap:5px;font-size:clamp(8px,.7vw,10px);font-weight:1000;letter-spacing:1px;text-shadow:0 2px 6px #000}
.dot{width:8px;height:8px;background:#ff304f;border-radius:50%;box-shadow:0 0 10px #ff304f;animation:blink .9s infinite}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 10px;background:linear-gradient(100deg,var(--accent) 0%,color-mix(in srgb,var(--accent),#ffffff 12%) 30%,var(--bg) 30%,color-mix(in srgb,var(--bg),#000000 18%) 100%);border:1px solid #ffffff45;border-bottom:3px solid var(--accent);border-radius:5px 5px 0 0;box-shadow:inset 0 1px 0 #ffffff30}
.competition{font-size:clamp(9px,.9vw,12px);font-weight:1000;letter-spacing:1.1px;text-transform:uppercase;min-width:0;overflow-wrap:anywhere;color:#ffffff;text-shadow:0 1px #0008}
.phase{font-size:clamp(8px,.75vw,10px);font-weight:900;color:#fff;letter-spacing:.8px;text-align:right;flex-shrink:0}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,130px) minmax(0,1fr);background:linear-gradient(110deg,var(--bg),color-mix(in srgb,var(--bg),#000000 18%) 50%,var(--bg));border:1px solid #ffffff28;border-top:0;overflow:hidden}
.team{display:flex;align-items:center;gap:8px;padding:7px 10px;min-width:0;position:relative;background:linear-gradient(100deg,#ffffff08,transparent)}
.team:first-child{border-left:4px solid var(--a)}.team:last-child{border-right:4px solid var(--b)}
.team.right{flex-direction:row-reverse;text-align:right}
.crest{width:clamp(28px,3vw,38px);height:clamp(28px,3vw,38px);flex-shrink:0;display:grid;place-items:center;border-radius:50%;border:2px solid var(--a);background:linear-gradient(145deg,var(--a),color-mix(in srgb,var(--a),#000000 28%));color:#19120a;font-weight:1000;font-size:clamp(12px,1.5vw,18px);box-shadow:0 0 0 3px #ffb02e18}
.right .crest{border-color:var(--b);color:#fff;background:linear-gradient(145deg,var(--b),color-mix(in srgb,var(--b),#000000 35%));box-shadow:0 0 0 3px #f04c6918}
.teamname{font-size:clamp(10px,1vw,14px);font-weight:1000;letter-spacing:.25px;text-transform:uppercase;white-space:normal;overflow-wrap:anywhere;line-height:1.15;min-width:0}
.sub{font-size:clamp(7px,.65vw,9px);font-weight:900;letter-spacing:1px;color:#aeb3bd;margin-top:3px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 5px;background:linear-gradient(180deg,color-mix(in srgb,var(--bg),#ffffff 12%),var(--bg));border-left:1px solid #ffffff20;border-right:1px solid #ffffff20;position:relative}
.score{display:flex;align-items:center;gap:9px;font-size:clamp(18px,2.2vw,27px);font-weight:1000;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 3px 0 #0008}
.sa{color:var(--a)}.sb{color:var(--b)}.dash{font-size:.7em;color:#f4f4f4}
.scorelabel{margin-top:5px;color:#ffbd52;font-size:clamp(7px,.65vw,9px);font-weight:1000;letter-spacing:1.6px}
.kicks{display:grid;grid-template-columns:1fr 1fr;background:linear-gradient(90deg,color-mix(in srgb,var(--bg),#ffffff 7%),color-mix(in srgb,var(--bg),#000000 12%));border:1px solid #ffffff28;border-top:0;border-radius:0 0 5px 5px}
.kickside{padding:5px 9px 6px;min-width:0}.kickside+.kickside{border-left:1px solid #ffffff20}
.kickhead{display:flex;align-items:center;justify-content:space-between;gap:7px;font-size:clamp(8px,.75vw,10px);font-weight:900;letter-spacing:.35px;color:#c7cbd4;text-transform:uppercase;min-width:0}
.kickhead strong{color:#fff;min-width:0;overflow-wrap:anywhere;white-space:normal;line-height:1.15}.kickhead span{flex-shrink:0;white-space:nowrap;color:#ffcf79}
.slots{display:flex;flex-wrap:wrap;gap:clamp(3px,.45vw,5px);margin-top:5px;align-items:center;min-width:0}
.slot{height:clamp(11px,1vw,14px);width:clamp(11px,1vw,14px);border-radius:3px;border:1px solid #626672;background:linear-gradient(145deg,#46746d,#214943);position:relative}
.slot.goal{border-color:#ffc45c;background:linear-gradient(145deg,#ffb02e,#b85b0c);box-shadow:0 0 8px #ffb02e30}.slot.goal:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#17120a;font-size:12px;font-weight:1000}
.slot.miss{border-color:#ff7087;background:linear-gradient(145deg,#f04c69,#79172c)}.slot.miss:after{content:"×";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:1000}
.slot.active{border-color:#fff0b3;box-shadow:0 0 0 2px #fff0b333,0 0 10px #fff0b355;animation:pulse 1.1s infinite}
.foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:4px;padding:0 2px;font-size:clamp(9px,.8vw,11px);font-weight:900;letter-spacing:.3px;text-shadow:0 2px 6px #000;flex-wrap:wrap;line-height:1.25}.foot>span{min-width:0;overflow-wrap:anywhere}
.shooter{color:#ffd16e;text-transform:uppercase}.status{background:linear-gradient(90deg,#ffb02e,#ff764a);color:#19120b;padding:4px 7px;border-radius:3px;letter-spacing:.35px;white-space:normal;text-align:center;overflow-wrap:anywhere;max-width:58%;font-weight:1000}
.result-banner{display:none;margin-top:5px;padding:6px 9px;text-align:center;font-size:clamp(12px,1.2vw,16px);font-weight:1000;letter-spacing:.7px;text-transform:uppercase;color:#fff;background:linear-gradient(100deg,color-mix(in srgb,var(--result),#000000 20%),var(--result) 48%,color-mix(in srgb,var(--result),#000000 35%));color:var(--resultText);border:1px solid color-mix(in srgb,var(--result),#ffffff 35%);border-left:5px solid var(--accent);border-radius:4px;box-shadow:0 0 18px #f04c6933;overflow-wrap:anywhere;line-height:1.2}.result-banner.show{display:block;animation:rise .35s ease-out}.result-detail{display:block;font-size:clamp(9px,.75vw,11px);letter-spacing:.3px;margin-top:3px;color:#fff1d7;line-height:1.2;overflow-wrap:anywhere}
.controller{position:fixed;top:14px;left:14px;width:min(340px,calc(100vw - 28px));max-height:92vh;overflow:auto;z-index:20;background:rgba(13,43,40,.97);border:1px solid #ffb02e;border-radius:10px;padding:15px;box-shadow:0 15px 40px #0009;font-size:13px}.controller h2{margin:0 0 12px;font-size:15px;letter-spacing:.5px}.controller label{display:block;margin:9px 0 4px;color:#aeb3bd;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.6px}.controller input,.controller select{width:100%;padding:8px 9px;background:#1d4942;color:#fff;border:1px solid #5c8980;border-radius:5px;outline:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.buttons{display:flex;gap:7px;flex-wrap:wrap}.controller button{flex:1;min-width:80px;margin-top:8px;padding:9px;border:0;border-radius:5px;font-weight:1000;color:#17120b;background:#ffb02e;cursor:pointer}.controller button.blue{background:#ffcf69}.controller button.red{background:#f04c69;color:white}.controller button.dark{background:#24534d;color:#eaf3ff;border:1px solid #5c8980}.note{font-size:11px;color:#a3aab8;line-height:1.45;margin-top:10px}.hide-controller .controller{display:none}
@keyframes blink{50%{opacity:.25;box-shadow:0 0 2px #ff304f}}@keyframes pulse{50%{transform:scale(1.08)}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){body{padding:0 1vw 1vh}.overlay{width:98vw}.top{padding:4px 6px;gap:4px}.competition{font-size:8px;letter-spacing:.45px}.phase{font-size:7px;letter-spacing:.2px}.main{grid-template-columns:minmax(0,1fr) 76px minmax(0,1fr)}.team{padding:5px 4px;gap:4px}.crest{width:22px;height:22px;font-size:11px}.teamname{font-size:9px;letter-spacing:0;line-height:1.1}.sub{font-size:6px;letter-spacing:.3px;margin-top:2px}.center{padding:5px 2px}.score{font-size:17px;gap:4px}.scorelabel{font-size:7px;letter-spacing:.35px;margin-top:3px}.kickside{padding:4px 4px}.kickhead{font-size:8px;letter-spacing:0;gap:3px;align-items:flex-start}.slots{gap:3px;margin-top:4px}.slot{height:10px;width:10px;border-radius:3px}.slot.goal:after{font-size:9px}.slot.miss:after{font-size:11px}.foot{font-size:8px;gap:4px;line-height:1.2}.status{padding:3px 4px;letter-spacing:0}.result-banner{font-size:11px;padding:5px 5px;margin-top:4px;letter-spacing:.35px}.result-detail{font-size:9px;line-height:1.2}}
@media(max-width:380px){.overlay{width:98vw}.main{grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr)}.team{padding:4px 3px;gap:3px}.crest{width:18px;height:18px;font-size:10px}.teamname{font-size:8px}.sub{font-size:6px}.score{font-size:15px;gap:3px}.scorelabel{font-size:6px;letter-spacing:0}.kickside{padding:4px 3px}.kickhead{font-size:7px;flex-wrap:wrap}.slot{width:9px;height:9px}.live{top:-15px;font-size:8px}.status{max-width:55%}}
</style></head>
<body>
<div class="overlay">
  <div class="live"><span class="dot"></span> BRKLIVE19 <span style="color:#ff425f">LIVE</span></div>
  <div class="top"><div class="competition" id="compOut">PENALTY SHOOTOUT</div><div class="phase" id="phaseOut">ROUND 1 · KICK 1</div></div>
  <div class="main">
    <div class="team"><div class="crest" id="crestAOut">A</div><div style="min-width:0"><div class="teamname" id="teamAOut">TEAM A</div><div class="sub">HOME SIDE</div></div></div>
    <div class="center"><div class="score"><span class="sa" id="scoreAOut">0</span><span class="dash">:</span><span class="sb" id="scoreBOut">0</span></div><div class="scorelabel">PENALTY SCORE</div></div>
    <div class="team right"><div class="crest" id="crestBOut">B</div><div style="min-width:0"><div class="teamname" id="teamBOut">TEAM B</div><div class="sub">AWAY SIDE</div></div></div>
  </div>
  <div class="kicks">
    <div class="kickside"><div class="kickhead"><strong id="kickAName">TEAM A</strong><span id="madeA">0 SCORED</span></div><div class="slots" id="slotsA"></div></div>
    <div class="kickside"><div class="kickhead"><strong id="kickBName">TEAM B</strong><span id="madeB">0 SCORED</span></div><div class="slots" id="slotsB"></div></div>
  </div>
  <div class="foot"><span>SHOOTER: <span class="shooter" id="shooterOut">—</span></span><span class="status" id="statusOut">TEAM A TO KICK</span></div>
  <div class="result-banner" id="resultBanner"><span id="resultTitle">MATCH FINISHED</span><span class="result-detail" id="resultDetail"></span></div>
</div>
<script>
const $=id=>document.getElementById(id);
let active='A', matchFinished=false;
const data={A:[],B:[]};
function goals(t){return data[t].filter(x=>x==='goal').length}
function render(){
  const ga=goals('A'),gb=goals('B');
  $('scoreAOut').textContent=ga;$('scoreBOut').textContent=gb;
  $('madeA').textContent=ga+' / '+data.A.length+' SCORED';
  $('madeB').textContent=gb+' / '+data.B.length+' SCORED';
  ['A','B'].forEach(t=>{
    const el=$('slots'+t);el.innerHTML='';
    for(let i=0;i<Math.max(5,data[t].length);i++){
      const s=document.createElement('span');
      s.className='slot'+(data[t][i]==='goal'?' goal':data[t][i]==='miss'?' miss':'')+(i===data[t].length&&active===t&&!matchFinished?' active':'');
      s.title=data[t][i]||'Pending';el.appendChild(s);
    }
  });
  $('statusOut').textContent=matchFinished?'MATCH FINISHED':(active==='A'?$('teamAOut').textContent:$('teamBOut').textContent)+' TO KICK';
}
function syncFromController(){
  try{
    const raw=localStorage.getItem('brklive19_penalty_shootout');
    if(!raw)return;
    const d=JSON.parse(raw);
    if(d.colors){const r=document.documentElement.style;r.setProperty('--bg',d.colors.bg||'#102c2a');r.setProperty('--panel',d.colors.bg||'#102c2a');r.setProperty('--accent',d.colors.accent||'#ffb02e');r.setProperty('--a',d.colors.teamA||d.colors.accent||'#ffb02e');r.setProperty('--b',d.colors.teamB||'#f04c69');r.setProperty('--result',d.colors.result||'#c52b48');r.setProperty('--resultText',d.colors.resultText||'#ffffff');}
    $('teamAOut').textContent=d.teamA||'TEAM A';
    $('teamBOut').textContent=d.teamB||'TEAM B';
    $('kickAName').textContent=d.teamA||'TEAM A';
    $('kickBName').textContent=d.teamB||'TEAM B';
    $('crestAOut').textContent=(d.teamA||'A').trim().slice(0,2).toUpperCase();
    $('crestBOut').textContent=(d.teamB||'B').trim().slice(0,2).toUpperCase();
    active=d.activeTeam||'A';
    data.A=(d.kicks?.A||[]).map(x=>typeof x==='string'?x:x.result);
    data.B=(d.kicks?.B||[]).map(x=>typeof x==='string'?x:x.result);
    matchFinished=!!d.finished;
    $('phaseOut').textContent='ROUND '+(d.round||1)+' · KICK '+(data[active].length+1);
    $('shooterOut').textContent=d.shooter||'—';
    render();
    if(matchFinished){
      $('resultTitle').textContent=d.result||'MATCH FINISHED';
      $('resultDetail').textContent='FINAL PENALTY SCORE: '+(d.scoreA??goals('A'))+' – '+(d.scoreB??goals('B'));
      $('resultBanner').classList.add('show');
    }else $('resultBanner').classList.remove('show');
  }catch(e){console.warn('Shootout sync failed',e)}
}
window.addEventListener('storage',e=>{if(e.key==='brklive19_penalty_shootout')syncFromController()});
setInterval(syncFromController,500);
syncFromController();
</script></body></html>
