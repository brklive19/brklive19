    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBLWq1bqJ32F2cg3mqYQ0uwXcS3zvTA3A4",
            authDomain: "brklive19-2bab4.firebaseapp.com",
            databaseURL: "https://brklive19-2bab4-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "brklive19-2bab4",
            storageBucket: "brklive19-2bab4.firebasestorage.app",
            messagingSenderId: "294058533898",
            appId: "1:294058533898:web:4996705937e969939cabf3",
            measurementId: "G-RW18E7LVEX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const liveRef = ref(db, "liveScore");

        const requestedMatch = new URLSearchParams(location.search).get('matchId') || localStorage.getItem('brklive19_current_match_id') || '';
        if(requestedMatch){
            const matchRef = ref(db, 'liveScoreByMatch/' + encodeURIComponent(requestedMatch));
            onValue(matchRef, snapshot => { const data=snapshot.val(); if(data) updateOverlay(data); });
        }

        const STORAGE_KEY = 'brklive19_liveScore';
        const STORAGE_TICK_KEY = 'brklive19_liveScore_tick';
        const CHANNEL_1 = 'BRKLIVE19_LIVE_OVERLAY';
        const CHANNEL_2 = 'BRKLIVE19_SCORER_DATA';

        const el = {
            statusDot: document.getElementById('statusDot'),
            eventOverlay: document.getElementById('eventOverlay'),
            marqueeText: document.getElementById('marqueeText'),
            overlayBar: document.getElementById('overlayBar'),
            battingTeam: document.getElementById('batting-team'),
            teamScoreMain: document.getElementById('team-score-main'),
            teamOvers: document.getElementById('team-overs'),
            teamCrr: document.getElementById('team-crr'),
            strikerName: document.getElementById('striker-name'),
            strikerStats: document.getElementById('striker-stats'),
            nonStrikerName: document.getElementById('non-striker-name'),
            nonStrikerStats: document.getElementById('non-striker-stats'),
            inningsLabel: document.getElementById('innings-label'),
            bowlerName: document.getElementById('bowler-name'),
            bowlerStats: document.getElementById('bowler-stats'),
            currentOver: document.getElementById('current-over'),
            displayScreen: document.getElementById('displayScreen'),
            displayContentWrapper: document.getElementById('displayContentWrapper'),
            displayKicker: document.getElementById('displayKicker'),
            displayTitle: document.getElementById('displayTitle'),
            displaySubtitle: document.getElementById('displaySubtitle'),
            displayStrip: document.getElementById('displayStrip'),
            displayContent: document.getElementById('displayContent'),
            displayGrid: document.getElementById('displayGrid'),
            lowerThirdScreen: document.getElementById('lowerThirdScreen'),
            ltTitle: document.getElementById('ltTitle'),
            ltTeam: document.getElementById('ltTeam'),
            ltSubtitle: document.getElementById('ltSubtitle'),
            ltCards: document.getElementById('ltCards')
        };

        const UP = v => String(v == null ? '' : v).toUpperCase();
        function formatOvers(balls){ if(!balls) return '0.0'; return Math.floor(balls/6)+'.'+(balls%6); }
        function calculateCRR(runs, balls){ if(!balls||balls===0) return '0.00'; return ((runs/balls)*6).toFixed(2); }
        function getBatterStats(data, playerName){
            if(!playerName || !data.batters || !data.batters[playerName]) return '0 (0)';
            const b = data.batters[playerName];
            return `${b.runs||0} (${b.balls||0})`;
        }
        function getBowlerStats(data, playerName){
            if(!playerName || !data.bowlers || !data.bowlers[playerName]) return '0-0-0-0';
            const b = data.bowlers[playerName];
            return `${formatOvers(b.balls)}-${Number(b.runs||0)}-${Number(b.wickets||0)}`;
        }
        function escapeHtml(v){ return String(v).replace(/[&<>'"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
        const first = (...v) => v.find(x => x!==undefined && x!==null && String(x).trim()!=='');
        const str = (v, fallback='') => UP(first(v, fallback));
        function value(data, keys, fallback=''){
            for(const key of keys){
                const parts = key.split('.'); let v = data;
                for(const p of parts){ if(v==null) break; v = v[p]; }
                if(v!==undefined && v!==null && String(v).trim()!=='') return v;
            }
            return fallback;
        }
        function normName(s){ return String(s||'').trim().toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' '); }
        function findByPlayerName(map, name){
            if(!map || typeof map !== 'object' || Array.isArray(map)) return null;
            if(map[name]) return map[name];
            const target = normName(name); if(!target) return null;
            for(const k of Object.keys(map)){ if(normName(k) === target) return map[k]; }
            for(const k of Object.keys(map)){
                const nk = normName(k);
                if(nk.length>=4 && target.length>=4 && (nk.includes(target)||target.includes(nk))) return map[k];
            }
            return null;
        }

        function getDismissal(b, playerName, data){
            if(!b || typeof b !== 'object') return { text:'', cls:'' };
            const statusRaw = String(b.status || b.battingStatus || b.state || '').toLowerCase();
            if(
                b.didNotBat === true || b.dnb === true ||
                statusRaw.includes('did not bat') || statusRaw.includes('didnt bat') ||
                statusRaw.includes('dnb') || statusRaw.includes('yet to bat') ||
                statusRaw.includes('not batted')
            ){ return { text:'', cls:'blank' }; }
            const dismissalRaw = b.dismissal || b.howOut || b.how_out || b.outText || b.dismissalText || b.outDesc || b.outDescription || b.wicketText;
            if(dismissalRaw !== undefined && dismissalRaw !== null){
                const d = String(dismissalRaw).trim();
                if(d){
                    const dl = d.toLowerCase();
                    if(dl === 'no' || dl === 'n' || dl.includes('not out') || dl.includes('notout') || dl.includes('batting') || dl.includes('retired hurt') || dl.includes('retired not out')){
                        return { text:'NOT OUT', cls:'not-out' };
                    }
                    if(dl === 'out' || dl === 'yes' || dl === 'y') return { text:'OUT', cls:'' };
                    return { text: UP(d), cls:'' };
                }
            }
            const striker = value(data,['striker','currentStriker'],'');
            const nonStriker = value(data,['nonStriker','currentNonStriker'],'');
            if(playerName && (playerName === striker || playerName === nonStriker)) return { text:'NOT OUT', cls:'not-out' };
            if(b.isOut === true || b.out === true || b.dismissed === true || b.wicket === true) return { text:'OUT', cls:'' };
            if(b.isOut === false || b.out === false || b.notOut === true || b.unbeaten === true) return { text:'NOT OUT', cls:'not-out' };
            const balls = Number(b.balls || 0);
            const runs  = Number(b.runs || 0);
            if(balls === 0 && runs === 0) return { text:'', cls:'blank' };
            return { text:'NOT OUT', cls:'not-out' };
        }

        function getInningsData(data, inningsNum){
            const direct = inningsNum === 2 ? data.secondInnings : data.firstInnings;
            if(direct && typeof direct === 'object') return direct;
            if(Number(data.innings||1) === inningsNum) {
                return {
                    team: data.battingTeam, runs: data.runs, wickets: data.wickets,
                    balls: data.legalBalls || data.balls, extras: data.extras,
                    batters: data.batters, bowlers: data.bowlers,
                    fow: data.fow || data.fallOfWickets,
                    partnerships: data.partnerships
                };
            }
            return {};
        }

        function renderBattingScorecard(body, strip, data, innNum){
            const inn = getInningsData(data, innNum);
            const teamA = str(value(data,['teamA','teams.A','teamAName'],'TEAM A'));
            const teamB = str(value(data,['teamB','teams.B','teamBName'],'TEAM B'));
            const team  = inn.team === 'A' ? teamA : inn.team === 'B' ? teamB : str(value(data,['battingTeamName','battingTeam'],''));

            const runs    = Number(inn.runs || 0);
            const wickets = Number(inn.wickets || 0);
            const balls   = Number(inn.balls || inn.legalBalls || 0);
            const extras  = inn.extras !== undefined ? inn.extras : 0;
            const crr     = calculateCRR(runs, balls);
            const batters = inn.batters || data.batters || {};
            const fow     = inn.fow || data.fow || data.fallOfWickets || {};
            const partnerships = inn.partnerships || data.partnerships || [];

            strip.innerHTML = `
                <div class="strip-item"><b>SCORE</b><span>${runs}/${wickets}</span></div>
                <div class="strip-item"><b>OVERS</b><span>${formatOvers(balls)}</span></div>
                <div class="strip-item"><b>CRR</b><span>${crr}</span></div>
                <div class="strip-item"><b>EXTRAS</b><span>${typeof extras === 'object' ? (extras.total || 0) : extras}</span></div>
                <div class="strip-item"><b>TEAM</b><span>${escapeHtml(team || '—')}</span></div>
            `;

            const batterKeys = Object.keys(batters);
            const striker = value(data,['striker','currentStriker'],'');
            const nonStriker = value(data,['nonStriker','currentNonStriker'],'');

            let rowsHtml = '';
            if(batterKeys.length){
                rowsHtml = batterKeys.map(p=>{
                    const b = batters[p] || {};
                    const r = Number(b.runs||0), bl = Number(b.balls||0);
                    const f = Number(b.fours||0), s = Number(b.sixes||0);
                    const sr = bl > 0 ? ((r/bl)*100).toFixed(2) : '0.00';
                    const isActive = (p === striker || p === nonStriker);
                    const dis = getDismissal(b, p, data);
                    const disCls = dis.cls ? ` ${dis.cls}` : '';
                    const disText = dis.text || '';
                    return `
                        <div class="table-row ${isActive ? 'active' : ''}">
                            <div class="cell-name">${escapeHtml(UP(p))}</div>
                            <div class="cell-dismissal${disCls}">${escapeHtml(disText)}</div>
                            <div class="cell-num highlight">${r}</div>
                            <div class="cell-num">${bl}</div>
                            <div class="cell-num gold">${f}</div>
                            <div class="cell-num gold">${s}</div>
                            <div class="cell-num">${sr}</div>
                        </div>
                    `;
                }).join('');
            } else {
                rowsHtml = `<div class="table-row"><div class="cell-name" style="grid-column:1/-1;text-align:center;color:rgba(255,255,255,.7)">NO BATTING DATA</div></div>`;
            }

            let sideHtml = '';
            const extrasDetail = extras && typeof extras === 'object' ? extras : {};
            sideHtml += `
                <div class="side-card gold">
                    <div class="sc-title">EXTRAS <span>${typeof extras === 'object' ? (extras.total || 0) : extras}</span></div>
                    ${extrasDetail.wides !== undefined ? `<div class="side-row"><b>WIDES</b><span>${extrasDetail.wides}</span></div>` : ''}
                    ${extrasDetail.noBalls !== undefined ? `<div class="side-row"><b>NO BALLS</b><span>${extrasDetail.noBalls}</span></div>` : ''}
                    ${extrasDetail.byes !== undefined ? `<div class="side-row"><b>BYES</b><span>${extrasDetail.byes}</span></div>` : ''}
                    ${extrasDetail.legByes !== undefined ? `<div class="side-row"><b>LEG BYES</b><span>${extrasDetail.legByes}</span></div>` : ''}
                </div>
            `;
            const fowKeys = Object.keys(fow);
            if(fowKeys.length){
                const fowRows = fowKeys.slice(0,10).map(k=>{
                    const v = fow[k];
                    if(typeof v === 'object'){
                        return `<div class="side-row"><b>${escapeHtml(UP(k))}</b><span>${v.score || v.runs || ''} (${v.over || v.overs || ''})</span></div>`;
                    }
                    return `<div class="side-row"><b>${escapeHtml(UP(k))}</b><span>${v}</span></div>`;
                }).join('');
                sideHtml += `<div class="side-card red"><div class="sc-title">FALL OF WICKETS</div>${fowRows}</div>`;
            }
            if(Array.isArray(partnerships) && partnerships.length){
                const pRows = partnerships.slice(0,10).map((p,i)=>`
                    <div class="side-row"><b>W${i+1}</b><span>${p.runs || 0} (${p.balls || 0})</span></div>
                `).join('');
                sideHtml += `<div class="side-card pink"><div class="sc-title">PARTNERSHIPS</div>${pRows}</div>`;
            }

            body.classList.add('has-sidebar');
            body.innerHTML = `
                <div class="side-panel">${sideHtml}</div>
                <div class="tables-panel">
                    <div class="table-block batting">
                        <div class="table-header">
                            <div>BATTER</div><div>DISMISSAL</div><div>R</div><div>B</div><div>4S</div><div>6S</div><div>SR</div>
                        </div>
                        <div class="table-body">${rowsHtml}</div>
                        <div class="table-footer">
                            <div class="foot-item"><b>TOTAL</b><span>${runs}/${wickets} (${formatOvers(balls)} OV)</span></div>
                            <div class="foot-item"><b>EXTRAS</b><span>${typeof extras === 'object' ? (extras.total||0) : extras}</span></div>
                            <div class="foot-item"><b>CRR</b><span>${crr}</span></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderBowlingScorecard(body, strip, data, innNum){
            const inn = getInningsData(data, innNum);
            const teamA = str(value(data,['teamA','teams.A','teamAName'],'TEAM A'));
            const teamB = str(value(data,['teamB','teams.B','teamBName'],'TEAM B'));
            const batTeam  = inn.team === 'A' ? teamA : inn.team === 'B' ? teamB : str(value(data,['battingTeamName','battingTeam'],''));
            const bowlTeam = inn.team === 'A' ? teamB : inn.team === 'B' ? teamA : str(value(data,['bowlingTeamName','bowlingTeam'],''));
            const bowlers = inn.bowlers || data.bowlers || {};
            const runs    = Number(inn.runs || 0);
            const wickets = Number(inn.wickets || 0);
            const balls   = Number(inn.balls || inn.legalBalls || 0);

            strip.innerHTML = `
                <div class="strip-item"><b>BATTING TEAM</b><span>${escapeHtml(batTeam || '—')}</span></div>
                <div class="strip-item"><b>BOWLING TEAM</b><span>${escapeHtml(bowlTeam || '—')}</span></div>
                <div class="strip-item"><b>SCORE</b><span>${runs}/${wickets}</span></div>
                <div class="strip-item"><b>OVERS</b><span>${formatOvers(balls)}</span></div>
                <div class="strip-item"><b>CRR</b><span>${calculateCRR(runs, balls)}</span></div>
            `;

            const bowlerKeys = Object.keys(bowlers);
            let rowsHtml = '';
            if(bowlerKeys.length){
                rowsHtml = bowlerKeys.map(p=>{
                    const b = bowlers[p] || {};
                    const bl = Number(b.balls||0);
                    const overs = formatOvers(bl);
                    const m = Number(b.maidens||0);
                    const r = Number(b.runs||0);
                    const w = Number(b.wickets||0);
                    const ec = bl > 0 ? (r/(bl/6)).toFixed(2) : '0.00';
                    const wd = Number(b.wides || 0);
                    const nb = Number(b.noBalls || 0);
                    const sub = (wd||nb) ? `${wd ? `WD ${wd}` : ''}${wd&&nb?' · ':''}${nb ? `NB ${nb}` : ''}` : '';
                    return `
                        <div class="table-row">
                            <div class="cell-name">${escapeHtml(UP(p))}${sub ? `<small>${sub}</small>` : ''}</div>
                            <div class="cell-num overs">${overs}</div>
                            <div class="cell-num">${m}</div>
                            <div class="cell-num">${r}</div>
                            <div class="cell-num wicket">${w}</div>
                            <div class="cell-num">${ec}</div>
                        </div>
                    `;
                }).join('');
            } else {
                rowsHtml = `<div class="table-row"><div class="cell-name" style="grid-column:1/-1;text-align:center;color:rgba(255,255,255,.7)">NO BOWLING DATA</div></div>`;
            }

            body.classList.remove('has-sidebar');
            body.innerHTML = `
                <div class="tables-panel">
                    <div class="table-block bowling">
                        <div class="table-header">
                            <div>BOWLER</div><div>OVERS</div><div>M</div><div>R</div><div>W</div><div>ECON</div>
                        </div>
                        <div class="table-body">${rowsHtml}</div>
                        <div class="table-footer">
                            <div class="foot-item"><b>INNINGS TOTAL</b><span>${runs}/${wickets} (${formatOvers(balls)} OV)</span></div>
                            <div class="foot-item"><b>RUN RATE</b><span>${calculateCRR(runs, balls)}</span></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMatchSummary(body, strip, data){
            const teamA = str(value(data,['teamA','teams.A','teamAName'],'TEAM A'));
            const teamB = str(value(data,['teamB','teams.B','teamBName'],'TEAM B'));
            const inn1 = getInningsData(data, 1);
            const inn2 = getInningsData(data, 2);
            const runs1 = Number(inn1.runs||0), wkts1 = Number(inn1.wickets||0), balls1 = Number(inn1.balls||inn1.legalBalls||0);
            const runs2 = Number(inn2.runs||0), wkts2 = Number(inn2.wickets||0), balls2 = Number(inn2.balls||inn2.legalBalls||0);
            const team1Name = inn1.team === 'A' ? teamA : inn1.team === 'B' ? teamB : teamA;
            const team2Name = inn2.team === 'A' ? teamA : inn2.team === 'B' ? teamB : teamB;
            const result = str(value(data,['matchResult','result','resultText','summaryText'],''));
            const winner = str(value(data,['winner','winningTeam'],''));
            const margin = str(value(data,['margin','winMargin'],''));
            const pom = str(value(data,['playerOfMatch','pom','manOfTheMatch'],''));
            const toss = str(value(data,['tossText','toss'],''));
            const venue = str(value(data,['venue','ground'],''));
            const tourn = str(value(data,['tournamentName','tournament'],''));

            strip.innerHTML = `
                ${tourn ? `<div class="strip-item"><b>TOURNAMENT</b><span>${escapeHtml(tourn)}</span></div>` : ''}
                ${venue ? `<div class="strip-item"><b>VENUE</b><span>${escapeHtml(venue)}</span></div>` : ''}
                ${toss ? `<div class="strip-item"><b>TOSS</b><span>${escapeHtml(toss)}</span></div>` : ''}
            `;

            body.classList.remove('has-sidebar');
            body.innerHTML = `
                <div class="summary-grid">
                    <div class="summary-team-card team-a">
                        <div class="st-name">${escapeHtml(team1Name || teamA)}</div>
                        <div class="st-score">${runs1}/${wkts1}</div>
                        <div class="st-line"><b>OVERS</b><span>${formatOvers(balls1)}</span></div>
                        <div class="st-line"><b>RUN RATE</b><span>${calculateCRR(runs1, balls1)}</span></div>
                        <div class="st-line"><b>EXTRAS</b><span>${typeof inn1.extras === 'object' ? (inn1.extras?.total || 0) : (inn1.extras || 0)}</span></div>
                    </div>
                    <div class="summary-team-card team-b">
                        <div class="st-name">${escapeHtml(team2Name || teamB)}</div>
                        <div class="st-score">${runs2}/${wkts2}</div>
                        <div class="st-line"><b>OVERS</b><span>${formatOvers(balls2)}</span></div>
                        <div class="st-line"><b>RUN RATE</b><span>${calculateCRR(runs2, balls2)}</span></div>
                        <div class="st-line"><b>EXTRAS</b><span>${typeof inn2.extras === 'object' ? (inn2.extras?.total || 0) : (inn2.extras || 0)}</span></div>
                    </div>

                    ${(result || winner) ? `
                        <div class="summary-result-card">
                            <div class="rc-kicker">${winner ? 'WINNER' : 'RESULT'}</div>
                            <div class="rc-text">${escapeHtml(result || winner)}</div>
                            ${margin ? `<div class="rc-margin">${escapeHtml(margin)}</div>` : ''}
                        </div>
                    ` : ''}

                    ${pom ? `
                        <div class="summary-pom-card">
                            <div class="pom-label">PLAYER OF THE MATCH</div>
                            <div class="pom-name">${escapeHtml(pom)}</div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderPlayingXI(body, strip, data){
            const teamA = str(value(data,['teamA','teams.A','teamAName'],'TEAM A'));
            const teamB = str(value(data,['teamB','teams.B','teamBName'],'TEAM B'));
            const xiA = Array.isArray(data.xiA) ? data.xiA : (data.playingXI?.A || []);
            const xiB = Array.isArray(data.xiB) ? data.xiB : (data.playingXI?.B || []);
            const capA = str(value(data,['captainA'],''));
            const capB = str(value(data,['captainB'],''));
            const wkA  = str(value(data,['keeperA','wicketKeeperA'],''));
            const wkB  = str(value(data,['keeperB','wicketKeeperB'],''));

            strip.innerHTML = `
                <div class="strip-item"><b>TEAM A</b><span>${escapeHtml(teamA)}</span></div>
                <div class="strip-item"><b>TEAM B</b><span>${escapeHtml(teamB)}</span></div>
                ${value(data,['matchName','match']) ? `<div class="strip-item"><b>MATCH</b><span>${escapeHtml(value(data,['matchName','match'],''))}</span></div>` : ''}
            `;

            const buildXIHtml = (arr, cap, wk) => {
                if(!arr.length) return `<div class="xi-player"><div class="xi-num">—</div><div class="xi-name">NO XI NAMED</div></div>`;
                return arr.map((p, i) => {
                    const name = UP(typeof p === 'string' ? p : (p?.name || p?.playerName || ''));
                    const isCap = cap && name === UP(cap);
                    const isWk  = wk && name === UP(wk);
                    return `
                        <div class="xi-player ${isCap ? 'captain' : ''} ${isWk ? 'keeper' : ''}">
                            <div class="xi-num">${i+1}</div>
                            <div class="xi-name">${escapeHtml(name)}</div>
                            ${isCap ? '<div class="xi-tag">C</div>' : ''}
                            ${isWk ? '<div class="xi-tag">WK</div>' : ''}
                        </div>
                    `;
                }).join('');
            };

            body.classList.remove('has-sidebar');
            body.innerHTML = `
                <div class="xi-grid">
                    <div class="xi-team a">
                        <div class="xi-team-header">
                            <span>${escapeHtml(teamA)}</span>
                            <small>${xiA.length} PLAYERS</small>
                        </div>
                        <div class="xi-list">${buildXIHtml(xiA, capA, wkA)}</div>
                    </div>
                    <div class="xi-team b">
                        <div class="xi-team-header">
                            <span>${escapeHtml(teamB)}</span>
                            <small>${xiB.length} PLAYERS</small>
                        </div>
                        <div class="xi-list">${buildXIHtml(xiB, capB, wkB)}</div>
                    </div>
                </div>
            `;
        }

        function extractPlayerStatus(data){
            const ps = data.playerStatus || data.overlay?.playerStatus || {};
            const pl = data.playerLower  || data.overlay?.playerLower  || {};
            const name = String(first(
                ps.name, ps.playerName, ps.player, ps.selectedPlayer,
                pl.name, pl.playerName,
                data.playerName, data.selectedPlayer, data.player
            ) || '').trim();
            let team = String(first(ps.team, ps.teamName, ps.playerTeam, pl.team, pl.teamName,
                data.playerTeam, data.teamName, data.selectedPlayerTeam) || '').trim();
            if(!team && name){
                const p = UP(name);
                const xiA = Array.isArray(data.xiA) ? data.xiA : (data.playingXI?.A || []);
                const xiB = Array.isArray(data.xiB) ? data.xiB : (data.playingXI?.B || []);
                const toName = x => UP(typeof x === 'string' ? x : (x?.name || ''));
                if(xiA.map(toName).includes(p)) team = String(first(data.teamA, data.teams?.A, data.teamAName, '') || '');
                else if(xiB.map(toName).includes(p)) team = String(first(data.teamB, data.teams?.B, data.teamBName, '') || '');
            }
            let bat = null;
            if(ps.batting && typeof ps.batting === 'object') bat = ps.batting;
            if(!bat){
                const r = first(ps.runs, ps.battingRuns, ps.batterRuns, ps.score);
                const b = first(ps.balls, ps.ballsFaced, ps.battingBalls, ps.batterBalls);
                if(r !== undefined || b !== undefined) bat = { runs: r, balls: b };
            }
            if(!bat && name){
                const keys = ['batters','batsmen','batsman','batting','battingCard','playerBats','players','playerStats','stats','battingStats','currentBatters'];
                const sources = [data, data.firstInnings, data.secondInnings];
                for(const src of sources){ if(!src || bat) continue;
                    for(const k of keys){ const m = src[k]; if(m && typeof m === 'object' && !Array.isArray(m)){
                        const f = findByPlayerName(m, name);
                        if(f && typeof f === 'object' && (f.runs!==undefined || f.balls!==undefined)){ bat = f; break; }
                    }}
                }
            }
            let bowl = null;
            if(ps.bowling && typeof ps.bowling === 'object') bowl = ps.bowling;
            if(!bowl){
                const bB = first(ps.bowlingBalls, ps.ballsBowled);
                const bO = first(ps.overs, ps.bowlingOvers);
                const bW = first(ps.wickets, ps.bowlingWickets, ps.wicketsTaken);
                const bR = first(ps.bowlingRuns, ps.runsConceded, ps.runsGiven);
                if(bB!==undefined || bO!==undefined || bW!==undefined || bR!==undefined) bowl = { balls:bB, overs:bO, wickets:bW, runs:bR };
            }
            if(!bowl && name){
                const keys = ['bowlers','bowler','bowling','bowlingCard','playerBowl','players','playerStats','stats','bowlingStats','currentBowlers'];
                const sources = [data, data.firstInnings, data.secondInnings];
                for(const src of sources){ if(!src || bowl) continue;
                    for(const k of keys){ const m = src[k]; if(m && typeof m === 'object' && !Array.isArray(m)){
                        const f = findByPlayerName(m, name);
                        if(f && typeof f === 'object' && (f.wickets!==undefined || f.overs!==undefined || f.ballsBowled!==undefined || f.bowlingBalls!==undefined)){ bowl = f; break; }
                    }}
                }
            }
            let batting = null;
            if(bat){
                const r = bat.runs ?? bat.score ?? bat.totalRuns;
                const b = bat.balls ?? bat.ballsFaced ?? bat.battingBalls;
                if(r!==undefined || b!==undefined) batting = { runs: Number(r||0), balls: Number(b||0) };
            }
            let bowling = null;
            if(bowl){
                let oversStr;
                if(bowl.overs !== undefined && bowl.overs !== null && String(bowl.overs).trim() !== '') oversStr = String(bowl.overs);
                else { const bB = bowl.balls ?? bowl.ballsBowled; if(bB!==undefined) oversStr = formatOvers(Number(bB)); }
                const wk = bowl.wickets ?? bowl.wkts ?? bowl.wicketsTaken;
                const rn = bowl.runs ?? bowl.runsConceded ?? bowl.runsGiven;
                if(oversStr!==undefined || wk!==undefined || rn!==undefined)
                    bowling = { overs: oversStr !== undefined ? oversStr : '0.0', wickets: Number(wk||0), runs: Number(rn||0) };
            }
            return { name: name ? UP(name) : '', team: team ? UP(team) : '', batting, bowling };
        }

        function findPlayerTeam(data, playerName){
            if(!playerName) return '';
            const explicit = value(data,['playerStatus.team','playerTeam','teamName'],'');
            if(explicit) return UP(explicit);
            const p = UP(playerName);
            const xiA = Array.isArray(data.xiA) ? data.xiA : (data.playingXI?.A || []);
            const xiB = Array.isArray(data.xiB) ? data.xiB : (data.playingXI?.B || []);
            const getName = x => UP(typeof x === 'string' ? x : (x?.name || ''));
            if(xiA.map(getName).includes(p)) return str(value(data,['teamA','teams.A','teamAName'],''));
            if(xiB.map(getName).includes(p)) return str(value(data,['teamB','teams.B','teamBName'],''));
            return '';
        }

        function buildLowerThirdContent(type, data){
            const teamA = str(value(data,['teamA','teams.A','teamAName'],'TEAM A'));
            const teamB = str(value(data,['teamB','teams.B','teamBName'],'TEAM B'));
            const bat   = str(value(data,['battingTeamName','battingTeamNameShort','battingTeam'],''));
            const titleMap = {TOURNAMENT:'TOURNAMENT',MATCH:'MATCH',TOSS:'TOSS',VENUE:'VENUE',PARTNERSHIP:'PARTNERSHIP',SUMMARY:'MATCH SUMMARY',TARGET:'TARGET',FOW:'FALL OF WICKET',PLAYER:'PLAYER STATUS',STRIKER:'STRIKER','NON-STRIKER':'NON-STRIKER',BOWLER:'BOWLER',RESULT:'MATCH RESULT',SCORECARD1:'1ST INN SCORECARD',SCORECARD2:'2ND INN SCORECARD',POINTTABLE:'POINT TABLE',CUSTOM:'CUSTOM'};
            const title = UP(titleMap[type] || String(type||''));
            let subtitle = '', headerTeam = '';
            const cards = [];
            const add = (label, val, extraClass='') => { if(val!==undefined && val!==null && String(val)!=='') cards.push({ label:UP(label), value:UP(val), extraClass }); };

            if(type==='TOURNAMENT'){ subtitle = str(value(data,['tournamentName','tournament','name'],'')); add('VENUE', value(data,['venue','ground'],'')); add('MATCH', value(data,['matchName','match'],'')); add('FORMAT', value(data,['format','matchType'],'')); }
            else if(type==='MATCH'){ subtitle = str(value(data,['matchName','match'],`${teamA} VS ${teamB}`)); add('TOURNAMENT', value(data,['tournamentName','tournament'],'')); add('VENUE', value(data,['venue','ground'],'')); add('FORMAT', value(data,['format','matchType'],'')); }
            else if(type==='TOSS'){ subtitle = str(value(data,['tossText','toss'],'')); add('WINNER', value(data,['tossWinner','toss.winner'],'')); add('DECISION', value(data,['tossDecision','decision'],'')); }
            else if(type==='VENUE'){ subtitle = str(value(data,['venue','ground','venueName'],'')); add('CITY', value(data,['city','venueCity'],'')); add('COUNTRY', value(data,['country','venueCountry'],'')); }
            else if(type==='TARGET'){ const needed = value(data,['targetRemaining','remainingRuns','runsNeeded'],0); subtitle = `${bat||'TEAM'} NEED ${needed} RUNS`; add('TARGET', value(data,['target','targetScore'],'')); add('OVERS LEFT', value(data,['targetOvers','oversRemaining'],'')); add('RUNS NEEDED', needed); add('WICKETS LEFT', value(data,['wicketsLeft','wicketsRemaining'],'')); }
            else if(type==='FOW'){ subtitle = str(value(data,['fowText','dismissedPlayer','wicketPlayer'],'')); add('SCORE', value(data,['fowScore','scoreAtWicket'],'')); add('OVER', value(data,['fowOver','overAtWicket'],'')); add('BATTER', value(data,['fowBatter','dismissedPlayer'],'')); add('BOWLER', value(data,['fowBowler','wicketBowler'],'')); }
            else if(type==='STRIKER' || type==='NON-STRIKER'){ const player = type==='STRIKER' ? value(data,['striker','currentStriker','playerName']) : value(data,['nonStriker','currentNonStriker','playerName']); subtitle = UP(player || 'PLAYER'); headerTeam = findPlayerTeam(data, player); add('TEAM', headerTeam || value(data,['battingTeamName','battingTeam'],''), 'team'); add('BATTING', getBatterStats(data,player), 'batting'); if(player && data.batters && data.batters[player]){ const b = data.batters[player]; const sr = Number(b.balls)>0 ? ((Number(b.runs)||0)/Number(b.balls)*100).toFixed(2) : '0.00'; add('RUNS', b.runs||0, 'batting'); add('BALLS', b.balls||0, 'batting'); add('SR', sr, 'batting'); } }
            else if(type==='BOWLER'){ const player = value(data,['bowler','currentBowler','playerName']); subtitle = UP(player || 'BOWLER'); headerTeam = findPlayerTeam(data, player); add('TEAM', headerTeam || value(data,['bowlingTeamName','bowlingTeam'],''), 'team'); add('BOWLING', getBowlerStats(data,player), 'bowling'); if(player && data.bowlers && data.bowlers[player]){ const b = data.bowlers[player]; add('OVERS', formatOvers(b.balls||0), 'bowling'); add('WICKETS', b.wickets||0, 'bowling'); add('RUNS', b.runs||0, 'bowling'); } }
            else if(type==='PLAYER'){ const ps = extractPlayerStatus(data); subtitle = ps.name || 'PLAYER'; headerTeam = ps.team; if(ps.name) add('PLAYER', ps.name); if(ps.team) add('TEAM', ps.team, 'team'); if(ps.batting){ const { runs, balls } = ps.batting; const sr = balls > 0 ? ((runs / balls) * 100).toFixed(2) : '0.00'; add('RUNS', runs, 'batting'); add('BALLS', balls, 'batting'); add('SR', sr, 'batting'); } if(ps.bowling){ const { overs, wickets, runs } = ps.bowling; add('OVERS', overs, 'bowling'); add('WICKETS', wickets, 'bowling'); add('RUNS', runs, 'bowling'); } if(!ps.batting && !ps.bowling && ps.name) add('STATUS', 'NO BATTING / BOWLING YET'); }
            else if(type==='RESULT'){ subtitle = str(value(data,['matchResult','result','resultText'],'')); add('WINNER', value(data,['winner','winningTeam'],'')); add('MARGIN', value(data,['margin','winMargin'],'')); }
            else if(type==='SCORECARD1' || type==='SCORECARD2'){ const innNum = type === 'SCORECARD2' ? 2 : 1; const inn = getInningsData(data, innNum); const team = inn.team==='A'?teamA:inn.team==='B'?teamB:value(data,['battingTeamName','battingTeam'],''); subtitle = `${UP(team)} — ${innNum===2?'2ND':'1ST'} INNINGS`; add('SCORE', `${inn?.runs||0}/${inn?.wickets||0}`); add('OVERS', formatOvers(inn?.balls || inn?.legalBalls || 0)); add('EXTRAS', inn?.extras ?? 0); add('RUN RATE', calculateCRR(inn?.runs||0, inn?.balls||inn?.legalBalls||0)); }
            else if(type==='POINTTABLE'){ subtitle = str(value(data,['tournamentName','tournament'],'')); const pt = data.pointTable || data.pointsTable || []; if(Array.isArray(pt) && pt.length){ pt.slice(0,4).forEach((r,i)=>{ const team = r.team || r.name || `TEAM ${i+1}`; add(team, `${r.played ?? 0}P · ${r.won ?? 0}W · ${r.points ?? 0} PTS`); }); } else add('TEAMS', 'NO TABLE DATA'); }
            else if(type==='CUSTOM'){ subtitle = str(value(data,['customLower.text','displayText','message','text'],'')); add('MESSAGE', value(data,['customLower.text','displayText','message','text'],'')); }
            else { subtitle = str(value(data,['displayText','message','text'],'')); add('INFO', subtitle); }

            return { title, subtitle, cards, headerTeam };
        }

        function showLowerThirdScreen(type, data){
            const { title, subtitle, cards, headerTeam } = buildLowerThirdContent(type, data);
            const maxCards = type === 'PLAYER' ? 12 : 5;
            const textCards = cards.filter(c => !c.html).slice(0, maxCards);
            const key = 'LT|' + type + '|' + title + '|' + subtitle + '|' + headerTeam + '|' + textCards.map(c=>c.label+':'+c.value+':'+(c.extraClass||'')).join('|');
            if(key === lastLowerThirdKey && el.lowerThirdScreen.classList.contains('show')) return;
            lastLowerThirdKey = key;
            el.lowerThirdScreen.dataset.type = type;
            el.ltTitle.textContent = UP(title);
            el.ltTeam.textContent = UP(headerTeam || '');
            el.ltSubtitle.textContent = UP(subtitle) || ' ';
            el.ltCards.innerHTML = textCards.map(c => {
                const cls = 'lt-card' + (c.extraClass ? ' ' + c.extraClass : '');
                return `<div class="${cls}"><b>${escapeHtml(UP(c.label))}</b><span>${escapeHtml(UP(c.value))}</span></div>`;
            }).join('');
            el.lowerThirdScreen.classList.add('show');
        }
        function hideLowerThirdScreen(){
            if(el.lowerThirdScreen.classList.contains('show')){
                el.lowerThirdScreen.classList.remove('show');
                lastLowerThirdKey = '';
            }
        }

        /* Theme application */
        function applyDisplayTheme(type){
            const wrapper = el.displayContentWrapper;
            wrapper.classList.remove('theme-batting','theme-bowling','theme-xi','theme-summary');
            if(type==='BATTING1' || type==='BATTING2') wrapper.classList.add('theme-batting');
            else if(type==='BOWLING1' || type==='BOWLING2') wrapper.classList.add('theme-bowling');
            else if(type==='PLAYINGXI') wrapper.classList.add('theme-xi');
            else if(type==='SUMMARY') wrapper.classList.add('theme-summary');
        }

        function showFullScreen(type, data){
            el.displayGrid.style.display = 'none';
            el.displayGrid.innerHTML = '';
            const headerMap = {BATTING1:'1ST INNINGS BATTING',BATTING2:'2ND INNINGS BATTING',BOWLING1:'1ST INNINGS BOWLING',BOWLING2:'2ND INNINGS BOWLING',PLAYINGXI:'PLAYING XI',SUMMARY:'MATCH SUMMARY'};
            el.displayKicker.textContent = 'BRKLIVE19 LIVE';
            el.displayTitle.textContent = UP(headerMap[type] || type);
            applyDisplayTheme(type);
            el.displayContent.className = 'content-area';
            el.displayStrip.innerHTML = '';
            el.displaySubtitle.textContent = '';

            if(type === 'BATTING1') renderBattingScorecard(el.displayContent, el.displayStrip, data, 1);
            else if(type === 'BATTING2') renderBattingScorecard(el.displayContent, el.displayStrip, data, 2);
            else if(type === 'BOWLING1') renderBowlingScorecard(el.displayContent, el.displayStrip, data, 1);
            else if(type === 'BOWLING2') renderBowlingScorecard(el.displayContent, el.displayStrip, data, 2);
            else if(type === 'SUMMARY') renderMatchSummary(el.displayContent, el.displayStrip, data);
            else if(type === 'PLAYINGXI') renderPlayingXI(el.displayContent, el.displayStrip, data);

            el.displayScreen.classList.remove('hide');
            el.displayScreen.classList.add('show');
            el.displayScreen.setAttribute('aria-hidden','false');
            clearTimeout(screenTimer);
            const duration = Number(value(data,['displayDuration','screenDuration'],0));
            if(duration>0){ screenTimer = setTimeout(hideFullScreen, duration); }
        }
        function hideFullScreen(){
            if(el.displayScreen.classList.contains('show') || el.displayScreen.classList.contains('hide')){
                el.displayScreen.classList.remove('show');
                el.displayScreen.classList.add('hide');
                el.displayScreen.setAttribute('aria-hidden','true');
                setTimeout(()=>el.displayScreen.classList.remove('hide'), 240);
                lastFullScreenKey = '';
            }
        }

        function updateEvent(data){
            const b = data.broadcast || {};
            const active = !!(b.active && b.type);
            if(!active){ el.eventOverlay.classList.remove('show'); return; }
            const type = UP(b.type);
            const map = {FOUR:['FOUR','#00ffb3'],SIX:['SIX','#ffd400'],WICKET:['WICKET','#ff3b5c'],'RUN OUT':['RUN OUT','#ff8a00'],'FREE HIT':['FREE HIT','#00d4ff'],'HAT-TRICK BALL':['HAT-TRICK','#ff4dd2']};
            const [text, color] = map[type] || [type, '#ffffff'];
            const key = String(first(b.id,b.eventId,b.timestamp,b.time,`${type}|${b.text||''}`));
            if(key !== lastEventKey){
                lastEventKey = key;
                el.marqueeText.innerHTML = '';
                for(let i=0;i<12;i++){ const sp = document.createElement('span'); sp.textContent = UP(text); sp.style.color = color; el.marqueeText.appendChild(sp); }
                el.marqueeText.style.animation = 'none';
                void el.marqueeText.offsetWidth;
                el.marqueeText.style.animation = 'scrollMarquee 20s linear infinite';
            }
            el.overlayBar.classList.add('hidden');
            el.lowerThirdScreen.classList.remove('show');
            el.eventOverlay.classList.add('show');
        }

        const screenAliases = {TOURNAMENT:'TOURNAMENT',MATCH:'MATCH',TOSS:'TOSS',VENUE:'VENUE',PARTNERSHIP:'PARTNERSHIP',SUMMARY:'SUMMARY','MATCH SUMMARY':'SUMMARY',TARGET:'TARGET',FOW:'FOW','FALL OF WICKET':'FOW',PLAYER:'PLAYER','PLAYER STATUS':'PLAYER',STRIKER:'STRIKER','NON-STRIKER':'NON-STRIKER',BOWLER:'BOWLER',RESULT:'RESULT','MATCH RESULT':'RESULT'};
        const FULL_SCREEN_TYPES = new Set(['BATTING1','BATTING2','BOWLING1','BOWLING2','PLAYINGXI','SUMMARY']);
        const isFullScreenType = t => FULL_SCREEN_TYPES.has(t);

        let lastEventKey = '';
        let lastFullScreenKey = '';
        let lastLowerThirdKey = '';
        let screenTimer = null;

        function getScreenType(data){
            const o = data && data.overlay ? data.overlay : {};
            const aliases = {SHOWTOURNAMENT:'TOURNAMENT',SHOWVENUE:'VENUE',SHOWMATCH:'MATCH',SHOWTOSS:'TOSS',SHOWRESULT:'RESULT',PLAYER_STATUS:'PLAYER',PLAYERSTATUS:'PLAYER',B1:'STRIKER',B2:'NON-STRIKER',NONSTRIKER:'NON-STRIKER',BOWLER:'BOWLER',FOW:'FOW',PARTNERSHIP:'PARTNERSHIP',TARGET:'TARGET',SUMMARY:'SUMMARY',PLAYINGXI:'PLAYINGXI',BATTING1:'BATTING1',BATTING2:'BATTING2',BOWLING1:'BOWLING1',BOWLING2:'BOWLING2',SCORECARD1:'SCORECARD1',SCORECARD2:'SCORECARD2',POINTTABLE:'POINTTABLE',CUSTOM:'CUSTOM',RESULT:'RESULT'};
            const view = String(o.view || data.overlayView || '').trim().toUpperCase();
            if (view && view !== 'DEFAULT' && view !== 'LIVE') return aliases[view] || screenAliases[view] || view;
            if (o.playerStatus?.active) return 'PLAYER';
            if (o.playerLower?.active) { const slot = String(o.playerLower.slot||'').toLowerCase(); return slot==='b2' ? 'NON-STRIKER' : slot==='playerstatus' ? 'PLAYER' : 'STRIKER'; }
            if (o.showFOW) return 'FOW';
            if (o.showBowler) return 'BOWLER';
            if (o.partnership?.active) return 'PARTNERSHIP';
            if (o.showTarget) return 'TARGET';
            if (o.showTournament) return 'TOURNAMENT';
            if (o.showVenue) return 'VENUE';
            if (o.showMatch) return 'MATCH';
            if (o.showToss) return 'TOSS';
            if (o.showResult) return 'RESULT';
            const raw = first(data.displayScreen, data.activeScreen, data.overlayScreen, data.screen, data.broadcast?.screen);
            if (raw) return aliases[String(raw).toUpperCase()] || screenAliases[String(raw).toUpperCase()] || String(raw).toUpperCase();
            const mode = String(data.mode || '').trim().toLowerCase();
            const modeMap = {summary:'SUMMARY',playingxi:'PLAYINGXI',batting1:'BATTING1',batting2:'BATTING2',bowling1:'BOWLING1',bowling2:'BOWLING2',scorecard1:'SCORECARD1',scorecard2:'SCORECARD2',custom:'CUSTOM',player:'PLAYER',playerstatus:'PLAYER'};
            if (modeMap[mode]) return modeMap[mode];
            return null;
        }

        function updateOverlay(data){
            if(!data || typeof data !== 'object') return;
            el.statusDot.classList.add('online');
            const screenType = getScreenType(data);
            if(screenType && isFullScreenType(screenType)){ hideLowerThirdScreen(); showFullScreen(screenType, data); }
            else if(screenType){ hideFullScreen(); showLowerThirdScreen(screenType, data); }
            else { hideFullScreen(); hideLowerThirdScreen(); }
            updateEvent(data);
            if(data.broadcast?.active) return;
            const overlayState = data.overlay || {};
            const scoreVisible = overlayState.scoreVisible !== false && !screenType && !data.customLower?.active;
            if(!scoreVisible) el.overlayBar.classList.add('hidden');
            else el.overlayBar.classList.remove('hidden');
            const battingTeam = first(data.battingTeamName, data.battingTeam==='A'?data.teamA:data.battingTeam==='B'?data.teamB:null, 'TEAM');
            el.battingTeam.textContent = UP(battingTeam);
            el.teamScoreMain.textContent = `${value(data,['runs'],0)}/${value(data,['wickets'],0)}`;
            const balls = Number(value(data,['legalBalls','balls','totalLegalBalls'],0))||0;
            const runs = Number(value(data,['runs'],0))||0;
            el.teamOvers.textContent = `(${formatOvers(balls)} OV)`;
            el.teamCrr.textContent = `CRR: ${calculateCRR(runs,balls)}`;
            const striker = value(data,['striker','currentStriker'],'');
            const non = value(data,['nonStriker','currentNonStriker'],'');
            const bowler = value(data,['bowler','currentBowler'],'');
            el.strikerName.textContent = UP(striker || 'STRIKER');
            el.strikerStats.textContent = getBatterStats(data,striker);
            el.nonStrikerName.textContent = UP(non || 'NON-STRIKER');
            el.nonStrikerStats.textContent = getBatterStats(data,non);
            el.inningsLabel.textContent = Number(value(data,['innings'],1))===2?'2ND INN':'1ST INN';
            el.bowlerName.textContent = UP(bowler || 'BOWLER');
            el.bowlerStats.textContent = getBowlerStats(data,bowler);
            el.currentOver.innerHTML = '';
            const arr = Array.isArray(data.currentOverBalls) ? data.currentOverBalls : [];
            const list = arr.slice(-6); while(list.length<6) list.push(null);
            list.forEach(ball=>{
                const d = document.createElement('div');
                d.className = 'ball ' + (ball ? 'runs empty' : 'empty');
                const label = ball ? UP(ball.label ?? ball.result ?? ball.runs ?? '0') : '-';
                if(ball){
                    if(label==='W' || label.includes('WICKET')){ d.className='ball wicket'; d.textContent='W'; }
                    else if(label==='4'){ d.className='ball four'; d.textContent='4'; }
                    else if(label==='6'){ d.className='ball six'; d.textContent='6'; }
                    else if(/WD|NB|LB|BYE|B/.test(label)){ d.className='ball extra'; d.textContent=label.slice(0,3); }
                    else { d.className='ball runs'; d.textContent=label; }
                } else d.textContent = '-';
                el.currentOver.appendChild(d);
            });
        }

        console.log("Connecting to Firebase...");
        onValue(liveRef, (snapshot) => {
            const data = snapshot.val();
            if (data) { console.log("Firebase Data Received:", data); updateOverlay(data); }
        }, (error) => { console.error("Firebase Error:", error); el.statusDot.classList.remove('online'); });

        [CHANNEL_1, CHANNEL_2].forEach(channelName => {
            try {
                const channel = new BroadcastChannel(channelName);
                channel.onmessage = (event) => { if (event.data && event.data.type === "LIVE_SCORE") updateOverlay(event.data.data); };
            } catch (e) {}
        });
        window.addEventListener('storage', (event) => {
            if ((event.key === STORAGE_KEY || event.key === STORAGE_TICK_KEY) && event.newValue) {
                try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) updateOverlay(JSON.parse(raw)); } catch (e) {}
            }
        });
        function loadInitialData() {
            try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) updateOverlay(JSON.parse(raw)); } catch (e) {}
        }
        loadInitialData();
    </script>
</body>
