<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRKLIVE19 - Live Cricket Overlay</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
        :root{ --text:#ffffff; --line:rgba(255,255,255,.28); }
        body { background-color:transparent; height:100vh; display:flex; justify-content:center; align-items:flex-end; overflow:hidden; padding-bottom:20px; }
        body, body * { text-transform:uppercase !important; }
        .player-stats, .bowler-stats, .pstat, .lt-card span { font-variant-numeric:tabular-nums; }
        .lower-third-wrapper { position:relative; width:98%; min-width:800px; max-width:1600px; min-height:105px; }

        /* Event animation */
        .event-animation{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:12px;overflow:hidden;z-index:9999;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease;pointer-events:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#ff8a00 0%,#ff4dd2 35%,#8b5cf6 70%,#00d4ff 100%);border:2px solid rgba(255,255,255,.5);box-shadow:0 18px 50px rgba(0,0,0,.6),inset 0 0 80px rgba(0,0,0,.25)}
        .event-animation::before,.event-animation::after{content:'';position:absolute;left:0;width:100%;height:4px;background:linear-gradient(90deg,#fff,#ffd400,#00e5a0,#00d4ff,#ff4dd2,#fff);background-size:200% 100%;animation:rainbowSlide 2.5s linear infinite}
        .event-animation::before{top:0} .event-animation::after{bottom:0}
        @keyframes rainbowSlide{0%{background-position:0% 0}100%{background-position:200% 0}}
        .event-animation.show{opacity:1;visibility:visible;pointer-events:auto}
        .marquee{display:flex;white-space:nowrap;animation:scrollMarquee 20s linear infinite}
        .marquee span{font-size:clamp(80px,12vw,180px);font-weight:900;letter-spacing:8px;margin-right:80px;color:#fff;text-shadow:0 0 40px currentColor,0 6px 0 rgba(0,0,0,.55),0 8px 22px rgba(0,0,0,.8);-webkit-text-stroke:4px #000;line-height:1.1}
        @keyframes scrollMarquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

        /* Main bar */
        .cricket-overlay{width:100%;min-height:105px;position:relative;background:linear-gradient(90deg,#061a3a 0%,#0b2c66 20%,#123a86 40%,#1a2f8f 60%,#2a1a6b 80%,#0a0a24 100%);border:2px solid rgba(255,255,255,.35);border-radius:12px;box-shadow:0 18px 45px rgba(0,0,0,.65),0 0 30px rgba(0,212,255,.35),0 0 55px rgba(255,77,210,.18),inset 0 2px 0 rgba(255,255,255,.25);display:grid;grid-template-columns:1.2fr 1.2fr 0.6fr 2fr;grid-template-rows:1fr 1fr;color:var(--text);overflow:hidden;transition:opacity .3s ease,transform .3s ease;animation:barIn .85s cubic-bezier(.22,.9,.28,1),glowPulse 2.2s ease-out .6s}
        @keyframes barIn{0%{opacity:0;transform:translateY(30px) scaleX(.965);filter:blur(7px)}55%{opacity:1}100%{opacity:1;transform:translateY(0) scaleX(1);filter:blur(0)}}
        @keyframes glowPulse{0%{box-shadow:0 18px 45px rgba(0,0,0,.65),inset 0 2px 0 rgba(255,255,255,.25),0 0 0 0 rgba(255,212,0,.55)}50%{box-shadow:0 18px 45px rgba(0,0,0,.65),inset 0 2px 0 rgba(255,255,255,.35),0 0 40px 12px rgba(255,212,0,.35)}100%{box-shadow:0 18px 45px rgba(0,0,0,.65),inset 0 2px 0 rgba(255,255,255,.25),0 0 0 0 rgba(255,212,0,0)}}
        .cricket-overlay::after{content:'';position:absolute;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,#1687ff,#00d4ff,#00e5a0,#a3e635,#ffd400,#ff8a00,#ff3b5c,#ff4dd2,#8b5cf6,#1687ff);background-size:200% 100%;animation:rainbowSlide 4s linear infinite;z-index:11;pointer-events:none}
        .cricket-overlay::before{content:'';position:absolute;top:0;left:4%;width:38%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);transform:skewX(-30deg);pointer-events:none;z-index:1}
        .cricket-overlay.hidden{opacity:0;transform:translateY(20px);pointer-events:none}

        .c1-r1{grid-column:1;grid-row:1;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
        .c1-r2{grid-column:1;grid-row:2;border-right:1px solid var(--line)}
        .c2-r1{grid-column:2;grid-row:1;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
        .c2-r2{grid-column:2;grid-row:2;border-right:1px solid var(--line)}
        .c3-r1r2{grid-column:3;grid-row:1/span 2;border-right:1px solid var(--line);justify-content:center}
        .c4-r1{grid-column:4;grid-row:1;border-bottom:1px solid var(--line)}
        .c4-r2{grid-column:4;grid-row:2}
        .c1-r1{background:linear-gradient(135deg,#0a4fd6 0%,#1687ff 55%,#00d4ff 100%)}
        .c1-r2{background:linear-gradient(135deg,#0a3aa8 0%,#1d6fe8 100%)}
        .c2-r1{background:linear-gradient(135deg,#067a4f 0%,#00b877 55%,#00e5a0 100%)}
        .c2-r2{background:linear-gradient(135deg,#056b45 0%,#00a86b 100%)}
        .c3-r1r2{background:linear-gradient(160deg,#8b5cf6 0%,#b14dff 45%,#ff4dd2 100%)}
        .c4-r1{background:linear-gradient(135deg,#c2410c 0%,#ff8a00 55%,#ffd400 100%)}
        .c4-r2{background:linear-gradient(135deg,#9d174d 0%,#ff3b5c 50%,#ff4dd2 100%)}

        .grid-item{display:flex;align-items:center;padding:6px 14px;z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;gap:8px;opacity:0;animation:fadeInUp .6s ease-out forwards;position:relative}
        @keyframes fadeInUp{0%{opacity:0;transform:translateY(15px)}100%{opacity:1;transform:translateY(0)}}
        .c1-r1{animation-delay:.75s}.c2-r1{animation-delay:.85s}.c3-r1r2{animation-delay:.95s}
        .c4-r1{animation-delay:1.05s}.c1-r2{animation-delay:.80s}.c2-r2{animation-delay:.90s}.c4-r2{animation-delay:1.10s}

        .c1-r1 .team-name{font-size:17px;font-weight:800;letter-spacing:1.6px;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.55)}
        .c1-r1 .team-score{font-size:27px;font-weight:900;letter-spacing:.5px;color:#fff9c4;font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(255,212,0,.9),0 2px 5px rgba(0,0,0,.6)}
        .c1-r2{justify-content:space-between}
        .c1-r2 .overs-text{font-size:14px;font-weight:700;letter-spacing:.6px;color:#e0f2ff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
        .c1-r2 .crr-text{font-size:13px;font-weight:800;letter-spacing:.5px;color:#052a1c;background:#7dffcf;padding:3px 9px;border-radius:999px;box-shadow:0 0 12px rgba(125,255,207,.75)}

        .c2-r1,.c2-r2{justify-content:space-between}
        .player-name{font-size:14px;font-weight:800;letter-spacing:.9px;color:#fff;max-width:120px;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 4px rgba(0,0,0,.5)}
        .player-name.active::after{content:'';display:inline-block;width:8px;height:8px;margin-left:6px;border-radius:50%;background:#ffd400;box-shadow:0 0 10px #ffd400,0 0 18px rgba(255,212,0,.7);vertical-align:middle;animation:strikePulse 1.4s ease-in-out infinite}
        @keyframes strikePulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.75}}
        .player-stats{font-family:'Courier New',monospace;font-size:14px;font-weight:700;letter-spacing:.5px;color:#05301f;background:rgba(255,255,255,.92);padding:3px 9px;border-radius:6px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}

        .innings-badge{font-size:13px;font-weight:900;letter-spacing:2px;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.75);padding:10px 16px;border-radius:10px;color:#fff;text-align:center;text-shadow:0 2px 4px rgba(0,0,0,.6);box-shadow:0 0 18px rgba(255,255,255,.35),inset 0 0 16px rgba(255,255,255,.15);animation:inningsGlow 2.4s ease-in-out infinite}
        @keyframes inningsGlow{0%,100%{box-shadow:0 0 14px rgba(255,255,255,.3),inset 0 0 14px rgba(255,255,255,.12)}50%{box-shadow:0 0 26px rgba(255,255,255,.75),inset 0 0 20px rgba(255,255,255,.25)}}

        .c4-r1{justify-content:space-between}
        .bowler-name{font-size:14px;font-weight:800;letter-spacing:.9px;color:#fff;max-width:140px;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 4px rgba(0,0,0,.55)}
        .bowler-stats{font-family:'Courier New',monospace;font-size:14px;font-weight:700;letter-spacing:.5px;color:#3a1a00;background:rgba(255,255,255,.95);padding:3px 9px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
        .c4-r2{justify-content:flex-start}
        .balls-container{display:flex;gap:7px}
        .ball{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;letter-spacing:.3px;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.6);color:#fff;box-shadow:inset 0 2px 4px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.35);transition:transform .18s ease;text-shadow:0 1px 2px rgba(0,0,0,.6)}
        .ball.runs{background:linear-gradient(135deg,#fff,#cfd8e3);color:#10203a;text-shadow:none}
        .ball.four{background:linear-gradient(135deg,#00ffb3,#00b377);color:#00261a;border-color:#00ffcc;box-shadow:0 0 14px rgba(0,255,179,.9),inset 0 2px 4px rgba(0,0,0,.2);text-shadow:none}
        .ball.six{background:linear-gradient(135deg,#ffe14d,#ff8a00);color:#2a1400;border-color:#fff08a;box-shadow:0 0 16px rgba(255,180,0,.95),inset 0 2px 4px rgba(0,0,0,.2);text-shadow:none}
        .ball.wicket{background:linear-gradient(135deg,#ff5d7d,#d1003f);color:#fff;border-color:#ff9bb0;box-shadow:0 0 16px rgba(255,60,110,.95),inset 0 2px 4px rgba(0,0,0,.3)}
        .ball.extra{background:linear-gradient(135deg,#7de3ff,#0091ff);color:#001b33;border-color:#b3f0ff;font-size:10px;box-shadow:0 0 14px rgba(0,180,255,.9),inset 0 2px 4px rgba(0,0,0,.2);text-shadow:none}
        .ball.empty{opacity:.35;border-style:dashed;background:rgba(255,255,255,.10)}

        .status-dot{position:absolute;top:12px;right:16px;width:12px;height:12px;border-radius:50%;background:#ff3b5c;z-index:12;box-shadow:0 0 10px rgba(255,59,92,.9);opacity:0;border:2px solid rgba(255,255,255,.7);animation:dotBounce .6s cubic-bezier(.175,.885,.32,1.275) 1.25s forwards}
        .status-dot.online{background:#00e5a0;box-shadow:0 0 14px rgba(0,229,160,.95)}
        .status-dot.online::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(0,229,160,.55);animation:pulseRing 1.5s ease-out infinite}
        @keyframes dotBounce{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
        @keyframes pulseRing{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.9);opacity:0}}

        /* Lower third */
        .lower-third-screen{position:absolute;top:0;left:0;width:100%;min-height:105px;border-radius:12px;overflow:hidden;z-index:9998;opacity:0;visibility:hidden;transform:translateY(20px);transition:opacity .35s ease,visibility .35s ease,transform .35s ease;pointer-events:none;display:flex;align-items:stretch;background:linear-gradient(90deg,#0a0a24 0%,#1a2f8f 25%,#3a1a6b 60%,#0a0a24 100%);border:2px solid rgba(255,255,255,.35);box-shadow:0 18px 45px rgba(0,0,0,.65),0 0 30px rgba(0,212,255,.35),0 0 55px rgba(255,77,210,.18),inset 0 2px 0 rgba(255,255,255,.25)}
        .lower-third-screen.show{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}
        .lower-third-screen::after{content:'';position:absolute;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,#1687ff,#00d4ff,#00e5a0,#a3e635,#ffd400,#ff8a00,#ff3b5c,#ff4dd2,#8b5cf6,#1687ff);background-size:200% 100%;animation:rainbowSlide 4s linear infinite;z-index:5;pointer-events:none}
        .lower-third-screen::before{content:'';position:absolute;top:0;left:0;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);transform:skewX(-30deg);pointer-events:none;z-index:1}

        .lt-left{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px 26px;background:linear-gradient(135deg,#8b5cf6 0%,#b14dff 45%,#ff4dd2 100%);border-right:2px solid rgba(255,255,255,.35);min-width:230px;text-align:center;position:relative;z-index:2}
        .lt-kicker{font-size:10px;letter-spacing:4px;font-weight:800;color:rgba(255,255,255,.85);margin-bottom:4px}
        .lt-title{font-size:22px;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 2px 6px rgba(0,0,0,.55);line-height:1.05}
        .lt-team{margin-top:6px;font-size:11px;font-weight:800;letter-spacing:2px;color:rgba(255,255,255,.95);text-shadow:0 1px 3px rgba(0,0,0,.5);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

        .lower-third-screen[data-type="TOURNAMENT"] .lt-left{background:linear-gradient(135deg,#8b5cf6 0%,#b14dff 45%,#ff4dd2 100%)}
        .lower-third-screen[data-type="MATCH"] .lt-left{background:linear-gradient(135deg,#1687ff 0%,#00d4ff 100%)}
        .lower-third-screen[data-type="TOSS"] .lt-left{background:linear-gradient(135deg,#ff8a00 0%,#ffd400 100%)}
        .lower-third-screen[data-type="VENUE"] .lt-left{background:linear-gradient(135deg,#00b877 0%,#00e5a0 100%)}
        .lower-third-screen[data-type="PARTNERSHIP"] .lt-left{background:linear-gradient(135deg,#00e5a0 0%,#00d4ff 100%)}
        .lower-third-screen[data-type="TARGET"] .lt-left{background:linear-gradient(135deg,#ff8a00 0%,#ff3b5c 100%)}
        .lower-third-screen[data-type="FOW"] .lt-left{background:linear-gradient(135deg,#d1003f 0%,#ff4dd2 100%)}
        .lower-third-screen[data-type="STRIKER"] .lt-left,
        .lower-third-screen[data-type="NON-STRIKER"] .lt-left,
        .lower-third-screen[data-type="BOWLER"] .lt-left,
        .lower-third-screen[data-type="PLAYER"] .lt-left{background:linear-gradient(135deg,#067a4f 0%,#00e5a0 100%)}
        .lower-third-screen[data-type="RESULT"] .lt-left{background:linear-gradient(135deg,#ffd400 0%,#ff8a00 100%)}
        .lower-third-screen[data-type="SCORECARD1"] .lt-left,
        .lower-third-screen[data-type="SCORECARD2"] .lt-left{background:linear-gradient(135deg,#1687ff 0%,#8b5cf6 100%)}
        .lower-third-screen[data-type="POINTTABLE"] .lt-left{background:linear-gradient(135deg,#4f46e5 0%,#00d4ff 100%)}
        .lower-third-screen[data-type="CUSTOM"] .lt-left{background:linear-gradient(135deg,#ff4dd2 0%,#8b5cf6 100%)}

        .lt-right{flex:1;display:flex;flex-direction:column;justify-content:center;padding:12px 24px;gap:8px;overflow:hidden;position:relative;z-index:2}
        .lt-subtitle{font-size:19px;font-weight:800;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}
        .lt-cards{display:flex;gap:10px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
        .lt-cards::-webkit-scrollbar{display:none}
        .lt-card{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:8px;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.28);white-space:nowrap;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.25)}
        .lt-card b{font-size:10px;letter-spacing:1.4px;font-weight:800;color:rgba(255,255,255,.72)}
        .lt-card span{font-size:15px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
        .lt-card.batting{background:linear-gradient(135deg,rgba(0,229,160,.45),rgba(0,229,160,.18));border-color:rgba(0,255,179,.70);box-shadow:0 3px 14px rgba(0,229,160,.50)}
        .lt-card.bowling{background:linear-gradient(135deg,rgba(255,138,0,.45),rgba(255,212,0,.18));border-color:rgba(255,180,0,.70);box-shadow:0 3px 14px rgba(255,138,0,.50)}
        .lt-card.team{background:linear-gradient(135deg,rgba(0,212,255,.45),rgba(139,92,246,.20));border-color:rgba(0,212,255,.70);box-shadow:0 3px 14px rgba(0,212,255,.50)}

        /* =========================================================
           FULL DISPLAY — VIBRANT THEMED PER SCREEN
           ========================================================= */
        .display-screen{position:fixed;inset:0;z-index:20000;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(6,4,24,.90),rgba(3,10,30,.92),rgba(18,4,32,.92));overflow:hidden;pointer-events:none;padding:10vh 10vw}
        .display-screen.show{display:flex;animation:screenIn .3s ease-out both}
        .display-screen.hide{animation:screenOut .22s ease-in both}

        .display-glow{position:absolute;inset:-20%;background:radial-gradient(circle at 28% 30%,rgba(0,212,255,.30),transparent 42%),radial-gradient(circle at 72% 65%,rgba(255,77,210,.28),transparent 44%),radial-gradient(circle at 50% 90%,rgba(255,212,0,.20),transparent 42%);pointer-events:none;animation:glowShift 8s ease-in-out infinite}
        @keyframes glowShift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(2%,-2%) scale(1.05)}}

        .display-content{position:relative;width:100%;height:100%;overflow:hidden;padding:14px 22px 14px;text-align:center;border:3px solid transparent;border-radius:20px;display:flex;flex-direction:column;min-height:0;box-shadow:0 24px 80px rgba(0,0,0,.75);transition:background .4s ease}

        /* Theme by screen type */
        .display-content.theme-batting{
            background:
                radial-gradient(circle at 15% 20%, rgba(0,229,160,.22), transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(56,189,248,.22), transparent 45%),
                linear-gradient(135deg, rgba(2,24,16,.99), rgba(4,32,48,.985), rgba(6,20,40,.985)) padding-box,
                linear-gradient(120deg,#00e5a0,#00d4ff,#a3e635,#00e5a0) border-box;
            border:3px solid transparent;
        }
        .display-content.theme-bowling{
            background:
                radial-gradient(circle at 15% 20%, rgba(255,180,0,.25), transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(255,59,92,.22), transparent 45%),
                linear-gradient(135deg, rgba(36,10,2,.99), rgba(46,12,8,.985), rgba(24,6,18,.985)) padding-box,
                linear-gradient(120deg,#ffd400,#ff8a00,#ff3b5c,#ffd400) border-box;
            border:3px solid transparent;
        }
        .display-content.theme-xi{
            background:
                radial-gradient(circle at 20% 30%, rgba(0,212,255,.28), transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(255,77,210,.28), transparent 45%),
                linear-gradient(135deg, rgba(4,14,42,.99), rgba(14,10,48,.985), rgba(34,6,48,.985)) padding-box,
                linear-gradient(120deg,#00d4ff,#8b5cf6,#ff4dd2,#00d4ff) border-box;
            border:3px solid transparent;
        }
        .display-content.theme-summary{
            background:
                radial-gradient(circle at 15% 20%, rgba(255,212,0,.28), transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(0,229,160,.28), transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(255,77,210,.18), transparent 50%),
                linear-gradient(135deg, rgba(28,10,4,.99), rgba(10,20,48,.985), rgba(40,6,32,.985)) padding-box,
                linear-gradient(120deg,#ffd400,#00e5a0,#00d4ff,#ff4dd2,#ffd400) border-box;
            border:3px solid transparent;
        }

        .display-kicker{font-size:clamp(10px,1vw,13px);font-weight:800;letter-spacing:5px;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;flex-shrink:0}
        .theme-batting .display-kicker{background-image:linear-gradient(90deg,#00e5a0,#00d4ff,#a3e635)}
        .theme-bowling .display-kicker{background-image:linear-gradient(90deg,#ffd400,#ff8a00,#ff3b5c)}
        .theme-xi .display-kicker{background-image:linear-gradient(90deg,#00d4ff,#8b5cf6,#ff4dd2)}
        .theme-summary .display-kicker{background-image:linear-gradient(90deg,#ffd400,#00e5a0,#ff4dd2)}

        .display-title{margin-top:2px;font-size:clamp(22px,2.6vw,38px);font-weight:1000;line-height:1;background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:titleShift 6s linear infinite;filter:drop-shadow(0 3px 6px #000);flex-shrink:0}
        .theme-batting .display-title{background-image:linear-gradient(90deg,#ffffff,#00ffb3,#00d4ff,#ffffff);filter:drop-shadow(0 0 18px rgba(0,255,179,.5)) drop-shadow(0 3px 6px #000)}
        .theme-bowling .display-title{background-image:linear-gradient(90deg,#ffffff,#ffd400,#ff8a00,#ffffff);filter:drop-shadow(0 0 18px rgba(255,180,0,.5)) drop-shadow(0 3px 6px #000)}
        .theme-xi .display-title{background-image:linear-gradient(90deg,#ffffff,#00d4ff,#ff4dd2,#ffffff);filter:drop-shadow(0 0 18px rgba(255,77,210,.5)) drop-shadow(0 3px 6px #000)}
        .theme-summary .display-title{background-image:linear-gradient(90deg,#ffffff,#ffd400,#00e5a0,#ff4dd2,#ffffff);filter:drop-shadow(0 0 18px rgba(255,212,0,.5)) drop-shadow(0 3px 6px #000)}
        @keyframes titleShift{0%{background-position:0% center}100%{background-position:200% center}}

        .display-subtitle{margin-top:3px;font-size:clamp(11px,1.1vw,15px);font-weight:700;color:#cfe2ff;text-shadow:0 1px 4px rgba(0,0,0,.6);flex-shrink:0}

        /* Score strip — colorful per screen */
        .score-strip{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px;flex-shrink:0}
        .strip-item{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.24);box-shadow:0 3px 12px rgba(0,0,0,.35);white-space:nowrap;position:relative;overflow:hidden}
        .strip-item::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.10),transparent);pointer-events:none}
        .strip-item b{font-size:9px;letter-spacing:1.2px;color:rgba(255,255,255,.72);font-weight:800;position:relative;z-index:1}
        .strip-item span{font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55);font-variant-numeric:tabular-nums;position:relative;z-index:1}
        .theme-batting .strip-item{background:linear-gradient(135deg,rgba(0,229,160,.40),rgba(0,212,255,.24))}
        .theme-bowling .strip-item{background:linear-gradient(135deg,rgba(255,180,0,.42),rgba(255,59,92,.24))}
        .theme-xi .strip-item{background:linear-gradient(135deg,rgba(0,212,255,.40),rgba(139,92,246,.24))}
        .theme-summary .strip-item{background:linear-gradient(135deg,rgba(255,212,0,.40),rgba(0,229,160,.24))}

        .content-area{flex:1;min-height:0;margin-top:10px;display:grid;grid-template-columns:1fr;gap:10px;overflow:hidden}
        .content-area.has-sidebar{grid-template-columns:220px 1fr}

        .side-panel{display:flex;flex-direction:column;gap:8px;overflow:hidden;min-height:0}
        .side-card{padding:8px 10px;border-radius:10px;text-align:left;border:1px solid rgba(255,255,255,.20);animation:cardIn .4s ease-out both;flex-shrink:0;box-shadow:0 4px 14px rgba(0,0,0,.30);position:relative;overflow:hidden}
        .side-card::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.10),transparent);pointer-events:none}
        .side-card.green{border-left:4px solid #00ffb3;background:linear-gradient(135deg,rgba(0,229,160,.30),rgba(0,180,120,.14))}
        .side-card.gold{border-left:4px solid #ffd400;background:linear-gradient(135deg,rgba(255,212,0,.30),rgba(255,138,0,.12))}
        .side-card.orange{border-left:4px solid #ff8a00;background:linear-gradient(135deg,rgba(255,138,0,.30),rgba(255,59,92,.12))}
        .side-card.pink{border-left:4px solid #ff4dd2;background:linear-gradient(135deg,rgba(255,77,210,.30),rgba(139,92,246,.16))}
        .side-card.red{border-left:4px solid #ff3b5c;background:linear-gradient(135deg,rgba(255,59,92,.30),rgba(139,20,60,.14))}
        .side-card.blue{border-left:4px solid #00d4ff;background:linear-gradient(135deg,rgba(0,212,255,.30),rgba(139,92,246,.14))}

        .side-card .sc-title{font-size:9px;letter-spacing:1.6px;font-weight:900;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
        .side-card .sc-title span{color:#fff;font-size:11px;text-shadow:0 1px 3px rgba(0,0,0,.55)}
        .side-card.green .sc-title{color:#a7ffd9}
        .side-card.gold .sc-title{color:#fff3a8}
        .side-card.orange .sc-title{color:#ffd9a8}
        .side-card.pink .sc-title{color:#ffc4ee}
        .side-card.red .sc-title{color:#ffb3c2}
        .side-card.blue .sc-title{color:#9fe6ff}

        .side-row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:11px;font-weight:700;color:#eaf3ff;border-bottom:1px dashed rgba(255,255,255,.15);position:relative;z-index:1}
        .side-row:last-child{border-bottom:none}
        .side-row b{color:rgba(255,255,255,.75);font-weight:800;letter-spacing:.5px}
        .side-row span{font-family:'Courier New',monospace;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}

        .tables-panel{display:flex;flex-direction:column;min-height:0;overflow:hidden}

        .table-block{border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.20);box-shadow:0 8px 26px rgba(0,0,0,.45);display:flex;flex-direction:column;min-height:0;flex:1;animation:cardIn .5s ease-out both}
        .table-block.batting{background:linear-gradient(135deg,rgba(0,229,160,.14),rgba(0,212,255,.10));border-left:5px solid #00e5a0}
        .table-block.bowling{background:linear-gradient(135deg,rgba(255,180,0,.14),rgba(255,59,92,.10));border-left:5px solid #ff8a00}

        .table-header{display:grid;padding:8px 14px;font-size:10px;font-weight:900;letter-spacing:1.6px;color:#fff;border-bottom:1px solid rgba(255,255,255,.22);flex-shrink:0;text-shadow:0 1px 3px rgba(0,0,0,.55)}
        .table-block.batting .table-header{grid-template-columns: 1.9fr 2.2fr .55fr .55fr .5fr .5fr .8fr;background:linear-gradient(90deg,rgba(0,229,160,.55),rgba(0,212,255,.35))}
        .table-block.bowling .table-header{grid-template-columns: 2.4fr .85fr .65fr .65fr .65fr .85fr;background:linear-gradient(90deg,rgba(255,138,0,.55),rgba(255,59,92,.35))}

        .table-body{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 6px;gap:2px;padding-top:2px;padding-bottom:2px}

        .table-row{flex:1 1 auto;display:grid;align-items:center;padding:2px 10px;min-height:0;font-size:12.5px;font-weight:700;color:#fff;border-radius:6px;transition:transform .18s ease,filter .18s ease;position:relative;overflow:hidden}

        /* Color-cycling rows for batting */
        .table-block.batting .table-row{grid-template-columns: 1.9fr 2.2fr .55fr .55fr .5fr .5fr .8fr}
        .table-block.batting .table-row:nth-child(4n+1){background:linear-gradient(90deg,rgba(0,229,160,.24),rgba(0,180,130,.10))}
        .table-block.batting .table-row:nth-child(4n+2){background:linear-gradient(90deg,rgba(0,212,255,.24),rgba(0,140,200,.10))}
        .table-block.batting .table-row:nth-child(4n+3){background:linear-gradient(90deg,rgba(163,230,53,.22),rgba(0,180,130,.10))}
        .table-block.batting .table-row:nth-child(4n+4){background:linear-gradient(90deg,rgba(0,229,160,.16),rgba(0,212,255,.10))}

        /* Color-cycling rows for bowling */
        .table-block.bowling .table-row{grid-template-columns: 2.4fr .85fr .65fr .65fr .65fr .85fr}
        .table-block.bowling .table-row:nth-child(4n+1){background:linear-gradient(90deg,rgba(255,180,0,.26),rgba(255,120,0,.12))}
        .table-block.bowling .table-row:nth-child(4n+2){background:linear-gradient(90deg,rgba(255,212,0,.24),rgba(255,138,0,.12))}
        .table-block.bowling .table-row:nth-child(4n+3){background:linear-gradient(90deg,rgba(255,59,92,.24),rgba(200,20,60,.12))}
        .table-block.bowling .table-row:nth-child(4n+4){background:linear-gradient(90deg,rgba(255,138,0,.20),rgba(255,212,0,.10))}

        .table-row:hover{transform:translateX(3px);filter:brightness(1.15)}

        .table-row.active{background:linear-gradient(90deg,rgba(255,212,0,.42),rgba(255,138,0,.22)) !important;border-left:4px solid #ffd400;box-shadow:0 0 22px rgba(255,212,0,.55),inset 0 0 14px rgba(255,212,0,.18)}
        .table-row.active .cell-name::after{content:'';display:inline-block;width:7px;height:7px;margin-left:6px;border-radius:50%;background:#ffd400;box-shadow:0 0 10px #ffd400;vertical-align:middle;animation:strikePulse 1.4s ease-in-out infinite}

        .cell-name{text-align:left;font-weight:800;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px;line-height:1.15;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
        .cell-name small{display:block;font-size:9px;color:rgba(255,255,255,.65);letter-spacing:.6px;font-weight:600;margin-top:1px;overflow:hidden;text-overflow:ellipsis}

        .cell-dismissal{text-align:left;font-size:10.5px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px 0 4px;line-height:1.1;text-shadow:0 1px 2px rgba(0,0,0,.4)}
        .cell-dismissal.not-out{color:#00ffb3;font-weight:900;text-shadow:0 0 8px rgba(0,255,179,.6)}
        .cell-dismissal.blank{color:transparent}

        .cell-num{text-align:center;font-family:'Courier New',monospace;font-weight:900;font-size:13px;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px rgba(0,0,0,.5)}
        .cell-num.highlight{color:#00ffb3;text-shadow:0 0 8px rgba(0,255,179,.75)}
        .cell-num.wicket{color:#ff5d7d;text-shadow:0 0 8px rgba(255,93,125,.75)}
        .cell-num.gold{color:#ffd400;text-shadow:0 0 8px rgba(255,212,0,.75)}
        .cell-num.overs{color:#ffb020;text-shadow:0 0 8px rgba(255,176,32,.75)}

        .table-footer{display:flex;justify-content:space-between;align-items:center;padding:7px 14px;font-size:11px;font-weight:800;color:#fff;flex-wrap:wrap;gap:8px;flex-shrink:0;border-top:1px solid rgba(255,255,255,.20)}
        .table-block.batting .table-footer{background:linear-gradient(90deg,rgba(0,229,160,.40),rgba(0,212,255,.25))}
        .table-block.bowling .table-footer{background:linear-gradient(90deg,rgba(255,138,0,.40),rgba(255,59,92,.25))}
        .table-footer .foot-item{display:flex;gap:5px;align-items:center}
        .table-footer .foot-item b{color:rgba(255,255,255,.72);font-size:9px;letter-spacing:1.2px;font-weight:800}
        .table-footer .foot-item span{font-family:'Courier New',monospace;font-size:12px;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.5)}

        /* Playing XI — colorful */
        .xi-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0;overflow:hidden}
        .xi-team{display:flex;flex-direction:column;min-height:0;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,.28);box-shadow:0 10px 30px rgba(0,0,0,.45)}
        .xi-team.a{background:linear-gradient(135deg,rgba(0,229,160,.28),rgba(0,212,255,.22));border-color:rgba(0,229,160,.55)}
        .xi-team.b{background:linear-gradient(135deg,rgba(255,77,210,.28),rgba(139,92,246,.22));border-color:rgba(255,77,210,.55)}

        .xi-team-header{padding:10px 16px;font-size:14px;font-weight:900;letter-spacing:1.6px;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.55);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.22);position:relative;overflow:hidden}
        .xi-team-header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.20),transparent);pointer-events:none}
        .xi-team.a .xi-team-header{background:linear-gradient(90deg,#00e5a0,#00d4ff,#1687ff)}
        .xi-team.b .xi-team-header{background:linear-gradient(90deg,#ff4dd2,#b14dff,#8b5cf6)}
        .xi-team-header small{font-size:9px;color:rgba(255,255,255,.9);letter-spacing:1.8px;font-weight:900;position:relative;z-index:1}

        .xi-list{flex:1;display:flex;flex-direction:column;min-height:0;padding:5px 8px;gap:2px}

        .xi-player{flex:1 1 auto;min-height:0;display:flex;align-items:center;gap:10px;padding:4px 10px;border-radius:7px;font-size:12.5px;font-weight:800;color:#fff;transition:transform .18s ease,filter .18s ease;text-shadow:0 1px 3px rgba(0,0,0,.5)}
        .xi-team.a .xi-player:nth-child(4n+1){background:linear-gradient(90deg,rgba(0,229,160,.35),rgba(0,180,130,.14))}
        .xi-team.a .xi-player:nth-child(4n+2){background:linear-gradient(90deg,rgba(0,212,255,.35),rgba(0,140,200,.14))}
        .xi-team.a .xi-player:nth-child(4n+3){background:linear-gradient(90deg,rgba(163,230,53,.30),rgba(0,180,130,.14))}
        .xi-team.a .xi-player:nth-child(4n+4){background:linear-gradient(90deg,rgba(0,229,160,.22),rgba(0,212,255,.14))}
        .xi-team.b .xi-player:nth-child(4n+1){background:linear-gradient(90deg,rgba(255,77,210,.35),rgba(180,40,160,.14))}
        .xi-team.b .xi-player:nth-child(4n+2){background:linear-gradient(90deg,rgba(139,92,246,.35),rgba(100,60,200,.14))}
        .xi-team.b .xi-player:nth-child(4n+3){background:linear-gradient(90deg,rgba(255,59,92,.32),rgba(180,20,60,.14))}
        .xi-team.b .xi-player:nth-child(4n+4){background:linear-gradient(90deg,rgba(255,77,210,.22),rgba(139,92,246,.14))}

        .xi-player:hover{transform:translateX(4px);filter:brightness(1.15)}

        .xi-player .xi-num{flex-shrink:0;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;font-size:11px;font-weight:900;color:#fff;background:linear-gradient(135deg,#00ffb3,#00b877);box-shadow:0 0 12px rgba(0,255,179,.75)}
        .xi-team.b .xi-player .xi-num{background:linear-gradient(135deg,#ff4dd2,#8b5cf6);box-shadow:0 0 12px rgba(255,77,210,.75)}
        .xi-player .xi-name{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .xi-player .xi-tag{font-size:9px;letter-spacing:1px;padding:2px 7px;border-radius:5px;font-weight:900;flex-shrink:0;background:rgba(255,255,255,.22);color:#fff}
        .xi-player.captain .xi-tag{background:linear-gradient(135deg,#ffd400,#ff8a00);color:#2a1400;box-shadow:0 0 10px rgba(255,212,0,.75)}
        .xi-player.keeper .xi-tag{background:linear-gradient(135deg,#00e5a0,#00d4ff);color:#00261a;box-shadow:0 0 10px rgba(0,229,160,.75)}

        /* Match summary — colorful */
        .summary-grid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(0,auto);gap:12px;min-height:0;overflow:hidden}
        .summary-team-card{padding:16px 20px;border-radius:16px;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:cardIn .5s ease-out both;display:flex;flex-direction:column;justify-content:center;min-height:0;border:2px solid rgba(255,255,255,.28);position:relative;overflow:hidden}
        .summary-team-card::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.10),transparent);pointer-events:none}
        .summary-team-card.team-a{background:linear-gradient(135deg,rgba(0,229,160,.42),rgba(0,212,255,.28));border-color:rgba(0,229,160,.65)}
        .summary-team-card.team-b{background:linear-gradient(135deg,rgba(255,77,210,.42),rgba(139,92,246,.28));border-color:rgba(255,77,210,.65)}
        .summary-team-card .st-name{font-size:16px;font-weight:900;color:#fff;letter-spacing:1.2px;margin-bottom:6px;text-shadow:0 2px 5px rgba(0,0,0,.55);position:relative;z-index:1}
        .summary-team-card .st-score{font-size:clamp(28px,3.4vw,44px);font-weight:1000;color:#fff;font-family:'Courier New',monospace;letter-spacing:.5px;text-shadow:0 0 22px rgba(255,255,255,.85),0 3px 6px rgba(0,0,0,.55);margin-bottom:8px;line-height:1;position:relative;z-index:1}
        .summary-team-card .st-line{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:12px;font-weight:700;color:#fff;border-bottom:1px dashed rgba(255,255,255,.20);position:relative;z-index:1}
        .summary-team-card .st-line:last-child{border-bottom:none}
        .summary-team-card .st-line b{color:rgba(255,255,255,.82);font-weight:800;letter-spacing:.6px}
        .summary-team-card .st-line span{font-family:'Courier New',monospace;color:#fff;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.5)}

        .summary-result-card{grid-column:1/-1;padding:16px 24px;border-radius:16px;text-align:center;background:linear-gradient(135deg,#ffd400,#ff8a00,#ff3b5c,#ff4dd2);background-size:200% auto;animation:resultShift 4s ease infinite,cardIn .55s ease-out both;box-shadow:0 0 55px rgba(255,180,0,.6),inset 0 0 30px rgba(255,255,255,.20);border:3px solid rgba(255,255,255,.55);position:relative;overflow:hidden}
        @keyframes resultShift{0%{background-position:0% center}100%{background-position:200% center}}
        .summary-result-card .rc-kicker{font-size:11px;letter-spacing:5px;color:#2a1400;font-weight:1000;margin-bottom:5px;text-shadow:0 1px 0 rgba(255,255,255,.5)}
        .summary-result-card .rc-text{font-size:clamp(20px,2.4vw,34px);font-weight:1000;color:#2a1400;line-height:1.1;letter-spacing:1px;text-shadow:0 2px 0 rgba(255,255,255,.55),0 4px 10px rgba(0,0,0,.35)}
        .summary-result-card .rc-margin{margin-top:5px;font-size:13px;font-weight:900;color:#2a1400;letter-spacing:3px;text-shadow:0 1px 0 rgba(255,255,255,.5)}

        .summary-pom-card{grid-column:1/-1;padding:14px 22px;border-radius:14px;text-align:center;background:linear-gradient(135deg,rgba(255,212,0,.55),rgba(255,138,0,.40),rgba(255,77,210,.40));border:2px solid rgba(255,212,0,.75);box-shadow:0 0 40px rgba(255,212,0,.45);animation:cardIn .55s ease-out both;position:relative;overflow:hidden}
        .summary-pom-card::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.20),transparent);pointer-events:none}
        .summary-pom-card .pom-label{font-size:11px;letter-spacing:4px;color:#fff;font-weight:900;margin-bottom:5px;text-shadow:0 1px 3px rgba(0,0,0,.5);position:relative;z-index:1}
        .summary-pom-card .pom-name{font-size:22px;font-weight:1000;color:#fff;text-shadow:0 0 22px rgba(255,212,0,.85),0 2px 5px rgba(0,0,0,.55);position:relative;z-index:1}

        @keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
        @keyframes screenIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
        @keyframes screenOut{from{opacity:1}to{opacity:0}}

        .display-grid{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;overflow:hidden;padding-right:4px;flex:1;min-height:0}
        .display-card{padding:10px 14px;border-radius:12px;background:linear-gradient(135deg,rgba(0,212,255,.16),rgba(0,212,255,.05));border:1px solid rgba(255,255,255,.20);border-left:5px solid #00d4ff;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:cardIn .45s ease-out both}
        .display-card b{display:block;font-size:11px;letter-spacing:1.6px;color:#9fe6ff;margin-bottom:4px;font-weight:800}
        .display-card span{display:block;font-size:clamp(14px,1.5vw,22px);font-weight:900;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 2px 6px rgba(0,0,0,.5)}

        @media (max-width:1100px){
            .content-area.has-sidebar{grid-template-columns:180px 1fr}
        }
        @media (max-width:900px){
            .player-name,.bowler-name{max-width:80px;font-size:12px}
            .player-stats,.bowler-stats{font-size:12px;padding:2px 6px}
            .team-name{font-size:14px;letter-spacing:1px}
            .team-score{font-size:20px}
            .ball{width:22px;height:22px;font-size:10px}
            .grid-item{padding:5px 9px;gap:5px}
            .innings-badge{font-size:10px;padding:6px 9px;letter-spacing:1px}
            .marquee span{-webkit-text-stroke:3px #000}
            .display-screen{padding:6vh 5vw}
            .lt-left{min-width:150px;padding:8px 14px}
            .lt-title{font-size:16px;letter-spacing:1px}
            .lt-subtitle{font-size:15px}
            .lt-card{padding:4px 10px}
            .lt-card span{font-size:13px}
            .content-area.has-sidebar{grid-template-columns:1fr;grid-template-rows:auto 1fr}
            .side-panel{flex-direction:row;overflow-x:auto;overflow-y:hidden}
            .side-card{min-width:180px}
            .table-block.batting .table-header,
            .table-block.batting .table-row{grid-template-columns: 1.6fr 1.6fr .5fr .5fr .45fr .45fr .7fr;font-size:11px}
        }
    </style>
</head>
<body>

    <div class="lower-third-wrapper">

        <div class="lower-third-screen" id="lowerThirdScreen" data-type="">
            <div class="lt-left">
                <div class="lt-kicker">BRKLIVE19</div>
                <div class="lt-title" id="ltTitle">PLAYER STATUS</div>
                <div class="lt-team" id="ltTeam"></div>
            </div>
            <div class="lt-right">
                <div class="lt-subtitle" id="ltSubtitle"></div>
                <div class="lt-cards" id="ltCards"></div>
            </div>
        </div>

        <div class="cricket-overlay" id="overlayBar">
            <div class="status-dot" id="statusDot"></div>
            <div class="grid-item c1-r1"><span class="team-name" id="batting-team">TEAM A</span><span class="team-score" id="team-score-main">0/0</span></div>
            <div class="grid-item c1-r2"><span class="overs-text" id="team-overs">(0.0 OV)</span><span class="crr-text" id="team-crr">CRR: 0.00</span></div>
            <div class="grid-item c2-r1"><span class="player-name active" id="striker-name">STRIKER</span><span class="player-stats" id="striker-stats">0 (0)</span></div>
            <div class="grid-item c2-r2"><span class="player-name" id="non-striker-name">NON-STRIKER</span><span class="player-stats" id="non-striker-stats">0 (0)</span></div>
