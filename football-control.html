<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRKLIVE19 Football Controller</title><style>body{margin:0;padding:16px;background:#06111d;color:#fff;font-family:Arial,sans-serif}*{box-sizing:border-box}.wrap{max-width:900px;margin:auto}.card{background:linear-gradient(145deg,#0c2338,#07131f);border:1px solid #1e5a4a;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 15px 40px #0008}h1{text-align:center;color:#53e89a}label{display:block;color:#a8c8c0;font-size:13px;margin-top:8px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #31516b;background:#071421;color:#fff;margin:5px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:9px;padding:9px 10px;font-size:12px;color:#fff;font-weight:900;cursor:pointer;width:100%;margin-top:7px}.green{background:linear-gradient(135deg,#087d4b,#20d77c)}.yellow{background:linear-gradient(135deg,#9b6900,#ffd34d);color:#111}.red{background:linear-gradient(135deg,#8e0922,#ff3158)}.blue{background:linear-gradient(135deg,#075cc9,#36b8ff)}.dark{background:#24354b}.score{text-align:center;font-size:64px;font-weight:900}.timer{text-align:center;font-size:48px;font-weight:900;color:#ffe26d}.status{text-align:center;padding:10px;border-radius:10px;background:#092a20;margin-top:10px}.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.grid,.links{grid-template-columns:1fr}}</style></head><body><script>if(!localStorage.getItem("brklive_user")){location.href="./index.html?login=1"}</script><div class="wrap"><h1>⚽ BRKLIVE19 FOOTBALL CONTROL</h1><div class="card"><div class="grid"><div><label>Home Team</label><input id="home" value="HOME"></div><div><label>Away Team</label><input id="away" value="AWAY"></div></div><div class="grid"><div><label>Period</label><select id="period"><option>1H</option><option>HT</option><option>2H</option><option>ET1</option><option>ET2</option><option>PEN</option><option>FT</option></select></div><div><label>Added / Extra Time (minutes)</label><input id="added" type="number" min="0" value="0"></div></div></div><div class="grid"><div class="card"><h2 id="homeName">HOME</h2><div class="score" id="homeScore">0</div><button class="btn green" id="homeGoal">⚽ + GOAL</button><button class="btn yellow" id="homeYellow">🟨 YELLOW</button><button class="btn red" id="homeRed">🟥 RED</button></div><div class="card"><h2 id="awayName">AWAY</h2><div class="score" id="awayScore">0</div><button class="btn green" id="awayGoal">⚽ + GOAL</button><button class="btn yellow" id="awayYellow">🟨 YELLOW</button><button class="btn red" id="awayRed">🟥 RED</button></div></div><div class="card"><div class="timer" id="timer">00:00</div><div class="grid"><button class="btn green" id="start">▶ START</button><button class="btn yellow" id="pause">⏸ PAUSE</button></div><button class="btn dark" id="reset">↺ RESET</button><button class="btn blue" id="save">💾 SEND SCORE TO OVERLAY</button><div class="status" id="status">Ready</div></div><div class="card"><h2>📺 Football Lower Third Graphics</h2><div class="grid"><button class="btn blue" id="showTournament">🏆 TOURNAMENT</button><button class="btn blue" id="showMatch">⚽ MATCH</button><button class="btn green" id="showPlayer">👤 PLAYER</button><button class="btn dark" id="showCustom">✏️ CUSTOM TEXT</button></div><button class="btn red" id="hideGraphic">✕ HIDE LOWER THIRD</button><div class="status" id="graphicStatus">No lower-third graphic selected</div></div><div class="card"><h2>🎨 Football Overlay Colours</h2><div class="grid"><div><label>Primary Colour</label><input id="primaryColor" type="color" value="#087d4b"></div><div><label>Accent Colour</label><input id="accentColor" type="color" value="#53e89a"></div><div><label>Score Background</label><input id="scoreColor" type="color" value="#061b35"></div><div><label>Goal Animation Colour</label><input id="goalColor" type="color" value="#16c784"></div></div><button class="btn blue" id="applyColors">APPLY COLOURS</button></div><div class="card"><h2>📺 Football Broadcast</h2><div class="links"><button class="btn blue" id="openOverlay">OPEN FOOTBALL OVERLAY</button><button class="btn dark" id="copyOverlay">COPY OVERLAY LINK</button></div></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getDatabase,ref,set}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';const cfg={apiKey:'AIzaSyBLWq1bqJ32F2cg3mqYQ0uwXcS3zvTA3A4',authDomain:'brklive19-2bab4.firebaseapp.com',databaseURL:'https://brklive19-2bab4-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'brklive19-2bab4',storageBucket:'brklive19-2bab4.firebasestorage.app',messagingSenderId:'294058533898',appId:'1:294058533898:web:4996705937e969939cabf3'};const db=getDatabase(initializeApp(cfg)),live=ref(db,'footballLiveScore');const $=id=>document.getElementById(id);const active=JSON.parse(localStorage.getItem('brklive19_activeFootballMatch')||'null');if(active){$('home').value=active.homeTeam||'HOME';$('away').value=active.awayTeam||'AWAY';}let saved=JSON.parse(localStorage.getItem('brklive19_football')||'null');let s={home:0,away:0,hy:0,ay:0,hr:0,ar:0,sec:0,run:false,t:null,goal:null,startTimestamp:null,graphic:null};if(saved){s={...s,...saved,run:!!saved.running,startTimestamp:saved.startTimestamp||null,graphic:saved.graphic||null};}let colors=JSON.parse(localStorage.getItem('brklive19_football_colors')||'{}');function currentSec(){return s.run&&s.startTimestamp?Math.max(0,s.sec+Math.floor((Date.now()-s.startTimestamp)/1000)):s.sec}function render(){s.sec=currentSec(); $('homeName').textContent=$('home').value.toUpperCase()||'HOME';$('awayName').textContent=$('away').value.toUpperCase()||'AWAY';$('homeScore').textContent=s.home;$('awayScore').textContent=s.away;$('timer').textContent=String(Math.floor(s.sec/60)).padStart(2,'0')+':'+String(s.sec%60).padStart(2,'0');$('status').textContent=$('period').value+' • +'+(Number($('added').value)||0)+' MIN • 🟨 '+s.hy+'-'+s.ay+' • 🟥 '+s.hr+'-'+s.ar;if(s.graphic)$('graphicStatus').textContent='Showing: '+s.graphic.type+(s.graphic.text?' • '+s.graphic.text:'')}function bind(id,fn){$(id).onclick=()=>{fn();render()}}bind('homeGoal',()=>{s.home++;s.goal={team:'home',name:$('home').value||'HOME',id:Date.now()}});bind('awayGoal',()=>{s.away++;s.goal={team:'away',name:$('away').value||'AWAY',id:Date.now()}});bind('homeYellow',()=>s.hy++);bind('awayYellow',()=>s.ay++);bind('homeRed',()=>s.hr++);bind('awayRed',()=>s.ar++);$('start').onclick=()=>{if(s.run)return;s.sec=currentSec();s.startTimestamp=Date.now();s.run=true;send();s.t=setInterval(()=>{render();send()},1000)};$('pause').onclick=()=>{s.sec=currentSec();s.run=false;s.startTimestamp=null;clearInterval(s.t);send();render()};$('reset').onclick=()=>{s.run=false;clearInterval(s.t);s={home:0,away:0,hy:0,ay:0,hr:0,ar:0,sec:0,run:false,t:null,goal:null,startTimestamp:null,graphic:null};render();send()};async function send(){const d={sport:'football',football:{homeTeam:$('home').value||'HOME',awayTeam:$('away').value||'AWAY',homeScore:s.home,awayScore:s.away,homeYellow:s.hy,awayYellow:s.ay,homeRed:s.hr,awayRed:s.ar,seconds:currentSec(),running:s.run,startTimestamp:s.startTimestamp,period:$('period').value,addedTime:Number($('added').value)||0,updatedAt:Date.now(),colors:{primary:colors.primary||'#087d4b',accent:colors.accent||'#53e89a',score:colors.score||'#061b35',goal:colors.goal||'#16c784'},goal:s.goal||null,graphic:s.graphic||null}};localStorage.setItem('brklive19_football',JSON.stringify(d.football));try{localStorage.setItem('brklive19_liveSport',JSON.stringify(d.football));new BroadcastChannel('BRKLIVE19_LIVE').postMessage(d);}catch(e){}await set(live,{...d,updatedAt:Date.now()});$('status').textContent='LIVE SCORE SENT TO INTERNET / FIREBASE'}function setGraphic(type,text){s.graphic={type,text:text||'',updatedAt:Date.now()};send();render()}$('showTournament').onclick=()=>setGraphic('tournament',prompt('Tournament name:','BRKLIVE19 TOURNAMENT')||'');$('showMatch').onclick=()=>setGraphic('match',($('home').value||'HOME')+'  VS  '+($('away').value||'AWAY'));$('showPlayer').onclick=()=>setGraphic('player',prompt('Player name / details:','PLAYER')||'');$('showCustom').onclick=()=>setGraphic('custom',prompt('Custom overlay text:','')||'');$('hideGraphic').onclick=()=>{s.graphic=null;send();render()};
$('applyColors').onclick=()=>{colors={primary:$('primaryColor').value,accent:$('accentColor').value,score:$('scoreColor').value,goal:$('goalColor').value};localStorage.setItem('brklive19_football_colors',JSON.stringify(colors));send()};$('save').onclick=send;const overlayUrl=()=>location.href.replace(/football(?:-control)?\.html.*/i,'football-overlay.html');$('openOverlay').onclick=()=>window.open(overlayUrl(),'_blank');$('copyOverlay').onclick=()=>navigator.clipboard.writeText(overlayUrl()).then(()=>alert('Overlay link copied'));render();if(s.run){s.t=setInterval(()=>{render();send()},1000)}else if(s.graphic){render()}setInterval(()=>{if(s.run)render()},250);</script></body></html>
