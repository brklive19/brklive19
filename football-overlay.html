<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRKLIVE19 Football Overlay</title>
<style>
  /* ============================================================
     BRKLIVE19 FOOTBALL OVERLAY
     - Transparent background (OBS / vMix / Streamlabs friendly)
     - Syncs with football-control.html via BroadcastChannel,
       localStorage AND Firebase Realtime Database.
     - Includes penalty shootout score row.
     ============================================================ */

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }

  /* BRKLIVE19 style: everything uppercase */
  body, body * { text-transform: uppercase; }

  :root {
    --primary:    #087d4b;
    --accent:     #53e89a;
    --score-bg:   #061b35;
    --goal:       #16c784;
  }

  /* ============ SCOREBOARD WRAPPER (TOP LEFT) ============ */
  .scoreboard-wrap {
    position: fixed;
    top: 26px;
    left: 26px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
  }

  /* ============ MAIN SCOREBOARD BAR ============ */
  .scoreboard {
    display: flex;
    align-items: stretch;
    height: 66px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow:
      0 12px 34px rgba(0,0,0,.50),
      0 0 0 1px rgba(255,255,255,.10);
  }

  /* ---- full-colour team name blocks ---- */
  .team-block {
    display: flex;
    align-items: center;
    padding: 0 22px;
    min-width: 130px;
    font-size: 21px;
    font-weight: 900;
    letter-spacing: 1.3px;
    white-space: nowrap;
    transition: background .3s, color .3s;
  }
  .team-block.home {
    justify-content: flex-start;
    background:
      linear-gradient(180deg, rgba(255,255,255,.20), rgba(0,0,0,.14)),
      var(--primary);
    border-radius: 12px 0 0 12px;
    box-shadow:
      inset 0 -3px 0 rgba(0,0,0,.22),
      inset 0  3px 0 rgba(255,255,255,.14);
  }
  .team-block.away {
    justify-content: flex-end;
    background:
      linear-gradient(180deg, rgba(255,255,255,.20), rgba(0,0,0,.14)),
      var(--accent);
    border-radius: 0 12px 12px 0;
    box-shadow:
      inset 0 -3px 0 rgba(0,0,0,.22),
      inset 0  3px 0 rgba(255,255,255,.14);
  }

  /* cards inside team blocks */
  .cards {
    display: inline-flex;
    gap: 5px;
    margin-left: 12px;
    font-size: 12px;
    font-weight: 900;
  }
  .team-block.away .cards {
    margin-left: 0;
    margin-right: 12px;
    order: -1;
  }
  .card-y {
    background: #f1c40f;
    color: #111;
    padding: 2px 6px;
    border-radius: 3px;
  }
  .card-r {
    background: #e74c3c;
    color: #fff;
    padding: 2px 6px;
    border-radius: 3px;
  }

  /* ---- score ---- */
  .score-group {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 0 22px;
    background: var(--score-bg);
    font-size: 30px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    min-width: 120px;
  }
  .sep { opacity: .40; font-size: 25px; font-weight: 600; }
  .score { transition: transform .18s ease; }
  .score.bump { transform: scale(1.35); }

  /* ---- clock ---- */
  .clock-block {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 20px;
    background: rgba(0,0,0,.60);
    border-left: 1px solid rgba(255,255,255,.12);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #f1c40f;
    box-shadow: 0 0 10px #f1c40f;
    transition: background .25s, box-shadow .25s;
  }
  .dot.live {
    background: #2ecc71;
    box-shadow: 0 0 10px #2ecc71;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%     { opacity: .35; transform: scale(.8); }
  }
  .period-badge {
    background: var(--primary);
    padding: 3px 8px;
    border-radius: 5px;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .added-time {
    color: var(--accent);
    font-size: 14px;
    font-weight: 900;
    display: none;
  }
  .added-time.show { display: inline; }

  /* ============ PENALTY SHOOTOUT ROW ============ */
  .penalty-row {
    display: flex;
    align-items: stretch;
    height: 44px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow:
      0 8px 22px rgba(0,0,0,.45),
      0 0 0 1px rgba(255,255,255,.10);
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity .35s ease, transform .35s ease;
    pointer-events: none;
  }
  .penalty-row.show {
    opacity: 1;
    transform: translateY(0);
  }

  .pen-team {
    display: flex;
    align-items: center;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 1.2px;
    min-width: 130px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pen-team.home {
    justify-content: flex-start;
    background: rgba(0,0,0,.72);
    color: #fff;
    border-left: 5px solid var(--primary);
    border-radius: 10px 0 0 10px;
  }
  .pen-team.away {
    justify-content: flex-end;
    background: rgba(0,0,0,.72);
    color: #fff;
    border-right: 5px solid var(--accent);
    border-radius: 0 10px 10px 0;
  }

  .pen-score-group {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 0 18px;
    background: rgba(0,0,0,.88);
    font-size: 20px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    min-width: 110px;
  }
  .pen-score { transition: transform .18s ease; }
  .pen-score.bump { transform: scale(1.35); }

  .pen-kicks{display:flex;align-items:center;justify-content:center;padding:0 12px;background:rgba(4,12,22,.88);color:#d9e8f4;font-size:10px;font-weight:900;letter-spacing:1px;white-space:nowrap}
  .pen-label {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 16px;
    background: linear-gradient(135deg, #8e0922, #ff3158);
    color: #fff;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 2px;
  }
  .pen-label::before {
    content: '';
    width: 8px; height: 8px; border-radius: 50%;
    background: #ffd34d;
    box-shadow: 0 0 8px #ffd34d;
    animation: pulse 1.4s ease-in-out infinite;
  }

  /* ============ LOWER THIRD ============ */
  .lower-third {
    position: fixed;
    left: 26px;
    bottom: 60px;
    display: flex;
    align-items: stretch;
    height: 64px;
    border-radius: 10px;
    overflow: hidden;
    opacity: 0;
    transform: translateY(30px);
    transition: opacity .4s ease, transform .4s ease;
    box-shadow: 0 12px 34px rgba(0,0,0,.55);
    pointer-events: none;
    z-index: 9;
  }
  .lower-third.show {
    opacity: 1;
    transform: translateY(0);
  }
  .lt-accent { width: 8px; background: var(--accent); }
  .lt-body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 24px;
    background: linear-gradient(90deg, rgba(6,17,29,.96), rgba(6,17,29,.85));
    min-width: 280px;
  }
  .lt-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--accent);
    font-weight: 800;
    margin-bottom: 3px;
  }
  .lt-text {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
    white-space: nowrap;
    max-width: 70vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ============ PLAY XI PANEL ============ */
  .xi-panel {
    position: fixed;
    left: 50%;
    bottom: 60px;
    transform: translate(-50%, 30px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-radius: 14px;
    overflow: hidden;
    background: linear-gradient(145deg, rgba(6,17,29,.96), rgba(6,17,29,.85));
    box-shadow: 0 15px 40px rgba(0,0,0,.6);
    opacity: 0;
    transition: opacity .4s ease, transform .4s ease;
    pointer-events: none;
    max-width: 92vw;
    z-index: 9;
  }
  .xi-panel.show { opacity: 1; transform: translate(-50%, 0); }
  .xi-col { padding: 16px 26px; }
  .xi-col.home { border-right: 1px solid rgba(255,255,255,.1); }
  .xi-title {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1px;
    padding-bottom: 8px;
    margin-bottom: 8px;
    border-bottom: 2px solid var(--accent);
    color: var(--accent);
  }
  .xi-list {
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 13px;
    line-height: 1.75;
    columns: 2;
    column-gap: 18px;
    max-height: 220px;
    overflow: hidden;
  }
  .xi-list li {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ============ PLAYER CHANGE ============ */
  .change-panel {
    position: fixed;
    left: 50%;
    bottom: 60px;
    transform: translate(-50%, 30px);
    display: flex;
    align-items: stretch;
    border-radius: 12px;
    overflow: hidden;
    background: linear-gradient(145deg, rgba(6,17,29,.96), rgba(6,17,29,.85));
    box-shadow: 0 15px 40px rgba(0,0,0,.6);
    opacity: 0;
    transition: opacity .4s ease, transform .4s ease;
    pointer-events: none;
    z-index: 9;
  }
  .change-panel.show { opacity: 1; transform: translate(-50%, 0); }
  .change-head {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 22px;
    background: var(--primary);
  }
  .change-head .team-name {
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 1px;
  }
  .change-head .change-label {
    font-size: 10px;
    letter-spacing: 2px;
    opacity: .85;
    margin-top: 3px;
  }
  .change-body {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 14px 28px;
  }
  .change-player {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .change-player .tag {
    font-size: 10px;
    letter-spacing: 2px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .change-player.out .tag { background: #e74c3c; }
  .change-player.in  .tag { background: #2ecc71; color: #04170c; }
  .change-player .pname {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 1px;
  }
  .change-arrow {
    font-size: 26px;
    color: var(--accent);
    font-weight: 900;
  }

  /* ============ GOAL FLASH ============ */
  .goal-flash {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,.14), transparent 65%);
    z-index: 20;
  }
  .goal-flash span {
    font-size: 12vw;
    font-weight: 900;
    letter-spacing: 14px;
    text-shadow: 0 0 60px currentColor, 0 6px 30px rgba(0,0,0,.6);
  }
  .goal-flash.show {
    animation: goalPop 2s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes goalPop {
    0%   { opacity: 0; transform: scale(.55); }
    15%  { opacity: 1; transform: scale(1.08); }
    30%  { transform: scale(1); }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: scale(1.15); }
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 700px) {
    .penalty-row{max-width:calc(100vw - 24px)}
    .scoreboard-wrap { top: 12px; left: 12px; }
    .scoreboard { height: 54px; }
    .team-block { padding: 0 12px; font-size: 15px; min-width: 80px; }
    .score-group { padding: 0 12px; font-size: 22px; min-width: 80px; }
    .clock-block { padding: 0 12px; font-size: 16px; gap: 6px; }
    .cards { display: none; }
    .penalty-row { height: 36px; }
    .pen-team { padding: 0 10px; font-size: 11px; min-width: 80px; }
    .pen-score-group { padding: 0 10px; font-size: 15px; min-width: 70px; }
    .pen-label { padding: 0 10px; font-size: 9px; letter-spacing: 1px; }
    .pen-kicks{padding:0 7px;font-size:8px}
    .lower-third { left: 12px; bottom: 20px; height: 54px; }
    .lt-body { padding: 0 14px; min-width: 180px; }
    .lt-text { font-size: 16px; }
    .xi-panel { grid-template-columns: 1fr; bottom: 20px; }
    .xi-list { columns: 1; max-height: 140px; }
    .change-panel { flex-direction: column; bottom: 20px; }
    .change-body { flex-direction: column; gap: 8px; padding: 10px 16px; }
    .change-arrow { transform: rotate(90deg); }
  }

  /* ============ DEDICATED PENALTY SHOOTOUT GRAPHIC ============ */
  .scoreboard-wrap { gap: 0; }
  .penalty-row {
    position: fixed;
    left: 50%;
    top: 18%;
    width: min(1040px, calc(100vw - 48px));
    height: auto;
    min-height: 190px;
    padding: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(95,210,255,.55);
    border-radius: 18px;
    overflow: hidden;
    opacity: 0;
    transform: translate(-50%, -12px) scale(.97);
    background: linear-gradient(135deg, rgba(3,12,30,.97), rgba(7,35,65,.97) 55%, rgba(2,12,28,.98));
    box-shadow: 0 20px 65px rgba(0,0,0,.62), 0 0 35px rgba(0,170,255,.20), inset 0 1px 0 rgba(255,255,255,.12);
    pointer-events: none;
    transition: opacity .35s ease, transform .35s ease;
  }
  .penalty-row.show {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }
  .penalty-heading {
    min-height: 42px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    color:#f6fbff;
    font-size:17px;
    font-weight:1000;
    letter-spacing:3px;
    background:linear-gradient(90deg,#07152e,#0b4774,#07152e);
    border-bottom:1px solid rgba(90,205,255,.35);
  }
  .penalty-live-dot { width:9px;height:9px;border-radius:50%;background:#ff3d55;box-shadow:0 0 12px #ff3d55;animation:pulse 1s infinite; }
  .penalty-stage { color:#69ddff;font-size:10px;letter-spacing:1.5px;margin-left:10px; }
  .penalty-main { display:grid;grid-template-columns:minmax(0,1fr) 230px minmax(0,1fr);align-items:stretch;min-height:145px; }
  .pen-team {
    min-width:0;
    padding:18px 24px;
    font-size:clamp(15px,2vw,24px);
    letter-spacing:1.5px;
    background:transparent!important;
    color:#f5faff!important;
    border:0!important;
    border-radius:0!important;
    white-space:normal;
    overflow-wrap:anywhere;
    text-shadow:0 2px 10px rgba(0,0,0,.6);
  }
  .pen-team.home { justify-content:flex-start;border-left:6px solid #19bfff!important; }
  .pen-team.away { justify-content:flex-end;border-right:6px solid #ffbd4a!important; }
  .pen-score-group {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:10px 14px;
    background:rgba(0,0,0,.38);
    color:#fff;
    font-size:clamp(38px,5vw,62px);
    font-weight:1000;
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 20px rgba(52,202,255,.3);
  }
  .pen-score { min-width:40px;text-align:center; }
  .pen-score-group .sep { color:#7cdfff;font-size:35px;opacity:.8; }
  .pen-kicks {
    grid-column:1 / 3;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:34px;
    color:#bfeeff;
    background:rgba(0,0,0,.35);
    font-size:12px;
    font-weight:900;
    letter-spacing:2px;
    border-top:1px solid rgba(255,255,255,.08);
  }
  .pen-label {
    grid-column:3;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#071629;
    background:linear-gradient(90deg,#ffd36a,#ffab37);
    font-size:11px;
    font-weight:1000;
    letter-spacing:2px;
  }
  @media(max-width:620px) {
    .penalty-row { top:12%;width:calc(100vw - 20px);min-height:150px;border-radius:12px; }
    .penalty-heading { min-height:34px;font-size:12px;letter-spacing:1.5px;gap:7px; }
    .penalty-stage { font-size:8px;margin-left:2px; }
    .penalty-main { grid-template-columns:minmax(0,1fr) 110px minmax(0,1fr);min-height:112px; }
    .pen-team { padding:10px 8px;font-size:12px;letter-spacing:.5px; }
    .pen-score-group { gap:7px;padding:6px;font-size:34px; }
    .pen-score-group .sep { font-size:22px; }
    .pen-kicks { font-size:9px;letter-spacing:1px; }
    .pen-label { font-size:8px;letter-spacing:1px; }
  }


/* BRKLIVE19 cinematic penalty shootout design */
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent!important}
.scoreboard-wrap{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
.penalty-row{position:absolute!important;left:0!important;top:0!important;width:100vw!important;height:100vh!important;min-height:0!important;max-width:none!important;padding:0!important;box-sizing:border-box;display:flex!important;flex-direction:column;justify-content:flex-start;align-items:center;overflow:hidden!important;border:0!important;border-radius:0!important;opacity:0;transform:scale(.985);background:radial-gradient(ellipse at 50% 72%,rgba(11,91,71,.96) 0%,rgba(3,33,46,.96) 33%,rgba(2,11,29,.98) 72%)!important;box-shadow:none!important;transition:opacity .45s ease,transform .45s ease;isolation:isolate}
.penalty-row.show{opacity:1;transform:scale(1)}
.penalty-row:before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(0,132,255,.34),transparent 42%,rgba(255,24,55,.32)),repeating-linear-gradient(0deg,transparent 0 7%,rgba(255,255,255,.025) 7.1% 7.3%),radial-gradient(ellipse at 50% 110%,rgba(44,255,150,.28),transparent 52%)}
.penalty-row:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.05),transparent 55%,rgba(0,0,0,.25));pointer-events:none}
.arena-lights{position:absolute;top:0;left:0;right:0;height:25%;background:radial-gradient(ellipse at 8% 0%,rgba(0,183,255,.65),transparent 28%),radial-gradient(ellipse at 92% 0%,rgba(255,35,60,.58),transparent 28%);filter:blur(10px);z-index:-1}
.ps-brand{margin-top:2.2vh;display:flex;align-items:center;gap:12px;color:#fff;font-size:clamp(17px,2.5vw,34px);font-weight:1000;font-style:italic;text-shadow:0 3px 14px #000;letter-spacing:1px}
.ps-brand small{font-size:clamp(8px,.9vw,13px);letter-spacing:3px;background:linear-gradient(90deg,#101c34,#283d5c,#101c34);padding:7px 18px;border-radius:4px;margin-left:10px}
.ps-play{display:grid;place-items:center;width:clamp(28px,3.5vw,48px);height:clamp(22px,2.8vw,36px);border-radius:9px;background:#f21d32;color:white;font-size:18px;font-style:normal;box-shadow:0 0 20px #ff304a}
.ps-title{margin-top:2.1vh;width:min(78vw,1250px);min-height:12vh;display:flex;align-items:center;justify-content:center;position:relative;color:#fff;font-size:clamp(25px,5.3vw,76px);font-weight:1000;font-style:italic;letter-spacing:1px;text-align:center;text-shadow:0 4px 2px #111,0 0 24px rgba(255,255,255,.28);background:linear-gradient(100deg,#052b72,#071a3c 48%,#7e0718);border:4px solid #c6a45b;clip-path:polygon(3% 0,97% 0,100% 50%,97% 100%,3% 100%,0 50%);box-shadow:0 12px 35px #000}
.ps-title b{position:absolute;bottom:-2.3vh;left:50%;transform:translateX(-50%);padding:5px 30px;background:linear-gradient(#ff3b42,#a90019);border:2px solid #ffd46d;border-radius:8px;font-size:clamp(13px,1.8vw,24px);font-style:normal;letter-spacing:2px;box-shadow:0 5px 18px #000}
.ps-title b i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#fff;margin-right:7px;box-shadow:0 0 12px white;animation:pulse 1s infinite}

let lastUpdated = 0;

/* last-known scores so we can animate on change */
let lastHomeScore = -1;
let lastAwayScore = -1;
let lastHomePen   = -1;
let lastAwayPen   = -1;

/* ---------- render helpers ---------- */
function applyColors() {
  const c = state.colors || {};
  const root = document.documentElement.style;
  root.setProperty('--primary',  c.primary  || '#087d4b');
  root.setProperty('--accent',   c.accent   || '#53e89a');
  root.setProperty('--score-bg', c.score    || '#061b35');
  root.setProperty('--goal',     c.goal     || '#16c784');

  // Auto-contrast text on the full-colour team blocks
  $('homeBlock').style.color = readableText(c.primary || '#087d4b');
  $('awayBlock').style.color = readableText(c.accent  || '#53e89a');
}

function renderCards() {
  const mk = (y, r) => {
    let h = '';
    if (y > 0) h += `<span class="card-y">${y}</span>`;
    if (r > 0) h += `<span class="card-r">${r}</span>`;
    return h;
  };
  $('homeCards').innerHTML = mk(state.homeYellow, state.homeRed);
  $('awayCards').innerHTML = mk(state.awayYellow, state.awayRed);
}

function applyOverlayDisplayMode(){
  const mode = state.overlayDisplayMode || 'normal';
  const showScore = mode === 'normal' || mode === 'both';
  const showPenalty = mode === 'penalty' || mode === 'both';
  const scoreboard = $('scoreboard');
  scoreboard.style.setProperty('display', showScore ? 'flex' : 'none', 'important');
  scoreboard.style.visibility = showScore ? 'visible' : 'hidden';
  scoreboard.style.opacity = showScore ? '1' : '0';
  $('penaltyRow').classList.toggle('show', showPenalty && !!state.penaltyActive);
}

function renderScoreboard() {
  applyOverlayDisplayMode();
  $('homeName').textContent = (state.homeTeam || 'HOME');
  $('awayName').textContent = (state.awayTeam || 'AWAY');
  $('period').textContent   = state.period || '1H';

  // added time badge
  const at = Number(state.addedTime) || 0;
  if (at > 0) {
    $('addedTime').textContent = '+' + at;
    $('addedTime').classList.add('show');
  } else {
    $('addedTime').classList.remove('show');
  }

  // score with bump animation
  const hs = Number(state.homeScore) || 0;
  const as = Number(state.awayScore) || 0;
  if (hs !== lastHomeScore) {
    $('homeScore').textContent = hs;
    if (lastHomeScore >= 0) bump($('homeScore'));
    lastHomeScore = hs;
  }
  if (as !== lastAwayScore) {
    $('awayScore').textContent = as;
    if (lastAwayScore >= 0) bump($('awayScore'));
    lastAwayScore = as;
  }

  renderCards();
}

/* ---------- penalty shootout ---------- */
function renderPenalty() {
  const row = $('penaltyRow');
  const p = state.penaltyShootout || {};
  const active = !!state.penaltyActive;
  const teamA = p.teamA || state.homeTeam || 'HOME';
  const teamB = p.teamB || state.awayTeam || 'AWAY';
  $('penHomeName').textContent = teamA;
  $('penAwayName').textContent = teamB;
  $('penHomeLabel').textContent = teamA;
  $('penAwayLabel').textContent = teamB;
  const ka = Array.isArray(p.kicks?.A) ? p.kicks.A : [];
  const kb = Array.isArray(p.kicks?.B) ? p.kicks.B : [];
  const hp = p.scoreA != null ? Number(p.scoreA)||0 : ka.filter(x=>x.result==='goal').length;
  const ap = p.scoreB != null ? Number(p.scoreB)||0 : kb.filter(x=>x.result==='goal').length;
  if (hp !== lastHomePen) { $('penHomeScore').textContent=hp; if(lastHomePen>=0&&active)bump($('penHomeScore')); lastHomePen=hp; }
  if (ap !== lastAwayPen) { $('penAwayScore').textContent=ap; if(lastAwayPen>=0&&active)bump($('penAwayScore')); lastAwayPen=ap; }
  const rounds = 10; // Always display all ten penalty positions
  $('penaltyRow').classList.add('ten-kicks');
  $('penRoundHeaders').innerHTML = Array.from({length:rounds},(_,i)=>`<span>${i+1}</span>`).join('');
  const marker = (kick) => {
    if (!kick) return '<span class="ps-kick pending">–</span>';
    return kick.result === 'goal' ? '<span class="ps-kick goal">✓</span>' : '<span class="ps-kick miss">×</span>';
  };
  $('penHomeKicks').innerHTML = Array.from({length:rounds},(_,i)=>marker(ka[i])).join('');
  $('penAwayKicks').innerHTML = Array.from({length:rounds},(_,i)=>marker(kb[i])).join('');
  $('penKickDetails').textContent = p.finished ? (p.result || 'SHOOTOUT COMPLETE') : 'SHOOTOUT IN PROGRESS';
  $('penaltyStage').textContent = p.finished ? 'FINAL RESULT' : (Math.max(ka.length,kb.length) >= 10 ? 'SUDDEN DEATH' : 'PENALTY KICKS');
  row.classList.add('show');
  applyOverlayDisplayMode();
}

function renderClock() {
  const secs = isRunning
    ? baseSeconds + (Date.now() - baseAt) / 1000
    : baseSeconds;
  $('clock').textContent = formatTime(secs);
  $('dot').classList.toggle('live', !!isRunning);
}

/* ---------- graphics ---------- */
function updateGraphics() {
  const b = state.broadcast || {};
  const lt = $('lowerThird');
  const xi = $('xiPanel');
  const cp = $('changePanel');

  lt.classList.remove('show');
  xi.classList.remove('show');
  cp.classList.remove('show');

  switch (b.graphic) {
    case 'tournament':
      $('ltLabel').textContent = 'TOURNAMENT';
      $('ltText').textContent  = b.tournamentName || '—';
      lt.classList.add('show');
      break;

    case 'match':
      $('ltLabel').textContent = 'MATCH';
      $('ltText').textContent  = b.matchName || '—';
      lt.classList.add('show');
      break;

    case 'custom':
      $('ltLabel').textContent = 'INFO';
      $('ltText').textContent  = b.customText || '—';
      lt.classList.add('show');
      break;

    case 'playXI': {
      const p = b.playXI;
      if (!p) break;
      $('xiHomeTitle').textContent = (p.homeTeam || 'HOME') + ' XI';
      $('xiAwayTitle').textContent = (p.awayTeam || 'AWAY') + ' XI';
      const home = Array.isArray(p.homePlayers) ? p.homePlayers : [];
      const away = Array.isArray(p.awayPlayers) ? p.awayPlayers : [];
      $('xiHomeList').innerHTML = home.length
        ? home.map(n => `<li>${esc(n)}</li>`).join('')
        : '<li>—</li>';
      $('xiAwayList').innerHTML = away.length
        ? away.map(n => `<li>${esc(n)}</li>`).join('')
        : '<li>—</li>';
      xi.classList.add('show');
      break;
    }

    case 'playerChange': {
      const pc = b.playerChange;
      if (!pc) break;
      $('changeTeamName').textContent = pc.teamName || 'TEAM';
      $('changeOut').textContent      = pc.playerOut || '—';
      $('changeIn').textContent       = pc.playerIn  || '—';
      cp.classList.add('show');
      break;
    }

    default:
      /* 'none' → everything hidden */
      break;
  }
}

/* ---------- goal flash ---------- */
function maybeFlashGoal() {
  const g = state.goal;
  if (!g || !g.id) return;
  if (g.id === lastGoalId) return;
  lastGoalId = g.id;

  const color = (g.team === 'home')
    ? (state.colors.primary || '#087d4b')
    : (state.colors.accent  || '#53e89a');

  $('flashText').textContent = 'GOAL!';
  $('flashText').style.color = color;

  const flash = $('goalFlash');
  flash.classList.remove('show');
  void flash.offsetWidth;
  flash.classList.add('show');
}
$('goalFlash').addEventListener('animationend', () => {
  $('goalFlash').classList.remove('show');
});

/* ============================================================
   DATA INGESTION
   Accepts either the full packet ({ sport, football, ... })
   or the bare football object (as stored in localStorage).
   ============================================================ */
function ingestFootball(fb) {
  if (!fb || typeof fb !== 'object') return;

  // Ignore stale packets that arrive out of order
  if (fb.updatedAt && fb.updatedAt < lastUpdated) return;
  if (fb.updatedAt) lastUpdated = fb.updatedAt;

  /* core match data */
  if (fb.homeTeam  !== undefined) state.homeTeam  = fb.homeTeam  || 'HOME';
  if (fb.awayTeam  !== undefined) state.awayTeam  = fb.awayTeam  || 'AWAY';
  if (fb.homeScore !== undefined) state.homeScore = Number(fb.homeScore) || 0;
  if (fb.awayScore !== undefined) state.awayScore = Number(fb.awayScore) || 0;
  if (fb.homeYellow !== undefined) state.homeYellow = Number(fb.homeYellow) || 0;
  if (fb.awayYellow !== undefined) state.awayYellow = Number(fb.awayYellow) || 0;
  if (fb.homeRed    !== undefined) state.homeRed    = Number(fb.homeRed)    || 0;
  if (fb.awayRed    !== undefined) state.awayRed    = Number(fb.awayRed)    || 0;
  if (fb.period     !== undefined) state.period     = fb.period || '1H';
  if (fb.addedTime  !== undefined) state.addedTime  = Number(fb.addedTime) || 0;

  /* ---------- PENALTY SHOOTOUT ----------
     Accepts several field-name shapes so the controller can
     send whichever it prefers:
       homePenalty / awayPenalty
       homePen / awayPen
       penaltyHome / penaltyAway
       homePenalties / awayPenalties
  --------------------------------------- */
  const hp = fb.homePenalty ?? fb.homePen ?? fb.penaltyHome ?? fb.homePenalties;
  const ap = fb.awayPenalty ?? fb.awayPen ?? fb.penaltyAway ?? fb.awayPenalties;
  if (hp !== undefined) state.homePenalty = Number(hp) || 0;
  if (ap !== undefined) state.awayPenalty = Number(ap) || 0;

  // auto-activate the row when the period is PEN, or when the
  // controller explicitly sends a `penaltyActive` flag.
  if (fb.penaltyActive !== undefined) {
    state.penaltyActive = !!fb.penaltyActive;
  } else if (String(state.period).toUpperCase() === 'PEN') {
    state.penaltyActive = true;
  } else if (
    (state.homePenalty > 0 || state.awayPenalty > 0) &&
    state.penaltyActive !== false
  ) {
    // if penalties were never explicitly toggled off, show them
    state.penaltyActive = true;
  }

  /* timer */
  if (fb.seconds !== undefined) {
    baseSeconds = Number(fb.seconds) || 0;
    baseAt = Date.now();
  }
  if (fb.running !== undefined) isRunning = !!fb.running;

  /* colours */
  if (fb.colors && typeof fb.colors === 'object') {
    state.colors = {
      primary: fb.colors.primary || state.colors.primary,
      accent:  fb.colors.accent  || state.colors.accent,
      score:   fb.colors.score   || state.colors.score,
      goal:    fb.colors.goal    || state.colors.goal
    };
    applyColors();
  }

  /* goal event */
  if (fb.goal !== undefined) state.goal = fb.goal;

  /* broadcast graphics */
  if (fb.broadcast && typeof fb.broadcast === 'object') {
    state.broadcast = {
      tournamentName: fb.broadcast.tournamentName || '',
      matchName:      fb.broadcast.matchName      || '',
      customText:     fb.broadcast.customText     || '',
      graphic:        fb.broadcast.graphic        || 'none',
      playXI:         fb.broadcast.playXI         || null,
      playerChange:   fb.broadcast.playerChange   || null,
      matchXI:        fb.broadcast.matchXI        || { home: [], away: [] }
    };
  }

  renderScoreboard();
  renderPenalty();
  updateGraphics();
  maybeFlashGoal();
}

function ingestPenalty(p) {
  if(!p || typeof p!=='object') return;
  state.penaltyShootout=p;
  state.penaltyActive = p.enabled !== undefined ? !!p.enabled : true;
  state.homePenalty=Number(p.scoreA)||0;
  state.awayPenalty=Number(p.scoreB)||0;
  if(p.teamA) state.homeTeam=p.teamA;
  if(p.teamB) state.awayTeam=p.teamB;
  renderPenalty();
}
function ingestPacket(d) {
  if (!d || typeof d !== 'object') return;
  if (['normal','penalty','both'].includes(d.overlayDisplayMode)) state.overlayDisplayMode=d.overlayDisplayMode;
  if (d.penaltyShootout) ingestPenalty(d.penaltyShootout);
  if (d.football) return ingestFootball(d.football);
  // also accept the bare football object (matches localStorage shape)
  if (d.homeTeam !== undefined || d.homeScore !== undefined) {
    return ingestFootball(d);
  }
}

/* ============================================================
   LIVE SOURCES
   ============================================================ */

/* ---------- 1. instant bootstrap from localStorage ---------- */
try {
  const raw = localStorage.getItem('brklive19_football')
           || localStorage.getItem('brklive19_liveSport');
  if (raw) ingestPacket(JSON.parse(raw));
  const penRaw=localStorage.getItem('brklive19_penalty_shootout');
  if(penRaw) ingestPenalty(JSON.parse(penRaw));
  const savedMode=localStorage.getItem('brklive19_football_display_mode');
  if(['normal','penalty','both'].includes(savedMode)) state.overlayDisplayMode=savedMode;
} catch (e) { /* ignore */ }

/* ---------- 2. BroadcastChannel (fastest, same-origin) ---------- */
let bc = null;
try {
  bc = new BroadcastChannel('BRKLIVE19_LIVE');
  bc.onmessage = (ev) => { const d=ev.data; if(d && ['normal','penalty','both'].includes(d.overlayDisplayMode)){state.overlayDisplayMode=d.overlayDisplayMode;applyOverlayDisplayMode();renderPenalty();} ingestPacket(d); };
} catch (e) {
  console.warn('BroadcastChannel unavailable.', e);
}

/* ---------- 3. localStorage `storage` event (other tabs) ---------- */
window.addEventListener('storage', (ev) => {
  if (!ev.key) return;
  if (ev.key === 'brklive19_football' || ev.key === 'brklive19_liveSport') {
    try { ingestPacket(JSON.parse(ev.newValue)); } catch (e) { /* ignore */ }
  }
  if (ev.key === 'brklive19_football_broadcast') {
    try {
      const b = JSON.parse(ev.newValue);
      if (b) { state.broadcast = { ...state.broadcast, ...b }; updateGraphics(); }
    } catch (e) { /* ignore */ }
  }
  if (ev.key === 'brklive19_football_colors') {
    try {
      const c = JSON.parse(ev.newValue);
      if (c) { state.colors = { ...state.colors, ...c }; applyColors(); }
    } catch (e) { /* ignore */ }
  }
  if (ev.key === 'brklive19_penalty_shootout') {
    try { ingestPenalty(JSON.parse(ev.newValue)); } catch(e) {}
  }
  if (ev.key === 'brklive19_football_display_mode' && ['normal','penalty','both'].includes(ev.newValue)) { state.overlayDisplayMode=ev.newValue; applyOverlayDisplayMode(); renderPenalty(); }
});

/* ---------- 4. Firebase (works across devices / networks) ---------- */
if (db) {
  try {
    onValue(ref(db, 'footballLiveScore'), (snap) => {
      const v = snap.val();
      if (v) ingestPacket(v);
    });
    onValue(ref(db, 'footballPenaltyShootout'), (snap) => {
      const p=snap.val();
      if(p) ingestPenalty(p);
    });
    onValue(ref(db, 'footballOverlayDisplayMode'), (snap) => {
      const mode=snap.val();
      if(['normal','penalty','both'].includes(mode)){ state.overlayDisplayMode=mode; applyOverlayDisplayMode(); renderPenalty(); }
    });
  } catch (e) {
    console.warn('Firebase listen failed.', e);
  }
}

/* ============================================================
   RENDER LOOPS
   ============================================================ */

/* smooth clock tick (100ms) */
setInterval(renderClock, 100);

/* safety net: if nothing arrives via BC/Firebase for a while,
   re-read localStorage every 2s so the overlay never goes stale. */
setInterval(() => {
  try {
    const raw = localStorage.getItem('brklive19_football')
             || localStorage.getItem('brklive19_liveSport');
    if (raw) {
      const fb = JSON.parse(raw);
      if (fb && fb.updatedAt && fb.updatedAt !== lastUpdated) {
        ingestPacket(fb);
      }
    }
  } catch (e) { /* ignore */ }
}, 2000);

/* ---------- initial paint ---------- */
applyColors();
renderScoreboard();
renderPenalty();
renderClock();
updateGraphics();

console.log('%cBRKLIVE19 Football Overlay ready', 'color:#53e89a;font-weight:900;');
</script>
</body>
</html>
