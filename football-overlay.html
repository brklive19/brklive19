<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRKLIVE19 Football Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#fff}#stage{position:relative;width:100vw;height:100vh;background:transparent}.lower{position:absolute;left:3.5%;right:3.5%;bottom:5.5%;display:flex;align-items:stretch;min-height:98px;filter:drop-shadow(0 5px 14px #0009);opacity:0;transform:translateY(16px);transition:opacity .25s,transform .25s}.lower.show{opacity:1;transform:translateY(0)}.brand{background:#071525;border:2px solid var(--accent,#56dcff);border-right:0;border-radius:13px 0 0 13px;padding:10px 15px;min-width:195px;display:flex;flex-direction:column;justify-content:center}.brand b{font-size:23px;letter-spacing:2px;color:var(--accent,#5bdcff)}.brand small{font-size:12px;color:#d5e8f5;margin-top:5px;letter-spacing:1px}.main{flex:1;min-width:0;background:linear-gradient(110deg,#10233b,#071321);border:2px solid var(--accent,#56dcff);display:flex;align-items:stretch}.info{flex:1;min-width:0;padding:8px 15px;display:flex;flex-direction:column;justify-content:center}.tournament{font-size:16px;font-weight:800;color:#8ceaff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}.match{font-size:13px;color:#d7e5f4;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.teams{display:flex;align-items:center;gap:14px;margin-top:6px}.team-block{min-width:120px;display:flex;flex-direction:column;align-items:center;gap:5px}.team{padding:6px 11px;border-radius:6px;font-size:20px;font-weight:900;min-width:120px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.penalty-dots{display:flex;justify-content:center;gap:5px;min-height:12px;flex-wrap:wrap}.penalty-dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid #ffffffaa;box-shadow:0 0 4px #0008}.penalty-dot.scored{background:#20d66b}.penalty-dot.missed{background:#f04452}.custom-center{display:none;text-align:center;margin-top:5px;font-size:15px;font-weight:900;letter-spacing:.4px;color:var(--custom-color,#fff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 5px #000;max-width:100%}.score{font-size:34px;font-weight:900;white-space:nowrap}.clock{margin-left:auto;background:#06101d;padding:0 20px;display:flex;align-items:center;justify-content:center;min-width:115px;font-size:26px;font-weight:900;color:#ffe07a;border-left:1px solid #314964}.footer{background:#071525;border:2px solid var(--accent,#56dcff);border-left:0;border-radius:0 13px 13px 0;padding:8px 14px;min-width:160px;display:flex;flex-direction:column;justify-content:center;text-align:center}.footer strong{font-size:15px;color:var(--custom-color,#fff)}.footer span{font-size:12px;color:var(--accent,#8ceaff);margin-top:5px}.event{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%) scale(.8);padding:18px 36px;border-radius:14px;background:#071525ee;border:3px solid var(--accent,#5bdcff);font-size:38px;font-weight:1000;letter-spacing:2px;opacity:0;transition:.2s;text-align:center;text-shadow:0 3px 8px #000}.event.show{opacity:1;transform:translate(-50%,-50%) scale(1)}#status{position:absolute;right:18px;top:14px;background:#071525cc;color:#8ceaff;padding:5px 9px;border-radius:5px;font-size:11px}#result{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);padding:12px 25px;background:#071525ee;border:2px solid #ffe07a;border-radius:9px;font-size:23px;font-weight:900;display:none;white-space:nowrap}@media(max-width:900px){.lower{left:2%;right:2%;bottom:3%;min-height:72px}.brand{min-width:125px;padding:6px}.brand b{font-size:17px}.brand small{font-size:9px}.info{padding:6px 9px}.tournament{font-size:12px}.match{font-size:10px}.teams{gap:7px;margin-top:5px}.team-block{min-width:75px}.penalty-dots{gap:3px}.penalty-dot{width:8px;height:8px}.custom-center{font-size:11px;margin-top:4px}.team{font-size:14px;min-width:75px;padding:5px}.score{font-size:23px}.clock{min-width:70px;padding:0 8px;font-size:18px}.footer{min-width:110px;padding:6px}.footer strong{font-size:11px}.footer span{font-size:9px}}
</style></head><body><div id="stage"><div id="status">BRKLIVE19 • CONNECTING</div><div class="event" id="event"></div><div id="result"></div><div class="lower" id="lower"><div class="brand"><b>BRKLIVE19</b><small>LIVE FOOTBALL</small></div><div class="main"><div class="info"><div class="tournament" id="tournament">FOOTBALL TOURNAMENT</div><div class="match" id="match">MATCH</div><div class="teams"><div class="team-block"><div class="team" id="home">HOME</div><div class="penalty-dots" id="homePenaltyDots"></div></div><div class="score"><span id="hs">0</span> - <span id="as">0</span></div><div class="team-block"><div class="team" id="away">AWAY</div><div class="penalty-dots" id="awayPenaltyDots"></div></div></div><div class="custom-center" id="customCenter"></div></div><div class="clock" id="clock">00:00</div></div><div class="footer"><strong id="period">1ST HALF</strong><span id="venue">BRKLIVE19</span><span id="pens"></span></div></div></div>
<script>
const DB_URL='https://brklive19-2bab4-default-rtdb.asia-southeast1.firebasedatabase.app/brklive19/football/live.json';const $=id=>document.getElementById(id);let lastEventStamp=0;
function time(s){s=Math.max(0,Number(s)||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function showEvent(ev){if(!ev||!ev.stamp||ev.stamp===lastEventStamp)return;lastEventStamp=ev.stamp;const labels={goal:'GOAL!',yellow:'YELLOW CARD',red:'RED CARD','penalty-goal':'PENALTY GOAL!','penalty-miss':'PENALTY MISSED'};let t=labels[ev.type]||String(ev.type||'').replaceAll('-',' ').toUpperCase();if(ev.team)t+=' • '+(ev.team==='home'?'HOME':'AWAY');if(ev.player)t+=' • '+ev.player;$('event').textContent=t;$('event').classList.add('show');setTimeout(()=>$('event').classList.remove('show'),3500)}
function renderPenaltyDots(side,d){const box=$(side+'PenaltyDots');box.innerHTML='';if(d.showPenalty==='no')return;const results=Array.isArray(d[side+'PenaltyResults'])?d[side+'PenaltyResults']:[];results.forEach((scored,i)=>{const dot=document.createElement('span');dot.className='penalty-dot '+(scored?'scored':'missed');dot.title='Penalty '+(i+1)+': '+(scored?'Scored':'Missed');box.appendChild(dot)})}
function render(d){d=d||{};const accent=d.accent||'#56dcff';document.documentElement.style.setProperty('--accent',accent);document.documentElement.style.setProperty('--custom-color',d.customColor||'#ffffff');$('tournament').textContent=d.showDetails==='no'?'':(d.tournament||'FOOTBALL TOURNAMENT');$('match').textContent=d.showDetails==='no'?'':[d.match,d.showVenue==='no'?'':d.venue].filter(Boolean).join(' • ');$('home').textContent=d.home||'HOME';$('away').textContent=d.away||'AWAY';$('hs').textContent=d.homeScore??0;$('as').textContent=d.awayScore??0;$('clock').textContent=time(d.elapsed);$('period').textContent=d.period||'1ST HALF';$('venue').textContent=d.venue||'BRKLIVE19';$('venue').style.display=(d.showVenue==='no'||!d.venue)?'none':'';$('customCenter').textContent=d.customText||'';$('customCenter').style.display=d.customText?'block':'none';$('home').style.background=d.homeColor||'#0878c9';$('home').style.color=d.homeText||'#ffffff';$('away').style.background=d.awayColor||'#d83b42';$('away').style.color=d.awayText||'#ffffff';const hasPens=(Number(d.homeAttempts)||Number(d.awayAttempts));$('pens').textContent=d.showPenalty==='no'||!hasPens?'':'PEN '+(d.homePens||0)+'-'+(d.awayPens||0);renderPenaltyDots('home',d);renderPenaltyDots('away',d);$('lower').classList.add('show');if(d.showResult==='yes'&&d.resultText){$('result').textContent=d.resultText;$('result').style.display='block'}else $('result').style.display='none';showEvent(d.event)}
async function poll(){try{const r=await fetch(DB_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();render(d);$('status').textContent='BRKLIVE19 • LIVE DATA CONNECTED';$('status').style.color='#72f0b2'}catch(e){$('status').textContent='BRKLIVE19 • WAITING FOR DATA';$('status').style.color='#ffd36a';console.warn('Firebase read failed:',e)}}poll();setInterval(poll,1000);
</script></body></html>
