<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRKLIVE19 Football Overlay</title><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,sans-serif}.box{position:fixed;top:22px;right:22px;left:auto;width:min(720px,58vw);background:linear-gradient(120deg,#061b35,#0c7045 48%,#07152a);border:2px solid #53e89a;border-radius:16px;color:#fff;box-shadow:0 16px 50px #000b,0 0 0 2px #ffffff12 inset;overflow:hidden;animation:pulse 3s ease-in-out infinite}.top{display:flex;justify-content:space-between;padding:8px 14px;background:#031022;font-weight:900;letter-spacing:.08em}.main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:12px 16px}.team{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:900}.team span{font-size:clamp(13px,1.5vw,25px)}.team b{font-size:clamp(30px,3.2vw,52px)}.clock{font-size:clamp(22px,2.4vw,40px);font-weight:900;color:#ffe16b}.extra{text-align:center;padding:7px;background:#020c19;font-size:clamp(10px,1vw,15px);font-weight:900}@keyframes pulse{50%{box-shadow:0 20px 60px #000d,0 0 25px #53e89a55}}@media(max-width:700px){.box{top:10px;left:10px;width:96vw}.main{gap:5px;padding:9px}.team{flex-direction:column}.top{padding:7px 10px}}.goalBanner{position:fixed;left:50%;bottom:16%;transform:translate(-50%,30px) scale(.85);opacity:0;z-index:20;padding:16px 42px;border-radius:14px;background:#16c784;color:#fff;font-size:clamp(24px,4vw,58px);font-weight:1000;letter-spacing:.06em;box-shadow:0 12px 45px #000b;pointer-events:none}.goalBanner.show{animation:goalIn 3.2s ease both}@keyframes goalIn{0%{opacity:0;transform:translate(-50%,30px) scale(.8)}12%,78%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-15px) scale(1.04)}}@keyframes pulse{50%{box-shadow:0 20px 60px #000d,0 0 25px var(--accent,#53e89a)}}.box{background:linear-gradient(120deg,var(--score,#061b35),var(--primary,#0c7045) 48%,#07152a);border-color:var(--accent,#53e89a)}.clock{color:var(--accent,#ffe16b)}.extra{background:#020c19}</style><style>.broadcastGraphic{position:fixed;left:50%;bottom:7%;transform:translate(-50%,30px);min-width:min(1000px,82vw);max-width:90vw;text-align:center;padding:12px 28px 15px;border-radius:14px;background:linear-gradient(90deg,var(--score,#061b35),var(--primary,#087d4b),var(--score,#061b35));border:2px solid var(--accent,#53e89a);color:#fff;box-shadow:0 14px 45px #000b;opacity:0;visibility:hidden;transition:opacity .25s ease,transform .25s ease;z-index:30;pointer-events:none}.broadcastGraphic.show{opacity:1;visibility:visible;transform:translate(-50%,0)}.graphicLabel{font-size:clamp(11px,1vw,16px);font-weight:900;letter-spacing:.16em;opacity:.8;text-transform:uppercase}.graphicText{font-size:clamp(28px,4vw,64px);font-weight:1000;line-height:1.05;margin-top:3px;overflow-wrap:anywhere}@media(max-width:700px){.broadcastGraphic{bottom:5%;min-width:88vw;padding:10px 16px}.graphicText{font-size:clamp(24px,7vw,42px)}}</style></head><body><div class="goalBanner" id="goalBanner"><span id="goalText">⚽ GOAL!</span></div><div class="broadcastGraphic" id="broadcastGraphic"><div class="graphicLabel" id="graphicLabel">TOURNAMENT</div><div class="graphicText" id="graphicText"></div></div><div class="box" id="box"><div class="top"><span id="period">1H</span><span>⚽ BRKLIVE19 LIVE</span><span id="added">+0</span></div><div class="main"><div class="team"><span id="home">HOME</span><b id="hs">0</b></div><div class="clock" id="clock">00:00</div><div class="team"><b id="as">0</b><span id="away">AWAY</span></div></div><div class="extra" id="extra">LIVE</div></div><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getDatabase,ref,onValue}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
const cfg={apiKey:'AIzaSyBLWq1bqJ32F2cg3mqYQ0uwXcS3zvTA3A4',authDomain:'brklive19-2bab4.firebaseapp.com',databaseURL:'https://brklive19-2bab4-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'brklive19-2bab4',storageBucket:'brklive19-2bab4.firebasestorage.app',messagingSenderId:'294058533898',appId:'1:294058533898:web:4996705937e969939cabf3'};
const live=ref(getDatabase(initializeApp(cfg)),'footballLiveScore'),$=id=>document.getElementById(id);
let current=null,lastReceived=Date.now(),lastGoal=null;
function drawClock(){if(!current)return;let sec=Number(current.seconds)||0;if(current.running){sec+=Math.max(0,Math.floor((Date.now()-lastReceived)/1000))} $('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function renderFootball(f){if(!f)return;current=f;lastReceived=Date.now();$('home').textContent=f.homeTeam||'HOME';$('away').textContent=f.awayTeam||'AWAY';$('hs').textContent=Number(f.homeScore)||0;$('as').textContent=Number(f.awayScore)||0;$('period').textContent=f.period||'1H';$('added').textContent='+'+(Number(f.addedTime)||0);drawClock();$('extra').textContent=(Number(f.addedTime)||0)>0?'LIVE • +'+Number(f.addedTime)+' MIN ADDED TIME':'LIVE • '+(f.period||'1H');const c=f.colors||{};document.documentElement.style.setProperty('--primary',c.primary||'#087d4b');document.documentElement.style.setProperty('--accent',c.accent||'#53e89a');document.documentElement.style.setProperty('--score',c.score||'#061b35');const bg=f.broadcastGraphic||{};const bgEl=$('broadcastGraphic');if(bg.type&&bg.type!=='none'&&bg.text){$('graphicLabel').textContent=bg.type==='tournament'?'TOURNAMENT':bg.type==='match'?'MATCH':'CUSTOM TEXT';$('graphicText').textContent=bg.text;bgEl.classList.add('show')}else{bgEl.classList.remove('show')}
const g=f.goal;if(g&&g.id&&g.id!==lastGoal){lastGoal=g.id;$('goalText').textContent='⚽ GOAL!  '+(g.name||'GOAL');$('goalBanner').style.background=c.goal||'#16c784';$('goalBanner').classList.remove('show');void $('goalBanner').offsetWidth;$('goalBanner').classList.add('show')}}
onValue(live,snap=>{const d=snap.val();if(d&&d.sport==='football'&&d.football)renderFootball(d.football)});
window.addEventListener('storage',e=>{if(e.key==='brklive19_football'&&e.newValue){try{renderFootball(JSON.parse(e.newValue))}catch(x){}}});
try{const bc=new BroadcastChannel('BRKLIVE19_LIVE');bc.onmessage=e=>{if(e.data&&e.data.football)renderFootball(e.data.football)}}catch(e){}
try{const f=JSON.parse(localStorage.getItem('brklive19_football')||'null');if(f)renderFootball(f)}catch(e){}
setInterval(drawClock,250);
</script></body></html>
