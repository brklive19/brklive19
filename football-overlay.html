<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRKLIVE19 Football Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif;color:white}
#stage{position:absolute;inset:0;pointer-events:none}.lower{position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);width:min(92%,1500px);filter:drop-shadow(0 7px 15px #0009)}
.meta{text-align:center;font-size:clamp(12px,1.25vw,22px);font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px;text-shadow:0 2px 5px #000}
.scorebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;min-height:76px;border-radius:10px;overflow:hidden;border:2px solid #ffffff33}
.team{display:flex;align-items:center;gap:14px;padding:12px 22px;font-size:clamp(18px,2.3vw,38px);font-weight:900;text-transform:uppercase;min-width:0}
.team span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.home{justify-content:flex-end}.away{justify-content:flex-start}
.numbers{display:flex;align-items:center;gap:10px;background:#081321;color:#fff;padding:8px 22px;font-size:clamp(28px,3.2vw,52px);font-weight:900;white-space:nowrap}
.separator{font-size:.55em;color:#8fa6bd}.details{background:#07111feF;text-align:center;padding:7px 12px;font-size:clamp(10px,1vw,17px);font-weight:700;letter-spacing:.4px}

.result-panel{display:none;background:#0b1a2c;color:#fff;text-align:center;padding:9px 12px;border-top:2px solid #f3c75b;font-size:clamp(15px,1.55vw,25px);font-weight:900;letter-spacing:.5px;text-transform:uppercase;text-shadow:0 2px 4px #000}
.penalty-panel{display:none;background:#061426;color:#fff;text-align:center;padding:9px 14px;border-top:2px solid #59dcff;font-size:clamp(13px,1.35vw,22px);font-weight:900;letter-spacing:.4px;text-shadow:0 2px 4px #000}
.penalty-summary{margin-bottom:7px}
.penalty-attempts{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;margin-top:5px}
.penalty-team-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.penalty-team-name{font-size:.82em;opacity:.9}
.penalty-dots{display:inline-flex;gap:6px;align-items:center;min-height:17px;flex-wrap:wrap}
.penalty-dot{width:13px;height:13px;border-radius:50%;display:inline-block;border:1px solid #ffffff88;box-shadow:0 0 6px currentColor}
.penalty-dot.scored{background:#20d66b;color:#20d66b}
.penalty-dot.missed{background:#f04452;color:#f04452}
.penalty-empty{font-size:.75em;color:#9fb2c9;font-weight:500}
.penalty-title{color:#59dcff}.penalty-next{font-size:.72em;color:#b9d5eb}

.custom{position:absolute;right:2.5%;top:3%;font-weight:900;font-size:clamp(12px,1.3vw,22px);text-shadow:0 2px 5px #000;max-width:45%;text-align:right}
.clock{position:absolute;left:2.5%;top:3%;background:#07111feF;border:1px solid #ffffff55;border-radius:6px;padding:7px 12px;font-weight:900;font-size:clamp(17px,2vw,30px)}
.period{font-size:.48em;color:#b8d8ed;margin-left:7px}
.event{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%) scale(.65);opacity:0;background:linear-gradient(110deg,#061321ee,#14304dee);border:3px solid var(--accent);border-radius:18px;padding:22px 42px;text-align:center;min-width:min(70%,420px);box-shadow:0 0 35px #000b}
.event.show{animation:pop 3s ease forwards}.event .big{font-size:clamp(40px,7vw,100px);font-weight:1000;line-height:1.05}.event .sub{font-size:clamp(17px,2vw,28px);font-weight:900;margin-top:5px;text-transform:uppercase}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}22%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.95)}}
.style-solid .scorebar,.style-solid .details{background:#07111f}.style-light .numbers{background:#fff;color:#102033}.style-light .details{background:#fff;color:#102033}
</style></head><body><div id="stage">
<div class="clock" id="clock">00:00 <span class="period" id="period">1ST HALF</span></div><div class="custom" id="custom"></div>
<div class="lower" id="lower"><div class="meta" id="meta"></div><div class="scorebar">
<div class="team home" id="homeBox"><span id="home">HOME</span></div>
<div class="numbers"><span id="hs">0</span><span class="separator">:</span><span id="as">0</span></div>
<div class="team away" id="awayBox"><span id="away">AWAY</span></div>
</div><div class="details" id="details">VENUE • MATCH TYPE</div><div class="result-panel" id="resultPanel"></div>
<div class="penalty-panel" id="penaltyPanel">
 <div id="penaltySummary"></div>
 <div class="penalty-attempts">
  <div class="penalty-team-row"><span class="penalty-team-name" id="homePenaltyName">HOME</span><span class="penalty-dots" id="homePenaltyDots"></span></div>
  <div class="penalty-team-row"><span class="penalty-team-name" id="awayPenaltyName">AWAY</span><span class="penalty-dots" id="awayPenaltyDots"></span></div>
 </div>
</div></div>
<div class="event" id="event"><div class="big" id="eventBig">⚽ GOAL!</div><div class="sub" id="eventSub"></div></div>
</div>
<script>
const DB_URL='https://brklive19-2bab4-default-rtdb.asia-southeast1.firebasedatabase.app/brklive19/football/live.json';let lastStamp=0,lastUpdatedAt=0;
function fmt(s){return String(Math.floor((s||0)/60)).padStart(2,'0')+':'+String((s||0)%60).padStart(2,'0')}
function showEvent(e,d){let n=e.team==='home'?(d.home||'HOME'):(d.away||'AWAY'),b=e.type==='goal'?'⚽ GOAL!':e.type==='yellow'?'🟨 YELLOW CARD':e.type==='red'?'🟥 RED CARD':e.type==='penalty-goal'?'⚽ PENALTY SCORED!':e.type==='penalty-miss'?'✕ PENALTY MISSED':'🟥 RED CARD';eventBig.textContent=b;eventSub.textContent=[n,e.player].filter(Boolean).join(' • ');let el=document.getElementById('event');el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
function render(d){if(!d||typeof d!=='object')return;let $=id=>document.getElementById(id);$('home').textContent=d.home||'HOME';$('away').textContent=d.away||'AWAY';$('hs').textContent=d.homeScore||0;$('as').textContent=d.awayScore||0;$('homeBox').style.background=d.homeColor||'#0878c9';$('homeBox').style.color=d.homeText||'#fff';$('awayBox').style.background=d.awayColor||'#d83b42';$('awayBox').style.color=d.awayText||'#fff';$('clock').firstChild.textContent=fmt(d.elapsed)+' ';$('period').textContent=(d.period||'1st Half').toUpperCase();$('meta').textContent=d.showDetails==='no'?'':[d.tournament,d.match].filter(Boolean).join('  •  ');$('details').textContent=d.showVenue==='no'?'':[d.venue,d.matchType].filter(Boolean).join('  •  ');$('custom').textContent=d.customText||'';$('custom').style.color=d.customColor||'#fff';let rt=String(d.resultText||'').trim(),sr=d.showResult!=='no';$('resultPanel').style.display=sr&&rt?'block':'none';$('resultPanel').textContent=sr&&rt?'FULL TIME RESULT • '+rt:'';let p=$('penaltyPanel'),pt=String(d.period||'').toLowerCase(),ah=+d.homeAttempts||0,aa=+d.awayAttempts||0,ip=pt.includes('penalty')||ah>0||aa>0,v=d.showPenalty!=='no';p.style.display=ip&&v?'block':'none';if(ip&&v){$('penaltySummary').innerHTML='<span class="penalty-title">PENALTY SHOOTOUT</span> &nbsp; '+(d.home||'HOME')+' <b>'+(+d.homePens||0)+' / '+ah+'</b> — <b>'+(+d.awayPens||0)+' / '+aa+'</b> '+(d.away||'AWAY')+' &nbsp; <span class="penalty-next">NEXT: '+((d.nextKicker||'home')==='home'?(d.home||'HOME'):(d.away||'AWAY'))+'</span>';$('homePenaltyName').textContent=d.home||'HOME';$('awayPenaltyName').textContent=d.away||'AWAY';let dots=a=>Array.isArray(a)&&a.length?a.map(v=>'<span class="penalty-dot '+(v?'scored':'missed')+'"></span>').join(''):'<span class="penalty-empty">No attempts yet</span>';$('homePenaltyDots').innerHTML=dots(d.homePenaltyResults);$('awayPenaltyDots').innerHTML=dots(d.awayPenaltyResults)}$('stage').style.setProperty('--accent',d.accent||'#59dcff');$('lower').className='lower style-'+(d.style||'glass');if(d.event&&d.event.stamp&&d.event.stamp!==lastStamp){lastStamp=d.event.stamp;showEvent(d.event,d)}}
async function poll(){try{let r=await fetch(DB_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();if(d&&Number(d.updatedAt||0)!==lastUpdatedAt){lastUpdatedAt=Number(d.updatedAt||0);render(d)}}catch(e){console.error('Firebase overlay read failed',e)}}poll();setInterval(poll,700);
</script></body></html>
