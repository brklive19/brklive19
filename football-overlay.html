radient(120deg,var(--score,#061b35),var(--primary,#0c7045) 48%,#07152a);border-color:var(--accent,#53e89a)}.clock{color:var(--accent,#ffe16b)}.extra{background:#020c19}</style></head><body><div class="goalBanner" id="goalBanner"><span id="goalText">⚽ GOAL!</span></div><div class="box" id="box"><div class="top"><span id="period">1H</span><span>⚽ BRKLIVE19 LIVE</span><span id="added">+0</span></div><div class="main"><div class="team"><span id="home">HOME</span><b id="hs">0</b></div><div class="clock" id="clock">00:00</div><div class="team"><b id="as">0</b><span id="away">AWAY</span></div></div><div class="extra" id="extra">LIVE</div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getDatabase,ref,onValue}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';const cfg={apiKey:'AIzaSyBLWq1bqJ32F2cg3mqYQ0uwXcS3zvTA3A4',authDomain:'brklive19-2bab4.firebaseapp.com',databaseURL:'https://brklive19-2bab4-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'brklive19-2bab4',storageBucket:'brklive19-2bab4.firebasestorage.app',messagingSenderId:'294058533898',appId:'1:294058533898:web:4996705937e969939cabf3'};const live=ref(getDatabase(initializeApp(cfg)),'footballLiveScore');const $=id=>document.getElementById(id);onValue(live,snap=>{const d=snap.val();if(!d||d.sport!=='football'||!d.football)return;const f=d.football;$('home').textContent=f.homeTeam||'HOME';$('away').textContent=f.awayTeam||'AWAY';$('hs').textContent=Number(f.homeScore)||0;$('as').textContent=Number(f.awayScore)||0;$('period').textContent=f.period||'1H';$('added').textContent='+'+(Number(f.addedTime)||0);const sec=Number(f.seconds)||0;$('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');$('extra').textContent=(Number(f.addedTime)||0)>0?'LIVE • +'+Number(f.addedTime)+' MIN ADDED TIME':'LIVE • '+(f.period||'1H');const c=f.colors||{};document.documentElement.style.setProperty('--primary',c.primary||'#087d4b');document.documentElement.style.setProperty('--accent',c.accent||'#53e89a');document.documentElement.style.setProperty('--score',c.score||'#061b35');const g=f.goal;if(g&&g.id&&g.id!==window.lastGoal){window.lastGoal=g.id;$('goalText').textContent='⚽ GOAL!  '+(g.name||'GOAL');$('goalBanner').style.background=c.goal||'#16c784';$('goalBanner').classList.remove('show');void $('goalBanner').offsetWidth;$('goalBanner').classList.add('show')}});</script></body></html>
