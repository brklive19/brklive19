<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRKLIVE19 Football Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#fff}
#stage{position:relative;width:100vw;height:100vh;background:transparent}
.lower{position:absolute;left:3.5%;right:3.5%;bottom:5.5%;display:flex;align-items:stretch;min-height:112px;filter:drop-shadow(0 5px 14px #0009);opacity:0;transform:translateY(16px);transition:opacity .25s,transform .25s}
.lower.show{opacity:1;transform:translateY(0)}
.brand{background:#071525;border:2px solid #56dcff;border-right:0;border-radius:13px 0 0 13px;padding:13px 18px;min-width:210px;display:flex;flex-direction:column;justify-content:center}
.brand b{font-size:25px;letter-spacing:2px;color:#5bdcff}.brand small{font-size:12px;color:#d5e8f5;margin-top:5px;letter-spacing:1px}
.main{flex:1;min-width:0;background:linear-gradient(110deg,#10233b,#071321);border:2px solid #56dcff;display:flex;align-items:stretch}
.info{flex:1;min-width:0;padding:10px 18px;display:flex;flex-direction:column;justify-content:center}
.tournament{font-size:17px;font-weight:800;color:#8ceaff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.match{font-size:13px;color:#d7e5f4;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teams{display:flex;align-items:center;gap:14px;margin-top:8px}
.team{padding:8px 13px;border-radius:6px;font-size:22px;font-weight:900;min-width:120px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-size:37px;font-weight:900;white-space:nowrap}.clock{margin-left:auto;background:#06101d;padding:0 20px;display:flex;align-items:center;justify-content:center;min-width:115px;font-size:26px;font-weight:900;color:#ffe07a;border-left:1px solid #314964}
.footer{background:#071525;border:2px solid #56dcff;border-left:0;border-radius:0 13px 13px 0;padding:10px 16px;min-width:170px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.footer strong{font-size:15px;color:#fff}.footer span{font-size:12px;color:#8ceaff;margin-top:5px}
.event{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%) scale(.8);padding:18px 36px;border-radius:14px;background:#071525ee;border:3px solid #5bdcff;font-size:38px;font-weight:1000;letter-spacing:2px;opacity:0;transition:.2s;text-align:center;text-shadow:0 3px 8px #000}
.event.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#status{position:absolute;right:18px;top:14px;background:#071525cc;color:#8ceaff;padding:5px 9px;border-radius:5px;font-size:11px}
#result{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);padding:12px 25px;background:#071525ee;border:2px solid #ffe07a;border-radius:9px;font-size:23px;font-weight:900;display:none;white-space:nowrap}
@media(max-width:900px){.lower{left:2%;right:2%;bottom:3%;min-height:80px}.brand{min-width:125px;padding:8px}.brand b{font-size:17px}.brand small{font-size:9px}.info{padding:7px 10px}.tournament{font-size:12px}.match{font-size:10px}.teams{gap:7px;margin-top:5px}.team{font-size:15px;min-width:75px;padding:6px}.score{font-size:25px}.clock{min-width:70px;padding:0 8px;font-size:18px}.footer{min-width:110px;padding:6px}.footer strong{font-size:11px}.footer span{font-size:9px}}
</style>
</head>
<body>
<div id="stage">
<div id="status">BRKLIVE19 • CONNECTING</div>
<div class="event" id="event"></div>
<div id="result"></div>
<div class="lower" id="lower">
  <div class="brand"><b>BRKLIVE19</b><small>LIVE FOOTBALL</small></div>
  <div class="main">
    <div class="info">
      <div class="tournament" id="tournament">FOOTBALL TOURNAMENT</div>
      <div class="match" id="match">MATCH</div>
      <div class="teams">
        <div class="team" id="home">HOME</div><div class="score"><span id="hs">0</span> - <span id="as">0</span></div><div class="team" id="away">AWAY</div>
      </div>
    </div>
    <div class="clock" id="clock">00:00</div>
  </div>
  <div class="footer"><strong id="period">1ST HALF</strong><span id="venue">BRKLIVE19</span><span id="pens"></span></div>
</div>
</div>
<script>
const URL='https://brklive19-2bab4-default-rtdb.asia-southeast1.firebasedatabase.app/brklive19/football/live.json';
const $=id=>document.getElementById(id);
let lastEventStamp=0;
function time(s){s=Math.max(0,Number(s)||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function showEvent(ev){if(!ev||!ev.stamp||ev.stamp===lastEventStamp)return;lastEventStamp=ev.stamp;let labels={'goal':'GOAL!','yellow':'YELLOW CARD','yellow-card':'YELLOW CARD','red':'RED CARD','red-card':'RED CARD','penalty-goal':'PENALTY GOAL!','penalty-miss':'PENALTY MISSED'};let text=labels[ev.type]||String(ev.type||'').replaceAll('-',' ').toUpperCase();if(ev.team)text+=' • '+(ev.team==='home'?'HOME':'AWAY');if(ev.player)text+=' • '+ev.player;$('event').textContent=text;$('event').classList.add('show');setTimeout(()=>$('event').classList.remove('show'),3500)}
function render(d){d=d||{};$('tournament').textContent=d.tournament||'FOOTBALL TOURNAMENT';$('match').textContent=[d.match,d.venue].filter(Boolean).join(' • ');$('home').textContent=d.home||'HOME';$('away').textContent=d.away||'AWAY';$('hs').textContent=d.homeScore??0;$('as').textContent=d.awayScore??0;$('clock').textContent=time(d.elapsed);$('period').textContent=d.period||'1ST HALF';$('venue').textContent=d.customText||'BRKLIVE19';$('home').style.background=d.homeColor||'#0878c9';$('home').style.color=d.homeText||'#ffffff';$('away').style.background=d.awayColor||'#d83b42';$('away').style.color=d.awayText||'#ffffff';$('pens').textContent=(Number(d.homeAttempts)||Number(d.awayAttempts))?'PEN '+(d.homePens||0)+'-'+(d.awayPens||0)+' ('+(d.homeAttempts||0)+'/'+(d.awayAttempts||0)+')':'';$('lower').classList.add('show');if(d.showResult==='yes'&&d.resultText){$('result').textContent=d.resultText;$('result').style.display='block'}else{$('result').style.display='none'}showEvent(d.event)}
async function poll(){try{const r=await fetch(URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();render(d);$('status').textContent='BRKLIVE19 • LIVE DATA CONNECTED';$('status').style.color='#72f0b2'}catch(e){$('status').textContent='BRKLIVE19 • WAITING FOR DATA';$('status').style.color='#ffd36a';console.warn(e)}}
poll();setInterval(poll,1000);
</script>
</body></html>
