<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BRKLIVE19 Cricket Scorer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    margin: 5px 0 15px;
}

.status {
    text-align: center;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 8px;
    background: #333;
}

.connected {
    background: #075e32;
}

.disconnected {
    background: #8b0000;
}

.card {
    background: #1d1d1d;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
}

.card h2 {
    margin-top: 0;
    font-size: 20px;
}

input {
    width: 100%;
    padding: 13px;
    margin: 6px 0;
    border: none;
    border-radius: 8px;
    background: #333;
    color: white;
    font-size: 17px;
}

.score {
    text-align: center;
    font-size: 55px;
    font-weight: bold;
    margin: 10px 0;
}

.overs {
    text-align: center;
    font-size: 22px;
    margin-bottom: 15px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 16px 8px;
    font-size: 20px;
    font-weight: bold;
    color: white;
    background: #333;
}

button:active {
    transform: scale(0.95);
}

.run {
    background: #1769aa;
}

.wicket {
    background: #b00020;
}

.extra {
    background: #7b4f00;
}

.reset {
    background: #555;
}

.save {
    width: 100%;
    background: #008f4c;
    margin-top: 12px;
}

.small {
    font-size: 14px;
    color: #bbb;
}
</style>
</head>

<body>

<h1>🏏 BRKLIVE19 SCORER</h1>

<div id="connection" class="status disconnected">
    Connecting to Firebase...
</div>

<!-- MATCH INFORMATION -->
<div class="card">

<h2>Match Information</h2>

<input id="teamA" placeholder="Team A">
<input id="teamB" placeholder="Team B">

</div>


<!-- SCORE -->
<div class="card">

<h2>Live Score</h2>

<div id="score" class="score">
    0/0
</div>

<div id="overs" class="overs">
    Overs: 0.0
</div>

<div class="buttons">

<button class="run" onclick="addRun(0)">0</button>
<button class="run" onclick="addRun(1)">1</button>
<button class="run" onclick="addRun(2)">2</button>

<button class="run" onclick="addRun(3)">3</button>
<button class="run" onclick="addRun(4)">4</button>
<button class="run" onclick="addRun(6)">6</button>

<button class="extra" onclick="addWide()">WIDE</button>
<button class="extra" onclick="addNoBall()">NO BALL</button>
<button class="wicket" onclick="addWicket()">WICKET</button>

</div>

<button class="reset" style="width:100%;margin-top:10px"
onclick="resetScore()">
RESET SCORE
</button>

</div>


<!-- MANUAL OVERS -->
<div class="card">

<h2>Overs</h2>

<p class="small">
You can manually enter the over number if required.
Example: 2.4
</p>

<input
id="manualOvers"
type="text"
placeholder="Example: 2.4"
onchange="manualOvers()"
>

</div>

<!-- BATSMEN -->
<div class="card">

<h2>Batsmen</h2>

<h3>Striker</h3>

<input id="batsman1" placeholder="Striker Name">

<input
id="batsman1Runs"
type="number"
placeholder="Runs"
>

<input
id="batsman1Balls"
type="number"
placeholder="Balls"
>

<input
id="batsman1Fours"
type="number"
placeholder="4s"
>

<input
id="batsman1Sixes"
type="number"
placeholder="6s"
>

<h3>Non-Striker</h3>

<input id="batsman2" placeholder="Non-Striker Name">

<input
id="batsman2Runs"
type="number"
placeholder="Runs"
>

<input
id="batsman2Balls"
type="number"
placeholder="Balls"
>

<input
id="batsman2Fours"
type="number"
placeholder="4s"
>

<input
id="batsman2Sixes"
type="number"
placeholder="6s"
>

</div>

<!-- BOWLER -->
<div class="card">

<h2>Bowler</h2>

<input
id="bowler"
placeholder="Bowler Name"
>

<input
id="bowlerOvers"
placeholder="Overs e.g. 2.4"
>

<input
id="bowlerRuns"
type="number"
placeholder="Runs"
>

<input
id="bowlerWickets"
type="number"
placeholder="Wickets"
>

<input
id="bowlerEconomy"
type="number"
step="0.01"
placeholder="Economy"
>

</div>
<!-- MATCH INFORMATION -->
<div class="card">

<h2>Match Information</h2>

<input
id="currentRunRate"
type="number"
step="0.01"
placeholder="Current Run Rate"
>

<input
id="requiredRunRate"
type="number"
step="0.01"
placeholder="Required Run Rate"
>

<input
id="target"
type="number"
placeholder="Target"
>

<input
id="currentOver"
placeholder="Current Over e.g. 5.3"
>

<input
id="extras"
type="number"
placeholder="Extras"
>

</div>

<button class="save" onclick="saveData()">
💾 SAVE / UPDATE OVERLAY
</button>


<p class="small" style="text-align:center;margin-top:20px">
BRKLIVE19 Live Cricket Scorer
</p>


<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =====================================================
   FIREBASE CONFIGURATION
   =====================================================

   REPLACE THE VALUES BELOW WITH YOUR FIREBASE
   WEB APP CONFIGURATION.
===================================================== */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBLWq1bqJ32F2cg3mqYQ0uwXcS3zvTA3A4",
  authDomain: "brklive19-2bab4.firebaseapp.com",
  databaseURL: "https://brklive19-2bab4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "brklive19-2bab4",
  storageBucket: "brklive19-2bab4.firebasestorage.app",
  messagingSenderId: "294058533898",
  appId: "1:294058533898:web:4996705937e969939cabf3",
  measurementId: "G-RW18E7LVEX"
};


/* START FIREBASE */

const app = initializeApp(firebaseConfig);

const database = getDatabase(app);

const scoreRef = ref(database, "liveScore");


/* SCORE VARIABLES */

let totalRuns = 0;
let wickets = 0;
let balls = 0;

let overDisplay = "0.0";


/* FIREBASE CONNECTION TEST */

onValue(
    scoreRef,
    (snapshot) => {

        document.getElementById("connection").innerText =
            "🟢 Firebase Connected";

        document.getElementById("connection")
            .className = "status connected";

        const data = snapshot.val();

        if (data) {

            totalRuns = data.runs || 0;

            wickets = data.wickets || 0;

            balls = data.balls || 0;

            overDisplay =
                data.overs || calculateOvers();

            updateScreen();

        }

    },

    (error) => {

        console.log(error);

        document.getElementById("connection").innerText =
            "🔴 Firebase Connection Error";

        document.getElementById("connection")
            .className = "status disconnected";

    }
);


/* ADD RUN */

window.addRun = function(run) {

    totalRuns += run;

    balls++;

    overDisplay = calculateOvers();

    updateScreen();

};


/* WIDE */

window.addWide = function() {

    totalRuns++;

    updateScreen();

};


/* NO BALL */

window.addNoBall = function() {

    totalRuns++;

    updateScreen();

};


/* WICKET */

window.addWicket = function() {

    if (wickets < 10) {

        wickets++;

    }

    balls++;

    overDisplay = calculateOvers();

    updateScreen();

};


/* CALCULATE OVERS */

function calculateOvers() {

    const over =
        Math.floor(balls / 6);

    const ball =
        balls % 6;

    return over + "." + ball;
}


/* UPDATE SCREEN */

function updateScreen() {

    document.getElementById("score").innerText =
        totalRuns + "/" + wickets;

    document.getElementById("overs").innerText =
        "Overs: " + overDisplay;

}


/* MANUAL OVERS */

window.manualOvers = function() {

    const value =
        document.getElementById("manualOvers").value;

    if (value !== "") {

        overDisplay = value;

        updateScreen();

    }

};


/* SAVE DATA TO FIREBASE */

window.saveData = function() {

    const data = {

        teamA:
            document.getElementById("teamA").value,

        teamB:
            document.getElementById("teamB").value,

        runs:
            totalRuns,

        wickets:
            wickets,

        balls:
            balls,

        overs:
            overDisplay,

        batsman1:
            document.getElementById("batsman1").value,

        batsman1Runs:
            Number(
                document.getElementById("batsman1Runs").value
            ) || 0,

        batsman2:
            document.getElementById("batsman2").value,

        batsman2Runs:
            Number(
                document.getElementById("batsman2Runs").value
            ) || 0,

        batsman1Balls:
    Number(
        document.getElementById("batsman1Balls").value
    ) || 0,

batsman1Fours:
    Number(
        document.getElementById("batsman1Fours").value
    ) || 0,

batsman1Sixes:
    Number(
        document.getElementById("batsman1Sixes").value
    ) || 0,

batsman2Balls:
    Number(
        document.getElementById("batsman2Balls").value
    ) || 0,

batsman2Fours:
    Number(
        document.getElementById("batsman2Fours").value
    ) || 0,

batsman2Sixes:
    Number(
        document.getElementById("batsman2Sixes").value
    ) || 0,
        bowler:
            document.getElementById("bowler").value,

        bowlerOvers:
            document.getElementById("bowlerOvers").value,

        bowlerRuns:
            Number(
                document.getElementById("bowlerRuns").value
            ) || 0,

        bowlerWickets:
            Number(
                document.getElementById("bowlerWickets").value
            ) || 0,
         
        bowlerEconomy:
            Number(
                document.getElementById("bowlerEconomy").value
    ) || 0,
        currentRunRate:
    Number(
        document.getElementById("currentRunRate").value
    ) || 0,

requiredRunRate:
    Number(
        document.getElementById("requiredRunRate").value
    ) || 0,

target:
    Number(
        document.getElementById("target").value
    ) || 0,

currentOver:
    document.getElementById("currentOver").value,

extras:
    Number(
        document.getElementById("extras").value
    ) || 0,
        updatedAt:
            Date.now()

    };


    set(scoreRef, data)

    .then(() => {

        alert("✅ Score updated successfully!");

    })

    .catch((error) => {

        console.error(error);

        alert(
            "❌ Error saving score: " +
            error.message
        );

    });

};


/* RESET */

window.resetScore = function() {

    const confirmReset =
        confirm(
            "Reset the entire score?"
        );

    if (!confirmReset) return;

    totalRuns = 0;

    wickets = 0;

    balls = 0;

    overDisplay = "0.0";

    updateScreen();

};

</script>

</body>
</html>
