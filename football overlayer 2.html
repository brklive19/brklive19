<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRKLIVE19 Football Live Overlay</title>
<style>
:root{--accent:#7fffd4;--head:linear-gradient(180deg,#087b68,#062e3b);--detail:linear-gradient(90deg,#123e46,#25164b);--base:#071b28;--home:linear-gradient(100deg,#064d42,#12a889);--away:linear-gradient(100deg,#35145f,#853bd1);--scorebg:linear-gradient(135deg,#e4fff7,#72e8c5);--scorefg:#062c28;--mid:linear-gradient(180deg,#102d36,#160d2d);--custombg:#174b50;--customfg:#fff;--resultbg:#261346;--event:#55249b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}
body{display:flex;align-items:flex-end;justify-content:center}
#overlay{width:100%;padding:0 1.2vw 4vh;filter:drop-shadow(0 4px 7px #0009);position:relative}
.tournament{width:max-content;max-width:76%;margin:0 auto -1px;padding:5px 22px 6px;border:2px solid var(--accent);border-bottom:0;border-radius:16px 16px 0 0;background:var(--head);color:#fff;text-align:center;font-weight:900;font-size:clamp(12px,1.45vw,25px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.details{display:none;text-align:center;color:#fff;background:var(--detail);font-size:clamp(9px,.9vw,15px);font-weight:700;padding:3px 8px}
.bar{min-height:clamp(48px,5.1vw,88px);display:grid;grid-template-columns:minmax(0,1fr) clamp(52px,7vw,110px) clamp(74px,10vw,150px) clamp(52px,7vw,110px) minmax(0,1fr);border:2px solid var(--accent);border-radius:15px;overflow:hidden;background:var(--base)}
.team{display:flex;align-items:center;justify-content:center;min-width:0;padding:5px 1vw;color:white;font-size:clamp(15px,2.25vw,38px);font-weight:1000;text-shadow:0 2px 4px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home{background:var(--home)}.away{background:var(--away)}
.score{display:flex;align-items:center;justify-content:center;background:var(--scorebg);color:var(--scorefg);font-size:clamp(25px,3.7vw,62px);font-weight:1000}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--mid);color:#fff;border-left:1px solid var(--accent);border-right:1px solid var(--accent);padding:3px}
.period{font-size:clamp(9px,1vw,16px);font-weight:900;text-align:center}.clock{font-size:clamp(16px,2vw,31px);font-weight:1000;font-variant-numeric:tabular-nums}
.meta{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;background:var(--detail);color:#fff;padding:3px 8px;font-size:clamp(9px,.95vw,15px);font-weight:800}
.custom{display:none;text-align:center;background:var(--custombg);color:var(--customfg);font-weight:900;font-size:clamp(10px,1vw,16px);padding:3px 8px}
.result{display:none;text-align:center;background:var(--resultbg);color:#fff;font-weight:1000;font-size:clamp(13px,1.5vw,24px);padding:5px 8px;border:2px solid var(--accent);border-top:0}
.penalties{display:none;grid-template-columns:1fr 1fr;gap:8px;background:var(--detail);padding:5px 10px;border:1px solid var(--accent);border-top:0}
.pen-team{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;color:#fff;font-size:clamp(9px,.95vw,15px);font-weight:900}
.pen-name{max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pen-count{white-space:nowrap;color:#fff}
.pen-dots{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
.pen-dot{width:clamp(10px,1.05vw,15px);height:clamp(10px,1.05vw,15px);border-radius:50%;display:inline-block;border:1px solid #ffffffa8;box-shadow:0 0 4px #0008}
.pen-dot.scored{background:#20dc70;box-shadow:0 0 7px #20dc70a8}
.pen-dot.missed{background:#ff334f;box-shadow:0 0 7px #ff334fa8}
.pen-empty{font-size:9px;color:#c7d5e6}
.event{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);display:none;padding:14px 30px;border-radius:14px;background:var(--event);border:3px solid var(--accent);color:white;font-size:clamp(28px,6vw,90px);font-weight:1000;text-shadow:0 3px 6px #000;white-space:nowrap}
.event.show{display:block;animation:pop 1.8s ease both}@keyframes pop{0%{opacity:0;scale:.75}15%,75%{opacity:1;scale:1}100%{opacity:0;scale:1.05}}
.live{position:fixed;right:1.5vw;top:1.5vh;color:white;font-size:clamp(10px,1vw,16px);font-weight:900;text-shadow:0 2px 4px #000}.live i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff253c;margin-right:5px;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.35}}
@media(max-width:600px){#overlay{padding-bottom:3vh}.bar{grid-template-columns:minmax(0,1fr) 38px 65px 38px minmax(0,1fr);min-height:48px}.team{font-size:clamp(11px,3vw,17px);white-space:normal;line-height:1.05}.tournament{max-width:90%;font-size:11px}.meta{gap:6px}}
</style></head><body>
<div class="live"><i></i>LIVE</div>
<div id="overlay"><div class="tournament" id="tournament"></div><div class="details" id="details"></div>
<div class="bar"><div class="team home" id="home"></div><div class="score" id="hs">0</div><div class="mid"><div class="period" id="period">1st Half</div><div class="clock" id="clock">00:00</div></div><div class="score" id="as">0</div><div class="team away" id="away"></div></div>
<div class="meta" id="meta"></div><div class="penalties" id="pens">
<div class="pen-team"><span class="pen-name" id="homePenName">HOME</span><span class="pen-count" id="homePenCount">0/0</span><span class="pen-dots" id="homePenDots"></span></div>
<div class="pen-team"><span class="pen-name" id="awayPenName">AWAY</span><span class="pen-count" id="awayPenCount">0/0</span><span class="pen-dots" id="awayPenDots"></span></div>
</div><div class="custom" id="custom"></div><div class="result" id="result"></div></div>
<div class="event" id="event"></div>
<script>
const DB='https://brklive19-2bab4-default-rtdb.asia-southeast1.firebasedatabase.app/brklive19/football/live.json';
const $=id=>document.getElementById(id);let lastEvent='';
function txt(v,fallback=''){return v===undefined||v===null||v===''?fallback:String(v)}
function fmt(v){v=Math.max(0,Number(v)||0);return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}
function showEvent(e){if(!e||!e.stamp||String(e.stamp)===lastEvent)return;lastEvent=String(e.stamp);let names={'goal':'GOAL!','yellow':'YELLOW CARD','red':'RED CARD','penalty-goal':'PENALTY SCORED!','penalty-miss':'PENALTY MISSED'};let label=names[e.type]||String(e.type||'').toUpperCase();if(e.player)label+=' · '+e.player;$('event').textContent=label;$('event').classList.remove('show');void $('event').offsetWidth;$('event').classList.add('show')}
async function refresh(){try{let r=await fetch(DB+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;let d=await r.json()||{};
const root=document.documentElement;
if(d.accent)root.style.setProperty('--accent',d.accent);
if(d.homeColor)root.style.setProperty('--home',`linear-gradient(100deg,${d.homeColor},${d.homeColor})`);
if(d.awayColor)root.style.setProperty('--away',`linear-gradient(100deg,${d.awayColor},${d.awayColor})`);
if(d.homeText) $('home').style.color=d.homeText;
if(d.awayText) $('away').style.color=d.awayText;
if(d.customColor)root.style.setProperty('--customfg',d.customColor);
if(d.style==='solid'){root.style.setProperty('--detail','#071522');root.style.setProperty('--base','#071522')}
else if(d.style==='light'){root.style.setProperty('--detail','#dce8f4');root.style.setProperty('--base','#dce8f4');$('details').style.color='#102033';$('meta').style.color='#102033'}

$('tournament').textContent=txt(d.tournament,'Football Tournament');
$('home').textContent=txt(d.home,'HOME');$('away').textContent=txt(d.away,'AWAY');
$('hs').textContent=Number(d.homeScore)||0;$('as').textContent=Number(d.awayScore)||0;
$('period').textContent=txt(d.period,'1st Half');$('clock').textContent=fmt(d.elapsed);
$('tournament').style.display=d.showDetails==='no'?'none':'block';
let detail=[];if(d.match)detail.push(d.match);if(d.showVenue!=='no'&&d.venue)detail.push(d.venue);if(d.showVenue!=='no'&&d.matchType)detail.push(d.matchType);
$('details').textContent=detail.join('  •  ');$('details').style.display=d.showDetails==='no'||!detail.length?'none':'block';
$('meta').textContent=d.customText||'';$('meta').style.display='none';
$('custom').textContent=d.customText||'';$('custom').style.display=d.customText?'block':'none';
const homeResults=Array.isArray(d.homePenaltyResults)?d.homePenaltyResults:[];
const awayResults=Array.isArray(d.awayPenaltyResults)?d.awayPenaltyResults:[];
$('homePenName').textContent=txt(d.home,'HOME');
$('awayPenName').textContent=txt(d.away,'AWAY');
$('homePenCount').textContent=(Number(d.homePens)||0)+'/'+(Number(d.homeAttempts)||0);
$('awayPenCount').textContent=(Number(d.awayPens)||0)+'/'+(Number(d.awayAttempts)||0);
function drawPenaltyDots(target,results,attempts){
  target.innerHTML='';
  const total=Math.max(results.length,Number(attempts)||0);
  for(let i=0;i<total;i++){
    const dot=document.createElement('span');
    dot.className='pen-dot '+(results[i]===true?'scored':results[i]===false?'missed':'');
    dot.title=results[i]===true?'Scored':results[i]===false?'Missed':'Attempt';
    target.appendChild(dot);
  }
  if(!total){const empty=document.createElement('span');empty.className='pen-empty';empty.textContent='No kicks yet';target.appendChild(empty)}
}
drawPenaltyDots($('homePenDots'),homeResults,d.homeAttempts);
drawPenaltyDots($('awayPenDots'),awayResults,d.awayAttempts);
$('pens').style.display=d.showPenalty==='no'?'none':((Number(d.homeAttempts)||0)+(Number(d.awayAttempts)||0)>0?'grid':'none');
$('result').textContent=d.resultText||'';$('result').style.display=d.showResult==='yes'&&d.resultText?'block':'none';
showEvent(d.event);
}catch(e){console.warn('Overlay sync error',e)}}
refresh();setInterval(refresh,700);
</script></body></html>
