<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BRKLIVE19 Overlay</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}
body{color:#fff}
#overlay{position:relative;width:100vw;height:100vh;background:transparent;overflow:hidden}

/* LIVE BUG */
.live{position:absolute;right:2%;top:2%;display:flex;align-items:center;gap:8px;padding:6px 11px 6px 7px;border:2px solid #ff334d;border-radius:22px;background:rgba(0,0,0,.86);font-size:clamp(12px,1.25vw,22px);font-weight:900;z-index:30;box-shadow:0 0 20px #ff183d66}
.dot{width:16px;height:16px;border-radius:50%;background:#ff173b;box-shadow:0 0 13px #ff173b}
.live span:last-child{background:#ef1838;border-radius:7px;padding:3px 9px}

/* EVENT ANIMATIONS */
#event{position:absolute;inset:0;display:none;z-index:25;pointer-events:none;overflow:hidden}
#event.show{display:block}
#event.shake{animation:screenShake .55s cubic-bezier(.36,.07,.19,.97) both}
@keyframes screenShake{10%,90%{transform:translate(-4px,2px)}20%,80%{transform:translate(6px,-3px)}30%,50%,70%{transform:translate(-9px,3px)}40%,60%{transform:translate(9px,-2px)}}
.ev-burst{position:absolute;left:50%;top:50%;width:200vmax;height:200vmax;transform:translate(-50%,-50%) scale(.05);border-radius:50%;opacity:0;background:radial-gradient(circle,var(--c1) 0%,transparent 42%),radial-gradient(circle,var(--c2) 0%,transparent 70%);animation:burstIn .95s ease-out forwards}
@keyframes burstIn{0%{transform:translate(-50%,-50%) scale(.05);opacity:0}22%{transform:translate(-50%,-50%) scale(.45);opacity:.95}100%{transform:translate(-50%,-50%) scale(1.08);opacity:0}}
.ev-rays{position:absolute;left:50%;top:50%;width:175vmax;height:175vmax;transform:translate(-50%,-50%);opacity:0;mix-blend-mode:screen;background:conic-gradient(from 0deg,transparent 0 5deg,var(--c1) 5deg 8deg,transparent 8deg 22deg,var(--c2) 22deg 24deg,transparent 24deg 44deg,var(--c1) 44deg 46deg,transparent 46deg 60deg);-webkit-mask-image:radial-gradient(circle,transparent 10%,#000 28%,transparent 66%);mask-image:radial-gradient(circle,transparent 10%,#000 28%,transparent 66%);animation:raysSpin 1.15s ease-out forwards}
@keyframes raysSpin{0%{opacity:0;transform:translate(-50%,-50%) rotate(0deg) scale(.3)}30%{opacity:.9}100%{opacity:0;transform:translate(-50%,-50%) rotate(150deg) scale(1)}}
.ev-particles{position:absolute;left:50%;top:50%;width:0;height:0;z-index:2}
.ev-particles i{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--c1);box-shadow:0 0 16px var(--c1),0 0 30px var(--c2);opacity:0;animation:particleFly 1.2s cubic-bezier(.15,.7,.3,1) forwards;animation-delay:var(--pd,0s)}
@keyframes particleFly{0%{opacity:0;transform:translate(0,0) scale(.2)}22%{opacity:1;transform:translate(calc(var(--tx)*.35),calc(var(--ty)*.35)) scale(1.1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.15)}}
.ev-deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ev-content{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:900px}
.ev-text{font-size:clamp(50px,11.5vw,200px);font-weight:1000;font-style:italic;letter-spacing:-.02em;line-height:.92;text-transform:uppercase;color:#fff;white-space:nowrap;opacity:0;text-shadow:4px 6px 0 rgba(0,0,0,.85),0 0 26px var(--c1),0 0 72px var(--c2)}
.ev-text.long{font-size:clamp(34px,7.5vw,124px)}
.ev-text.xlong{font-size:clamp(24px,5.2vw,88px)}
.ev-four .ev-text{animation:fourIn .8s cubic-bezier(.15,1.6,.4,1) forwards}
.ev-six .ev-text{animation:sixIn .9s cubic-bezier(.2,1.5,.35,1) forwards}
.ev-wicket .ev-text{animation:wicketIn .95s linear forwards}
.ev-runout .ev-text{animation:runOutIn .82s cubic-bezier(.15,1.5,.4,1) forwards}
.ev-freehit .ev-text{animation:freeHitIn .8s ease-out forwards,freeHitPulse 1s ease-in-out .8s infinite alternate}
.ev-hattrick .ev-text{animation:hatIn .95s ease-out forwards,hatFlicker .55s steps(2,end) .95s infinite}
@keyframes fourIn{0%{opacity:0;transform:translateX(-70vw) skewX(-28deg) scale(.6)}55%{opacity:1;transform:translateX(2vw) skewX(7deg) scale(1.08)}75%{transform:translateX(-1vw) skewX(-4deg) scale(.98)}100%{opacity:1;transform:translateX(0) skewX(0) scale(1)}}
@keyframes sixIn{0%{opacity:0;transform:translateY(-80vh) rotate(-14deg) scale(.35)}50%{opacity:1;transform:translateY(4vh) rotate(5deg) scale(1.2)}68%{transform:translateY(-2vh) rotate(-3deg) scale(.94)}84%{transform:translateY(1vh) rotate(1deg) scale(1.05)}100%{opacity:1;transform:translateY(0) rotate(0) scale(1)}}
@keyframes wicketIn{0%{opacity:0;transform:scale(2.4);filter:blur(16px)}35%{opacity:1;transform:scale(.92);filter:blur(0)}45%{transform:translateX(-14px) scale(1.04)}55%{transform:translateX(14px) scale(.98)}65%{transform:translateX(-9px)}75%{transform:translateX(9px)}85%{transform:translateX(-4px)}100%{opacity:1;transform:translateX(0) scale(1)}}
@keyframes runOutIn{0%{opacity:0;transform:translateX(72vw) skewX(22deg) scale(.8)}55%{opacity:1;transform:translateX(-3vw) skewX(-6deg) scale(1.06)}78%{transform:translateX(1vw) skewX(2deg) scale(.99)}100%{opacity:1;transform:translateX(0) skewX(0) scale(1)}}
@keyframes freeHitIn{0%{opacity:0;transform:scale(.15)}40%{opacity:1;transform:scale(1.22)}55%{transform:scale(.94)}70%{transform:scale(1.1)}85%{transform:scale(.98)}100%{opacity:1;transform:scale(1)}}
@keyframes freeHitPulse{0%{filter:drop-shadow(0 0 18px var(--c1)) brightness(1)}100%{filter:drop-shadow(0 0 55px var(--c1)) brightness(1.5)}}
@keyframes hatIn{0%{opacity:0;transform:scale(.25) rotate(-10deg);filter:brightness(4) blur(6px)}25%{opacity:1;transform:scale(1.18) rotate(4deg);filter:brightness(2) blur(0)}38%{opacity:.35}48%{opacity:1}58%{opacity:.45}70%{opacity:1;transform:scale(.96)}100%{opacity:1;transform:scale(1) rotate(0);filter:brightness(1)}}
@keyframes hatFlicker{0%,100%{text-shadow:4px 6px 0 rgba(0,0,0,.85),0 0 26px var(--c1),0 0 72px var(--c2)}50%{text-shadow:4px 6px 0 rgba(0,0,0,.85),0 0 55px #fff,0 0 120px var(--c1)}}
.deco-streak{position:absolute;top:50%;left:50%;width:70vw;height:clamp(6px,.9vw,15px);border-radius:999px;transform:translate(-50%,-50%) scaleX(0);opacity:0;background:linear-gradient(90deg,transparent,var(--c1),#fff,var(--c1),transparent);filter:blur(1px) drop-shadow(0 0 16px var(--c1))}
.deco-streak.s1{animation:streakGo .72s ease-out forwards}
.deco-streak.s2{top:37%;animation:streakGo .72s ease-out .08s forwards;width:58vw}
.deco-streak.s3{top:63%;animation:streakGo .72s ease-out .16s forwards;width:64vw}
@keyframes streakGo{0%{transform:translate(-50%,-50%) scaleX(0);opacity:0}30%{opacity:1}100%{transform:translate(-50%,-50%) scaleX(1);opacity:0}}
.deco-sixball{position:absolute;left:-12vw;bottom:6vh;width:clamp(34px,4.4vw,78px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 27%,#fff 0 10%,#ffd15c 12% 45%,#b25b00 46% 60%,#ff9a1f 62% 100%);box-shadow:0 0 45px #ff9a1f,0 0 95px #ff5a00,0 0 140px #ff2d00;opacity:0;animation:sixBall 1.25s cubic-bezier(.3,.08,.5,1) forwards}
@keyframes sixBall{0%{opacity:0;transform:translate(0,0) rotate(0)}8%{opacity:1}50%{transform:translate(52vw,-34vh) rotate(420deg)}100%{opacity:0;transform:translate(122vw,-6vh) rotate(960deg)}}
.deco-stump{position:absolute;left:50%;top:50%;width:clamp(9px,1.15vw,19px);height:clamp(60px,9vw,150px);border-radius:6px;background:linear-gradient(#fff,#a9b6cc);box-shadow:0 0 22px var(--c1);opacity:0}
.deco-stump.k1{margin-left:calc(-50% - clamp(20px,2.2vw,40px));animation:stumpFlyL 1s ease-out forwards}
.deco-stump.k2{animation:stumpFlyC 1s ease-out forwards}
.deco-stump.k3{margin-left:calc(-50% + clamp(20px,2.2vw,40px));animation:stumpFlyR 1s ease-out forwards}
@keyframes stumpFlyL{0%{opacity:0;transform:translate(-50%,-50%) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% - 28vw),calc(-50% - 34vh)) rotate(-340deg)}}
@keyframes stumpFlyC{0%{opacity:0;transform:translate(-50%,-50%) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,calc(-50% - 42vh)) rotate(240deg)}}
@keyframes stumpFlyR{0%{opacity:0;transform:translate(-50%,-50%) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + 28vw),calc(-50% - 34vh)) rotate(360deg)}}
.deco-runball{position:absolute;left:-8vw;top:50%;margin-top:clamp(-16px,-2.2vw,-38px);width:clamp(32px,4.2vw,74px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 27%,#fff 0 10%,#ffd15c 12% 45%,#b25b00 46% 60%,#ff9a1f 62% 100%);box-shadow:0 0 40px var(--c1),0 0 90px var(--c2);opacity:0;animation:runBall .85s cubic-bezier(.25,.6,.4,1) forwards}
@keyframes runBall{0%{opacity:0;transform:translateX(0) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translateX(118vw) rotate(760deg)}}
.deco-bolt{position:absolute;top:-4%;height:108%;width:clamp(50px,7vw,130px);transform:translateX(-50%) scaleY(.3);opacity:0;background:linear-gradient(180deg,#fff,var(--c1) 45%,transparent);clip-path:polygon(46% 0,64% 40%,52% 40%,74% 100%,38% 56%,48% 56%,30% 0);filter:drop-shadow(0 0 28px var(--c1));animation:boltFlash .95s ease-out forwards}
.deco-bolt.b1{left:32%}
.deco-bolt.b2{left:68%;animation-delay:.12s;transform:translateX(-50%) scaleY(.3) scaleX(-1)}
@keyframes boltFlash{0%{opacity:0;transform:translateX(-50%) scaleY(.3)}22%{opacity:1}45%{opacity:.25}60%{opacity:1}100%{opacity:0;transform:translateX(-50%) scaleY(1.15)}}
.deco-ring{position:absolute;left:50%;top:50%;width:12vmax;height:12vmax;border-radius:50%;border:4px solid var(--c1);box-shadow:0 0 45px var(--c1),inset 0 0 45px var(--c2);transform:translate(-50%,-50%) scale(.15);opacity:0;animation:ringOut 1.05s ease-out forwards}
.deco-ring.r2{animation-delay:.14s}
.deco-ring.r3{animation-delay:.28s}
@keyframes ringOut{0%{transform:translate(-50%,-50%) scale(.15);opacity:0}25%{opacity:1}100%{transform:translate(-50%,-50%) scale(3.2);opacity:0}}

/* CORNER TEAM DESIGN */
.broadcast-row{position:relative;display:flex;align-items:stretch;width:100%;min-height:82px}
.corner-team{position:absolute;top:0;width:18%;height:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:5px 10px;z-index:5;color:#fff;font-size:clamp(12px,1.45vw,25px);font-weight:1000;text-transform:uppercase;white-space:nowrap;overflow:hidden;border:3px solid #dce7ff;text-shadow:0 2px 4px #000}
.corner-team span{overflow:hidden;text-overflow:ellipsis}
.left-team{left:0;border-radius:20px 8px 8px 20px;background:linear-gradient(135deg,#0878ff,#032d9d 70%,#061c5d);clip-path:polygon(0 0,90% 0,100% 50%,90% 100%,0 100%);padding-right:35px}
.right-team{right:0;border-radius:8px 20px 20px 8px;background:linear-gradient(135deg,#730008,#d71932 70%,#ff314a);clip-path:polygon(10% 0,100% 0,100% 100%,10% 100%,0 50%);padding-left:35px}
.center-score{width:68%;margin:0 auto;min-height:82px;display:grid;grid-template-columns:36% 29% 35%;border:3px solid #dce7ff;border-radius:18px;overflow:hidden;background:linear-gradient(#f8fbff,#c2cad7);color:#111827}

/* LOWER THIRD (score bar) */
.lower{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);width:min(88vw,1550px);z-index:10;padding:0}
.lower.hidden{display:none}

/* ROTATING INFO BAR */
.tournament{width:52%;margin:auto;display:flex;align-items:center;justify-content:center;gap:10px;height:clamp(36px,3.1vw,54px);padding:3px 16px;border:2px solid #e8c94a;border-bottom:0;border-radius:17px 17px 0 0;background:linear-gradient(90deg,#10194b,#1743bc,#10194b);font-size:clamp(12px,1.25vw,24px);font-weight:1000;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.tournament .info-label{flex:0 0 auto;display:inline-block;background:linear-gradient(#ffe98f,#e8c94a);color:#0b1240;border-radius:7px;padding:2px 9px;font-size:.8em;letter-spacing:.5px;box-shadow:0 0 12px #e8c94a66}
.tournament .info-value{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 2px 4px #000}
.tournament.infoFlash{animation:infoIn .45s ease-out}
@keyframes infoIn{0%{opacity:.55;transform:translateY(5px)}100%{opacity:1;transform:none}}

.players,.bowler{padding:5px 13px;display:flex;flex-direction:column;justify-content:center;font-size:clamp(10px,1.05vw,18px);font-weight:800}
.row{display:grid;grid-template-columns:minmax(0,1fr) 42px 38px;padding:2px 0 2px 9px;border-bottom:1px solid #7b8490}
.row:last-child{border:0}
.center{display:grid !important;grid-template-columns:minmax(0,1fr) 82px !important;align-items:stretch;background:linear-gradient(135deg,#ffd32b,#fff0a0);text-align:center}
.runs{font-size:clamp(27px,3.1vw,55px);font-weight:1000;line-height:1;margin-top:8px}
.crr{font-size:clamp(10px,1vw,17px);font-weight:1000;margin-top:5px;white-space:nowrap}
.overs{display:flex;align-items:center;justify-content:center;background:linear-gradient(#1663ef,#082c8e);color:white;font-size:clamp(14px,1.5vw,26px);font-weight:1000;min-width:0}
.bowtop{display:grid;grid-template-columns:1fr 60px 40px;padding-bottom:5px;border-bottom:1px solid #7b8490}
.balls{display:flex;gap:5px;margin-top:7px}
.ball{width:clamp(20px,1.7vw,31px);height:clamp(20px,1.7vw,31px);border-radius:50%;display:grid;place-items:center;background:#172034;color:#fff;border:2px solid #fff;font-size:clamp(10px,1vw,17px);font-weight:1000}
.ball.four{background:#0878ff}.ball.six{background:#ffd21f;color:#111}.ball.wicket{background:#ed1739}.ball.wide{background:#19c85b}.ball.noball{background:#9233ed}

@media(max-width:800px){
.broadcast-row{min-height:82px}
.corner-team{width:21%;font-size:clamp(9px,2.1vw,15px);padding:4px 5px}
.left-team{padding-right:18px}
.right-team{padding-left:18px}
.center-score{width:66%;min-height:82px;grid-template-columns:36% 29% 35%}
.players,.bowler{padding:4px 6px}
.row{grid-template-columns:1fr 35px 30px}
.tournament{width:70%}
}

html,body,body *{text-transform:uppercase !important}

/* =========================================================
   LOWER BANNER (broadcast-style card at the bottom)
   ========================================================= */
#bannerLower{
  position:absolute;
  left:50%;
  bottom:3%;
  transform:translateX(-50%);
  width:min(88vw,1550px);
  z-index:12;
  display:none;
  pointer-events:none;
}
#bannerLower.show{display:block}

.bannerCard{
  border-radius:18px;
  border:3px solid #dce7ff;
  background:
    radial-gradient(ellipse at 0% 0%, rgba(8,120,255,.55), transparent 55%),
    radial-gradient(ellipse at 100% 100%, rgba(215,25,50,.45), transparent 55%),
    linear-gradient(95deg,#0a1230 0%,#10194b 40%,#1743bc 70%,#0a1230 100%);
  box-shadow:0 0 45px rgba(8,120,255,.5), 0 20px 60px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.18);
  padding:clamp(14px,1.8vh,24px) clamp(20px,2.2vw,40px);
  min-height:88px;
  position:relative;
  overflow:hidden;
  transform-origin:bottom center;
  will-change:transform,opacity;
  animation:bannerSlideUp .55s cubic-bezier(.2,1.15,.35,1);
}
@keyframes bannerSlideUp{
  0%   {opacity:0; transform:translateY(80px) scale(.92); filter:blur(6px)}
  55%  {opacity:1; transform:translateY(-6px) scale(1.015); filter:blur(0)}
  80%  {opacity:1; transform:translateY(2px) scale(.998)}
  100% {opacity:1; transform:translateY(0) scale(1)}
}
.bannerCard.no-anim{animation:none}

.bannerCard.gold{
  background:
    radial-gradient(ellipse at 0% 0%, rgba(255,200,50,.45), transparent 55%),
    radial-gradient(ellipse at 100% 100%, rgba(215,25,50,.40), transparent 55%),
    linear-gradient(95deg,#1a1408 0%,#3a2a06 40%,#8a5a00 70%,#1a1408 100%);
  border-color:#e8c94a;
}
.bannerCard.red{
  background:
    radial-gradient(ellipse at 0% 0%, rgba(255,60,90,.55), transparent 55%),
    radial-gradient(ellipse at 100% 100%, rgba(120,0,20,.55), transparent 55%),
    linear-gradient(95deg,#2a0209 0%,#730008 40%,#d71932 70%,#2a0209 100%);
  border-color:#ffb0b8;
}

/* Light-sweep shine overlay */
.bannerCard::after{
  content:"";
  position:absolute;
  top:-10%;
  bottom:-10%;
  left:0;
  width:55%;
  background:linear-gradient(100deg,
    transparent 0%,
    rgba(255,255,255,.12) 30%,
    rgba(255,255,255,.55) 48%,
    rgba(255,255,255,.85) 50%,
    rgba(255,255,255,.55) 52%,
    rgba(255,255,255,.12) 70%,
    transparent 100%);
  pointer-events:none;
  transform:translateX(-120%) skewX(-18deg);
  opacity:0;
  mix-blend-mode:screen;
  z-index:5;
}
.bannerCard.playing::after{
  animation:bannerSweep .95s cubic-bezier(.25,.85,.4,1) .08s forwards;
}
@keyframes bannerSweep{
  0%   {transform:translateX(-120%) skewX(-18deg); opacity:0}
  15%  {opacity:1}
  100% {transform:translateX(280%) skewX(-18deg); opacity:0}
}

.bannerInner{
  display:flex;
  align-items:center;
  gap:clamp(14px,1.6vw,28px);
  position:relative;
  z-index:2;
}

.bannerTag{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:clamp(6px,1vh,11px) clamp(14px,1.6vw,22px);
  border-radius:999px;
  background:linear-gradient(#ffe98f,#e8c94a);
  color:#0b1240;
  font-size:clamp(11px,1.2vw,18px);
  font-weight:1000;
  letter-spacing:2px;
  border:2px solid #b8941f;
  box-shadow:0 0 22px rgba(232,201,74,.7);
  text-shadow:0 1px 2px rgba(255,255,255,.4);
  white-space:nowrap;
}
.bannerTag.blue{
  background:linear-gradient(135deg,#0878ff,#032d9d);
  color:#fff;
  border-color:#dce7ff;
  box-shadow:0 0 22px rgba(8,120,255,.7);
  text-shadow:0 2px 5px rgba(0,0,0,.7);
}
.bannerTag.red{
  background:linear-gradient(135deg,#d71932,#730008);
  color:#fff;
  border-color:#ffb0b8;
  box-shadow:0 0 22px rgba(215,25,50,.7);
  text-shadow:0 2px 5px rgba(0,0,0,.7);
}
@keyframes tagPop{
  0%   {transform:scale(.35) rotate(-10deg); opacity:0; filter:brightness(2)}
  55%  {transform:scale(1.14) rotate(3deg); opacity:1; filter:brightness(1.15)}
  100% {transform:scale(1) rotate(0); opacity:1; filter:brightness(1)}
}
.bannerCard.playing .bannerTag{
  animation:tagPop .55s cubic-bezier(.2,1.5,.4,1) .12s both;
}

.bannerMainWrap{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:2px;
  overflow:hidden;
}
.bannerMainTitle{
  font-size:clamp(20px,3.4vw,56px);
  font-weight:1000;
  line-height:1;
  letter-spacing:-.01em;
  color:#fff;
  text-shadow:3px 4px 0 rgba(0,0,0,.75), 0 0 22px rgba(8,120,255,.7);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.bannerMainTitle.gold{color:#ffe98f;text-shadow:3px 4px 0 rgba(0,0,0,.75), 0 0 22px rgba(255,180,0,.75)}
.bannerMainTitle.red{color:#ffd0d5;text-shadow:3px 4px 0 rgba(0,0,0,.75), 0 0 22px rgba(255,50,80,.75)}
.bannerMainSub{
  font-size:clamp(11px,1.3vw,20px);
  font-weight:900;
  letter-spacing:2px;
  color:#ffe98f;
  text-shadow:0 2px 6px rgba(0,0,0,.75);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.bannerMainSub.blue{color:#a8d3ff}
.bannerMainSub.red{color:#ffb8c0}
@keyframes titleWipe{
  0%   {clip-path:inset(0 100% 0 0); opacity:0; transform:translateX(-14px)}
  60%  {clip-path:inset(0 0 0 0); opacity:1; transform:translateX(0)}
  100% {clip-path:inset(0 0 0 0); opacity:1; transform:translateX(0)}
}
.bannerCard.playing .bannerMainTitle{
  animation:titleWipe .6s cubic-bezier(.3,.9,.3,1) .16s both;
}
.bannerCard.playing .bannerMainSub{
  animation:titleWipe .55s cubic-bezier(.3,.9,.3,1) .28s both;
}

.bannerStats{
  flex:0 0 auto;
  display:flex;
  gap:clamp(10px,1.4vw,22px);
  align-items:center;
  padding-left:clamp(10px,1.4vw,22px);
  border-left:2px dashed rgba(255,255,255,.35);
}
.bannerStat{
  text-align:center;

<script>
/* ============================================================
   BRKLIVE19 OVERLAY
   · Flicker-free dedup (packet hash + HTML diff)
   · Entry animations play only on scene change
   · Bottom banner for Tournament/Match/Toss/Venue/B1/B2/
     Bowler/FOW/Partnership/Result
   · Full-screen for Summary/PlayingXI/Innings/Scorecards
   ============================================================ */

const $id = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n = v => Number(v) || 0;
function overs(v){
  if (typeof v === 'string' && v.includes('.')) return v;
  const b = n(v);
  return Math.floor(b / 6) + '.' + (b % 6);
}
function setText(id, v){
  const e = $id(id);
  if (e && v !== undefined && v !== null && e.textContent !== String(v)){
    e.textContent = v;
  }
}
function ballsFromOvers(v){
  if (typeof v === 'string' && v.includes('.')){
    const p = v.split('.');
    return (parseInt(p[0],10)||0)*6 + (parseInt(p[1],10)||0);
  }
  return n(v);
}

/* Channels */
let overlayChannel = null, scorerChannel = null;
try { overlayChannel = new BroadcastChannel('BRKLIVE19_LIVE_OVERLAY'); } catch(e) {}
try { scorerChannel  = new BroadcastChannel('BRKLIVE19_SCORER_DATA'); } catch(e) {}

/* ============================================================
   ROTATING INFO BAR
   ============================================================ */
function buildInfoItems(d){
  const items = [];
  const inn = n(d.innings) === 2 ? 2 : 1;
  items.push({label:'TOURNAMENT', value:d.tournament || d.tournamentName || 'BRKLIVE19 LIVE'});
  const matchBits = [d.matchName || ((d.teamA || 'TEAM A') + ' VS ' + (d.teamB || 'TEAM B')), d.venue || d.tournamentVenue || ''].filter(Boolean);
  items.push({label:'MATCH', value: matchBits.join(' • ')});
  const toss = [d.tossWinner, d.tossDecision].filter(Boolean).join(' • ');
  if (toss) items.push({label:'TOSS', value: toss});
  items.push({label:'INNINGS', value: (inn === 2 ? '2ND INNINGS' : '1ST INNINGS') + (d.battingTeamName ? ' • ' + d.battingTeamName : '')});
  items.push({label:'CRR', value: n(d.crr).toFixed(2)});
  if (inn === 1){
    const total = n(d.maxOvers) || n(d.totalOvers) || 20;
    const bowled = ballsFromOvers(d.overs);
    let crr = n(d.crr); if (!crr && bowled) crr = n(d.runs) / (bowled/6);
    items.push({label:'PROJECTED', value: Math.round(crr * total) + ' RUNS'});
  }
  if (inn === 2){
    if (d.target != null) items.push({label:'TARGET', value: n(d.target) + ' RUNS'});
    items.push({label:'RRR', value: n(d.rrr).toFixed(2)});
    if (d.runsToWin != null){
      items.push({label:'NEED', value: n(d.runsToWin) + ' RUNS FROM ' + n(d.ballsRemaining) + ' BALLS'});
    }
  }
  return items;
}
const infoState = {items:[], index:0, key:'', lastHtml:'', timer:null};
function renderInfo(animate){
  const el = $id('tournament');

  if (!it) return;
  const html = '<span class="info-label">' + esc(it.label) + '</span><span class="info-value">' + esc(it.value) + '</span>';
  if (html !== infoState.lastHtml){
    infoState.lastHtml = html;
    el.innerHTML = html;
  }
  if (animate){
    el.classList.remove('infoFlash');
    void el.offsetWidth;
    el.classList.add('infoFlash');
  }
}
function updateTournamentInfo(d){
  const items = buildInfoItems(d);
  if (!items.length) return;
  const key = items.map(i => i.label + ':' + i.value).join('|');
  if (key !== infoState.key){
    infoState.key = key;
    infoState.items = items;
    if (infoState.index >= items.length) infoState.index = 0;
    renderInfo(false);
  }
  if (!infoState.timer){
    infoState.timer = setInterval(function(){
      if (infoState.items.length < 2) return;
      infoState.index = (infoState.index + 1) % infoState.items.length;
      renderInfo(true);
    }, 5000);
  }
}

/* ============================================================

const EVENT_ALIASES = {
  '4':'FOUR','BOUNDARY':'FOUR','FOUR RUNS':'FOUR','FOUR!':'FOUR',
  '6':'SIX','SIXER':'SIX','SIX RUNS':'SIX','SIX!':'SIX',
  'W':'WICKET','OUT':'WICKET','BOWLED':'WICKET','CAUGHT':'WICKET','LBW':'WICKET','STUMPED':'WICKET','CAUGHT BEHIND':'WICKET','HIT WICKET':'WICKET',
  'RO':'RUN OUT','RUNOUT':'RUN OUT','RUN-OUT':'RUN OUT','RUN OUT!':'RUN OUT',
  'FH':'FREE HIT','FREEHIT':'FREE HIT','FREE-HIT':'FREE HIT',
  'HAT TRICK BALL':'HAT-TRICK BALL','HATTRICK BALL':'HAT-TRICK BALL',
  'HATTRICK':'HAT-TRICK','HAT TRICK':'HAT-TRICK'
};
const EVENT_CFG = {
  'FOUR':          {c1:'#00a8ff', c2:'#006eff', cls:'ev-four',     particles:14, dur:4000},
  'SIX':           {c1:'#ffb400', c2:'#ff5a00', cls:'ev-six',      particles:30, dur:4200, shake:true},
  'WICKET':        {c1:'#ff102d', c2:'#a00012', cls:'ev-wicket',   particles:22, dur:4200},
  'RUN OUT':       {c1:'#b735ff', c2:'#4b0c99', cls:'ev-runout',   particles:18, dur:4000},
  'FREE HIT':      {c1:'#7cff00', c2:'#19b500', cls:'ev-freehit',  particles:16, dur:4200},
  'HAT-TRICK BALL':{c1:'#00e5ff', c2:'#0066ff', cls:'ev-hattrick', particles:26, dur:4400},
  'HAT-TRICK':     {c1:'#00e5ff', c2:'#0066ff', cls:'ev-hattrick', particles:32, dur:4600}
};
let eventTimer = null, lastEventType = '', lastEventAt = 0, lastActiveEventKey = '';
let lastBallKey = null, ballKeyInit = false;

function normalizeEvent(name){
  const k = String(name == null ? '' : name).toUpperCase().trim().replace(/\s+/g,' ');
  if (!k) return null;
  if (EVENT_CFG[k]) return k;
  if (EVENT_ALIASES[k]) return EVENT_ALIASES[k];
  return null;
}
function spawnParticles(box, count, color, color2){
  if (!box) return;
  box.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (let i = 0; i < count; i++){
    const p = document.createElement('i');
    const ang = (i / count) * Math.PI * 2 + Math.random() * 0.7;
    const dist = 16 + Math.random() * 40;
    p.style.setProperty('--tx', (Math.cos(ang) * dist).toFixed(1) + 'vmax');
    p.style.setProperty('--ty', (Math.sin(ang) * dist).toFixed(1) + 'vmax');
    p.style.setProperty('--pd', (Math.random() * 0.28).toFixed(2) + 's');
    if (i % 3 === 0 && color2){
      p.style.background = color2;
      p.style.boxShadow = '0 0 16px ' + color2 + ',0 0 30px ' + color2;
    }
    frag.appendChild(p);
  }
  box.appendChild(frag);
}
function decoFor(type){
  switch(type){
    case 'FOUR':     return '<span class="deco-streak s1"></span><span class="deco-streak s2"></span><span class="deco-streak s3"></span>';
    case 'SIX':      return '<span class="deco-sixball"></span>';
    case 'WICKET':   return '<span class="deco-stump k1"></span><span class="deco-stump k2"></span><span class="deco-stump k3"></span>';
    case 'RUN OUT':  return '<span class="deco-stump k2"></span><span class="deco-runball"></span>';
    case 'FREE HIT': return '<span class="deco-bolt b1"></span><span class="deco-bolt b2"></span>';
    case 'HAT-TRICK BALL':
    case 'HAT-TRICK':return '<span class="deco-ring r1"></span><span class="deco-ring r2"></span><span class="deco-ring r3"></span>';
    default: return '';
  }
}
function showEvent(name, opts){
  const type = normalizeEvent(name);
  if (!type) return;
  const cfg = EVENT_CFG[type];
  const el = $id('event');
  if (!el) return;
  const now = Date.now();
  if (!(opts && opts.force) && type === lastEventType && now - lastEventAt < 1200) return;
  lastEventType = type; lastEventAt = now;
  el.className = 'show ' + cfg.cls + (cfg.shake ? ' shake' : '');
  el.style.setProperty('--c1', cfg.c1);
  el.style.setProperty('--c2', cfg.c2);
  const sizeCls = type.length >= 13 ? ' xlong' : (type.length >= 9 ? ' long' : '');
  el.innerHTML = '<div class="ev-burst"></div><div class="ev-rays"></div><div class="ev-deco">' + decoFor(type) + '</div><div class="ev-particles"></div><div class="ev-content"><div class="ev-text' + sizeCls + '">' + esc(type) + '</div></div>';
  spawnParticles(el.querySelector('.ev-particles'), cfg.particles, cfg.c1, cfg.c2);
  clearTimeout(eventTimer);
  eventTimer = setTimeout(() => { el.className = ''; }, cfg.dur || 4000);
}
function detectBallEvent(d){
  const arr = Array.isArray(d.ballResults) ? d.ballResults : (Array.isArray(d.recentBalls) ? d.recentBalls : []);
  if (!arr.length) return null;
  const last = arr[arr.length - 1];
  const label = String(typeof last === 'object' ? (last.label ?? last.result ?? '') : last).toUpperCase().trim();
  const key = String(d.totalBalls ?? d.legalBalls ?? arr.length) + '|' + label + '|' + String(d.overs || '');
  if (!ballKeyInit){ ballKeyInit = true; lastBallKey = key; return null; }
  if (key === lastBallKey) return null;
  lastBallKey = key;
  if (label === '4') return 'FOUR';
  if (label === '6') return 'SIX';
  if (['RO','RUN OUT','RUNOUT'].includes(label)) return 'RUN OUT';
  if (['W','WICKET','OUT','BOWLED','CAUGHT','LBW','STUMPED'].includes(label)) return 'WICKET';
  return null;
}

function normalizeScorerData(raw){

/* ============================================================
   STAT HELPERS
   ============================================================ */
function playerStats(d, name){
  const empty = {runs:0, balls:0, fours:0, sixes:0, out:false, dismissal:''};
  if (!name) return empty;
  const pools = [d.batters, d.secondInnings && d.secondInnings.batters, d.firstInnings && d.firstInnings.batters];
  for (const p of pools){
    if (!p) continue;
    if (p[name]) return p[name];
    const k = Object.keys(p).find(x => String(x).toLowerCase() === String(name).toLowerCase());
    if (k) return p[k];
  }
  if (name === d.b1 || name === d.b2){
    const i = name === d.b1 ? 1 : 2;
    return {runs:n(d['runs'+i]), balls:n(d['balls'+i]), fours:n(d['fours'+i]), sixes:n(d['sixes'+i]), out:false, dismissal:''};
  }
  return empty;
}
function bowlerStats(d, name){
  const empty = {balls:0, maidens:0, runs:0, wickets:0};
  if (!name) return empty;
  const pools = [d.bowlers, d.secondInnings && d.secondInnings.bowlers, d.firstInnings && d.firstInnings.bowlers];
  for (const p of pools){
    if (!p) continue;
    if (p[name]) return p[name];
    const k = Object.keys(p).find(x => String(x).toLowerCase() === String(name).toLowerCase());
    if (k) return p[k];
  }
  if (name === d.bowler){
    return {balls:ballsFromOvers(d.bowlerOvers), maidens:0, runs:n(d.bowlerRuns), wickets:n(d.bowlerWickets)};
  }
  return empty;
}
function inningData(d, no){ return no === 2 ? d.secondInnings : d.firstInnings; }
function innTeamName(d, inn){
  if (!inn) return '';
  if (inn.team === 'A') return d.teamA || 'TEAM A';
  if (inn.team === 'B') return d.teamB || 'TEAM B';
  return inn.team || '';
}

        cls:'red',
        html:'<div class="bannerInner">' +
          '<div class="bannerTag red">🏆 RESULT</div>' +
          '<div class="bannerMainWrap">' +
            '<div class="bannerMainTitle red">' + esc(txt) + '</div>' +
            (d.matchName ? '<div class="bannerMainSub red">' + esc(d.matchName) + '</div>' : '') +
          '</div>' +
        '</div>'
      };
    }

    case 'custom': {
      const txt = (d.customLower && d.customLower.text) || '';
      return {
        cls:'gold',
        html:'<div class="bannerInner">' +
          '<div class="bannerTag">✨ LOWER THIRD</div>' +
          '<div class="bannerMainWrap"><div class="bannerMainTitle gold">' + esc(txt) + '</div></div>' +
        '</div>'
      };
    }
  }
  return { cls:'', html:'' };
}

/* ============================================================
   FULL SCREEN DATA SCREEN RENDERERS
   ============================================================ */
function dsWrap(topbar, body, tournamentName){
  const tour = (tournamentName && String(tournamentName).trim())
    ? '<div class="dsTournament">' + esc(tournamentName) + '</div>' : '';
  return tour + topbar + '<div class="dataScroll">' + body + '</div>';
}
function scoreRows(inn, d){
  const bats = inn && inn.batters ? inn.batters : {};
  const entries = Object.entries(bats);
  if (!entries.length) return '<tr><td colspan="7" style="text-align:center;padding:14px;color:#4a5a75">NO BATTING DATA</td></tr>';
  return entries.map(([name, s]) => {
    const out = !!s.out;
    const isAtCrease = !!(d && (name === d.b1 || name === d.b2));
    const hasBatted = n(s.balls) > 0 || n(s.runs) > 0 || isAtCrease;
    let statusHtml = '';
    if (out) statusHtml = '<span class="dsBadge red">OUT</span>';
    else if (!hasBatted) statusHtml = '';
    else statusHtml = '<span class="dsBadge gold">NOT OUT</span>';
    const sr = s.balls ? ((n(s.runs) / n(s.balls)) * 100).toFixed(2) : '0.00';
    return '<tr><td>' + esc(name) + '</td><td>' + statusHtml + '</td><td>' + n(s.runs) + '</td><td>' + n(s.balls) + '</td><td>' + n(s.fours) + '</td><td>' + n(s.sixes) + '</td><td>' + sr + '</td></tr>';
  }).join('');
}
function bowlRows(inn){
  const bs = inn && inn.bowlers ? inn.bowlers : {};
  const entries = Object.entries(bs);
  if (!entries.length) return '<tr><td colspan="6" style="text-align:center;padding:14px;color:#4a5a75">NO BOWLING DATA</td></tr>';
  return entries.map(([name, s]) => {
    const econ = s.balls ? ((n(s.runs) / (n(s.balls) / 6))).toFixed(2) : '0.00';
    return '<tr><td>' + esc(name) + '</td><td>' + overs(s.balls || 0) + '</td><td>' + n(s.maidens || 0) + '</td><td>' + n(s.runs) + '</td><td>' + n(s.wickets) + '</td><td>' + econ + '</td></tr>';
  }).join('');
}
function renderInningsDetail(d, mode){
  const no = /2$/.test(mode) ? 2 : 1;
  const inn = inningData(d, no) || {};
  const isBat = mode.indexOf('batting') === 0;
  const team = innTeamName(d, inn) || (no === 1 ? (d.teamA || '') : (d.teamB || ''));
  const title = (no === 1 ? '1ST' : '2ND') + ' INNINGS ' + (isBat ? 'BATTING' : 'BOWLING');
  const r = inn.runs ?? 0, w = inn.wickets ?? 0;
  const o = inn.balls != null ? overs(inn.balls) : (d.overs || '0.0');
  const tour = d.tournament || d.tournamentName || 'BRKLIVE19 LIVE';
  const topbar = '<div class="dsTopbar"><div><div class="dsTitle">' + title + '</div><div class="dsSub">' + esc(team) + '</div></div><div class="dsBadges"><span class="dsBadge ' + (no === 2 ? 'red' : 'blue') + '">' + (no === 1 ? '1ST' : '2ND') + ' INN</span><span class="dsBadge gold">' + r + '/' + w + ' • ' + o + ' OV</span></div></div>';
  const body = '<div class="dataBox dataFull"><table class="dataTable ' + (isBat ? 'batTbl' : 'bowlTbl') + '"><thead>' +
    (isBat
      ? '<tr><th>PLAYER</th><th>STATUS</th><th>RUN</th><th>BALL</th><th>4S</th><th>6S</th><th>SR</th></tr>'
      : '<tr><th>BOWLER</th><th>OV</th><th>M</th><th>RUN</th><th>WKT</th><th>ECON</th></tr>') +
    '</thead><tbody>' + (isBat ? scoreRows(inn, d) : bowlRows(inn)) + '</tbody></table></div>';
  return dsWrap(topbar, body, tour);
}
function renderScorecard(d, no){
  const inn = inningData(d, no) || {};
  const team = innTeamName(d, inn) || (no === 1 ? (d.teamA || 'TEAM A') : (d.teamB || 'TEAM B'));
  const teamCls = (inn && inn.team === 'B') ? 'teamB' : '';
  const r = inn.runs ?? 0, w = inn.wickets ?? 0;
  const o = inn.balls != null ? overs(inn.balls) : (d.overs || '0.0');
  const crr = (inn.balls && inn.balls > 0) ? ((r / (inn.balls / 6)).toFixed(2)) : n(d.crr).toFixed(2);
  const extras = inn.extras ?? d.extras ?? 0;
  const tour = d.tournament || d.tournamentName || 'BRKLIVE19 LIVE';
  const topbar = '<div class="dsTopbar"><div><div class="dsTitle">' + (no === 1 ? '1ST' : '2ND') + ' INNINGS SCORECARD</div><div class="dsSub">BRKLIVE19 • FULL MATCH DETAILS</div></div><div class="dsBadges"><span class="dsBadge ' + (no === 2 ? 'red' : 'blue') + '">' + (no === 1 ? '1ST' : '2ND') + ' INN</span></div></div>';
  const body =
    '<div class="dsTeamHeader ' + teamCls + '">' +
      '<div><div class="dsTeamName">' + esc(team) + '</div><div class="dsTeamOvers">CRR ' + crr + ' • EXTRAS ' + extras + '</div></div>' +
      '<div style="text-align:right"><div class="dsTeamScore">' + r + '/' + w + '</div><div class="dsTeamOvers">' + o + ' OVERS</div></div>' +
    '</div>' +
    '<div class="dataBox dataFull"><h3>BATTING</h3>' +
      '<table class="dataTable batTbl"><thead><tr><th>PLAYER</th><th>STATUS</th><th>RUN</th><th>BALL</th><th>4S</th><th>6S</th><th>SR</th></tr></thead><tbody>' + scoreRows(inn, d) + '</tbody></table>' +
    '</div>' +
    '<div class="dataBox dataFull"><h3 class="red">BOWLING</h3>' +
      '<table class="dataTable bowlTbl"><thead><tr><th>BOWLER</th><th>OV</th><th>M</th><th>RUN</th><th>WKT</th><th>ECON</th></tr></thead><tbody>' + bowlRows(inn) + '</tbody></table>' +
    '</div>';
  return dsWrap(topbar, body, tour);
}
function renderPlayingXI(d){
  const a = Array.isArray(d.xiA) ? d.xiA : [];
  const b = Array.isArray(d.xiB) ? d.xiB : [];
  const tA = d.teamA || 'TEAM A', tB = d.teamB || 'TEAM B';
  const tour = d.tournament || d.tournamentName || 'BRKLIVE19 LIVE';
  const build = (list) => list.length
    ? list.map((x, i) => '<div class="xiPlayer"><div class="xiNum">' + (i+1) + '</div><div class="xiName">' + esc(x) + '</div></div>').join('')
    : '<div class="xiPlayer"><div class="xiName" style="opacity:.55">NO PLAYERS LISTED</div></div>';
  const topbar = '<div class="dsTopbar"><div><div class="dsTitle">PLAYING XI</div><div class="dsSub">' + esc(tA) + ' VS ' + esc(tB) + '</div></div><div class="dsBadges"><span class="dsBadge">LINEUPS</span></div></div>';
  const body = '<div class="xiGrid"><div class="xiTeam"><h3>🦁 ' + esc(tA) + '</h3><div class="xiList">' + build(a) + '</div></div><div class="xiTeam teamB"><h3>🐯 ' + esc(tB) + '</h3><div class="xiList">' + build(b) + '</div></div></div>';
  return dsWrap(topbar, body, tour);
}
function topBatter(inn){
  const bats = inn && inn.batters ? inn.batters : {};
  let best = null;
  Object.entries(bats).forEach(([name, s]) => {
    const r = n(s.runs);
    if (!best || r > best.runs || (r === best.runs && n(s.balls) < best.balls)){
      best = {name, runs:r, balls:n(s.balls), fours:n(s.fours), sixes:n(s.sixes)};
    }
  });
  return best;
}
function topBowler(inn){
  const bs = inn && inn.bowlers ? inn.bowlers : {};
  let best = null;
  Object.entries(bs).forEach(([name, s]) => {
    const w = n(s.wickets), r = n(s.runs);
    if (!best || w > best.wickets || (w === best.wickets && r < best.runs)){
      best = {name, wickets:w, runs:r, balls:n(s.balls)};
    }
  });
  return best;
}
function renderMatchSummary(d){
  const i1 = d.firstInnings || {};
  const i2 = d.secondInnings || {};
  const tA = d.teamA || 'TEAM A', tB = d.teamB || 'TEAM B';
  const t1 = innTeamName(d, i1) || tA, t2 = innTeamName(d, i2) || tB;
  const result = d.resultText || d.matchResult || '';
  const tour = d.tournament || d.tournamentName || 'BRKLIVE19 LIVE';
  const perf = (tb, bw) => {
    const parts = [];
    if (tb) parts.push('<b>' + esc(tb.name) + '</b> ' + tb.runs + ' (' + tb.balls + ') • ' + tb.fours + '×4 ' + tb.sixes + '×6');
    if (bw) parts.push('<b>' + esc(bw.name) + '</b> ' + bw.wickets + '/' + bw.runs + ' (' + overs(bw.balls) + ')');
    return parts.length ? parts.join('<br>') : '<span style="opacity:.55">NO DATA</span>';
  };
  const innCard = (inn, team, no) => {
    const cls = no === 2 ? 'inn2' : '';
    const r = inn.runs ?? 0, w = inn.wickets ?? 0;
    const o = inn.balls != null ? overs(inn.balls) : (inn.overs || '');
    return '<div class="msInnCard ' + cls + '"><div class="msInnTeam">' + esc(team) + (no === 1 ? ' (1ST)' : ' (2ND)') + '</div><div class="msInnScore">' + r + '/' + w + '</div><div class="msInnOvers">' + (o ? o + ' OVERS' : '') + '</div><div class="msPerf">' + perf(topBatter(inn), topBowler(inn)) + '</div></div>';
  };
  const topbar = '<div class="dsTopbar"><div><div class="dsTitle">MATCH SUMMARY</div><div class="dsSub">' + esc(d.matchName || (tA + ' VS ' + tB)) + '</div></div><div class="dsBadges"><span class="dsBadge gold">SUMMARY</span></div></div>';
  const body =
    (result ? '<div class="msResult"><div class="msResultText">' + esc(result) + '</div></div>' : '') +
    '<div class="msInningsGrid">' + innCard(i1, t1, 1) + innCard(i2, t2, 2) + '</div>' +
    '<div class="msInfoGrid">' +
      '<div class="msInfoBox"><div class="lbl">VENUE</div><div class="val">' + esc(d.venue || d.tournamentVenue || '—') + '</div></div>' +
      '<div class="msInfoBox"><div class="lbl">TOSS</div><div class="val">' + esc([d.tossWinner, d.tossDecision].filter(Boolean).join(' • ') || '—') + '</div></div>' +
      '<div class="msInfoBox"><div class="lbl">MATCH</div><div class="val">' + esc(d.matchName || (tA + ' VS ' + tB)) + '</div></div>' +
      '<div class="msInfoBox"><div class="lbl">FORMAT</div><div class="val">' + (n(d.maxOvers) || 20) + ' OVERS</div></div>' +
    '</div>';
  return dsWrap(topbar, body, tour);
}
function renderDataScreenHtml(d, mode){
  switch (mode){
    case 'scorecard1': return renderScorecard(d, 1);
    case 'scorecard2': return renderScorecard(d, 2);
    case 'batting1':
    case 'bowling1':
    case 'batting2':
    case 'bowling2': return renderInningsDetail(d, mode);
    case 'playingxi': return renderPlayingXI(d);
    case 'summary':   return renderMatchSummary(d);
    default:          return renderMatchSummary(d);
  }
}

/* ============================================================
   MODE RESOLUTION
   ============================================================ */
const LOWER_BANNER_MODES = ['tournament','venue','match','toss','b1','b2','bowler','fow','partnership','result','custom'];
const FULL_SCREEN_MODES  = ['summary','playingxi','batting1','batting2','bowling1','bowling2','scorecard1','scorecard2'];

function decideDisplayMode(d){
  const o = d.overlay || {};
  const custom = d.customLower || {};

  if (custom.active && custom.text) return 'custom';
  if (o.playerLower && o.playerLower.active){
    return String(o.playerLower.slot).toLowerCase() === 'b2' ? 'b2' : 'b1';
  }
  if (o.showFOW) return 'fow';
  if (o.showBowler) return 'bowler';
  if (o.showTarget) return 'target';
  if (o.partnership && o.partnership.active) return 'partnership';
  if (o.showTournament) return 'tournament';
  if (o.showVenue) return 'venue';
  if (o.showMatch) return 'match';
  if (o.showToss) return 'toss';
  if (o.showResult) return 'result';

  const mode = String(d.mode || '').toLowerCase();
  if (mode === 'playingxi') return 'playingxi';
  if (mode === 'summary') return 'summary';
  if (mode === 'batting1') return 'batting1';
  if (mode === 'batting2') return 'batting2';
  if (mode === 'bowling1') return 'bowling1';
  if (mode === 'bowling2') return 'bowling2';
  if (mode === 'scorecard1') return 'scorecard1';
  if (mode === 'scorecard2') return 'scorecard2';

  const view = String(o.view || '').toLowerCase();
  if (view && view !== 'default'){
    if (LOWER_BANNER_MODES.includes(view)) return view;
    if (FULL_SCREEN_MODES.includes(view)) return view;
    if (view === 'target') return 'target';
  }
  return 'default';
}
function sceneKeyOf(mode){
  if (LOWER_BANNER_MODES.includes(mode)) return 'banner:' + mode;
  if (FULL_SCREEN_MODES.includes(mode))  return 'full:' + mode;
  if (mode === 'target') return 'banner:target';
  return 'default';
}

/* ============================================================
   UPDATE — with flicker-free dedup + entry animations
   ============================================================ */
let LAST = null;
let lastPacketHash = '';
let lastSceneKey = '';
let lastBannerInnerKey = '';
let lastBannerCls = '';
let lastDataScreenKey = '';

function applySceneClass(el, cls){
  if (!el) return;
  const want = 'bannerCard ' + cls;
  if (el.className !== want) el.className = want;
}

/* Entry animation replay — resets base keyframe + toggles `playing`
   so the sweep overlay and staggered children replay. */
function playEntryAnim(el){
  if (!el) return;
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = '';

  el.classList.remove('playing');
  void el.offsetWidth;
  el.classList.add('playing');

  clearTimeout(el.__animTimer);
  el.__animTimer = setTimeout(() => {
    el.classList.remove('playing');
  }, 1500);
}

function updateOverlay(raw){
  const d = normalizeScorerData(raw);
  if (!d) return;

  /* Dedup identical packets */
  const hash = packetHash(d);
  if (hash === lastPacketHash) return;
  lastPacketHash = hash;

  LAST = d;
  window.__lastOverlayData = d;

  updateTournamentInfo(d);
  updateScoreBar(d);

  const o = d.overlay || {};
  const mode = decideDisplayMode(d);
  const scene = sceneKeyOf(mode);

  const lower      = $id('lowerThird');
  const banner     = $id('bannerLower');
  const bannerCard = $id('bannerLowerCard');
  const ds         = $id('dataScreen');
  const dsCard     = $id('dataCard');

  const sceneChanged = (scene !== lastSceneKey);

  /* ---------- Banner scene ---------- */
  if (scene.startsWith('banner:')){
    const content = renderLowerBannerContent(d, mode);
    const innerKey = content.cls + '|' + content.html;

    if (innerKey !== lastBannerInnerKey || sceneChanged){
      lastBannerInnerKey = innerKey;
      lastBannerCls = content.cls;
      applySceneClass(bannerCard, content.cls);
      if (bannerCard.innerHTML !== content.html){
        bannerCard.innerHTML = content.html;
      }
      if (sceneChanged) playEntryAnim(bannerCard);
    }
    if (!banner.classList.contains('show')) banner.classList.add('show');
    if (!lower.classList.contains('hidden')) lower.classList.add('hidden');
    if (ds.classList.contains('show')) ds.classList.remove('show');
  }
  /* ---------- Full-screen scene ---------- */
  else if (scene.startsWith('full:')){
    const html = renderDataScreenHtml(d, mode);
    if (html !== lastDataScreenKey || sceneChanged){
      lastDataScreenKey = html;
      if (dsCard.innerHTML !== html) dsCard.innerHTML = html;
      if (sceneChanged) playEntryAnim(dsCard);
    }
    if (!ds.classList.contains('show')) ds.classList.add('show');
    if (banner.classList.contains('show')) banner.classList.remove('show');
    if (!lower.classList.contains('hidden')) lower.classList.add('hidden');
  }
  /* ---------- Default scene: score bar only ---------- */
  else {
    if (banner.classList.contains('show')){
      banner.classList.remove('show');
      bannerCard.innerHTML = '';
      lastBannerInnerKey = '';
      lastBannerCls = '';
    }
    if (ds.classList.contains('show')){
      ds.classList.remove('show');
      lastDataScreenKey = '';
    }
    if (lower.classList.contains('hidden')) lower.classList.remove('hidden');
  }

  lastSceneKey = scene;

  /* ---------- Event animations ---------- */
  const bcast = d.broadcast || {};
  if (bcast.active){
    const evKey = bcast.id ?? bcast.eventId ?? bcast.ts ?? d.activeEvent ?? '';
    if (evKey !== lastActiveEventKey){
      lastActiveEventKey = evKey;
      showEvent(d.activeEvent || bcast.type, {force:true});
    }
  } else {
    if (lastActiveEventKey){
      lastActiveEventKey = '';
    } else {
      const auto = detectBallEvent(d);
      if (auto) showEvent(auto);
    }
  }
}

/* ============================================================
   MESSAGE WIRING
   ============================================================ */
function receiveScorerData(d){
  if (d && d.type === 'LIVE_SCORE') d = d.data || d;
  updateOverlay(d);
}
if (overlayChannel) overlayChannel.onmessage = e => {
  const d = e.data || {};
  receiveScorerData(d.type === 'LIVE_SCORE' ? (d.data || d) : d);
};
if (scorerChannel) scorerChannel.onmessage = e => {
  const d = e.data || {};
  receiveScorerData(d.type === 'LIVE_SCORE' ? (d.data || d) : d);
};
window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'BRKLIVE19_UPDATE' || d.type === 'LIVE_SCORE') receiveScorerData(d.data || d);
  if (d.type === 'BRKLIVE19_EVENT') showEvent(d.event, {force:true});
});
window.addEventListener('storage', e => {
  if (['brklive19_liveScore','brklive19_last_liveScore'].includes(e.key)){
    try { receiveScorerData(JSON.parse(e.newValue || '{}')); } catch(x) {}
  }
});
window.addEventListener('BRKLIVE19_UPDATE', e => receiveScorerData(e.detail || {}));
window.addEventListener('BRKLIVE19_BUTTON', e => {
  const p = e.detail || {};
  if (p.type === 'BRKLIVE19_HIDE' || p.action === 'hide' || p.mode === 'hide'){
    const ds = $id('dataScreen'); if (ds) ds.classList.remove('show');
    const banner = $id('bannerLower'); if (banner){ banner.classList.remove('show'); const c = $id('bannerLowerCard'); if (c) c.innerHTML=''; }
    const lower = $id('lowerThird'); if (lower) lower.classList.remove('hidden');
    lastSceneKey = 'default';
    lastBannerInnerKey = '';
    lastDataScreenKey = '';
  }
});

/* ---------- localStorage polling (skips identical raw strings) ---------- */
let lastStorageRaw = '';
function readStorage(){
  try {
    const keys = ['brklive19_liveScore','brklive19_last_liveScore'];
    for (const k of keys){
      const r = localStorage.getItem(k);
      if (r && r !== lastStorageRaw){
        lastStorageRaw = r;
        receiveScorerData(JSON.parse(r));
        return;
      }
    }
  } catch(e) {}
}
readStorage();
setInterval(readStorage, 500);

/* ---------- URL params ---------- */
const q = new URLSearchParams(location.search);
if (q.get('event')) showEvent(q.get('event'), {force:true});

/* ---------- Public API ---------- */
window.BRKLIVE19 = {
  update: receiveScorerData,
  event: name => showEvent(name, {force:true}),
  show: mode => { if (LAST) { LAST.mode = mode; lastPacketHash = ''; updateOverlay(LAST); } }
};

console.log('BRKLIVE19 Overlay ready — animated + flicker-free.');
</script>
