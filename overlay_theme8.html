<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRKLIVE19 - Live Cricket Overlay</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body, body * { text-transform: uppercase !important; }
body {
    background-color: transparent;
    height: 100vh;
    display: flex; justify-content: center; align-items: flex-end;
    overflow: hidden; padding-bottom: 30px;
}
#diag {
    position: fixed; top: 10px; left: 10px;
    background: rgba(0,0,0,0.75); color: #20e070;
    font-family: monospace; font-size: 11px;
    padding: 6px 10px; border-radius: 6px;
    z-index: 99999; max-width: 400px; line-height: 1.4; display: none;
}
#diag.show { display: block; }
#diag .err { color: #ff3158; }
#diag .warn { color: #ffbf22; }

.theme-gradient {
    background: linear-gradient(90deg, #f37021 0%, #d85a10 25%, #8a3a0a 55%, #2b1a1a 100%);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    border-radius: 10px; position: relative; overflow: hidden;
}
.theme-gradient::before {
    content: '';
    position: absolute; top: 0; left: 5%;
    width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transform: skewX(-30deg);
    pointer-events: none; z-index: 1;
}

@keyframes diagonalWipe {
    0% { clip-path: polygon(0 100%, 0 100%, 0 100%, 0 100%); opacity: 0; }
    40% { opacity: 1; }
    100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); opacity: 1; }
}
@keyframes glowPulse {
    0% { box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.2), 0 0 0 0 rgba(243,112,33,0.6); }
    50% { box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.2), 0 0 30px 8px rgba(243,112,33,0.4); }
    100% { box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.2), 0 0 0 0 rgba(243,112,33,0); }
}
@keyframes fadeInUp {
    0% { opacity: 0; transform: translateY(15px); }
    100% { opacity: 1; transform: translateY(0); }
}

.lower-third-wrapper {
    position: relative;
    width: 98%; min-width: 800px; max-width: 1600px;
    min-height: 100px;
}

.bowling-team-badge {
    position: absolute; top: -30px; right: 8px;
    padding: 6px 16px; border-radius: 8px 8px 0 0;
    background: linear-gradient(135deg, #d85a10 0%, #8a3a0a 60%, #2b1a1a 100%);
    color: #fff; font-size: 12px; font-weight: 900;
    letter-spacing: 2px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-bottom: none;
    box-shadow: 0 -6px 18px rgba(0,0,0,0.5);
    z-index: 20; white-space: nowrap;
    transition: opacity 0.3s ease;
}
.bowling-team-badge .btb-label {
    color: #ffd8b0; font-size: 10px;
    letter-spacing: 2px; margin-right: 4px;
}
.bowling-team-badge.hidden { opacity: 0; }

.event-animation {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    border-radius: 10px; overflow: hidden;
    z-index: 9999;
    opacity: 0; visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
    pointer-events: none;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.88);
}
.event-animation.show { opacity: 1; visibility: visible; pointer-events: auto; }
.marquee { display: flex; white-space: nowrap; will-change: transform; }
.marquee span {
    font-size: clamp(80px, 12vw, 180px);
    font-weight: 900; letter-spacing: 8px; margin-right: 80px;
    color: #fff;
    text-shadow: 0 0 40px currentColor, 0 8px 20px rgba(0,0,0,0.9);
    -webkit-text-stroke: 5px #000; line-height: 1.1;
}
.event-animation.show .marquee { animation: scrollMarquee 20s linear infinite; }
@keyframes scrollMarquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

.cricket-overlay {
    width: 100%; min-height: 100px;
    display: grid;
    grid-template-columns: 1.2fr 1.2fr 0.6fr 2fr;
    grid-template-rows: 1fr 1fr;
    color: white;
    transition: opacity 0.3s ease, transform 0.3s ease;
    animation: diagonalWipe 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards,
               glowPulse 2s ease-out 0.8s forwards;
    clip-path: polygon(0 100%, 0 100%, 0 100%, 0 100%);
    opacity: 0;
}
.cricket-overlay.ready {
    animation: none;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    opacity: 1;
}
.cricket-overlay.hidden { opacity: 0 !important; transform: translateY(20px); pointer-events: none; }

.c1-r1 { grid-column: 1; grid-row: 1; border-right: 1px solid rgba(255,255,255,0.2); border-bottom: 1px solid rgba(255,255,255,0.2); }
.c1-r2 { grid-column: 1; grid-row: 2; border-right: 1px solid rgba(255,255,255,0.2); }
.c2-r1 { grid-column: 2; grid-row: 1; border-right: 1px solid rgba(255,255,255,0.2); border-bottom: 1px solid rgba(255,255,255,0.2); }
.c2-r2 { grid-column: 2; grid-row: 2; border-right: 1px solid rgba(255,255,255,0.2); }
.c3-r1r2 { grid-column: 3; grid-row: 1 / span 2; border-right: 1px solid rgba(255,255,255,0.2); justify-content: center; }
.c4-r1 { grid-column: 4; grid-row: 1; border-bottom: 1px solid rgba(255,255,255,0.2); }
.c4-r2 { grid-column: 4; grid-row: 2; }

.grid-item {
    display: flex; align-items: center;
    padding: 6px 12px; z-index: 2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    gap: 6px;
}
.cricket-overlay .grid-item { opacity: 0; animation: fadeInUp 0.6s ease-out forwards; animation-delay: 0.9s; }
.cricket-overlay.ready .grid-item { animation: none; opacity: 1; }

.c1-r1 .team-name { font-size: 16px; font-weight: 900; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
.c1-r1 .team-score { font-size: 18px; font-weight: 900; color: #ffd8b0; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
.c1-r2 { justify-content: space-between; }
.c1-r2 .overs-text { font-size: 14px; font-weight: 700; color: #ddd; }
.c1-r2 .crr-text { font-size: 13px; font-weight: 800; color: #20e070; background: rgba(0,0,0,0.3); padding: 2px 5px; border-radius: 4px; }

.c2-r1, .c2-r2 { justify-content: space-between; }
.player-name { font-size: 14px; font-weight: 800; max-width: 100px; overflow: hidden; text-overflow: ellipsis; }
.player-name.active::after { content: '*'; color: #ffd700; margin-left: 2px; font-size: 16px; line-height: 0; }
.player-stats { font-family: 'Courier New', Courier, monospace; font-size: 14px; font-weight: 700; color: #fff; background: rgba(0,0,0,0.3); padding: 2px 5px; border-radius: 4px; text-align: center; }

.innings-badge {
    font-size: 12px; font-weight: 900;
    background: rgba(255,255,255,0.2);
    padding: 5px 10px; border-radius: 4px;
    color: #ffd8b0; letter-spacing: 1px;
    border: 1px solid rgba(255,255,255,0.3); text-align: center;
}

.c4-r1 { justify-content: space-between; }
.bowler-name { font-size: 14px; font-weight: 800; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
.bowler-stats { font-family: 'Courier New', Courier, monospace; font-size: 14px; font-weight: 700; color: #fff; background: rgba(0,0,0,0.3); padding: 2px 5px; border-radius: 4px; }
.c4-r2 { justify-content: flex-start; }
.balls-container { display: flex; gap: 4px; }
.ball {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 800;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
}
.ball.runs { background: rgba(255,255,255,0.2); }
.ball.four { background: #20e070; color: #000; border-color: #20e070; box-shadow: 0 0 6px rgba(32,224,112,0.5); }
.ball.six { background: #00d9ff; color: #000; border-color: #00d9ff; box-shadow: 0 0 6px rgba(0,217,255,0.5); }
.ball.wicket { background: #ff3158; color: #fff; border-color: #ff3158; box-shadow: 0 0 6px rgba(255,49,88,0.5); }
.ball.extra { background: #ffbf22; color: #000; border-color: #ffbf22; font-size: 8px; }
.ball.empty { opacity: 0.3; }

.status-dot {
    position: absolute; top: 10px; left: 15px;
    width: 10px; height: 10px; border-radius: 50%;
    background: #ff3158; z-index: 10;
    box-shadow: 0 0 5px rgba(0,0,0,0.5);
}
.status-dot.online { background: #20e070; box-shadow: 0 0 8px rgba(32,224,112,0.8); }
.status-dot.online::after {
    content: ''; position: absolute; inset: -3px; border-radius: 50%;
    border: 2px solid rgba(32, 224, 112, 0.5);
    animation: pulseRing 1.5s ease-out infinite;
}
@keyframes pulseRing { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }

.display-bar {
    position: absolute; top: 0; left: 0;
    width: 100%; display: none;
    padding: 14px 30px; color: white; z-index: 5;
    animation: diagonalWipe 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards,
               glowPulse 2s ease-out 0.8s forwards;
    min-height: 100px;
}
.display-bar.show { display: flex; align-items: center; gap: 24px; }

.dbar-icon { font-size: clamp(36px, 4vw, 56px); line-height: 1; flex-shrink: 0; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }
.dbar-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.dbar-title { font-size: clamp(10px, 1.1vw, 14px); font-weight: 800; color: #ffd8b0; letter-spacing: 3px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
.dbar-main {
    font-size: clamp(20px, 2.6vw, 38px);
    font-weight: 900; color: #fff; letter-spacing: 2px;
    text-shadow: 0 3px 6px rgba(0,0,0,0.6);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1;
}
.dbar-sub { font-size: clamp(12px, 1.3vw, 18px); font-weight: 700; color: rgba(255,255,255,0.85); letter-spacing: 1px; }
.dbar-stats { display: flex; gap: clamp(12px, 1.5vw, 24px); flex-shrink: 0; padding-left: 24px; border-left: 2px solid rgba(255,255,255,0.25); }
.dstat { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: clamp(50px, 5vw, 80px); }
.dstat .dl { font-size: clamp(9px, 0.9vw, 12px); font-weight: 800; color: #ffd8b0; letter-spacing: 1.5px; }
.dstat .dv { font-family: 'Courier New', Courier, monospace; font-size: clamp(16px, 1.9vw, 28px); font-weight: 900; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); line-height: 1.1; }
.dstat.highlight .dv { color: #20e070; }

/* ============================================
   MIDDLE PANEL
   ============================================ */
.middle-panel {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 84vw; height: 88vh;
    max-width: 1900px; max-height: 1050px;
    color: white; z-index: 9000;
    display: none; padding: 24px 34px;
    overflow: hidden;
    animation: diagonalWipe 1.1s cubic-bezier(0.25, 1, 0.5, 1) forwards,
               glowPulse 2.2s ease-out 0.6s forwards;
    clip-path: polygon(0 100%, 0 100%, 0 100%, 0 100%);
}
.middle-panel.show {
    display: flex; flex-direction: column;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
}

.mp-header {
    display: flex; align-items: center; gap: 18px;
    padding-bottom: 12px; margin-bottom: 14px;
    border-bottom: 3px solid rgba(255,216,176,0.35);
    flex-shrink: 0;
}
.mp-icon { font-size: clamp(30px, 3.4vw, 50px); line-height: 1; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }
.mp-titles { flex: 1; min-width: 0; }
.mp-title { font-size: clamp(20px, 2.2vw, 34px); font-weight: 900; color: #ffd8b0; letter-spacing: 3px; text-shadow: 0 3px 6px rgba(0,0,0,0.5); line-height: 1.1; }
.mp-subtitle { font-size: clamp(13px, 1.4vw, 20px); font-weight: 700; color: rgba(255,255,255,0.9); letter-spacing: 2px; margin-top: 4px; }
.mp-body {
    flex: 1; min-height: 0; position: relative;
    display: flex; flex-direction: column;
    justify-content: flex-start;
    transition: transform 0.2s ease;
}

/* ============================================
   BATTING TABLE — with DISMISSAL column
   ============================================ */
.mp-table {
    width: 100%; border-collapse: collapse;
    font-size: clamp(11px, 1.2vw, 18px);
    table-layout: fixed;
}
.mp-table th {
    text-align: left; padding: 8px 8px;
    background: rgba(0,0,0,0.45);
    color: #ffd8b0; font-weight: 900;
    letter-spacing: 1.5px;
    font-size: clamp(10px, 0.95vw, 14px);
    border-bottom: 2px solid rgba(255,216,176,0.4);
}
.mp-table th:not(:first-child) { text-align: center; }
.mp-table td {
    padding: 6px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    font-weight: 700; color: #fff;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mp-table td:not(:first-child) {
    text-align: center;
    font-family: 'Courier New', monospace;
}
.mp-table tbody tr:nth-child(odd) { background: rgba(255,255,255,0.03); }
.mp-table .is-batting { color: #ffd700; font-weight: 900; }
.mp-table .is-batting::after { content: ' *'; }
.mp-table .dismissal-cell {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    font-size: clamp(10px, 0.95vw, 14px);
    font-weight: 700;
    color: rgba(255,255,255,0.82);
    letter-spacing: 0.5px;
    text-align: left;
}
.mp-table .dismissal-cell.not-out {
    color: #20e070;
    font-weight: 900;
}

/* Specific column widths for batting table (7 cols) */
.mp-table.batting-table th:nth-child(1) { width: 22%; }
.mp-table.batting-table th:nth-child(2) { width: 30%; }
.mp-table.batting-table th:nth-child(3) { width: 8%; text-align: center; }
.mp-table.batting-table th:nth-child(4) { width: 8%; text-align: center; }
.mp-table.batting-table th:nth-child(5) { width: 8%; text-align: center; }
.mp-table.batting-table th:nth-child(6) { width: 8%; text-align: center; }
.mp-table.batting-table th:nth-child(7) { width: 16%; text-align: center; }
.mp-table.batting-table td:nth-child(2) {
    text-align: left;
    font-family: 'Segoe UI', Tahoma, sans-serif;
}

/* Bowling table (5 cols) */
.mp-table.bowling-table th:nth-child(1) { width: 32%; }
.mp-table.bowling-table th:nth-child(2) { width: 14%; text-align: center; }
.mp-table.bowling-table th:nth-child(3) { width: 14%; text-align: center; }
.mp-table.bowling-table th:nth-child(4) { width: 14%; text-align: center; }
.mp-table.bowling-table th:nth-child(5) { width: 26%; text-align: center; }

/* ============================================
   XI GRID
   ============================================ */
.mp-xi-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 22px; height: 100%; min-height: 0;
}
.mp-xi-team {
    background: rgba(0,0,0,0.32);
    border-radius: 14px; padding: 14px 20px;
    border-left: 5px solid #ffd8b0;
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0; overflow: hidden;
}
.mp-xi-team h3 {
    font-size: clamp(14px, 1.7vw, 24px);
    color: #ffd8b0; letter-spacing: 3px;
    margin-bottom: 10px; padding-bottom: 8px;
    border-bottom: 2px solid rgba(255,216,176,0.3);
    font-weight: 900; flex-shrink: 0;
}
.mp-xi-list {
    list-style: none; display: grid;
    grid-template-columns: 1fr; gap: 4px;
    flex: 1; min-height: 0; align-content: stretch;
}
.mp-xi-list li {
    display: flex; align-items: center; gap: 10px;
    font-size: clamp(11px, 1.2vw, 17px);
    font-weight: 700; padding: 4px 10px;
    background: rgba(0,0,0,0.25);
    border-radius: 6px;
    border-left: 3px solid rgba(255,216,176,0.4);
    min-height: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
}
.mp-xi-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px;
    background: rgba(255,216,176,0.2);
    border-radius: 50%; font-size: 12px;
    font-weight: 900; color: #ffd8b0; flex-shrink: 0;
}

/* ============================================
   SUMMARY — with top batter/bowler
   ============================================ */
.mp-summary-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 20px; margin-bottom: 18px;
}
.mp-summary-card {
    background: rgba(0,0,0,0.32);
    border-radius: 14px; padding: 16px 22px;
    border-left: 5px solid #ffd8b0;
}
.mp-summary-card h3 {
    font-size: clamp(13px, 1.4vw, 19px);
    color: #ffd8b0; letter-spacing: 2px;
    margin-bottom: 10px; padding-bottom: 8px;
    border-bottom: 2px solid rgba(255,216,176,0.3);
    font-weight: 900;
}
.mp-summary-score {
    font-size: clamp(26px, 3.4vw, 52px);
    font-weight: 900; color: #fff;
    text-shadow: 0 4px 10px rgba(0,0,0,0.6);
    letter-spacing: 2px; line-height: 1.1;
}
.mp-summary-meta {
    font-size: clamp(12px, 1.2vw, 16px);
    font-weight: 700; color: rgba(255,255,255,0.8);
    margin-top: 6px; letter-spacing: 1px;
}
.mp-perf-section {
    margin-top: 14px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}
.mp-perf-block {
    background: rgba(0,0,0,0.28);
    border-radius: 10px;
    padding: 10px 14px;
    border-top: 3px solid rgba(255,216,176,0.5);
}
.mp-perf-label {
    font-size: clamp(9px, 0.85vw, 12px);
    font-weight: 800; color: #ffd8b0;
    letter-spacing: 2px; margin-bottom: 6px;
}
.mp-perf-name {
    font-size: clamp(13px, 1.35vw, 19px);
    font-weight: 900; color: #fff;
    letter-spacing: 1px; margin-bottom: 3px;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
}
.mp-perf-stat {
    font-family: 'Courier New', monospace;
    font-size: clamp(12px, 1.15vw, 16px);
    font-weight: 700; color: #ffd8b0;
}
.mp-result-banner {
    background: linear-gradient(90deg, rgba(32,224,112,0.18), rgba(32,224,112,0.05));
    border-left: 5px solid #20e070;
    padding: 14px 22px; border-radius: 14px;
    font-size: clamp(18px, 2vw, 30px);
    font-weight: 900; color: #20e070;
    letter-spacing: 3px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
}

@media (max-width: 900px) {
    .player-name, .bowler-name { max-width: 70px; font-size: 12px; }
    .player-stats, .bowler-stats { font-size: 12px; }
    .team-name { font-size: 14px; }
    .team-score { font-size: 16px; }
    .ball { width: 18px; height: 18px; font-size: 8px; }
    .grid-item { padding: 4px 8px; gap: 4px; }
    .marquee span { -webkit-text-stroke: 3px #000; }
    .display-bar { padding: 10px 16px; gap: 12px; }
    .dbar-stats { padding-left: 12px; gap: 10px; }
    .middle-panel { width: 94vw; height: 92vh; padding: 16px 20px; }
    .mp-xi-grid { grid-template-columns: 1fr; gap: 12px; }
    .mp-summary-grid { grid-template-columns: 1fr; }
    .mp-perf-section { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="diag"></div>
<div class="middle-panel theme-gradient" id="middlePanel"></div>

<div class="lower-third-wrapper">
    
    <div class="bowling-team-badge" id="bowlingBadge">
        <span>🎯</span><span class="btb-label">BOWLING:</span><span id="bowlingTeamName">TEAM B</span>
    </div>

    <div class="cricket-overlay theme-gradient" id="overlayBar">
        <div class="status-dot" id="statusDot"></div>
        
        <div class="grid-item c1-r1">
            <span class="team-name" id="batting-team">TEAM A</span>
            <span class="team-score" id="team-score-main">0/0</span>
        </div>
        <div class="grid-item c1-r2">
            <span class="overs-text" id="team-overs">(0.0 OV)</span>
            <span class="crr-text" id="team-crr">CRR: 0.00</span>
        </div>
        <div class="grid-item c2-r1">
            <span class="player-name active" id="striker-name">STRIKER</span>
            <span class="player-stats" id="striker-stats">0 (0)</span>
        </div>
        <div class="grid-item c2-r2">
            <span class="player-name" id="non-striker-name">NON-STRIKER</span>
            <span class="player-stats" id="non-striker-stats">0 (0)</span>
        </div>
        <div class="grid-item c3-r1r2">
            <span class="innings-badge" id="innings-label">1ST INN</span>
        </div>
        <div class="grid-item c4-r1">
            <span class="bowler-name" id="bowler-name">BOWLER</span>
            <span class="bowler-stats" id="bowler-stats">0-0-0-0</span>
        </div>
        <div class="grid-item c4-r2">
            <div class="balls-container" id="current-over">
                <div class="ball empty">-</div>
                <div class="ball empty">-</div>
                <div class="ball empty">-</div>
            </div>
        </div>
    </div>

    <div class="display-bar theme-gradient" id="displayBar"></div>

    <div class="event-animation" id="eventOverlay">
        <div class="marquee" id="marqueeText"></div>
    </div>

</div>

<script>
(function() {
    // ============ DIAGNOSTIC ============
    const diagEl = document.getElementById('diag');
    const diagLines = [];
    function diag(msg, cls) {
        const time = new Date().toLocaleTimeString();
        const clsAttr = cls ? ` class="${cls}"` : '';
        diagLines.unshift(`<div${clsAttr}>[${time}] ${msg}</div>`);
        if (diagLines.length > 8) diagLines.pop();
        diagEl.innerHTML = diagLines.join('');
    }
    document.addEventListener('keydown', (e) => {
        if (e.key === 'd' || e.key === 'D') diagEl.classList.toggle('show');
    });

    // ============ DOM ============
    const el = {
        statusDot: document.getElementById('statusDot'),
        eventOverlay: document.getElementById('eventOverlay'),
        marqueeText: document.getElementById('marqueeText'),
        overlayBar: document.getElementById('overlayBar'),
        displayBar: document.getElementById('displayBar'),
        middlePanel: document.getElementById('middlePanel'),
        bowlingBadge: document.getElementById('bowlingBadge'),
        bowlingTeamName: document.getElementById('bowlingTeamName'),
        battingTeam: document.getElementById('batting-team'),
        teamScoreMain: document.getElementById('team-score-main'),
        teamOvers: document.getElementById('team-overs'),
        teamCrr: document.getElementById('team-crr'),
        strikerName: document.getElementById('striker-name'),
        strikerStats: document.getElementById('striker-stats'),
        nonStrikerName: document.getElementById('non-striker-name'),
        nonStrikerStats: document.getElementById('non-striker-stats'),
        inningsLabel: document.getElementById('innings-label'),
        bowlerName: document.getElementById('bowler-name'),
        bowlerStats: document.getElementById('bowler-stats'),
        currentOver: document.getElementById('current-over')
    };

    setTimeout(() => el.overlayBar.classList.add('ready'), 2200);

    // ============ HELPERS ============
    function ovFmt(balls) {
        balls = Number(balls) || 0;
        return Math.floor(balls / 6) + '.' + (balls % 6);
    }
    function crr(runs, balls) {
        if (!balls || balls === 0) return '0.00';
        return ((runs / balls) * 6).toFixed(2);
    }
    function esc(v) {
        return String(v ?? '').replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }
    function teamOf(data, side) {
        if (side === 'A') return data.teamA || 'TEAM A';
        if (side === 'B') return data.teamB || 'TEAM B';
        if (data.battingTeam === 'A') return data.teamA || 'TEAM A';
        if (data.battingTeam === 'B') return data.teamB || 'TEAM B';
        return data.teamA || 'TEAM A';
    }
    function bowlingTeamOf(data) {
        const side = data.bowlingTeam || (data.battingTeam === 'A' ? 'B' : 'A');
        return teamOf(data, side);
    }
    function batterStats(data, name) {
        if (!name || !data.batters || !data.batters[name]) return { runs: 0, balls: 0, fours: 0, sixes: 0 };
        return data.batters[name];
    }
    function bowlerStats(data, name) {
        if (!name || !data.bowlers || !data.bowlers[name]) return { balls: 0, runs: 0, wickets: 0 };
        return data.bowlers[name];
    }

    // ============ DISMISSAL TEXT ============
    function getDismissalText(data, name, b, isCurrentlyBatting) {
        // If batter is out
        if (b.out === true) {
            const type = b.dismissal || 'OUT';
            // Add bowler/catcher info if available
            let extra = '';
            if (type.toUpperCase() === 'CAUGHT' || type.toUpperCase() === 'CAUGHT BEHIND') {
                // Try to find the bowler who took the catch info from fallWickets
                const fw = (data.fallWickets || []).find(w => w.player === name);
                if (fw && fw.bowler) extra = ' B ' + fw.bowler;
                else if (data.bowler) extra = ' B ' + data.bowler;
            } else if (type.toUpperCase() === 'BOWLED' || type.toUpperCase() === 'LBW' || type.toUpperCase() === 'STUMPED') {
                const fw = (data.fallWickets || []).find(w => w.player === name);
                if (fw && fw.bowler) extra = ' B ' + fw.bowler;
                else if (data.bowler) extra = ' B ' + data.bowler;
            } else if (type.toUpperCase() === 'RUN OUT') {
                const fw = (data.fallWickets || []).find(w => w.player === name);
                if (fw && fw.bowler) extra = ' (' + fw.bowler + ')';
            }
            return { text: type.toUpperCase() + extra, notOut: false };
        }
        
        // If currently batting → NOT OUT
        if (isCurrentlyBatting) {
            return { text: 'NOT OUT', notOut: true };
        }
        
        // If batted but not currently on crease and not out (retired/innings ended)
        if ((b.balls > 0 || b.runs > 0)) {
            return { text: 'NOT OUT', notOut: true };
        }
        
        // Not yet to bat
        return { text: '', notOut: false };
    }

    // ============ TOP PERFORMERS ============
    function getTopBatter(batters) {
        if (!batters) return null;
        let top = null;
        Object.keys(batters).forEach(name => {
            const b = batters[name];
            if ((b.balls || 0) > 0 || (b.runs || 0) > 0) {
                if (!top || (b.runs || 0) > (top.runs || 0)) {
                    top = { name, runs: b.runs || 0, balls: b.balls || 0, fours: b.fours || 0, sixes: b.sixes || 0 };
                }
            }
        });
        return top;
    }
    function getTopBowler(bowlers) {
        if (!bowlers) return null;
        let top = null;
        Object.keys(bowlers).forEach(name => {
            const b = bowlers[name];
            if ((b.balls || 0) > 0) {
                const wickets = b.wickets || 0;
                const runs = b.runs || 0;
                if (!top || wickets > top.wickets || (wickets === top.wickets && runs < top.runs)) {
                    top = { name, balls: b.balls || 0, runs, wickets };
                }
            }
        });
        return top;
    }

    // ============================================
    // LOWER THIRD BAR RENDER FUNCTIONS
    // ============================================
    function dbarShell(icon, title, mainContent, statsHTML) {
        return `
            <div class="dbar-icon">${icon}</div>
            <div class="dbar-body">
                <div class="dbar-title">${esc(title)}</div>
                ${mainContent}
            </div>
            ${statsHTML ? `<div class="dbar-stats">${statsHTML}</div>` : ''}
        `;
    }
    function stat(label, value, highlight) {
        return `<div class="dstat${highlight ? ' highlight' : ''}"><span class="dl">${esc(label)}</span><span class="dv">${esc(value)}</span></div>`;
    }

    function renderCustomLower(data) {
        return dbarShell('✨', 'CUSTOM MESSAGE', `<div class="dbar-main">${esc(data.customLower.text)}</div>`, '');
    }
    function renderFOW(data) {
        const fow = data.fow || (data.fallWickets && data.fallWickets[data.fallWickets.length - 1]) || {};
        if (!fow || !fow.player) return dbarShell('💥', 'FALL OF WICKET', `<div class="dbar-main">NO WICKET RECORDED</div>`, '');
        const stats = stat('SCORE', `${fow.score || 0}/${fow.wicket || 0}`) + stat('OVERS', fow.overs || '0.0') + stat('BATTER', `${fow.runs || 0}(${fow.balls || 0})`) + stat('SR', fow.sr || '0.00');
        return dbarShell('💥', `FOW — ${fow.type || 'OUT'}`, `<div class="dbar-main">${esc(fow.player)}</div><div class="dbar-sub">BOWLER: ${esc(fow.bowler || '—')}</div>`, stats);
    }
    function renderBowlerCard(data) {
        const b = bowlerStats(data, data.bowler);
        const eco = b.balls ? (b.runs / (b.balls / 6)).toFixed(2) : '0.00';
        return dbarShell('🎯', 'BOWLER', `<div class="dbar-main">${esc(data.bowler || 'BOWLER')}</div>`,
            stat('OVERS', ovFmt(b.balls)) + stat('RUNS', b.runs) + stat('WICKETS', b.wickets, b.wickets > 0) + stat('ECON', eco));
    }
    function renderPlayerCard(data, pl) {
        const name = pl.player || '';
        const isB1 = String(pl.slot || '').toLowerCase() === 'b1';
        const b = batterStats(data, name);
        const sr = b.balls ? ((b.runs / b.balls) * 100).toFixed(2) : '0.00';
        return dbarShell('🏏', isB1 ? 'STRIKER' : 'NON-STRIKER', `<div class="dbar-main">${esc(name || 'PLAYER')}</div>`,
            stat('RUNS', b.runs) + stat('BALLS', b.balls) + stat('4S', b.fours) + stat('6S', b.sixes) + stat('SR', sr));
    }
    function renderPartnership(data) {
        const runs = data.partnershipRuns || 0;
        const balls = data.partnershipBalls || 0;
        const rr = balls ? ((runs / balls) * 6).toFixed(2) : '0.00';
        return dbarShell('🤝', 'PARTNERSHIP', `<div class="dbar-main">${esc(data.striker || '—')} & ${esc(data.nonStriker || '—')}</div>`,
            stat('RUNS', runs) + stat('BALLS', balls) + stat('RR', rr));
    }
    function renderTarget(data) {
        const target = Number(data.target) || 0;
        const runs = Number(data.runs) || 0;
        const balls = Math.max((Number(data.maxOvers) || 0) * 6 - (Number(data.legalBalls) || 0), 0);
        const need = Math.max(target - runs, 0);
        const rrr = balls ? ((need / balls) * 6).toFixed(2) : '0.00';
        return dbarShell('🎯', 'TARGET', `<div class="dbar-main">${esc(teamOf(data, data.battingTeam))} TO CHASE</div>`,
            stat('TARGET', target) + stat('CURRENT', `${runs}/${data.wickets || 0}`) + stat('NEED', need, need > 0) + stat('BALLS', balls) + stat('RRR', rrr));
    }
    function renderTournament(data) {
        return dbarShell('🏆', 'TOURNAMENT', `<div class="dbar-main">${esc(data.tournament || 'TOURNAMENT NAME')}</div>`,
            data.venue ? `<div class="dbar-sub" style="padding-left:24px;border-left:2px solid rgba(255,255,255,0.25);">📍 ${esc(data.venue)}</div>` : '');
    }
    function renderVenue(data) {
        return dbarShell('📍', 'VENUE', `<div class="dbar-main">${esc(data.venue || 'VENUE NAME')}</div>`,
            data.tournament ? `<div class="dbar-sub" style="padding-left:24px;border-left:2px solid rgba(255,255,255,0.25);">🏆 ${esc(data.tournament)}</div>` : '');
    }
    function renderMatch(data) {
        const tA = data.teamA || 'TEAM A', tB = data.teamB || 'TEAM B';
        return dbarShell('⚔️', 'MATCH', `<div class="dbar-main">${esc(tA)} VS ${esc(tB)}</div>`,
            stat('FORMAT', String(data.matchType || 'T20').toUpperCase()) + stat('OVERS', data.maxOvers || 20) + stat('MATCH', '#' + (data.matchNo || 1)));
    }
    function renderToss(data) {
        const winner = data.tossWinner === 'A' ? teamOf(data, 'A') : (data.tossWinner === 'B' ? teamOf(data, 'B') : data.tossWinner || 'TOSS WINNER');
        const decision = (data.tossDecision || '').toUpperCase();
        return dbarShell('🪙', 'TOSS', `<div class="dbar-main">${esc(winner)} WON THE TOSS</div><div class="dbar-sub">ELECTED TO ${esc(decision)}</div>`,
            stat('WON BY', winner) + stat('CHOSE', decision));
    }
    function renderResult(data) {
        return dbarShell('🏆', 'RESULT', `<div class="dbar-main">${esc(data.resultText || data.matchResult || 'MATCH COMPLETED')}</div>`, '');
    }

    // ============================================
    // MIDDLE PANEL RENDER FUNCTIONS
    // ============================================
    function midShell(icon, title, subtitle, bodyHTML) {
        return `
            <div class="mp-header">
                <div class="mp-icon">${icon}</div>
                <div class="mp-titles">
                    <div class="mp-title">${esc(title)}</div>
                    ${subtitle ? `<div class="mp-subtitle">${esc(subtitle)}</div>` : ''}
                </div>
            </div>
            <div class="mp-body">${bodyHTML}</div>
        `;
    }

    // --- BATTING MIDDLE (with DISMISSAL column) ---
    function renderBattingMiddle(data, inningsNo) {
        const inn = inningsNo === 2 ? (data.secondInnings || data) : (data.firstInnings || data);
        const batters = inn.batters || data.batters || {};
        const team = inn.team === 'A' ? (data.teamA || 'TEAM A') : (inn.team === 'B' ? (data.teamB || 'TEAM B') : teamOf(data, data.battingTeam));
        const scoreLine = `${inn.runs || 0}/${inn.wickets || 0} (${ovFmt(inn.balls || 0)} OV)`;

        const keys = Object.keys(batters);
        let rows = '';
        if (!keys.length) {
            rows = `<tr><td colspan="7" style="text-align:center;opacity:0.5;padding:30px;">NO BATTING DATA RECORDED YET</td></tr>`;
        } else {
            keys.forEach(name => {
                const b = batters[name];
                const sr = b.balls ? ((b.runs / b.balls) * 100).toFixed(2) : '0.00';
                const isBatting = !b.out && (name === data.striker || name === data.nonStriker);
                const dismissal = getDismissalText(data, name, b, isBatting);
                const dClass = dismissal.notOut ? 'dismissal-cell not-out' : 'dismissal-cell';
                rows += `<tr>
                    <td class="${isBatting ? 'is-batting' : ''}">${esc(name)}</td>
                    <td class="${dClass}">${esc(dismissal.text)}</td>
                    <td>${b.runs || 0}</td>
                    <td>${b.balls || 0}</td>
                    <td>${b.fours || 0}</td>
                    <td>${b.sixes || 0}</td>
                    <td>${sr}</td>
                </tr>`;
            });
        }

        const bodyHTML = `
            <table class="mp-table batting-table">
                <thead><tr>
                    <th>BATSMAN</th>
                    <th>DISMISSAL</th>
                    <th>R</th><th>B</th><th>4S</th><th>6S</th><th>SR</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
        `;
        return midShell('🏏', `${inningsNo === 2 ? '2ND' : '1ST'} INNINGS — BATTING`, `${team} — ${scoreLine}`, bodyHTML);
    }

    // --- BOWLING MIDDLE ---
    function renderBowlingMiddle(data, inningsNo) {
        const inn = inningsNo === 2 ? (data.secondInnings || data) : (data.firstInnings || data);
        const bowlers = inn.bowlers || data.bowlers || {};
        const team = inn.team === 'A' ? (data.teamB || 'TEAM B') : (inn.team === 'B' ? (data.teamA || 'TEAM A') : teamOf(data, data.bowlingTeam));

        const keys = Object.keys(bowlers);
        let rows = '';
        if (!keys.length) {
            rows = `<tr><td colspan="5" style="text-align:center;opacity:0.5;padding:30px;">NO BOWLING DATA RECORDED YET</td></tr>`;
        } else {
            keys.forEach(name => {
                const b = bowlers[name];
                const eco = b.balls ? (b.runs / (b.balls / 6)).toFixed(2) : '0.00';
                rows += `<tr>
                    <td>${esc(name)}</td>
                    <td>${ovFmt(b.balls)}</td>
                    <td>${b.runs || 0}</td>
                    <td>${b.wickets || 0}</td>
                    <td>${eco}</td>
                </tr>`;
            });
        }

        const bodyHTML = `
            <table class="mp-table bowling-table">
                <thead><tr><th>BOWLER</th><th>O</th><th>R</th><th>W</th><th>ECON</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>
        `;
        return midShell('🎯', `${inningsNo === 2 ? '2ND' : '1ST'} INNINGS — BOWLING`, `${team} — BOWLING FIGURES`, bodyHTML);
    }

    // --- MATCH SUMMARY (with top batter / bowler) ---
    function renderSummaryMiddle(data) {
        const first = data.firstInnings || {};
        const second = data.secondInnings || {};
        const firstTeam = first.team === 'A' ? (data.teamA || 'TEAM A') : (first.team === 'B' ? (data.teamB || 'TEAM B') : '');
        const secondTeam = second.team === 'A' ? (data.teamA || 'TEAM A') : (second.team === 'B' ? (data.teamB || 'TEAM B') : '');

        // ---- 1st Innings with top performers ----
        let firstCard = '';
        if (firstTeam) {
            const topBat = getTopBatter(first.batters);
            const topBowl = getTopBowler(first.bowlers);
            
            const batPerf = topBat ? `
                <div class="mp-perf-block">
                    <div class="mp-perf-label">⭐ TOP BATTER</div>
                    <div class="mp-perf-name">${esc(topBat.name)}</div>
                    <div class="mp-perf-stat">${topBat.runs} RUNS (${topBat.balls} B) • ${topBat.fours}×4 • ${topBat.sixes}×6</div>
                </div>
            ` : '';
            
            const bowlPerf = topBowl ? `
                <div class="mp-perf-block">
                    <div class="mp-perf-label">⭐ TOP BOWLER</div>
                    <div class="mp-perf-name">${esc(topBowl.name)}</div>
                    <div class="mp-perf-stat">${topBowl.wickets} WICKETS • ${topBowl.runs} RUNS • ${ovFmt(topBowl.balls)} OV</div>
                </div>
            ` : '';

            firstCard = `
                <div class="mp-summary-card">
                    <h3>1ST INNINGS — ${esc(firstTeam)}</h3>
                    <div class="mp-summary-score">${first.runs || 0}/${first.wickets || 0}</div>
                    <div class="mp-summary-meta">${ovFmt(first.balls || 0)} OVERS • ${first.extras || 0} EXTRAS</div>
                    <div class="mp-perf-section">
                        ${batPerf}
                        ${bowlPerf}
                    </div>
                </div>
            `;
        } else {
            firstCard = `<div class="mp-summary-card"><h3>1ST INNINGS</h3><div class="mp-summary-meta">NOT STARTED</div></div>`;
        }

        // ---- 2nd Innings with top performers ----
        let secondCard = '';
        if (secondTeam) {
            const topBat2 = getTopBatter(second.batters);
            const topBowl2 = getTopBowler(second.bowlers);
            
            const batPerf2 = topBat2 ? `
                <div class="mp-perf-block">
                    <div class="mp-perf-label">⭐ TOP BATTER</div>
                    <div class="mp-perf-name">${esc(topBat2.name)}</div>
                    <div class="mp-perf-stat">${topBat2.runs} RUNS (${topBat2.balls} B) • ${topBat2.fours}×4 • ${topBat2.sixes}×6</div>
                </div>
            ` : '';
            
            const bowlPerf2 = topBowl2 ? `
                <div class="mp-perf-block">
                    <div class="mp-perf-label">⭐ TOP BOWLER</div>
                    <div class="mp-perf-name">${esc(topBowl2.name)}</div>
                    <div class="mp-perf-stat">${topBowl2.wickets} WICKETS • ${topBowl2.runs} RUNS • ${ovFmt(topBowl2.balls)} OV</div>
                </div>
            ` : '';

            secondCard = `
                <div class="mp-summary-card">
                    <h3>2ND INNINGS — ${esc(secondTeam)}</h3>
                    <div class="mp-summary-score">${second.runs || 0}/${second.wickets || 0}</div>
                    <div class="mp-summary-meta">${ovFmt(second.balls || 0)} OVERS • ${second.extras || 0} EXTRAS</div>
                    <div class="mp-perf-section">
                        ${batPerf2}
                        ${bowlPerf2}
                    </div>
                </div>
            `;
        } else {
            secondCard = `<div class="mp-summary-card"><h3>2ND INNINGS</h3><div class="mp-summary-meta">NOT STARTED</div></div>`;
        }

        const resultBanner = (data.resultText || data.matchResult) 
            ? `<div class="mp-result-banner">🏆 ${esc(data.resultText || data.matchResult)}</div>` 
            : '';

        const bodyHTML = `
            <div class="mp-summary-grid">
                ${firstCard}
                ${secondCard}
            </div>
            ${resultBanner}
        `;
        return midShell('📊', 'MATCH SUMMARY', `${data.matchName || `${data.teamA || ''} VS ${data.teamB || ''}`}`, bodyHTML);
    }

    // --- PLAYING XI ---
    function renderPlayingXIMiddle(data) {
        const xiA = (data.xiA && data.xiA.length) ? data.xiA : [];
        const xiB = (data.xiB && data.xiB.length) ? data.xiB : [];
        const teamA = data.teamA || 'TEAM A';
        const teamB = data.teamB || 'TEAM B';

        const listA = xiA.length 
            ? xiA.map((p, i) => `<li><span class="mp-xi-num">${i + 1}</span>${esc(p)}</li>`).join('')
            : `<li style="opacity:0.5;">NO PLAYERS LISTED</li>`;
        const listB = xiB.length
            ? xiB.map((p, i) => `<li><span class="mp-xi-num">${i + 1}</span>${esc(p)}</li>`).join('')
            : `<li style="opacity:0.5;">NO PLAYERS LISTED</li>`;

        const bodyHTML = `
            <div class="mp-xi-grid">
                <div class="mp-xi-team">
                    <h3>${esc(teamA)}</h3>
                    <ul class="mp-xi-list">${listA}</ul>
                </div>
                <div class="mp-xi-team">
                    <h3>${esc(teamB)}</h3>
                    <ul class="mp-xi-list">${listB}</ul>
                </div>
            </div>
        `;
        return midShell('👥', 'PLAYING XI', 'STARTING LINEUPS', bodyHTML);
    }

    // ============================================
    // AUTO-FIT MIDDLE PANEL
    // ============================================
    function autoFitMiddlePanel() {
        const body = el.middlePanel.querySelector('.mp-body');
        if (!body) return;
        body.style.transform = '';
        body.style.width = '';
        body.style.transformOrigin = '';

        const naturalH = body.scrollHeight;
        const availH = body.clientHeight;
        if (availH > 0 && naturalH > availH + 1) {
            const scale = Math.max(0.55, availH / naturalH);
            body.style.transformOrigin = 'top left';
            body.style.transform = `scale(${scale})`;
            body.style.width = `${100 / scale}%`;
        }
    }

    // ============================================
    // MODE ROUTING
    // ============================================
    function renderDisplay(data) {
        const ov = data.overlay || {};
        const mode = String(data.mode || 'default').toLowerCase();

        if (mode === 'batting1') return { target: 'middle', html: renderBattingMiddle(data, 1) };
        if (mode === 'batting2') return { target: 'middle', html: renderBattingMiddle(data, 2) };
        if (mode === 'bowling1') return { target: 'middle', html: renderBowlingMiddle(data, 1) };
        if (mode === 'bowling2') return { target: 'middle', html: renderBowlingMiddle(data, 2) };
        if (mode === 'summary' || mode === 'scorecard' || mode === 'scorecard1' || mode === 'scorecard2') 
            return { target: 'middle', html: renderSummaryMiddle(data) };
        if (mode === 'playingxi') return { target: 'middle', html: renderPlayingXIMiddle(data) };

        if (data.customLower && data.customLower.active && data.customLower.text) return { target: 'bar', html: renderCustomLower(data) };
        if (ov.showFOW) return { target: 'bar', html: renderFOW(data) };
        if (ov.showBowler) return { target: 'bar', html: renderBowlerCard(data) };
        if (ov.playerLower && ov.playerLower.active) return { target: 'bar', html: renderPlayerCard(data, ov.playerLower) };
        if (ov.partnership && ov.partnership.active) return { target: 'bar', html: renderPartnership(data) };
        if (ov.showTarget) return { target: 'bar', html: renderTarget(data) };
        if (ov.showTournament) return { target: 'bar', html: renderTournament(data) };
        if (ov.showVenue) return { target: 'bar', html: renderVenue(data) };
        if (ov.showMatch) return { target: 'bar', html: renderMatch(data) };
        if (ov.showToss) return { target: 'bar', html: renderToss(data) };
        if (ov.showResult) return { target: 'bar', html: renderResult(data) };

        return null;
    }

    // ============================================
    // MAIN UPDATE
    // ============================================
    function mapBroadcastType(type) {
        const t = String(type || '').toUpperCase();
        switch(t) {
            case 'FOUR':          return { text: 'FOUR',       color: '#20e070' };
            case 'SIX':           return { text: 'SIX',        color: '#00d9ff' };
            case 'WICKET':        return { text: 'WICKET',     color: '#ff3158' };
            case 'RUN OUT':       return { text: 'RUN OUT',    color: '#ff3158' };
            case 'FREE HIT':      return { text: 'FREE HIT',   color: '#ffbf22' };
            case 'HAT-TRICK BALL':return { text: 'HAT-TRICK',  color: '#20e070' };
            default:              return { text: t || 'EVENT', color: '#ffffff' };
        }
    }

    let lastUpdate = 0;
    let currentMiddleKey = null;
    let currentBarKey = null;

    function updateOverlay(data) {
        if (!data) return;
        lastUpdate = Date.now();
        el.statusDot.classList.add('online');

        el.bowlingTeamName.textContent = bowlingTeamOf(data) || 'TEAM B';

        const bc = data.broadcast || {};
        const isAnimActive = bc.active === true && bc.type;

        if (isAnimActive) {
            const { text, color } = mapBroadcastType(bc.type);
            const eventId = String(bc.id || bc.eventId || bc.createdAt || text);
            if (el.marqueeText.dataset.eventId !== eventId) {
                el.marqueeText.dataset.eventId = eventId;
                let html = '';
                for (let i = 0; i < 20; i++) html += `<span style="color:${color}">${text}</span>`;
                el.marqueeText.innerHTML = html;
                diag(`🎬 ANIMATION: ${text}`, 'warn');
            }
            el.overlayBar.classList.add('hidden');
            el.displayBar.classList.remove('show');
            el.middlePanel.classList.remove('show');
            el.bowlingBadge.classList.add('hidden');
            el.eventOverlay.classList.add('show');
            return;
        } else {
            if (el.eventOverlay.classList.contains('show')) el.eventOverlay.classList.remove('show');
            el.bowlingBadge.classList.remove('hidden');
        }

        const result = renderDisplay(data);
        const mode = String(data.mode || 'default').toLowerCase();
        const ov = data.overlay || {};

        if (result && result.target === 'middle') {
            const key = mode;
            if (currentMiddleKey !== key) {
                currentMiddleKey = key;
                el.middlePanel.classList.remove('show');
                void el.middlePanel.offsetHeight;
                el.middlePanel.innerHTML = result.html;
                el.middlePanel.classList.add('show');
                requestAnimationFrame(() => requestAnimationFrame(autoFitMiddlePanel));
            } else {
                el.middlePanel.innerHTML = result.html;
                requestAnimationFrame(() => requestAnimationFrame(autoFitMiddlePanel));
            }
            el.displayBar.classList.remove('show');
            el.overlayBar.classList.add('hidden');
        } else if (result && result.target === 'bar') {
            const barKey = mode + '|' + JSON.stringify(ov);
            if (currentBarKey !== barKey) {
                currentBarKey = barKey;
                el.displayBar.classList.remove('show');
                void el.displayBar.offsetHeight;
                el.displayBar.innerHTML = result.html;
                el.displayBar.classList.add('show');
            } else {
                el.displayBar.innerHTML = result.html;
            }
            el.displayBar.classList.add('show');
            el.middlePanel.classList.remove('show');
            el.overlayBar.classList.add('hidden');
        } else {
            currentMiddleKey = null;
            currentBarKey = null;
            el.middlePanel.classList.remove('show');
            el.displayBar.classList.remove('show');
            el.overlayBar.classList.remove('hidden');
        }

        // Score bar data
        const battingTeam = data.battingTeam === 'A' ? data.teamA : (data.battingTeam === 'B' ? data.teamB : 'TEAM');
        el.battingTeam.textContent = battingTeam || 'TEAM';
        el.teamScoreMain.textContent = `${data.runs || 0}/${data.wickets || 0}`;
        el.teamOvers.textContent = `(${ovFmt(data.legalBalls)} OV)`;
        el.teamCrr.textContent = `CRR: ${crr(data.runs || 0, data.legalBalls || 0)}`;
        el.strikerName.textContent = data.striker || 'STRIKER';
        el.strikerStats.textContent = (() => {
            const b = batterStats(data, data.striker);
            return `${b.runs || 0} (${b.balls || 0})`;
        })();
        el.nonStrikerName.textContent = data.nonStriker || 'NON-STRIKER';
        el.nonStrikerStats.textContent = (() => {
            const b = batterStats(data, data.nonStriker);
            return `${b.runs || 0} (${b.balls || 0})`;
        })();
        el.inningsLabel.textContent = data.innings === 2 ? '2ND INN' : '1ST INN';
        el.bowlerName.textContent = data.bowler || 'BOWLER';
        el.bowlerStats.textContent = (() => {
            const b = bowlerStats(data, data.bowler);
            return `${ovFmt(b.balls)}-${b.runs}-${b.wickets}`;
        })();

        el.currentOver.innerHTML = '';
        const balls = data.currentOverBalls || [];
        if (balls.length === 0) {
            for (let i = 0; i < 6; i++) {
                const b = document.createElement('div');
                b.className = 'ball empty';
                b.textContent = '-';
                el.currentOver.appendChild(b);
            }
        } else {
            balls.forEach(ball => {
                const b = document.createElement('div');
                b.className = 'ball';
                const label = String(ball.label || '').toUpperCase();
                if (label === 'W' || label.includes('WICKET')) { b.classList.add('wicket'); b.textContent = 'W'; }
                else if (label === '4') { b.classList.add('four'); b.textContent = '4'; }
                else if (label === '6') { b.classList.add('six'); b.textContent = '6'; }
                else if (label.includes('WD') || label.includes('NB') || label.includes('B') || label.includes('LB')) { b.classList.add('extra'); b.textContent = label.substring(0, 2); }
                else { b.classList.add('runs'); b.textContent = label; }
                el.currentOver.appendChild(b);
            });
        }
    }

    window.addEventListener('resize', () => {
        if (el.middlePanel.classList.contains('show')) {
            requestAnimationFrame(() => requestAnimationFrame(autoFitMiddlePanel));
        }
    });

    // ============================================
    // DATA SOURCES
    // ============================================
    (async function initFirebase() {
        try {
            const firebaseApp = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
            const firebaseDb  = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");

            const app = firebaseApp.initializeApp({
                apiKey: "AIzaSyBLWq1bqJ32F2cg3mqYQ0uwXcS3zvTA3A4",
                authDomain: "brklive19-2bab4.firebaseapp.com",
                databaseURL: "https://brklive19-2bab4-default-rtdb.asia-southeast1.firebasedatabase.app",
                projectId: "brklive19-2bab4",
                storageBucket: "brklive19-2bab4.firebasestorage.app",
                messagingSenderId: "294058533898",
                appId: "1:294058533898:web:4996705937e969939cabf3"
            });
            const db = firebaseDb.getDatabase(app);
            const liveRef = firebaseDb.ref(db, "liveScore");

            diag('✅ FIREBASE CONNECTED');
            firebaseDb.onValue(liveRef, (snapshot) => {
                const data = snapshot.val();
                if (data) { diag('📡 FIREBASE DATA RECEIVED'); updateOverlay(data); }
            }, (error) => {
                diag('❌ FIREBASE ERROR: ' + error.message, 'err');
                el.statusDot.classList.remove('online');
            });
        } catch (e) {
            diag('❌ FIREBASE INIT FAILED: ' + e.message, 'err');
        }
    })();

    ['BRKLIVE19_LIVE_OVERLAY', 'BRKLIVE19_SCORER_DATA'].forEach(chName => {
        try {
            const ch = new BroadcastChannel(chName);
            ch.onmessage = (event) => {
                if (event.data && event.data.type === "LIVE_SCORE") {
                    diag(`📻 BROADCAST (${chName}) RECEIVED`);
                    updateOverlay(event.data.data);
                }
            };
            diag(`📻 LISTENING ON ${chName}`);
        } catch (e) {
            diag(`⚠ CHANNEL ${chName} UNAVAILABLE`, 'warn');
        }
    });

    const STORAGE_KEY = 'brklive19_liveScore';
    const STORAGE_TICK_KEY = 'brklive19_liveScore_tick';

    window.addEventListener('storage', (event) => {
        if ((event.key === STORAGE_KEY || event.key === STORAGE_TICK_KEY) && event.newValue) {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) { diag('💾 LOCALSTORAGE DATA RECEIVED'); updateOverlay(JSON.parse(raw)); }
            } catch (e) {}
        }
    });

    let lastTick = null;
    function pollLocalStorage() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;
            const data = JSON.parse(raw);
            const tick = data.__bridgeUpdatedAt || data.updatedAt || 0;
            if (tick !== lastTick) { lastTick = tick; updateOverlay(data); }
        } catch (e) {}
    }
    setInterval(pollLocalStorage, 500);
    pollLocalStorage();

    setInterval(() => {
        if (Date.now() - lastUpdate > 5000 && lastUpdate > 0) el.statusDot.classList.remove('online');
    }, 2000);

    diag('🚀 OVERLAY READY. PRESS "D" TO TOGGLE PANEL.');
})();
</script>
