<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRKLIVE19 – All Display Screens Overlay</title><style>
:root{--blue:#0752ad;--blue2:#087bd4;--cyan:#00c5f5;--ink:#073d82}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}
#stage{position:relative;width:100vw;height:100vh;background:transparent}
.scorebar{
 position:absolute;left:50%;bottom:1.5%;transform:translateX(-50%);
 width:99.5vw;max-width:1920px;height:clamp(82px,7.2vw,138px);
 display:grid;grid-template-columns:7.2% 36.2% 19.2% 0.7% 27.7% 9%;
 align-items:stretch;overflow:hidden;border-radius:30px;
 border:2px solid #00b9f0;
 background:
   linear-gradient(180deg,rgba(255,255,255,.98) 0%,rgba(220,248,255,.92) 7%,rgba(255,255,255,.18) 19%,transparent 34%),
   linear-gradient(180deg,#e8fbff 0%,#9bdcf7 23%,#f8fdff 43%,#7fc8f0 70%,#e8faff 87%,#72c8ee 100%);
 box-shadow:inset 0 3px 5px #fff,inset 0 -7px 11px #087fc4,inset 0 0 0 2px rgba(255,255,255,.72),0 4px 10px rgba(0,35,86,.55),0 0 14px rgba(0,191,255,.38);
 color:var(--ink)
}
.team{
 margin:10px 7px;border-radius:17px;min-width:0;display:flex;align-items:center;justify-content:center;
 padding:0 5px;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;word-break:break-word;
 font-size:clamp(9px,1.05vw,20px);font-weight:900;letter-spacing:.25px;
 background:linear-gradient(180deg,#ffffff 0%,#f7fdff 22%,#d9f2ff 48%,#a8d9f2 78%,#f7fdff 100%);
 border:2px solid #9bcbe4;box-shadow:inset 0 3px 6px #fff,inset 0 -4px 6px #7eb9dc,0 3px 7px rgba(0,47,91,.35)
}
.main{
 position:relative;margin:7px 0;min-width:0;display:flex;align-items:center;
 padding:22px 17px 9px 27px;color:#fff;
 border-radius:27px 0 88px 27px;border-right:5px solid #54d8ff;position:relative;
 background:
   linear-gradient(180deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,.10) 13%,transparent 30%),
   linear-gradient(110deg,#00256c 0%,#034aa8 20%,#006ed1 48%,#0052b8 72%,#00296f 100%);
 box-shadow:inset 0 3px 5px rgba(255,255,255,.82),inset 0 -10px 14px rgba(0,12,62,.9),inset 0 0 22px rgba(0,190,255,.42),0 5px 11px rgba(0,20,65,.68),0 0 13px rgba(0,170,255,.55)
}
.main:after{
 content:"";position:absolute;left:2%;right:9%;top:5px;height:23%;
 border-radius:22px 10px 60% 12px;pointer-events:none;
 background:linear-gradient(180deg,rgba(255,255,255,.48),rgba(255,255,255,.13) 48%,transparent);
 filter:blur(.25px)
}
.match-label{
 position:absolute;top:0;left:0;width:100%;text-align:center;
 font-size:clamp(9px,.9vw,17px);font-weight:900;letter-spacing:.15px;
 text-shadow:0 1px 2px #00295e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px
}
.scoreline{display:flex;align-items:center;justify-content:center;gap:clamp(4px,.55vw,10px);white-space:nowrap;min-width:0;width:100%;overflow:hidden}
.match-name{font-size:clamp(11px,1.42vw,27px);font-weight:900;overflow:hidden;text-overflow:clip}
.pipe{font-size:clamp(16px,1.8vw,34px);font-weight:300;color:#d9f2ff}
.score{font-size:clamp(30px,3.15vw,60px);font-weight:1000;line-height:1;text-shadow:0 2px 2px #002b70}
.over-word{font-size:clamp(14px,1.48vw,28px);font-weight:900}
.over-num{font-size:clamp(19px,1.8vw,34px);font-weight:900}
.extras{padding:10px 13px 10px 15px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:9px}
.extra-row{
 min-width:0;height:39%;min-height:29px;border-radius:30px;display:flex;align-items:center;overflow:hidden;
 color:white;font-weight:900;
 background:linear-gradient(180deg,rgba(255,255,255,.30),transparent 38%),linear-gradient(90deg,#00266f 0%,#034cae 38%,#006fd2 72%,#002b78 100%);
 box-shadow:inset 0 2px 4px rgba(255,255,255,.8),inset 0 -4px 7px rgba(0,24,83,.75),0 3px 6px rgba(0,37,91,.48),0 0 7px rgba(0,175,255,.3)
}
.extra-icon{font-size:clamp(15px,1.45vw,27px);padding:0 9px 0 17px}
.extra-label{font-size:clamp(13px,1.3vw,25px);flex:1}
.extra-value{
 flex:0 0 auto;margin:3px 7px 3px 3px;padding:5px 12px;min-width:72px;text-align:center;
 border-radius:30px;color:#124987;font-size:clamp(12px,1.2vw,23px);
 background:linear-gradient(180deg,#fff 0%,#f1f9ff 42%,#c7e4fa 100%);box-shadow:inset 0 2px 3px #fff,0 2px 4px rgba(0,24,74,.55)
}
.divider{height:82%;width:6px;justify-self:center;background:linear-gradient(90deg,#0644a1,#1685df,#003d8f);box-shadow:1px 0 3px #7dbde4}
.recent{padding:10px 13px 9px 16px;min-width:0;display:flex;flex-direction:column;justify-content:center}
.recent-top{display:flex;align-items:center;justify-content:space-between;gap:5px;margin:0 2px 7px;font-weight:900;white-space:nowrap}
.batting{font-size:clamp(17px,1.42vw,27px);color:#063f8d;text-align:center;flex:1}
.over-info{font-size:clamp(10px,.92vw,18px);color:#073d82;white-space:nowrap}
.balls{display:flex;gap:4px;justify-content:flex-end;align-items:center;white-space:nowrap;min-width:0;overflow:hidden}
.ball{
 height:clamp(23px,1.6vw,31px);min-width:clamp(25px,1.62vw,31px);padding:0 4px;
 border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;
 font-size:clamp(10px,.82vw,16px);color:#063e8a;
 background:linear-gradient(#e9f5ff,#b7d3ec);border:1px solid #7da9d3;box-shadow:inset 0 1px 2px #fff
}
.ball.boundary{background:linear-gradient(#0754b2,#002d7b);color:#fff;border-color:#073b87}
.ball.wide,.ball.noball{min-width:clamp(38px,3vw,57px);font-size:clamp(8px,.76vw,14px);background:linear-gradient(#f4eaff,#c8b7e6)}
@media(max-width:700px){
 .scorebar{height:76px;grid-template-columns:7.2% 36.2% 19.2% .7% 27.7% 9%;border-radius:16px}
 .team{margin:6px 2px;border-radius:9px;padding:0 2px;font-size:10px}
 .main{padding:17px 5px 6px 8px;border-radius:13px 0 32px 13px;border-right-width:3px}
 .scoreline{gap:3px}.match-name{font-size:10px}.score{font-size:24px}.pipe{font-size:13px}
 .over-word{font-size:10px}.over-num{font-size:15px}.match-label{font-size:8px}
 .extras{padding:5px 3px;gap:5px}.extra-row{min-height:25px}
 .extra-icon{padding:0 4px;font-size:12px}.extra-label{font-size:10px}
 .extra-value{min-width:34px;padding:3px 3px;margin-right:3px;font-size:9px}
 .divider{width:3px}.recent{padding:5px 3px}
 .recent-top{margin-bottom:4px}.batting{font-size:13px}.over-info{font-size:8px}
 .balls{gap:2px}.ball{height:20px;min-width:17px;padding:0 2px;font-size:8px}
 .ball.wide,.ball.noball{min-width:26px;font-size:7px}
}


/* ALL DISPLAY MODES SHARE THE LOWER-THIRD FOOTPRINT; FIT CONTENT WITHOUT SCROLLBARS */
.info-screen{
 position:absolute;left:50%;bottom:1.5%;top:auto;transform:translateX(-50%);
 width:min(99.5vw,1920px);height:clamp(82px,7.2vw,138px);
 max-height:clamp(82px,7.2vw,138px);box-sizing:border-box;
 overflow:hidden;display:none;padding:clamp(3px,.35vw,6px);
 border:2px solid #54dfff;border-radius:12px;
 background:linear-gradient(180deg,rgba(0,31,91,.97),rgba(0,11,43,.98));
 box-shadow:0 0 18px #00bfff88,inset 0 2px 8px #7ceaff55;
 color:#fff;text-transform:uppercase;
}
.info-screen.active{display:block}
#lowerThird{display:none}
#lowerThird.active{display:grid}
#infoScreen{display:none}
#infoScreen.active{display:block}
.info-screen *{box-sizing:border-box;min-width:0;text-transform:uppercase}
.info-title{text-align:center;font-size:clamp(11px,1.25vw,22px);line-height:1;
 font-weight:1000;letter-spacing:.025em;padding:0 2px 2px;
 border-bottom:1px solid #6be7ff;overflow-wrap:anywhere}
.info-sub{text-align:center;font-size:clamp(7px,.58vw,10px);line-height:1.02;
 font-weight:900;margin:2px 0;overflow-wrap:anywhere}
.info-big{text-align:center;font-size:clamp(13px,1.75vw,30px);line-height:1;
 font-weight:1000;padding:2px;text-shadow:0 2px 3px #00113c;overflow-wrap:anywhere;word-break:break-word}
.info-row{display:flex;justify-content:center;align-items:stretch;gap:3px;flex-wrap:nowrap;margin:2px 0}
.info-tile{flex:1 1 0;min-width:0;max-width:none;padding:2px 4px;text-align:center;
 border-radius:5px;color:#073d82;background:linear-gradient(180deg,#fff,#d9f1ff);
 border:1px solid #9bdcf7;overflow:hidden}
.info-tile b{display:block;font-size:clamp(6px,.52vw,9px);line-height:1;
 color:#1764a8;overflow-wrap:anywhere}
.info-tile strong{display:block;font-size:clamp(9px,1.05vw,18px);line-height:1;
 font-weight:1000;margin-top:1px;overflow-wrap:anywhere;word-break:break-word}
.info-table{width:100%;table-layout:fixed;border-collapse:collapse;margin:1px 0;
 background:#fff;color:#082858;font-size:clamp(6px,.58vw,10px);line-height:1;
 text-transform:uppercase}
.info-table th{background:linear-gradient(180deg,#087bd4,#043b91);color:#fff}
.info-table th,.info-table td{padding:1px 2px;text-align:center;vertical-align:middle;
 border:1px solid #a9c9e8;line-height:1;overflow-wrap:anywhere;word-break:break-word;white-space:normal}
.info-table tbody tr:nth-child(even){background:#eaf5ff}
.info-screen:has(.info-table tbody tr:nth-child(6)) .info-table{font-size:clamp(5px,.48vw,8px)}
.info-screen:has(.info-table tbody tr:nth-child(6)) .info-table th,
.info-screen:has(.info-table tbody tr:nth-child(6)) .info-table td{padding:0 1px}
.info-screen:has(.info-table tbody tr:nth-child(9)) .info-table{font-size:clamp(4.5px,.42vw,7px)}
.info-screen:has(.info-table tbody tr:nth-child(9)) .info-table th,
.info-screen:has(.info-table tbody tr:nth-child(9)) .info-table td{padding:0 1px}
.info-screen:has(.info-table tbody tr:nth-child(6)) .info-title{font-size:clamp(9px,.95vw,16px);padding-bottom:1px}
.info-screen:has(.info-table tbody tr:nth-child(6)) .info-sub{font-size:clamp(6px,.45vw,8px);margin:1px 0}
.info-screen .info-row:has(.info-tile:nth-child(5)) .info-tile strong{font-size:clamp(8px,.82vw,14px)}
.info-note{text-align:center;font-size:clamp(6px,.55vw,9px);line-height:1;margin:1px 0;overflow-wrap:anywhere}
@media(max-width:700px){
 .info-screen{width:99.5vw;height:76px;max-height:76px;bottom:1.5%;padding:2px;border-radius:7px}
 .info-title{font-size:clamp(9px,2.3vw,15px);padding-bottom:1px}
 .info-sub{font-size:6px;margin:1px 0}
 .info-big{font-size:clamp(11px,3vw,19px);padding:1px}
 .info-row{gap:2px;margin:1px 0}
 .info-tile{padding:1px 2px;border-radius:3px}
 .info-tile b{font-size:6px}.info-tile strong{font-size:clamp(7px,2vw,12px)}
 .info-table{font-size:6px;margin:0}
 .info-table th,.info-table td{padding:0 1px}
}

/* LARGE CENTER DISPLAY: SCORECARDS, PLAYING XI, SUMMARY AND TARGET */
.info-screen.center-large{
 left:50%!important;top:50%!important;bottom:auto!important;
 transform:translate(-50%,-50%)!important;
 width:75vw!important;height:75vh!important;max-height:75vh!important;
 max-width:75vw!important;overflow:hidden!important;
 padding:clamp(10px,1.4vw,24px)!important;border-radius:18px!important;
 box-shadow:0 0 32px #00cfff99,inset 0 2px 14px #9beaff55!important;
}
.info-screen.center-large .info-title{font-size:clamp(13px,1.65vw,29px);line-height:1.05;padding-bottom:4px;overflow-wrap:anywhere}
.info-screen.center-large .info-sub{font-size:clamp(8px,.78vw,13px);line-height:1.05;margin:3px 0;overflow-wrap:anywhere}
.info-screen.center-large .info-big{font-size:clamp(15px,2.1vw,36px);line-height:1.04;padding:3px;overflow-wrap:anywhere;word-break:break-word}
.info-screen.center-large .info-row{gap:4px;margin:3px 0;flex-wrap:wrap}
.info-screen.center-large .info-tile{padding:3px 5px;border-radius:6px;overflow-wrap:anywhere}
.info-screen.center-large .info-tile b{font-size:clamp(7px,.58vw,10px);line-height:1.05}
.info-screen.center-large .info-tile strong{font-size:clamp(10px,1.1vw,19px);line-height:1.05;overflow-wrap:anywhere;word-break:break-word}
.info-screen.center-large .info-table{width:100%;table-layout:fixed;font-size:clamp(7px,.62vw,11px);line-height:1.02;margin:3px 0;border-collapse:collapse}
.info-screen.center-large .info-table th,.info-screen.center-large .info-table td{
 padding:2px 3px;line-height:1.03;white-space:normal;overflow-wrap:anywhere;word-break:break-word
}
.info-screen.center-large .info-note{font-size:clamp(7px,.58vw,10px);line-height:1.04;margin:2px 0;overflow-wrap:anywhere}
@media(max-width:700px){
 .info-screen.center-large{
  width:75vw!important;height:75vh!important;max-width:75vw!important;max-height:75vh!important;
  padding:7px!important;border-radius:10px!important
 }
 .info-screen.center-large .info-title{font-size:clamp(10px,2.4vw,17px);padding-bottom:2px}
 .info-screen.center-large .info-sub{font-size:clamp(6px,1.45vw,9px);margin:2px 0}
 .info-screen.center-large .info-big{font-size:clamp(11px,2.5vw,18px);padding:2px}
 .info-screen.center-large .info-tile{padding:2px}
 .info-screen.center-large .info-tile b{font-size:6px}
 .info-screen.center-large .info-tile strong{font-size:clamp(8px,1.8vw,12px)}
 .info-screen.center-large .info-table{font-size:clamp(5px,1.15vw,8px)}
 .info-screen.center-large .info-table th,.info-screen.center-large .info-table td{padding:1px;line-height:1.02;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
}


.info-screen,.info-screen *{text-transform:uppercase!important;min-width:0;box-sizing:border-box}
.info-screen.center-large{overflow:hidden!important}
.info-screen.center-large .infoContent,.info-screen.center-large table{max-width:100%}
.info-screen.center-large td,.info-screen.center-large th{white-space:normal!important;overflow-wrap:anywhere!important;word-break:break-word!important}


/* Only the striker carries the batting indicator; non-striker has no batting logo. */
#lowerThird #nonStrikerBattingLogo{display:none!important}
#lowerThird #strikerBattingLogo{display:inline-flex!important}
.info-screen.center-large.mode-target .target-chase-line{font-size:clamp(18px,2.6vw,44px);line-height:1.12;padding:clamp(8px,1.2vw,18px);color:#fff;background:linear-gradient(110deg,#0646a5,#087ed4);border:2px solid #68d5ff;border-radius:12px;text-align:center;box-shadow:0 0 18px #00bfff66;overflow-wrap:anywhere}
@media(max-width:700px){.info-screen.center-large.mode-target .target-chase-line{font-size:clamp(12px,3vw,21px);padding:5px}}

/* LIVE BATTER AND BOWLER DETAILS */
.scorebar,.scorebar *{text-transform:uppercase}
.recent{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.player-stats{display:flex;align-items:center;justify-content:space-between;gap:5px;min-width:0;overflow:hidden}
.player-stat{display:block;min-width:0;flex:1 1 0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:clip;
 color:#073d82;font-size:clamp(8px,.72vw,14px);font-weight:1000;line-height:1.05}
.player-stat.bowler-stat{color:#064b9a}
@media(max-width:700px){
 .player-stats{gap:2px}
 .player-stat{font-size:clamp(6px,1.55vw,9px)}
}

#lowerThird,#lowerThird *{text-transform:uppercase!important}
#leftTeam{font-size:clamp(8px,1vw,19px);line-height:1.05;text-align:center;overflow-wrap:anywhere;word-break:break-word}
#playerStats{grid-template-columns:1fr 1fr 1fr}
#strikerLine:empty,#nonStrikerLine:empty,#bowlerLine:empty{display:none}
@media(max-width:700px){#leftTeam{font-size:clamp(7px,1.6vw,11px)}}

/* CLEAN LIVE LOWER THIRD: SCORE, TWO BATTERS, BOWLER AND BALL-BY-BALL ONLY */
#lowerThird{grid-template-columns:minmax(18%,25%) minmax(20%,25%) 0 minmax(0,1fr) 0!important}
#lowerThird .extras,#lowerThird .divider,#rightTeam,#lowerThird .match-label,
#lowerThird .match-name,#lowerThird .pipe,#lowerThird .over-word{display:none!important}
#lowerThird .main{grid-column:2;min-width:0}
#lowerThird .recent{grid-column:4;min-width:0;width:100%}
#leftTeam{grid-column:1;width:100%;white-space:normal!important;overflow:visible!important;text-overflow:clip!important;overflow-wrap:anywhere;word-break:break-word;font-size:clamp(10px,1.3vw,24px);line-height:1.05}
#lowerThird .scoreline{justify-content:center;gap:5px}
#lowerThird .player-stats{display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:2px}
#lowerThird .player-stat{flex:0 1 auto;width:100%;font-size:clamp(8px,.78vw,14px);line-height:1.05;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:clip}
#lowerThird .recent-top{display:flex;justify-content:space-between;gap:5px}
#lowerThird .balls{display:flex;flex-wrap:nowrap;gap:3px;overflow:hidden}
#lowerThird .ball{flex:0 0 auto}
@media(max-width:700px){
 #leftTeam{font-size:clamp(7px,1.8vw,12px)}
 #lowerThird .player-stat{font-size:clamp(6px,1.5vw,9px)}
}

#lowerThird,#lowerThird *{text-transform:uppercase!important}
#leftTeam,#rightTeam{white-space:normal;overflow-wrap:anywhere;word-break:break-word;text-align:center}
#lowerThird,#lowerThird *{text-transform:uppercase!important}
#leftTeam,#rightTeam{white-space:normal;overflow-wrap:anywhere;word-break:break-word;text-align:center}
#balls{display:flex;gap:4px;justify-content:flex-end;align-items:center;flex-wrap:nowrap;overflow:hidden}
.ball{flex:0 1 auto;min-width:clamp(18px,1.5vw,30px);text-align:center;white-space:nowrap}

/* REFERENCE SCREEN FIT */
#lowerThird,#lowerThird *{text-transform:uppercase!important}
#leftTeam,#rightTeam{overflow:hidden;overflow-wrap:anywhere;word-break:break-word;text-align:center}
#rightTeam{font-size:clamp(9px,1.02vw,19px)}
#matchLabel{white-space:nowrap;text-overflow:clip}
.extra-value{min-width:clamp(55px,4.7vw,90px)}
@media(max-width:700px){
 #rightTeam{font-size:8px}
 .extra-value{min-width:32px}
 .main{padding-left:5px;padding-right:5px}
 .scoreline{gap:2px}
 .match-name{font-size:9px}
}

/* FINAL REFERENCE LAYOUT OVERRIDE:
   Restore the complete six-section lower third shown in the supplied reference image. */
#lowerThird{
  grid-template-columns:7.2% 36.2% 19.2% 0.7% 27.7% 9% !important;
}
#lowerThird .extras,
#lowerThird .divider,
#rightTeam,
#lowerThird .match-label,
#lowerThird .match-name,
#lowerThird .pipe,
#lowerThird .over-word{
  display:initial !important;
}
#lowerThird .team{display:flex !important}
#lowerThird .main{
  grid-column:auto !important;
  margin:7px 0;
  padding:22px 17px 9px 27px;
  border-radius:27px 0 88px 27px;
  border-right:5px solid #54d8ff;
}
#lowerThird .match-label{display:block !important}
#lowerThird .match-name,
#lowerThird .pipe,
#lowerThird .over-word{display:inline !important}
#lowerThird .extras{
  grid-column:auto !important;
  display:flex !important;
  padding:10px 13px 10px 15px;
  gap:9px;
}
#lowerThird .divider{
  grid-column:auto !important;
  display:block !important;
}
#lowerThird .recent{
  grid-column:auto !important;
  padding:10px 13px 9px 16px;
  display:flex !important;
}
#lowerThird .recent-top{
  display:flex !important;
  justify-content:space-between;
}
#lowerThird .balls{justify-content:flex-end}
#leftTeam,#rightTeam{
  grid-column:auto !important;
  display:flex !important;
  font-size:clamp(9px,1.05vw,19px) !important;
  line-height:1.08;
  padding:0 5px;
  align-items:center;
  justify-content:center;
  width:auto;
  white-space:normal;
  overflow:hidden;
  text-align:center;
}
@media(max-width:700px){
  #lowerThird{
    grid-template-columns:15% 32% 19.2% .7% 24.1% 9% !important;
  }
  #lowerThird .main{
    padding:17px 5px 6px 8px;
    border-radius:13px 0 32px 13px;
    border-right-width:3px;
  }
  #lowerThird .extras{padding:5px 3px;gap:5px}
  #lowerThird .recent{padding:5px 3px}
}


/* PURE-WHITE FINISH: remove the pale-blue tint from all white shell panels. */
#lowerThird.scorebar{
  background:#ffffff !important;
  box-shadow:
    inset 0 3px 5px #ffffff,
    inset 0 -3px 5px rgba(0,55,105,.12),
    inset 0 0 0 2px rgba(255,255,255,.95),
    0 4px 10px rgba(0,35,86,.38) !important;
}
#lowerThird .team{
  background:#ffffff !important;
  border-color:#d8e0e8 !important;
  box-shadow:
    inset 0 2px 5px #ffffff,
    inset 0 -2px 4px rgba(0,0,0,.06),
    0 3px 7px rgba(0,47,91,.22) !important;
}


/* RELIABLE FULL-WIDTH EVENT ANIMATION LAYER — above the lower-third scoreboard */
#stage{position:relative;isolation:isolate}
#lowerThird{z-index:10}
#eventAnimation{
  position:absolute !important;
  z-index:9999 !important;
  left:50% !important;
  right:auto !important;
  bottom:max(1%,env(safe-area-inset-bottom,0px)) !important;
  transform:translateX(-50%);
  width:min(99vw,1920px) !important;
  max-width:99vw !important;
  height:clamp(62px,min(11.5vh,7.2vw),138px) !important;
  min-height:0;
  display:none;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  box-sizing:border-box;
  padding:8px 18px;
  border:3px solid currentColor;
  border-radius:clamp(9px,1.55vw,30px);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  font-weight:1000;
  letter-spacing:clamp(2px,.55vw,8px);
  font-size:clamp(34px,6.2vw,96px);
  line-height:1;
  text-align:center;
  white-space:nowrap;
  -webkit-text-stroke:1.5px rgba(0,12,45,.85);
  text-shadow:0 3px 0 #001b4e,0 7px 18px rgba(0,0,0,.8),0 0 28px currentColor;
  opacity:0;
  pointer-events:none !important;
  isolation:isolate;
}
#eventAnimation.show{
  display:flex !important;
  animation:brkEventFull 2.2s cubic-bezier(.15,.8,.25,1) both !important;
}
#eventAnimation:before,#eventAnimation:after{
  content:"";position:absolute;top:7px;bottom:7px;width:24%;
  border-top:3px solid currentColor;border-bottom:3px solid currentColor;
  opacity:.9;pointer-events:none;z-index:-1
}
#eventAnimation:before{left:0;transform:skewX(-22deg);border-left:5px solid currentColor}
#eventAnimation:after{right:0;transform:skewX(-22deg);border-right:5px solid currentColor}
#eventAnimation.four{color:#ffe45c;background:linear-gradient(90deg,#063b8c,#0879dc 50%,#063b8c)}
#eventAnimation.six{color:#fff;background:linear-gradient(90deg,#43006f,#c0009b 50%,#43006f)}
#eventAnimation.wicket,#eventAnimation.runout{color:#fff;background:linear-gradient(90deg,#69000b,#e22b20 50%,#69000b)}
#eventAnimation.freehit{color:#eafff1;background:linear-gradient(90deg,#005027,#00a85a 50%,#005027)}
#eventAnimation.hattrick{color:#ffe08a;background:linear-gradient(90deg,#550019,#d00045 50%,#550019)}
@keyframes brkEventFull{
  0%{opacity:0;clip-path:inset(0 50% 0 50%);scale:.78;filter:blur(8px)}
  14%{opacity:1;clip-path:inset(0 0 0 0);scale:1.04;filter:blur(0)}
  24%,76%{opacity:1;clip-path:inset(0);scale:1}
  100%{opacity:0;clip-path:inset(0);scale:1.06;filter:blur(3px)}
}
@media(max-width:700px){
 #eventAnimation{height:84px!important;bottom:1.5%!important;font-size:clamp(23px,7vw,42px);padding:5px 8px;letter-spacing:2px}
}
@media(prefers-reduced-motion:reduce){
 #eventAnimation.show{animation:none !important;opacity:1}
}
/* BATTING TEAM RUNS: distinct score badge against the blue centre panel. */
/* INNINGS LABEL NEXT TO THE BATTING SCORE */
#lowerThird .innings-badge{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;padding:4px clamp(4px,.45vw,9px);margin:0 2px;border-radius:7px;background:linear-gradient(180deg,#fff,#c9eaff);border:1px solid #83c9f1;color:#06458d;font-size:clamp(8px,.78vw,15px);font-weight:1000;line-height:1;white-space:nowrap;box-shadow:inset 0 1px 2px #fff,0 1px 3px #001b4e66}
@media(max-width:700px){#lowerThird .innings-badge{font-size:7px;padding:3px 2px;margin:0 1px;border-radius:4px}}
#lowerThird #score{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:2px clamp(8px,.8vw,16px);
  margin:0 2px;
  min-width:clamp(72px,7vw,132px);
  border-radius:10px;
  color:#062d69;
  background:linear-gradient(180deg,#fff7c9 0%,#ffd84d 48%,#f0a900 100%);
  border:1px solid #fff0a1;
  box-shadow:inset 0 2px 4px rgba(255,255,255,.9),inset 0 -3px 5px rgba(126,73,0,.24),0 2px 7px rgba(0,15,60,.55);
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
@media(max-width:700px){
  #lowerThird #score{min-width:43px;padding:2px 4px;border-radius:5px}
}

}

}

}

 #infoScreen.show-match-header #infoMatchHeading {

 #infoScreen.show-match-header #infoMatchValues span {

 }

  padding-top:clamp(62px,14vw,98px) !important;
 }
}


/* OPENING ANIMATION ONLY — no changes to display design, data, dimensions,
   positioning, scorer controls, or lower-third behavior. Runs whenever any
   information display screen is opened through the existing show() function. */
@keyframes brkDisplayOpen {
  0%   { opacity:0; transform:translate3d(0,22px,0) scale(.985); filter:blur(3px); }
  65%  { opacity:1; transform:translate3d(0,-2px,0) scale(1.002); filter:blur(0); }
  100% { opacity:1; transform:translate3d(0,0,0) scale(1); filter:blur(0); }
}
@keyframes brkDisplayContentOpen {
  0%   { opacity:0; transform:translate3d(0,12px,0); }
  100% { opacity:1; transform:translate3d(0,0,0); }
}
#infoScreen.active {
  animation:brkDisplayOpen .58s cubic-bezier(.2,.78,.22,1) both;
  transform-origin:50% 100%;
}
#infoScreen.active .info-title {
  animation:brkDisplayContentOpen .42s ease-out .10s both;
}
#infoScreen.active .info-sub {
  animation:brkDisplayContentOpen .42s ease-out .16s both;
}
#infoScreen.active #infoContent {
  animation:brkDisplayContentOpen .48s ease-out .12s both;
}
#infoScreen.active #infoTournamentHeader {
  animation:brkDisplayContentOpen .45s ease-out .04s both;
}
@media(prefers-reduced-motion:reduce) {
  #infoScreen.active,
  #infoScreen.active .info-title,
  #infoScreen.active .info-sub,
  #infoScreen.active #infoContent,
  #infoScreen.active #infoTournamentHeader {
    animation:none !important;
  }
}


/* VIEWPORT FIT PATCH: keep every information screen inside the visible
   browser/OBS canvas. Scorecards and Playing XI use nearly the full safe area;
   longer tables can scroll instead of being clipped. */
#infoScreen.center-large {
  left:50% !important;
  top:50% !important;
  right:auto !important;
  bottom:auto !important;
  transform:translate(-50%,-50%) !important;
  width:min(96vw,1840px) !important;
  height:min(92vh,1000px) !important;
  max-width:96vw !important;
  max-height:92vh !important;
  overflow-x:hidden !important;
  overflow-y:auto !important;
  overscroll-behavior:contain;
  padding:clamp(8px,1vw,18px) !important;
  padding-top:clamp(86px,9vw,150px) !important;
}
#infoScreen.center-large #infoContent {
  width:100%;
  max-width:100%;
  min-width:0;
  overflow-x:hidden;
}
#infoScreen.center-large .info-table {
  width:100% !important;
  max-width:100% !important;
  table-layout:fixed !important;
  border-collapse:collapse !important;
}
#infoScreen.center-large .info-table th,
#infoScreen.center-large .info-table td {
  white-space:normal !important;
  overflow-wrap:anywhere !important;
  word-break:break-word !important;
  padding:clamp(1px,.22vw,4px) clamp(2px,.3vw,5px) !important;
  line-height:1.04 !important;
}
#infoScreen.center-large .info-row {
  max-width:100%;
  flex-wrap:wrap !important;
  align-items:stretch;
}
#infoScreen.center-large .info-tile {
  min-width:0;
  overflow-wrap:anywhere;
}
#infoScreen.center-large img,
#infoScreen.center-large video,
#infoScreen.center-large canvas {
  max-width:100%;
  height:auto;
}
#infoScreen:not(.center-large) {
  left:50% !important;
  right:auto !important;
  width:min(99vw,1920px) !important;
  max-width:99vw !important;
  overflow-x:hidden !important;
}
#infoScreen:not(.center-large) #infoContent {
  max-width:100%;
  min-width:0;
  overflow-wrap:anywhere;
}
#infoScreen:not(.center-large) .info-table {
  width:100% !important;
  max-width:100% !important;
  table-layout:fixed !important;
}
#infoScreen:not(.center-large) .info-table th,
#infoScreen:not(.center-large) .info-table td {
  white-space:normal !important;
  overflow-wrap:anywhere !important;
  word-break:break-word !important;
}
@media(max-width:700px) {
  #infoScreen.center-large {
    width:96vw !important;
    height:92vh !important;
    max-width:96vw !important;
    max-height:92vh !important;
    padding:6px !important;
    padding-top:clamp(58px,14vw,96px) !important;
  }
  #infoScreen.center-large .info-table {
    font-size:clamp(6px,1.25vw,10px) !important;
  }
  #infoScreen.center-large .info-table th,
  #infoScreen.center-large .info-table td {
    padding:1px 2px !important;
    line-height:1.02 !important;
  }
  #infoScreen.center-large .info-title {
    font-size:clamp(11px,2.8vw,18px) !important;
  }
  #infoScreen.center-large .info-big {
    font-size:clamp(12px,3vw,20px) !important;
  }
}
/* Keep opening animation from shifting the centered panel after its entrance. */
@keyframes brkDisplayOpenFit {
  0% { opacity:0; translate:0 18px; scale:.985; filter:blur(2px); }
  70% { opacity:1; translate:0 -1px; scale:1.002; filter:blur(0); }
  100% { opacity:1; translate:0 0; scale:1; filter:blur(0); }

/* HEAVY BROADCAST OPENING ANIMATION for every information display:
   energetic light sweep, glow pulse, 3D lift and staggered data reveal.
   Uses opacity/filter/individual translate so the existing centered or
   bottom-anchored positioning is not overwritten. */
@keyframes brkHeavyPanelReveal {
  0% {
    opacity:0;
    filter:blur(12px) brightness(2.2) saturate(1.7);
    clip-path:inset(0 0 100% 0 round 12px);
    box-shadow:0 0 0 rgba(0,190,255,0);
  }
  55% {
    opacity:1;
    filter:blur(0) brightness(1.35) saturate(1.35);
    clip-path:inset(0 0 0 0 round 12px);
    box-shadow:0 0 48px rgba(0,190,255,.75), inset 0 0 28px rgba(255,255,255,.28);
  }
  78% {
    filter:brightness(1.08) saturate(1.12);
    box-shadow:0 0 25px rgba(0,190,255,.48), inset 0 0 14px rgba(255,255,255,.18);
  }
  100% {
    opacity:1;
    filter:none;
    clip-path:inset(0 0 0 0 round 0);
    box-shadow:initial;
  }
}
@keyframes brkHeavyContentReveal {
  0% { opacity:0; translate:0 26px; scale:.94; filter:blur(7px); }
  65% { opacity:1; translate:0 -3px; scale:1.015; filter:blur(0); }
  100% { opacity:1; translate:0 0; scale:1; filter:none; }
}
@keyframes brkHeaderFlash {
  0% { opacity:0; translate:-18px 0; filter:brightness(2.3) blur(5px); }
  70% { opacity:1; translate:2px 0; filter:brightness(1.25) blur(0); }
  100% { opacity:1; translate:0 0; filter:none; }
}
#infoScreen.active {
  animation:brkHeavyPanelReveal .82s cubic-bezier(.16,.84,.24,1) both !important;
  transform-origin:50% 100%;
  will-change:opacity,filter,clip-path;
}
#infoScreen.active .info-title {
  animation:brkHeavyContentReveal .62s cubic-bezier(.16,.84,.24,1) .12s both !important;
}
#infoScreen.active .info-sub {
  animation:brkHeavyContentReveal .62s cubic-bezier(.16,.84,.24,1) .22s both !important;
}
#infoScreen.active #infoContent {
  animation:brkHeavyContentReveal .72s cubic-bezier(.16,.84,.24,1) .18s both !important;
}
#infoScreen.active #infoTournamentHeader {
  animation:brkHeaderFlash .68s cubic-bezier(.16,.84,.24,1) .06s both !important;
}
#infoScreen.active #infoMatchDetails {
  animation:brkHeavyContentReveal .62s cubic-bezier(.16,.84,.24,1) .25s both;
}
@media(prefers-reduced-motion:reduce) {
  #infoScreen.active,
  #infoScreen.active .info-title,
  #infoScreen.active .info-sub,
  #infoScreen.active #infoContent,
  #infoScreen.active #infoTournamentHeader,
  #infoScreen.active #infoMatchDetails {
    animation:none !important;
    filter:none !important;
    clip-path:none !important;
    translate:none !important;
    scale:none !important;
  }
}

 const secondInnings=innings>=2||target!==undefined;
 const slides=[
  ["MATCH DETAILS",clean(match)],
  ["TOURNAMENT",clean(tournament)],
  ["VENUE",clean(venue)],
  ["TOSS",toss],
  ["MATCH TYPE",clean(matchType)],
  ["INNINGS",`${inningsLabel} INNINGS`],
  ["CURRENT SCORE",`${runs}/${wickets} • ${overs} OV`],
  ["CURRENT RUN RATE",`${crr} RUNS/OVER`],
  ["PROJECTED SCORE",projected],
  ["FOURS",String(totalFours)],
  ["SIXES",String(totalSixes)],
  ["PARTNERSHIP",`${clean(partnership)} RUNS`]
 ];
 if(secondInnings){
  slides.push(["TARGET",clean(target)]);
  slides.push(["REQUIRED RUN RATE",`${rrr} RUNS/OVER`]);
  if(runsToWin!==undefined)slides.push(["CHASE",`${num(runsToWin)} RUNS REQUIRED`]);
 }
 const [heading,value]=slides[liveTickerIndex%slides.length];
 if(label)label.textContent=heading;
 el.textContent=value;
 el.title=`${heading}: ${value}`;
 el.style.fontSize="15px";
 const ticker=el.closest(".live-match-ticker");
 const available=(ticker?.clientWidth||0)-(label?.offsetWidth||0)-24;
 let size=15;
 while(size>9&&el.scrollWidth>available){size-=0.5;el.style.fontSize=size+"px";}
}
updateLiveMatchTicker();
setInterval(()=>{liveTickerIndex++;updateLiveMatchTicker();},5000);
</script>

<script id="brk-auto-fit-no-scroll-js">
(function(){
  function fitBrkInfoScreen(){
    const panel=document.getElementById('infoScreen');
    const content=document.getElementById('infoContent');
    if(!panel||!content||!panel.classList.contains('active')||!panel.classList.contains('center-large')) return;
    content.style.zoom='1';
    content.style.width='100%';
    const panelStyle=getComputedStyle(panel);
    const bottomPad=parseFloat(panelStyle.paddingBottom)||0;
    const top=content.offsetTop;
    const available=Math.max(24,panel.clientHeight-top-bottomPad-4);
    const needed=Math.max(content.scrollHeight,content.getBoundingClientRect().height,1);
    let scale=Math.min(1,available/needed);
    // Small safety margin avoids a clipped final row from fractional pixel rounding.
    scale=Math.max(.48,scale*.985);
    if(scale<.999){
      content.style.zoom=String(scale);
      content.style.width=(100/scale)+'%';
    }
    panel.style.overflow='hidden';
  }
  window.__brkFitInfoScreen=fitBrkInfoScreen;
  const originalRAF=window.requestAnimationFrame.bind(window);
  window.addEventListener('resize',()=>originalRAF(fitBrkInfoScreen),{passive:true});
  document.addEventListener('DOMContentLoaded',()=>originalRAF(fitBrkInfoScreen));
  // Re-fit after each display render without changing scorer data or display selection.
  const content=document.getElementById('infoContent');
  if(content&&window.MutationObserver){
    new MutationObserver(()=>originalRAF(fitBrkInfoScreen)).observe(content,{childList:true,subtree:true,characterData:true});
  }
  const panel=document.getElementById('infoScreen');
  if(panel&&window.MutationObserver){
    new MutationObserver(()=>originalRAF(fitBrkInfoScreen)).observe(panel,{attributes:true,attributeFilter:['class']});
  }
})();
</script>
