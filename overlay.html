<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BRKLIVE19 Live Overlay</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:transparent!important;overflow:hidden;font-family:Arial,sans-serif}
.scoreboard{position:absolute;left:3%;right:3%;bottom:5%;padding:13px 20px;border-radius:15px;background:rgba(0,0,0,.80);color:#fff}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px}.team{font-size:22px;font-weight:800}.vs{font-size:13px;color:#bbb;margin-top:3px}
.score{font-size:42px;font-weight:900}.overs{font-size:17px;font-weight:700}.live{color:#ff3333;font-size:13px;font-weight:800;white-space:nowrap}
.meta{font-size:12px;color:#ccc;margin:5px 0 7px}.batting,.bowling,.match-info{font-size:14px;line-height:1.55}.batsman{display:inline-block;margin-right:18px}.bat-icon{margin-right:4px}
.batting strong,.bowling strong,.match-info strong{font-weight:900}.match-info{margin-top:2px}.winner{color:#ffd54a}
@media(max-width:700px){.scoreboard{left:2%;right:2%;bottom:3%;padding:10px 13px}.team{font-size:16px}.score{font-size:30px}.overs{font-size:13px}.live{font-size:10px}.meta,.batting,.bowling,.match-info{font-size:11px}.batsman{margin-right:8px}}
</style>
</head>
<body>
<div class="scoreboard">
<div class="top">
<div><div id="teamA" class="team">TEAM A</div><div id="teamB" class="vs">vs TEAM B</div></div>
<div id="score" class="score">0/0</div><div id="overs" class="overs">0.0 OV</div><div class="live">🔴 LIVE</div>
</div>
<div class="meta"><span id="tournament">BRKLIVE19</span> • <span id="matchName">Match</span> • 📍 <span id="venue">Venue</span></div>
<div class="meta">🏏 <span id="battingTeam">TEAM A</span> batting • 🎯 <span id="bowlingTeam">TEAM B</span> bowling • Toss: <span id="toss">-</span> • <span id="innings">Innings 1</span></div>
<div class="batting">
<div class="batsman">🏏 <span id="batsman1">Striker</span> <strong><span id="batsman1Runs">0</span> (<span id="batsman1Balls">0</span>)</strong> 4s:<span id="batsman1Fours">0</span> 6s:<span id="batsman1Sixes">0</span></div>
<div class="batsman">🏏 <span id="batsman2">Non-Striker</span> <strong><span id="batsman2Runs">0</span> (<span id="batsman2Balls">0</span>)</strong> 4s:<span id="batsman2Fours">0</span> 6s:<span id="batsman2Sixes">0</span></div>
</div>
<div class="bowling">🎯 <strong id="bowler">Bowler</strong> <span id="bowlerOvers">0.0</span> O • <span id="bowlerRuns">0</span> R • <span id="bowlerWickets">0</span> W • ECO: <span id="bowlerEconomy">0.00</span></div>
<div class="match-info">CRR: <strong id="currentRunRate">0.00</strong> • RRR: <strong id="requiredRunRate">0.00</strong> • TARGET: <strong id="target">-</strong> • OVER: <strong id="currentOver">0.0</strong> • EXTRAS: <strong id="extras">0</strong></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyBLWq1bqJ32F2cg3mqYQ0uwXcS3zvTA3A4",authDomain:"brklive19-2bab4.firebaseapp.com",databaseURL:"https://brklive19-2bab4-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"brklive19-2bab4",storageBucket:"brklive19-2bab4.firebasestorage.app",messagingSenderId:"294058533898",appId:"1:294058533898:web:4996705937e969939cabf3",measurementId:"G-RW18E7LVEX"};
const db=getDatabase(initializeApp(firebaseConfig)),r=ref(db,"liveScore"),$=id=>document.getElementById(id);
onValue(r,s=>{const d=s.val();if(!d)return;
$("teamA").textContent=d.teamA||"TEAM A";$("teamB").textContent="vs "+(d.teamB||"TEAM B");$("score").textContent=(d.runs||0)+"/"+(d.wickets||0);$("overs").textContent=(d.overs||"0.0")+" OV";
$("tournament").textContent=d.tournamentName||"BRKLIVE19";$("matchName").textContent=d.matchName||"Match";$("venue").textContent=d.venue||"Venue";
$("battingTeam").textContent=d.battingTeam==="B"?(d.teamB||"TEAM B"):(d.teamA||"TEAM A");$("bowlingTeam").textContent=d.bowlingTeam==="A"?(d.teamA||"TEAM A"):(d.teamB||"TEAM B");
$("toss").textContent=d.tossWinner?((d.tossWinner==="A"?d.teamA:d.teamB)||"")+(d.tossDecision?" won, chose to "+d.tossDecision:""):"-";$("innings").textContent="Innings "+(d.innings||1);
["batsman1","batsman2","bowler"].forEach(id=>$(id).textContent=d[id]||$(id).textContent);
["batsman1Runs","batsman2Runs","batsman1Balls","batsman2Balls","batsman1Fours","batsman2Fours","batsman1Sixes","batsman2Sixes","bowlerOvers","bowlerRuns","bowlerWickets","currentOver","extras","target"].forEach(id=>$(id).textContent=d[id]??0);
$("bowlerEconomy").textContent=Number(d.bowlerEconomy||0).toFixed(2);$("currentRunRate").textContent=Number(d.currentRunRate||0).toFixed(2);$("requiredRunRate").textContent=Number(d.requiredRunRate||0).toFixed(2);
});
</script>
</body>
</html>
