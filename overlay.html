<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRKLIVE19 TV Overlay</title>

<style>
:root{
  --blue:#0756c9;
  --blue2:#092878;
  --pink:#f0189b;
  --yellow:#f1d400;
  --white:#fff;
  --dark:#07133d;
  --light:#eef5ff;
  --muted:#dce6ff;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:transparent!important;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:2.2vw;
}

/* ==============================
   MAIN OVERLAY
============================== */

#overlay{
  width:96vw;
  max-width:1900px;
  min-height:105px;
  display:grid;
  grid-template-columns:
    0.72fr
    1.55fr
    1.05fr
    1.55fr
    0.72fr;

  position:relative;

  background:#fff;

  border-radius:2px;

  box-shadow:
    0 5px 25px #0009;
}

/* ==============================
   LEFT TEAM
============================== */

.teamLeft{
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      100deg,
      #009dd5,
      #0781bd
    );

  color:#fff;

  font-size:clamp(17px,2vw,32px);
  font-weight:1000;

  text-transform:uppercase;

  overflow:hidden;
}

/* diagonal decoration */

.teamLeft:after{
  content:"";

  position:absolute;

  right:-23px;
  top:-20px;

  width:45px;
  height:150px;

  background:#101f68;

  transform:rotate(17deg);

  z-index:1;
}

.teamLeft span{
  position:relative;
  z-index:2;
}

/* ==============================
   BATSMEN
============================== */

.batsmen{
  position:relative;

  display:flex;
  flex-direction:column;
  justify-content:center;

  padding:7px 16px;

  color:#fff;

  background:
    linear-gradient(
      90deg,
      #0b2472,
      #101b65
    );

  overflow:hidden;
}

.batsmanRow{
  height:43px;

  display:grid;

  grid-template-columns:
    1fr
    45px
    45px;

  align-items:center;

  border-bottom:1px solid #ffffff1c;
}

.batsmanRow:last-child{
  border-bottom:0;
}

.batsmanName{
  font-size:clamp(13px,1.25vw,22px);
  font-weight:900;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.strikerMark{
  color:#ffe000;
  margin-right:4px;
}

.batsmanRuns{
  text-align:center;

  color:#ffe000;

  font-size:clamp(16px,1.5vw,25px);

  font-weight:1000;
}

.batsmanBalls{
  text-align:center;

  font-size:clamp(12px,1.1vw,18px);

  font-weight:900;
}

/* ==============================
   CENTER SCORE
============================== */

.scoreBox{
  position:relative;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  background:#fff;

  color:#10154c;

  border-left:1px solid #ddd;
  border-right:1px solid #ddd;
}

.matchName{
  position:absolute;

  top:5px;

  width:100%;

  text-align:center;

  font-size:clamp(11px,1vw,17px);

  font-weight:900;

  color:#20215d;
}

.score{
  margin-top:10px;

  min-width:130px;

  padding:3px 15px;

  text-align:center;

  border-radius:8px;

  background:
    linear-gradient(
      90deg,
      #ee159a,
      #f31992
    );

  color:#fff;

  font-size:clamp(27px,3.2vw,52px);

  line-height:1;

  font-weight:1000;

  box-shadow:
    0 3px 8px #c7007755;
}

.scoreOvers{
  margin-top:3px;

  font-size:clamp(13px,1.3vw,22px);

  font-weight:900;
}

.rateRow{
  position:absolute;

  bottom:4px;

  width:100%;

  display:flex;

  justify-content:center;

  gap:22px;

  font-size:clamp(10px,0.9vw,15px);

  font-weight:900;
}

/* ==============================
   BOWLER
============================== */

.bowlerBox{
  position:relative;

  display:flex;
  flex-direction:column;

  justify-content:center;

  padding:7px 15px;

  color:#fff;

  background:
    linear-gradient(
      90deg,
      #111d69,
      #071d67
    );

  overflow:hidden;
}

.bowlerName{
  font-size:clamp(14px,1.4vw,23px);

  font-weight:1000;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.bowlerFigures{
  margin-top:3px;

  font-size:clamp(11px,1vw,17px);

  color:#fff;

  font-weight:800;
}

/* ==============================
   BALLS
============================== */

.ballRow{
  position:absolute;

  left:0;
  right:0;

  bottom:0;

  height:29px;

  display:flex;

  align-items:center;

  justify-content:flex-start;

  gap:4px;

  padding-left:15px;
}

.ball{
  width:25px;
  height:25px;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  color:#fff;

  font-size:12px;

  font-weight:1000;

  box-shadow:
    0 1px 3px #0008;
}

.ball1{
  background:#1475c9;
}

.ball2{
  background:#078bc4;
}

.ball3{
  background:#6848ba;
}

.ball4{
  background:#07995b;
}

.ball5{
  background:#1594c7;
}

.ball6{
  background:#ec9d00;
}

.ballDot{
  background:#213d82;
}

.ballW{
  background:#e21c42;
}

.ballExtra{
  background:#8d3cb8;
}

.ballWide{
  background:#c87900;
}

.ballNB{
  background:#db2677;
}

/* ==============================
   RIGHT TEAM
============================== */

.teamRight{
  position:relative;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    linear-gradient(
      100deg,
      #f2d500,
      #d9c000
    );

  color:#111;

  font-size:clamp(17px,2vw,32px);

  font-weight:1000;

  text-transform:uppercase;

  overflow:hidden;
}

.teamRight:before{
  content:"";

  position:absolute;

  left:-23px;
  top:-20px;

  width:45px;
  height:150px;

  background:#101f68;

  transform:rotate(-17deg);
}

.teamRight span{
  position:relative;
  z-index:2;
}

/* ==============================
   LIVE
============================== */

.liveDot{
  position:absolute;

  right:6px;
  top:5px;

  color:#ff2348;

  font-size:9px;

  font-weight:1000;
}

/* ==============================
   THEME COLORS
============================== */

.theme-neon .teamLeft{
  background:linear-gradient(100deg,#8b00ff,#40107d);
}

.theme-neon .batsmen,
.theme-neon .bowlerBox{
  background:linear-gradient(90deg,#250044,#40107d);
}

.theme-neon .score{
  background:linear-gradient(90deg,#ff1493,#8b00ff);
}

.theme-neon .teamRight{
  background:linear-gradient(100deg,#ff19d4,#a500d9);
  color:#fff;
}

.theme-green .teamLeft{
  background:linear-gradient(100deg,#009b55,#006d3d);
}

.theme-green .batsmen,
.theme-green .bowlerBox{
  background:linear-gradient(90deg,#063f26,#00633b);
}

.theme-green .score{
  background:linear-gradient(90deg,#00a85a,#20e070);
}

.theme-green .teamRight{
  background:linear-gradient(100deg,#62d66f,#13a84b);
}

.theme-gold .teamLeft{
  background:linear-gradient(100deg,#bd7600,#744500);
}

.theme-gold .batsmen,
.theme-gold .bowlerBox{
  background:linear-gradient(90deg,#382000,#654000);
}

.theme-gold .score{
  background:linear-gradient(90deg,#ffb300,#d47b00);
}

.theme-gold .teamRight{
  background:linear-gradient(100deg,#ffe45c,#ffb000);
}

.theme-red .teamLeft{
  background:linear-gradient(100deg,#bd1232,#69081c);
}

.theme-red .batsmen,
.theme-red .bowlerBox{
  background:linear-gradient(90deg,#36030d,#620817);
}

.theme-red .score{
  background:linear-gradient(90deg,#ff3158,#c90035);
}

.theme-red .teamRight{
  background:linear-gradient(100deg,#ff5b35,#d81c2e);
  color:#fff;
}

.theme-rainbow .score{
  background:
    linear-gradient(
      90deg,
      #00cfff,
      #7b2cff,
      #ff1493
    );
}

/* ==============================
   MOBILE
============================== */

@media(max-width:700px){

  body{
    padding:1vw;
  }

  #overlay{
    width:98vw;

    grid-template-columns:
      .65fr
      1.4fr
      1fr
      1.4fr
      .65fr;

    min-height:75px;
  }

  .batsmen{
    padding:4px 6px;
  }

  .batsmanRow{
    height:31px;

    grid-template-columns:
      1fr
      28px
      28px;
  }

  .ballRow{
    display:none;
  }

  .score{
    min-width:75px;

    padding:3px 7px;
  }

  .rateRow{
    gap:8px;
  }

  .bowlerBox{
    padding:4px 7px;
  }

}

/* ==============================
   HIDE FOR MINI MODE
============================== */

.mode-mini .batsmen,
.mode-mini .bowlerFigures,
.mode-mini .ballRow,
.mode-mini .rateRow{
  display:none;
}

.mode-mini #overlay{
  min-height:55px;
}

</style>
</head>

<body>

<div id="overlay">

  <!-- LEFT TEAM -->
  <div class="teamLeft">
    <span id="batTeam">INDIA</span>
  </div>


  <!-- BATTERS -->
  <div class="batsmen">

    <div class="batsmanRow">

      <div class="batsmanName">
        <span class="strikerMark">⚡</span>
        <span id="striker">STRIKER</span>
      </div>

      <div class="batsmanRuns" id="strikerRuns">
        0
      </div>

      <div class="batsmanBalls" id="strikerBalls">
        0
      </div>

    </div>


    <div class="batsmanRow">

      <div class="batsmanName">
        <span id="nonStriker">
          NON-STRIKER
        </span>
      </div>

      <div class="batsmanRuns" id="nonRuns">
        0
      </div>

      <div class="batsmanBalls" id="nonBalls">
        0
      </div>

    </div>


    <!-- BALLS UNDER BATTERS -->
    <div
      class="ballRow"
      id="ballRow">
    </div>

  </div>


  <!-- CENTER SCORE -->
  <div class="scoreBox">

    <div
      class="matchName"
      id="matchName">
      AUS v IND
    </div>

    <div
      class="score"
      id="score">
      0-0
    </div>

    <div
      class="scoreOvers"
      id="overs">
      0.0 (0)
    </div>

    <div class="rateRow">

      <span>
        CRR:
        <b id="crr">0.00</b>
      </span>

      <span>
        RRR:
        <b id="rrr">0.00</b>
      </span>

    </div>

  </div>


  <!-- BOWLER -->
  <div class="bowlerBox">

    <div class="liveDot">
      ● LIVE
    </div>

    <div
      class="bowlerName"
      id="bowler">
      BOWLER
    </div>

    <div
      class="bowlerFigures"
      id="bowlerFigures">
      0.0 O • 0 R • 0 W
    </div>

  </div>


  <!-- RIGHT TEAM -->
  <div class="teamRight">

    <span id="bowlTeam">
      AUSTRALIA
    </span>

  </div>

</div>


<script type="module">

/* ========================================
   FIREBASE
======================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBLWq1bqJ32F2cg3mqYQ0uwXcS3zvTA3A4",

  authDomain:
    "brklive19-2bab4.firebaseapp.com",

  databaseURL:
    "https://brklive19-2bab4-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "brklive19-2bab4",

  storageBucket:
    "brklive19-2bab4.firebasestorage.app",

  messagingSenderId:
    "294058533898",

  appId:
    "1:294058533898:web:4996705937e969939cabf3",

  measurementId:
    "G-RW18E7LVEX"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);

const liveRef =
  ref(db,"liveScore");


/* ========================================
   HELPERS
======================================== */

const $ =
  id => document.getElementById(id);


function num(v){

  return Number(v || 0);

}


function overs(balls){

  balls = num(balls);

  return (
    Math.floor(balls / 6)
    + "."
    + (balls % 6)
  );

}


function getTeam(data,side){

  if(side === "A"){

    return data.teamA || "TEAM A";

  }

  return data.teamB || "TEAM B";

}


function getBattingStats(data,name){

  if(
    data.batters &&
    name &&
    data.batters[name]
  ){

    return data.batters[name];

  }

  return {
    runs:0,
    balls:0,
    fours:0,
    sixes:0
  };

}


function getBowlerStats(data,name){

  if(
    data.bowlers &&
    name &&
    data.bowlers[name]
  ){

    return data.bowlers[name];

  }

  return {
    balls:0,
    runs:0,
    wickets:0
  };

}


/* ========================================
   SHORT NAME
======================================== */

function shortName(name){

  if(!name){

    return "TEAM";

  }

  const words =
    String(name)
      .trim()
      .split(/\s+/);

  if(words.length === 1){

    return words[0]
      .substring(0,7)
      .toUpperCase();

  }

  return words
    .map(word => word[0])
    .join("")
    .substring(0,6)
    .toUpperCase();

}


/* ========================================
   BALL HISTORY
======================================== */

function drawBalls(data){

  const row =
    $("ballRow");

  row.innerHTML = "";

  const events =
    Array.isArray(data.events)
      ? data.events.slice(-6)
      : [];

  events.forEach(event => {

    let text =
      String(event);

    let value = "0";
    let cls = "ballDot";


    /* NORMAL RUN */

    const run =
      text.match(/(\d+)\s*run/i);

    if(run){

      const r =
        Number(run[1]);

      value = r;

      if(r === 0){
        cls = "ballDot";
      }

      else if(r === 1){
        cls = "ball1";
      }

      else if(r === 2){
        cls = "ball2";
      }

      else if(r === 3){
        cls = "ball3";
      }

      else if(r === 4){
        cls = "ball4";
      }

      else if(r === 5){
        cls = "ball5";
      }

      else if(r === 6){
        cls = "ball6";
      }

    }


    /* WICKET */

    if(/WICKET/i.test(text)){

      value = "W";
      cls = "ballW";

    }


    /* WIDE */

    if(/wide/i.test(text)){

      const m =
        text.match(/wide\s*:\s*(\d+)/i);

      value =
        m ? "WD" : "WD";

      cls = "ballWide";

    }


    /* NO BALL */

    if(
      /noball/i.test(text) ||
      /no ball/i.test(text)
    ){

      value = "NB";
      cls = "ballNB";

    }


    /* BYE */

    if(
      /bye/i.test(text) &&
      !/legbye/i.test(text) &&
      !/leg bye/i.test(text)
    ){

      value = "B";
      cls = "ballExtra";

    }


    /* LEG BYE */

    if(
      /legbye/i.test(text) ||
      /leg bye/i.test(text)
    ){

      value = "LB";
      cls = "ballExtra";

    }


    const div =
      document.createElement("div");

    div.className =
      "ball " + cls;

    div.textContent =
      value;

    row.appendChild(div);

  });

}


/* ========================================
   THEME
======================================== */

function theme(data){

  const overlay =
    $("overlay");

  overlay.classList.remove(
    "theme-neon",
    "theme-green",
    "theme-gold",
    "theme-red",
    "theme-rainbow"
  );

  const t =
    data.theme || "blue";

  if(t === "neon"){
    overlay.classList.add("theme-neon");
  }

  if(t === "green"){
    overlay.classList.add("theme-green");
  }

  if(t === "gold"){
    overlay.classList.add("theme-gold");
  }

  if(t === "red"){
    overlay.classList.add("theme-red");
  }

  if(t === "rainbow"){
    overlay.classList.add("theme-rainbow");
  }

}


/* ========================================
   MODE
======================================== */

function mode(data){

  const overlay =
    $("overlay");

  overlay.classList.remove(
    "mode-mini"
  );

  if(data.mode === "mini"){

    overlay.classList.add(
      "mode-mini"
    );

  }

}


/* ========================================
   FIREBASE LIVE UPDATE
======================================== */

onValue(
  liveRef,
  snapshot => {

    const data =
      snapshot.val();

    if(!data){

      return;

    }


    /* ==============================
       TEAMS
    ============================== */

    const batting =
      getTeam(
        data,
        data.battingTeam || "A"
      );

    const bowling =
      getTeam(
        data,
        data.bowlingTeam || "B"
      );


    $("batTeam")
      .textContent =
      batting;


    $("bowlTeam")
      .textContent =
      bowling;


    /* ==============================
       BATTERS
    ============================== */

    const striker =
      data.striker ||
      data.b1 ||
      data.batsman1 ||
      "STRIKER";


    const nonStriker =
      data.nonStriker ||
      data.b2 ||
      data.batsman2 ||
      "NON-STRIKER";


    const strikerData =
      getBattingStats(
        data,
        striker
      );


    const nonData =
      getBattingStats(
        data,
        nonStriker
      );


    $("striker")
      .textContent =
      striker;


    $("nonStriker")
      .textContent =
      nonStriker;


    $("strikerRuns")
      .textContent =
      num(
        strikerData.runs
      );


    $("strikerBalls")
      .textContent =
      num(
        strikerData.balls
      );


    $("nonRuns")
      .textContent =
      num(
        nonData.runs
      );


    $("nonBalls")
      .textContent =
      num(
        nonData.balls
      );


    /* ==============================
       SCORE
    ============================== */

    const runs =
      num(data.runs);

    const wickets =
      num(data.wickets);

    $("score")
      .textContent =
      runs + "-" + wickets;


    const legalBalls =
      num(
        data.legalBalls ??
        data.balls
      );


    $("overs")
      .textContent =
      overs(legalBalls)
      + " ("
      + legalBalls
      + ")";


    /* ==============================
       MATCH NAME
    ============================== */

    const match =
      data.matchName ||
      (
        shortName(batting)
        + " v "
        + shortName(bowling)
      );


    $("matchName")
      .textContent =
      match;


    /* ==============================
       CRR
    ============================== */

    let crr =
      num(
        data.currentRunRate
      );

    if(
      !crr &&
      legalBalls > 0
    ){

      crr =
        runs /
        (legalBalls / 6);

    }


    $("crr")
      .textContent =
      crr.toFixed(2);


    /* ==============================
       RRR
    ============================== */

    let rrr =
      num(
        data.requiredRunRate
      );

    if(
      !rrr &&
      data.target &&
      legalBalls <
      num(data.maxOvers) * 6
    ){

      const remaining =
        num(data.maxOvers) * 6
        - legalBalls;

      const runsNeeded =
        num(data.target) - runs;

      if(
        remaining > 0 &&
        runsNeeded > 0
      ){

        rrr =
          runsNeeded /
          (remaining / 6);

      }

    }


    $("rrr")
      .textContent =
      rrr.toFixed(2);


    /* ==============================
       BOWLER
    ============================== */

    const bowler =
      data.bowler ||
      "BOWLER";


    const bowlerData =
      getBowlerStats(
        data,
        bowler
      );


    $("bowler")
      .textContent =
      bowler;


    $("bowlerFigures")
      .textContent =
      overs(
        bowlerData.balls
      )
      + " O • "
      + num(
        bowlerData.runs
      )
      + " R • "
      + num(
        bowlerData.wickets
      )
      + " W";


    /* ==============================
       BALLS
    ============================== */

    drawBalls(data);


    /* ==============================
       THEME
    ============================== */

    theme(data);


    /* ==============================
       MODE
    ============================== */

    mode(data);

  }

);

</script>

</body>
</html>
