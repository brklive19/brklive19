<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRKLIVE19 V4 Overlay</title>

<style>
:root{
  --c1:#00eaff;
  --c2:#006eff;
  --bg:#06101d;
  --panel:#0b1930;
  --text:#fff;
  --muted:#b9c9e5;
  --gold:#ffd12f;
  --green:#20e070;
  --red:#ff3158;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:transparent!important;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
}

body{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:2.2vw;
}

/* MAIN LOWER THIRD */

.overlay{
  width:min(1800px,96vw);
  position:relative;
  border-radius:18px;
  overflow:hidden;

  background:
    linear-gradient(
      110deg,
      rgba(3,12,25,.98),
      rgba(8,28,58,.98),
      rgba(4,12,24,.98)
    );

  border:2px solid var(--c1);

  box-shadow:
    0 0 18px color-mix(in srgb,var(--c1) 45%,transparent),
    0 0 45px rgba(0,0,0,.8);
}

/* TOP LINE */

.topLine{
  height:5px;
  background:linear-gradient(
    90deg,
    var(--c1),
    var(--c2),
    var(--gold),
    var(--c1)
  );
}

/* MAIN ROW */

.mainRow{
  display:grid;
  grid-template-columns:
    1.15fr
    1.55fr
    1fr
    1.45fr
    1.15fr;

  align-items:stretch;
  min-height:105px;
}

/* TEAM */

.team{
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:10px 16px;
  background:linear-gradient(
    90deg,
    rgba(0,0,0,.45),
    transparent
  );
}

.team.right{
  text-align:right;
  background:linear-gradient(
    270deg,
    rgba(0,0,0,.45),
    transparent
  );
}

.teamName{
  font-size:clamp(18px,2vw,34px);
  font-weight:900;
  text-transform:uppercase;
}

.teamShort{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

/* BATTERS */

.batters{
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:8px 12px;
  border-left:1px solid #ffffff20;
  border-right:1px solid #ffffff20;
}

.batter{
  display:grid;
  grid-template-columns:12px 1fr auto;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:3px 6px;
  border-radius:7px;
}

.batter.striker{
  background:linear-gradient(
    90deg,
    rgba(0,234,255,.25),
    transparent
  );
}

.strikeDot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:transparent;
}

.striker .strikeDot{
  background:var(--gold);
  box-shadow:0 0 8px var(--gold);
}

.batterName{
  font-size:clamp(14px,1.4vw,23px);
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.batterScore{
  font-size:clamp(15px,1.5vw,25px);
  font-weight:900;
}

.batterBalls{
  color:var(--muted);
  font-size:11px;
  margin-left:3px;
}

/* SCORE BOX */

.scoreBox{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  background:
    linear-gradient(
      145deg,
      rgba(0,100,255,.65),
      rgba(0,20,60,.95)
    );

  border-left:2px solid var(--c1);
  border-right:2px solid var(--c1);

  padding:7px;
}

.score{
  font-size:clamp(32px,4vw,62px);
  line-height:1;
  font-weight:1000;
  letter-spacing:-2px;
}

.overs{
  margin-top:5px;
  font-size:clamp(13px,1.4vw,22px);
  font-weight:900;
  color:#d9e8ff;
}

.target{
  margin-top:3px;
  color:var(--gold);
  font-size:12px;
  font-weight:800;
}

/* BOWLER */

.bowlerBox{
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:9px 14px;
}

.bowlerTitle{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
}

.bowlerName{
  font-size:clamp(16px,1.6vw,27px);
  font-weight:900;
  margin:2px 0;
}

.bowlerStats{
  font-size:12px;
  font-weight:700;
}

.economy{
  color:var(--gold);
}

/* BALL HISTORY */

.ballRow{
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 12px 8px;
  border-top:1px solid #ffffff18;
  overflow:hidden;
}

.ballTitle{
  font-size:10px;
  color:var(--muted);
  margin-right:4px;
}

.ball{
  min-width:25px;
  height:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#263552;
  font-size:11px;
  font-weight:900;
}

.ball.four{
  background:#087cff;
  box-shadow:0 0 8px #087cff99;
}

.ball.six{
  background:#a000ff;
  box-shadow:0 0 9px #a000ff99;
}

.ball.wicket{
  background:var(--red);
  box-shadow:0 0 9px #ff315899;
}

.ball.extra{
  background:#c98500;
  color:#111;
}

/* TO WIN */

.toWin{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:100%;
  margin-bottom:8px;

  padding:7px 18px;
  border-radius:10px;

  background:rgba(3,10,22,.96);
  border:1px solid var(--gold);

  color:#fff;
  font-size:13px;
  font-weight:900;

  box-shadow:0 0 15px #0008;
}

.toWin b{
  color:var(--gold);
}

/* CUSTOM LOWER THIRD */

.customLower{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(100% + 55px);

  display:none;

  min-width:300px;
  max-width:80%;

  padding:9px 22px;

  border-radius:10px;
  border:2px solid var(--c1);

  background:linear-gradient(
    90deg,
    rgba(4,13,28,.98),
    rgba(10,30,60,.98)
  );

  text-align:center;
  font-size:16px;
  font-weight:900;
}

.customLower.show{
  display:block;
}

/* ANIMATION MESSAGE */

.animation{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  z-index:50;
}

.animation.show{
  display:flex;
}

.animText{
  font-size:clamp(70px,12vw,190px);
  font-weight:1000;
  text-transform:uppercase;

  text-shadow:
    0 0 10px #fff,
    0 0 30px var(--c1),
    0 0 70px var(--c2);

  animation:pop .9s ease forwards;
}

@keyframes pop{
  0%{
    opacity:0;
    transform:scale(.2) rotate(-8deg);
  }
  30%{
    opacity:1;
    transform:scale(1.15) rotate(2deg);
  }
  70%{
    opacity:1;
    transform:scale(1);
  }
  100%{
    opacity:0;
    transform:scale(1.2);
  }
}

.animFour .animText{
  color:#00d9ff;
}

.animSix .animText{
  color:#d000ff;
}

.animWicket .animText{
  color:#ff3158;
}

.animFreeHit .animText{
  color:#ffd12f;
}

.animHat .animText{
  color:#20e070;
}

/* HIDE */

.hidden{
  display:none!important;
}

/* MOBILE */

@media(max-width:800px){

  .overlay{
    width:97vw;
    border-radius:12px;
  }

  .mainRow{
    grid-template-columns:
      .9fr
      1.3fr
      1fr
      1.2fr
      .9fr;
    min-height:82px;
  }

  .team{
    padding:6px;
  }

  .teamName{
    font-size:13px;
  }

  .teamShort{
    font-size:8px;
  }

  .batters{
    padding:4px;
  }

  .batterName{
    font-size:11px;
  }

  .batterScore{
    font-size:12px;
  }

  .batterBalls{
    font-size:8px;
  }

  .score{
    font-size:28px;
  }

  .overs{
    font-size:11px;
  }

  .bowlerBox{
    padding:5px;
  }

  .bowlerName{
    font-size:12px;
  }

  .bowlerStats{
    font-size:8px;
  }

  .ballRow{
    padding:4px;
  }

  .ball{
    min-width:19px;
    height:19px;
    font-size:8px;
  }

  .ballTitle{
    display:none;
  }
}
</style>
</head>

<body>

<div id="overlay" class="overlay">

  <div class="topLine"></div>

  <div id="toWin" class="toWin">
    TO WIN <b id="winRuns">—</b>
    RUNS FROM <b id="winBalls">—</b> BALLS
  </div>

  <div id="customLower" class="customLower"></div>

  <div class="mainRow">

    <!-- BATTING TEAM -->

    <div class="team">

      <div id="batTeam" class="teamName">
        TEAM A
      </div>

      <div id="batShort" class="teamShort">
        BATTING
      </div>

    </div>


    <!-- BATTERS -->

    <div class="batters">

      <div id="batter1" class="batter striker">

        <span class="strikeDot"></span>

        <span id="b1name" class="batterName">
          Striker
        </span>

        <span>
          <b id="b1runs">0</b>
          <span class="batterBalls">
            (<span id="b1balls">0</span>)
          </span>
        </span>

      </div>


      <div id="batter2" class="batter">

        <span class="strikeDot"></span>

        <span id="b2name" class="batterName">
          Non-Striker
        </span>

        <span>
          <b id="b2runs">0</b>
          <span class="batterBalls">
            (<span id="b2balls">0</span>)
          </span>
        </span>

      </div>

    </div>


    <!-- SCORE -->

    <div class="scoreBox">

      <div id="score" class="score">
        0/0
      </div>

      <div id="overs" class="overs">
        0.0 OV
      </div>

      <div id="target" class="target">
        TARGET —
      </div>

    </div>


    <!-- BOWLER -->

    <div class="bowlerBox">

      <div class="bowlerTitle">
        CURRENT BOWLER
      </div>

      <div id="bowler" class="bowlerName">
        Bowler
      </div>

      <div id="bowlerStats" class="bowlerStats">
        0.0 O • 0 R • 0 W
        <span class="economy">
          Eco 0.00
        </span>
      </div>

    </div>


    <!-- BOWLING TEAM -->

    <div class="team right">

      <div id="bowlTeam" class="teamName">
        TEAM B
      </div>

      <div class="teamShort">
        BOWLING
      </div>

    </div>

  </div>


  <!-- BALL BY BALL -->

  <div class="ballRow">

    <span class="ballTitle">
      THIS OVER
    </span>

    <div id="balls">
      <span class="ball">—</span>
    </div>

  </div>

</div>


<!-- ANIMATION -->

<div id="animation" class="animation">

  <div id="animText" class="animText">
    FOUR!
  </div>

</div>


<script type="module">
  const firebaseConfig = {
  apiKey: "AIzaSyBLWq1bqJ32F2cg3mqYQ0uwXcS3zvTA3A4",
  authDomain: "brklive19-2bab4.firebaseapp.com",
  databaseURL: "https://brklive19-2bab4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "brklive19-2bab4",
  storageBucket: "brklive19-2bab4.firebasestorage.app",
  messagingSenderId: "294058533898",
  appId: "1:294058533898:web:4996705937e969939cabf3",
  measurementId: "G-RW18E7LVEX"
};

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const liveRef = ref(db, "liveScore");

const $ = id => document.getElementById(id);

let previousRuns = 0;
let previousWickets = 0;
let previousBalls = 0;
let previousEventsLength = 0;


/* =========================
   HELPERS
========================= */

function num(v){
  return Number(v) || 0;
}

function oversFromBalls(balls){
  balls = num(balls);
  return Math.floor(balls / 6) + "." + (balls % 6);
}

function teamName(data, side){
  if(side === "A"){
    return data.teamA || "TEAM A";
  }

  return data.teamB || "TEAM B";
}

function batterStats(data, name){

  if(
    data.batters &&
    name &&
    data.batters[name]
  ){
    return data.batters[name];
  }

  return {
    runs: 0,
    balls: 0,
    fours: 0,
    sixes: 0
  };
}

function bowlerStats(data, name){

  if(
    data.bowlers &&
    name &&
    data.bowlers[name]
  ){
    return data.bowlers[name];
  }

  return {
    balls: 0,
    runs: 0,
    wickets: 0
  };
}


/* =========================
   TARGET / REQUIRED RUNS
========================= */

function updateTarget(data){

  const target = num(data.target);

  if(!target || num(data.innings) !== 2){

    $("target").textContent = "TARGET —";

    $("toWin").style.display = "none";

    return;
  }

  const runs = num(data.runs);
  const legalBalls = num(data.legalBalls);

  const runsNeeded = Math.max(target - runs, 0);

  const maxBalls =
    num(data.maxOvers) * 6;

  const ballsRemaining =
    Math.max(maxBalls - legalBalls, 0);

  $("target").textContent =
    "TARGET " + target;

  if(runsNeeded > 0){

    $("winRuns").textContent =
      runsNeeded;

    $("winBalls").textContent =
      ballsRemaining;

    $("toWin").style.display = "block";

  }else{

    $("toWin").style.display = "none";

  }
}


/* =========================
   BALL DISPLAY
========================= */

function getBallValue(event){

  const text =
    String(event || "").toLowerCase();

  if(text.includes("wicket"))
    return {
      value:"W",
      className:"wicket"
    };

  if(text.includes("six"))
    return {
      value:"6",
      className:"six"
    };

  if(text.includes("4 run") ||
     text.includes("4 run") ||
     text === "4")
    return {
      value:"4",
      className:"four"
    };

  if(text.includes("wide"))
    return {
      value:"Wd",
      className:"extra"
    };

  if(text.includes("noball") ||
     text.includes("no ball"))
    return {
      value:"Nb",
      className:"extra"
    };

  if(text.includes("legbye"))
    return {
      value:"Lb",
      className:"extra"
    };

  if(text.includes("bye"))
    return {
      value:"B",
      className:"extra"
    };

  const match =
    text.match(/(\d+)\s*run/);

  if(match){

    const r = Number(match[1]);

    if(r === 4)
      return {
        value:"4",
        className:"four"
      };

    if(r === 6)
      return {
        value:"6",
        className:"six"
      };

    return {
      value:String(r),
      className:""
    };
  }

  return {
    value:"•",
    className:""
  };
}


function renderBalls(data){

  const container = $("balls");

  container.innerHTML = "";

  const events =
    Array.isArray(data.events)
      ? data.events
      : [];

  const lastEvents =
    events.slice(-6);

  if(!lastEvents.length){

    const x =
      document.createElement("span");

    x.className = "ball";
    x.textContent = "—";

    container.appendChild(x);

    return;
  }

  lastEvents.forEach(event => {

    const info =
      getBallValue(event);

    const x =
      document.createElement("span");

    x.className =
      "ball " + info.className;

    x.textContent =
      info.value;

    container.appendChild(x);

  });

}


/* =========================
   ANIMATIONS
========================= */

function showAnimation(type){

  const animation =
    $("animation");

  const text =
    $("animText");

  animation.className =
    "animation";

  let message = "";

  if(type === "four"){
    message = "FOUR!";
    animation.classList.add("show","animFour");
  }

  if(type === "six"){
    message = "SIX!";
    animation.classList.add("show","animSix");
  }

  if(type === "wicket"){
    message = "WICKET!";
    animation.classList.add("show","animWicket");
  }

  if(type === "freehit"){
    message = "FREE HIT!";
    animation.classList.add("show","animFreeHit");
  }

  if(type === "hattrick"){
    message = "HAT-TRICK BALL!";
    animation.classList.add("show","animHat");
  }

  text.textContent = message;

  setTimeout(() => {

    animation.className =
      "animation";

  },1000);
}


/* =========================
   DETECT SCORE ANIMATION
========================= */

function detectAnimation(data){

  const runs =
    num(data.runs);

  const wickets =
    num(data.wickets);

  const balls =
    num(data.legalBalls);

  if(
    runs > previousRuns &&
    Array.isArray(data.events)
  ){

    const event =
      data.events[data.events.length - 1];

    const text =
      String(event || "").toLowerCase();

    if(
      text.includes("6 run") ||
      text.includes("six")
    ){

      showAnimation("six");

    }else if(
      text.includes("4 run") ||
      text.includes("four")
    ){

      showAnimation("four");

    }

  }

  if(wickets > previousWickets){

    showAnimation("wicket");

  }

  /*
    Free hit / hat trick can be sent
    from scorer.html using event text.
  */

  if(Array.isArray(data.events)){

    const last =
      String(
        data.events[data.events.length - 1] || ""
      ).toLowerCase();

    if(last.includes("free hit")){

      showAnimation("freehit");

    }

    if(last.includes("hat-trick") ||
       last.includes("hattrick")){

      showAnimation("hattrick");

    }

  }

  previousRuns = runs;
  previousWickets = wickets;
  previousBalls = balls;
}


/* =========================
   CUSTOM LOWER THIRD
========================= */

function customLowerThird(data){

  const box =
    $("customLower");

  const message =
    data.customLowerThird ||
    data.lowerThird ||
    data.customMessage ||
    "";

  if(!message){

    box.classList.remove("show");
    box.textContent = "";

    return;
  }

  box.textContent =
    message;

  box.classList.add("show");
}


/* =========================
   FIREBASE LIVE UPDATE
========================= */

onValue(liveRef, snapshot => {

  const data =
    snapshot.val();

  if(!data)
    return;


  /* TEAM */

  const battingSide =
    data.battingTeam || "A";

  const bowlingSide =
    data.bowlingTeam ||
    (battingSide === "A" ? "B" : "A");


  $("batTeam").textContent =
    teamName(data, battingSide);

  $("bowlTeam").textContent =
    teamName(data, bowlingSide);


  /* BATTERS */

  const striker =
    data.b1 ||
    data.batsman1 ||
    data.striker ||
    "Striker";

  const nonStriker =
    data.b2 ||
    data.batsman2 ||
    data.nonStriker ||
    "Non-Striker";


  const b1 =
    batterStats(data, striker);

  const b2 =
    batterStats(data, nonStriker);


  $("b1name").textContent =
    striker;

  $("b2name").textContent =
    nonStriker;


  $("b1runs").textContent =
    num(
      b1.runs ??
      data.batsman1Runs
    );

  $("b1balls").textContent =
    num(
      b1.balls ??
      data.batsman1Balls
    );


  $("b2runs").textContent =
    num(
      b2.runs ??
      data.batsman2Runs
    );

  $("b2balls").textContent =
    num(
      b2.balls ??
      data.batsman2Balls
    );


  /* STRIKER INDICATOR */

  $("batter1").classList.remove("striker");
  $("batter2").classList.remove("striker");

  if(
    striker &&
    striker !== "Striker"
  ){

    $("batter1").classList.add("striker");

  }


  /* SCORE */

  const runs =
    num(data.runs);

  const wickets =
    num(data.wickets);

  $("score").textContent =
    runs + "/" + wickets;


  /* OVERS */

  const legalBalls =
    num(
      data.legalBalls ??
      data.balls
    );

  $("overs").textContent =
    oversFromBalls(legalBalls) +
    " OV";


  /* BOWLER */

  const bowler =
    data.bowler ||
    "Bowler";

  const bo =
    bowlerStats(data, bowler);


  $("bowler").textContent =
    bowler;


  const eco =
    bo.balls
      ? (
          bo.runs /
          (bo.balls / 6)
        ).toFixed(2)
      : "0.00";


  $("bowlerStats").innerHTML =
    oversFromBalls(bo.balls) +
    " O • " +
    num(bo.runs) +
    " R • " +
    num(bo.wickets) +
    " W " +
    '<span class="economy">Eco ' +
    eco +
    "</span>";


  /* TARGET */

  updateTarget(data);


  /* BALLS */

  renderBalls(data);


  /* CUSTOM MESSAGE */

  customLowerThird(data);


  /* ANIMATION */

  detectAnimation(data);

});
</script>

</body>
</html>
