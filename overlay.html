<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRKLIVE19 V5 • 3D Broadcast Overlay</title>
<style>
:root{
  --cyan:#00b8e8;--cyan2:#08d7ff;--navy:#071a58;--navy2:#102875;
  --pink:#d600ff;--yellow:#ffd900;--green:#16b86a;--red:#f3274f;
  --white:#fff;--muted:#d7def1;--dark:#08163e;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#fff}
body{display:flex;align-items:flex-end;justify-content:center;padding:2.4vw 3vw}

.overlay{
  width:min(1760px,96vw);position:relative;overflow:visible;
}
.overlay.hidden{display:none}

.frame{position:relative;height:142px;overflow:hidden;background:var(--navy);box-shadow:0 0 0 1px #ffffff30 inset}
.frame:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.08),rgba(255,255,255,.03) 50%,rgba(0,0,0,.12));pointer-events:none}

/* angled team ends */
.teamPanel{position:absolute;top:0;bottom:0;width:18%;display:flex;align-items:center;padding:0 24px;z-index:2;overflow:hidden}
.teamPanel.left{left:0;background:linear-gradient(100deg,var(--cyan),#08a8d1);clip-path:polygon(0 0,100% 0,84% 100%,0 100%)}
.teamPanel.right{right:0;background:linear-gradient(80deg,var(--yellow),#f1ce00);clip-path:polygon(16% 0,100% 0,100% 100%,0 100%);justify-content:flex-end;text-align:right}
.teamPanel .teamName{font-size:clamp(20px,2.15vw,40px);font-weight:1000;text-transform:uppercase;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:0 2px 2px #0005}
.teamPanel.right .teamName{color:#071029;text-shadow:none}

/* center content area */
.content{position:absolute;left:16.5%;right:16.5%;top:0;bottom:0;display:grid;grid-template-columns:30% 31% 39%;z-index:3}

/* batters */
.batters{background:linear-gradient(90deg,#0b1d65,#12266c);padding:13px 18px 8px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.batter{height:49%;display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:7px;border-bottom:1px solid #ffffff16}
.batter:last-child{border-bottom:0}
.batter.striker{background:linear-gradient(90deg,rgba(255,255,255,.10),transparent)}
.strike{font-size:18px;color:transparent;font-weight:1000;text-align:center}
.striker .strike{color:var(--yellow)}
.batterName{font-size:clamp(15px,1.5vw,26px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.batterScore{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.batterScore b{font-size:clamp(21px,2vw,34px);color:var(--yellow)}
.batterScore span{font-size:clamp(12px,1vw,18px);font-weight:800;color:#fff}

/* score block */
.scorePanel{background:#fff;color:#142052;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:7px 8px}
.scorePanel:before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:4px;background:linear-gradient(#00b9ed,#d800ff)}
.scorePanel:after{content:"";position:absolute;right:-1px;top:0;bottom:0;width:4px;background:linear-gradient(#d800ff,#00b9ed)}
.matchTitle{font-size:clamp(13px,1.25vw,23px);font-weight:900;margin-bottom:7px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.scorePill{min-width:78%;padding:7px 20px;border-radius:15px;background:linear-gradient(90deg,#00b9ee,#d700ff);color:#fff;text-align:center;font-size:clamp(31px,3.3vw,58px);line-height:.95;font-weight:1000;letter-spacing:-1px;box-shadow:0 7px 14px #c900ff2e}
.scoreMeta{display:flex;align-items:center;gap:28px;margin-top:7px;font-size:clamp(12px,1.15vw,21px);font-weight:900}
.crrRrr{display:flex;gap:30px;margin-top:7px;font-size:clamp(10px,.95vw,17px);font-weight:900}
.crrRrr b{color:#17205a}

/* bowler end */
.bowlerPanel{background:linear-gradient(90deg,#10246b,#091a58);padding:12px 18px 7px;display:flex;flex-direction:column;justify-content:center;min-width:0;position:relative}
.bowlerTop{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px}
.bowlerName{font-size:clamp(16px,1.65vw,29px);font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.bowlerStats{font-size:clamp(12px,1.1vw,19px);font-weight:800;white-space:nowrap;color:#fff}
.live{color:#ff3158;font-size:12px;font-weight:1000;white-space:nowrap}
.live:before{content:"●";margin-right:5px}

/* CURRENT OVER BALLS */
.currentOver{margin-top:10px;display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden}
.currentOverLabel{font-size:10px;font-weight:1000;color:#bfcceb;letter-spacing:.7px;white-space:nowrap;margin-right:2px}
.ballList{display:flex;gap:6px;min-width:0;overflow:hidden;align-items:center}
.ball{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:#18367f;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:1000;box-shadow:inset 0 0 0 1px #ffffff16}
.ball.four{background:#7b35d7}.ball.six{background:#08a8f5}.ball.wicket{background:var(--red)}.ball.extra{background:#e7a500;color:#111}.ball.zero{background:#25437e}.ball.latest{box-shadow:0 0 0 2px #fff,0 0 12px #fff8}

/* ============================================================
   FULL FRAME SCORECARD OVERLAY
   ============================================================ */
.scorecard-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:200;
  padding:40px;
  font-family:Arial,Helvetica,sans-serif;
}
.scorecard-overlay.show{display:flex}
.scorecard-overlay .card{
  background:rgba(10,22,50,0.92);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;
  padding:28px 32px;
  max-width:1200px;
  width:100%;
  max-height:85vh;
  overflow-y:auto;
  box-shadow:0 30px 80px rgba(0,0,0,0.8);
  position:relative;
}
.scorecard-overlay .card::-webkit-scrollbar{width:4px}
.scorecard-overlay .card::-webkit-scrollbar-track{background:transparent}
.scorecard-overlay .card::-webkit-scrollbar-thumb{background:var(--cyan);border-radius:10px}

.scorecard-overlay .close-btn{
  position:absolute;
  top:12px;
  right:16px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:30px;
  color:#fff;
  padding:6px 18px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  z-index:5;
  transition:all .2s;
}
.scorecard-overlay .close-btn:hover{
  background:rgba(255,255,255,0.15);
  transform:scale(1.04);
}

.scorecard-overlay .sc-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:14px;
  border-bottom:2px solid rgba(255,255,255,0.06);
  margin-bottom:18px;
  flex-wrap:wrap;
  gap:8px;
}
.scorecard-overlay .sc-header .team-name{
  font-size:clamp(28px,3.5vw,48px);
  font-weight:1000;
  color:#fff;
  letter-spacing:-0.5px;
}
.scorecard-overlay .sc-header .team-name small{
  font-size:clamp(14px,1.2vw,22px);
  font-weight:600;
  color:var(--cyan);
  margin-left:10px;
}
.scorecard-overlay .sc-header .score-total{
  font-size:clamp(32px,4vw,56px);
  font-weight:1000;
  color:var(--yellow);
}
.scorecard-overlay .sc-header .score-total small{
  font-size:clamp(16px,1.5vw,26px);
  color:var(--muted);
  font-weight:600;
}
.scorecard-overlay .sc-header .overs-info{
  font-size:clamp(14px,1.2vw,20px);
  color:var(--muted);
  font-weight:600;
}

.scorecard-overlay .sc-table-wrap{
  overflow-x:auto;
  margin:6px 0 14px;
}
.scorecard-overlay table{
  width:100%;
  border-collapse:collapse;
  font-size:clamp(13px,1.1vw,18px);
}
.scorecard-overlay table th{
  text-align:left;
  color:var(--muted);
  font-weight:600;
  padding:8px 8px 6px 8px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  font-size:clamp(11px,0.9vw,15px);
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.scorecard-overlay table td{
  padding:6px 8px;
  border-bottom:1px solid rgba(255,255,255,0.03);
  color:var(--white);
}
.scorecard-overlay table tr:hover td{
  background:rgba(255,255,255,0.04);
}
.scorecard-overlay table .out{color:var(--red);font-weight:600}
.scorecard-overlay table .notout{color:var(--green);font-weight:600}
.scorecard-overlay table .dismissal{
  color:var(--muted);
  font-size:clamp(10px,0.8vw,14px);
  font-weight:400;
}
.scorecard-overlay table .extras-row td{
  color:var(--muted);
  font-style:italic;
  font-size:clamp(11px,0.9vw,15px);
  padding-top:10px;
  border-top:1px solid rgba(255,255,255,0.04);
}
.scorecard-overlay table .total-row td{
  font-weight:800;
  color:#fff;
  font-size:clamp(15px,1.2vw,20px);
  padding-top:10px;
  border-top:2px solid rgba(255,255,255,0.08);
}
.scorecard-overlay .sc-footer{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  padding-top:14px;
  border-top:1px solid rgba(255,255,255,0.04);
  font-size:clamp(12px,1vw,16px);
  color:var(--muted);
}
.scorecard-overlay .sc-footer .extras-detail span{margin-right:14px}
.scorecard-overlay .sc-footer .crr-rrr span{margin-right:20px;font-weight:600;color:#fff}

/* ===== TOP TARGET ===== */
.target{position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:#4e217e;color:#fff;padding:7px 22px;border-radius:7px 7px 0 0;font-size:clamp(11px,1vw,18px);font-weight:1000;white-space:nowrap;display:none}

/* ============================================================
   LOWER THIRD BANNERS – EXACT 1 inch × 4 inches (96px × 384px)
   ============================================================ */
.banner{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  width:384px;
  height:96px;
  line-height:96px;
  padding:0 16px;
  border-radius:7px;
  background:linear-gradient(90deg,#08164a,#152e79);
  border:2px solid var(--cyan2);
  font-size:clamp(16px, 1.5vw, 28px);
  font-weight:1000;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  display:none;
  z-index:120;
  box-shadow:0 8px 25px #0008;
  text-transform:uppercase;
  text-align:center;
  box-sizing:border-box;
}
.banner.show{display:block}

/* Each banner type gets its own border colour */
.banner.tournament{border-color:var(--yellow)}
.banner.toss{border-color:#35e995}
.banner.result{background:linear-gradient(90deg,#162c70,#711e8e);border-color:#fff}
.banner.player{background:linear-gradient(90deg,#101f63,#4b1d88);border-color:var(--yellow)}

/* Custom lower third – same height as the main frame (142px) */
.custom{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:14px;
  width:min(1760px,96vw);
  height:142px;
  padding:0 30px;
  border-radius:10px;
  background:linear-gradient(135deg,#071a58,#102875);
  border:2px solid var(--cyan2);
  font-size:clamp(22px,3vw,52px);
  font-weight:1000;
  white-space:nowrap;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  z-index:40;
  box-shadow:0 10px 30px #0008;
  text-transform:uppercase;
  box-sizing:border-box;
}
.custom.show{display:flex}

/* When custom is active, hide the normal frame */
.overlay.customMode .frame{visibility:hidden}


/* ===== CENTERED LOWER-THIRD GRAPHICS ===== */
.banner{bottom:14px;z-index:120;}
.banner.partnership{background:linear-gradient(90deg,#17316f,#2b0d63);border-color:var(--cyan2);}
.overlay.bannerMode .frame{visibility:hidden;}
.brkLogo{position:fixed;right:2.2vw;bottom:2.2vw;z-index:180;font-size:clamp(18px,2vw,34px);font-weight:1000;letter-spacing:-1px;color:#fff;text-shadow:0 0 10px var(--cyan2),0 0 22px #000;animation:brkPulse 2.2s ease-in-out infinite,brkFloat 4s ease-in-out infinite;pointer-events:none}.brkLogo span{color:var(--cyan2)}
@keyframes brkPulse{0%,100%{filter:drop-shadow(0 0 0 var(--cyan2));transform:scale(1)}50%{filter:drop-shadow(0 0 12px var(--cyan2));transform:scale(1.06)}}
@keyframes brkFloat{0%,100%{margin-bottom:0}50%{margin-bottom:7px}}
/* ===== ANIMATION ===== */
.animation{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:100}
.animation.show{display:flex}
.animText{font-size:clamp(70px,12vw,190px);font-weight:1000;text-transform:uppercase;text-shadow:0 0 10px #fff,0 0 30px var(--cyan2),0 0 70px #000;animation:pop .95s ease forwards}
.animFour .animText{color:#10cfff}.animSix .animText{color:#d100ff}.animWicket .animText{color:#ff3158}.animRunOut .animText{color:#ff3158}.animFreeHit .animText{color:#ffd900}.animHat .animText{color:#22e989}
@keyframes pop{0%{opacity:0;transform:scale(.15) rotate(-8deg)}25%{opacity:1;transform:scale(1.12) rotate(2deg)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.2)}}

/* ===== THEMES ===== */
.theme-neon{--cyan:#ff00e6;--cyan2:#00f7ff;--navy:#15064f;--navy2:#2b0868;--yellow:#7dff00}
.theme-green{--cyan:#13d887;--cyan2:#6dffb8;--navy:#073c2a;--navy2:#0b5a3e;--yellow:#e8ff48}
.theme-gold{--cyan:#ffc400;--cyan2:#fff08a;--navy:#4b2d00;--navy2:#6e4200;--yellow:#fff3a1}
.theme-red{--cyan:#ff3158;--cyan2:#ff7c93;--navy:#4c0b1a;--navy2:#711329;--yellow:#ffd24a}
.theme-rainbow{--cyan:#00d9ff;--cyan2:#ff00e6;--navy:#11145e;--navy2:#5a0a78;--yellow:#ffd900}
.theme-theme2{
  --cyan:#00ff88;
  --cyan2:#88ffcc;
  --navy:rgba(10,20,30,0.85);
  --navy2:rgba(20,40,60,0.85);
  --yellow:#00ffaa;
  --pink:#ff66aa;
}
.theme-glass{--cyan:#5ee7ff;--cyan2:#ffffff;--navy:#162a4dcc;--navy2:#284f8dcc;--yellow:#dffbff}
.theme-carbon{--cyan:#8f9aa8;--cyan2:#f0f4f8;--navy:#15181dcc;--navy2:#252a31cc;--yellow:#ffcf45}
.theme-stadium{--cyan:#00f0ff;--cyan2:#a4ffff;--navy:#062d46;--navy2:#0c5272;--yellow:#ffe05a}
.theme-aurora{--cyan:#65ffdf;--cyan2:#8e7dff;--navy:#102d3acc;--navy2:#3d1e65cc;--yellow:#f2ff75}
.theme-metallic{--cyan:#d8e2ea;--cyan2:#ffffff;--navy:#26313dcc;--navy2:#4c5b68cc;--yellow:#ffc94f}
.theme-redblack{--cyan:#ff365f;--cyan2:#ff9bb0;--navy:#180914;--navy2:#3a0c20;--yellow:#ffd44f}

/* ===== V5 3D EFFECTS ===== */
.frame{transform:perspective(1400px) rotateX(1deg);border-radius:10px;box-shadow:0 18px 45px #000b,0 0 0 1px #ffffff24 inset,0 1px 0 #fff3 inset;}
.frame:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 0%,#ffffff0a 42%,#ffffff18 50%,transparent 58%);transform:translateX(-120%);animation:sweep 6s ease-in-out infinite}
.teamPanel{filter:drop-shadow(0 5px 9px #0006)}
.scorePanel{box-shadow:0 10px 24px #0003 inset,0 0 25px #00d9ff18}
.scorePill{transform:translateZ(16px);box-shadow:0 10px 18px #0004,inset 0 1px #fff5}
.ball{box-shadow:inset 0 1px #ffffff22,0 4px 8px #0006}
.banner,.custom,.scorecard{transform:translateZ(25px);backdrop-filter:blur(12px);}
.theme-theme2 .frame{
  background:rgba(10,20,30,0.7);
  backdrop-filter:blur(20px);
  border:2px solid rgba(0,255,136,0.3);
  border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(0,255,136,0.1);
}
.theme-theme2 .teamPanel{
  background:linear-gradient(135deg,rgba(0,255,136,0.15),rgba(0,200,100,0.05));
  backdrop-filter:blur(10px);
  border:1px solid rgba(0,255,136,0.2);
}
.theme-theme2 .scorePanel{
  background:rgba(0,0,0,0.3);
  backdrop-filter:blur(10px);
  border:1px solid rgba(0,255,136,0.2);
}
.theme-theme2 .scorePill{
  background:linear-gradient(135deg,#00ff88,#00ccaa);
  color:#000;
  font-weight:900;
  text-shadow:none;
  box-shadow:0 0 30px rgba(0,255,136,0.3);
}
@keyframes sweep{0%,65%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}

@media(max-width:900px){
  .banner{height:56px;line-height:56px;padding:0 12px;font-size:12px;width:240px;}
  .custom{height:92px;font-size:clamp(14px,2.5vw,24px);padding:0 10px}
  body{padding:1vw}.frame{height:92px}.teamPanel{padding:0 10px}.teamPanel .teamName{font-size:13px}.content{left:16%;right:16%;grid-template-columns:31% 30% 39%}.batters{padding:4px 7px}.batter{gap:3px}.strike{font-size:10px}.batterName{font-size:9px}.batterScore b{font-size:14px}.batterScore span{font-size:8px}.matchTitle{font-size:9px}.scorePill{font-size:24px;padding:5px 8px}.scoreMeta{font-size:8px;gap:10px}.crrRrr{font-size:7px;gap:10px}.bowlerPanel{padding:5px 7px}.bowlerName{font-size:10px}.bowlerStats{font-size:7px}.currentOver{margin-top:4px;gap:3px}.currentOverLabel{font-size:6px}.ball{width:18px;height:18px;flex-basis:18px;font-size:7px}.live{font-size:7px}.target{top:-20px;padding:4px 8px;font-size:7px}
}
</style>
</head>
<body>
<!-- ===== MAIN OVERLAY ===== -->
<div id="overlay" class="overlay">
  <div id="targetTop" class="target">TARGET - <span id="targetValue">—</span></div>

  <!-- Banners are fixed position, not inside .overlay -->
  <div id="bannerTournament" class="banner tournament"></div>
  <div id="bannerMatch" class="banner matchFooter"></div>
  <div id="bannerToss" class="banner toss"></div>
  <div id="bannerResult" class="banner result"></div>
  <div id="bannerPlayer" class="banner player"></div>
  <div id="bannerPartnership" class="banner partnership"></div>
  <div id="custom" class="custom"></div>
  <div id="brkLogo" class="brkLogo" aria-label="BRKLIVE19">BRK<span>LIVE</span>19</div>

  <div class="frame">
    <div class="teamPanel left"><div id="batTeam" class="teamName">TEAM A</div></div>
    <div class="teamPanel right"><div id="bowlTeam" class="teamName">TEAM B</div></div>

    <div class="content">
      <div class="batters">
        <div id="batter1" class="batter striker"><div class="strike">⚡</div><div id="b1name" class="batterName">STRIKER</div><div class="batterScore"><b id="b1runs">0</b><span>(<span id="b1balls">0</span>)</span></div></div>
        <div id="batter2" class="batter"><div class="strike">⚡</div><div id="b2name" class="batterName">NON-STRIKER</div><div class="batterScore"><b id="b2runs">0</b><span>(<span id="b2balls">0</span>)</span></div></div>
      </div>

      <div class="scorePanel">
        <div id="matchTitle" class="matchTitle">League Match</div>
        <div id="scorePill" class="scorePill">0-0</div>
        <div class="scoreMeta"><span id="overs">0.0 (0)</span><span id="inningsLabel">INNINGS 1</span></div>
        <div class="crrRrr"><span>CRR: <b id="crr">0.00</b></span><span>RRR: <b id="rrr">0.00</b></span></div>
      </div>

      <div class="bowlerPanel">
        <div class="bowlerTop"><div id="bowler" class="bowlerName">BOWLER</div><div class="live">LIVE</div></div>
        <div id="bowlerStats" class="bowlerStats">0.0 O • 0 R • 0 W</div>
        <div class="currentOver"><div class="currentOverLabel">THIS OVER</div><div id="balls" class="ballList"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- ===== FULL-FRAME SCORECARD OVERLAY ===== -->
<div id="scorecardOverlay" class="scorecard-overlay">
  <div class="card">
    <button class="close-btn" id="closeScorecardBtn">✕ CLOSE</button>
    <div id="scContent"></div>
  </div>
</div>

<!-- ===== ANIMATION ===== -->
<div id="animation" class="animation"><div id="animText" class="animText">FOUR!</div></div>

<script type="module">
// ============================================================
// FIREBASE SETUP
// ============================================================

const $=id=>document.getElementById(id),num=v=>Number(v)||0;
let previousEventSignature="",previousBroadcastSignature="",animationTimer=null,animationBooted=false;

function oversFromBalls(b){b=num(b);return Math.floor(b/6)+"."+(b%6)}
function teamName(d,s){return s==="A"?(d.teamA||"TEAM A"):(d.teamB||"TEAM B")}
function batterStats(d,n){return d.batters&&n&&d.batters[n]?d.batters[n]:{runs:0,balls:0,fours:0,sixes:0}}
function bowlerStats(d,n){return d.bowlers&&n&&d.bowlers[n]?d.bowlers[n]:{balls:0,runs:0,wickets:0}}
function escapeText(v){return String(v??"")}

// ---- Apply theme (including custom colors) ----
function applyTheme(theme, customColors){
  const classes=["theme-neon","theme-green","theme-gold","theme-red","theme-rainbow","theme-theme2","theme-glass","theme-carbon","theme-stadium","theme-aurora","theme-metallic","theme-redblack"];
  document.body.classList.remove(...classes);

  if (theme === "custom") {
    const c=customColors||{};
    document.documentElement.style.setProperty("--cyan", c.primary || "#00b8e8");
    document.documentElement.style.setProperty("--cyan2", c.primary || "#08d7ff");
    document.documentElement.style.setProperty("--yellow", c.secondary || "#ffd900");
    document.documentElement.style.setProperty("--navy", c.accent || c.secondary || "#071a58");
    document.documentElement.style.setProperty("--navy2", c.accent || c.secondary || "#102875");
    return;
  }

  ["--cyan","--cyan2","--yellow","--navy","--navy2"].forEach(v=>document.documentElement.style.removeProperty(v));
  if(theme && theme !== "blue") document.body.classList.add("theme-"+theme);
}

function parseBallEvent(text){
  const t=String(text||"").toLowerCase().trim();
  if(!t)return null;
  if(t.includes("wicket"))return{v:"W",c:"wicket"};
  if(t.includes("run out"))return{v:"W",c:"wicket"};
  if(t.includes("wide"))return{v:"Wd",c:"extra"};
  if(t.includes("noball")||t.includes("no ball"))return{v:"Nb",c:"extra"};
  if(t.includes("legbye")||t.includes("leg bye"))return{v:"Lb",c:"extra"};
  if(t.includes("bye"))return{v:"B",c:"extra"};
  let m=t.match(/(?:—|-|:)\s*(\d+)\s*run/);
  if(!m)m=t.match(/(\d+)\s*run/);
  if(m){const r=Number(m[1]);return{v:String(r),c:r===4?"four":r===6?"six":r===0?"zero":""}}
  return null;
}

function currentOverEvents(data){
  if(Array.isArray(data.currentOverBalls)&&data.currentOverBalls.length)return data.currentOverBalls;
  const events=Array.isArray(data.events)?data.events:[];
  let start=0;
  for(let i=events.length-1;i>=0;i--){if(/OVER\s+\d+\.\d+\s+COMPLETE/i.test(String(events[i]))){start=i+1;break}}
  return events.slice(start).map(parseBallEvent).filter(Boolean);
}
function renderBalls(data){
  const box=$("balls");box.innerHTML="";
  const list=currentOverEvents(data).slice(-6);
  if(!list.length){const x=document.createElement("span");x.className="ball";x.textContent="—";box.appendChild(x);return}
  list.forEach((b,i)=>{const x=document.createElement("span");x.className="ball "+(b.c||"")+(i===list.length-1?" latest":"");x.textContent=b.v;box.appendChild(x)})
}

function calcCRR(d){const balls=num(d.legalBalls);return balls?(num(d.runs)/(balls/6)).toFixed(2):"0.00"}
function calcRRR(d){if(num(d.innings)!==2||!num(d.target))return"0.00";const need=Math.max(num(d.target)-num(d.runs),0),left=Math.max(num(d.maxOvers)*6-num(d.legalBalls),0);return need&&left?((need/left)*6).toFixed(2):"0.00"}

function deriveResult(d){
  const saved=d.resultText||d.matchResult||"";
  if(saved)return saved;
  if(num(d.innings)!==2||!num(d.target))return "";
  const runs=num(d.runs), target=num(d.target), ballsLeft=Math.max(num(d.maxOvers)*6-num(d.legalBalls),0);
  const chasing=teamName(d,d.battingTeam||"A"), defending=teamName(d,(d.firstInnings||{}).team||((d.battingTeam||"A")==="A"?"B":"A"));
  if(runs>=target)return `${chasing} WON BY ${Math.max(10-num(d.wickets),0)} WICKETS`;
  if(num(d.wickets)>=10||ballsLeft<=0){
    if(runs===target-1)return "MATCH TIED";
    return `${defending} WON BY ${Math.max(target-1-runs,0)} RUNS`;
  }
  return "";
}

function updateTarget(d){
  const target=num(d.target),second=num(d.innings)===2;
  const isCompleted = d.status === 'completed' || d.matchWinner || !!deriveResult(d);
  if(target && second && !isCompleted){
    $("targetTop").style.display="block";
    $("targetValue").textContent=target;
  }else{
    $("targetTop").style.display="none";
  }
}

function showAnimation(type){
  const a=$("animation"),t=$("animText");
  clearTimeout(animationTimer);
  a.className="animation";
  const map={four:["FOUR!","animFour"],six:["SIX!","animSix"],wicket:["WICKET!","animWicket"],runout:["RUN OUT!","animRunOut"],freehit:["FREE HIT!","animFreeHit"],hattrick:["HAT-TRICK BALL!","animHat"]};
  if(!map[type])return;
  t.textContent=map[type][0];
  void t.offsetWidth;
  a.classList.add("show",map[type][1]);
  animationTimer=setTimeout(()=>a.className="animation",1050);
}

function detectAnimation(d){
  const bcast=d.broadcast||{};
  const broadcastId=String(bcast.id||bcast.eventId||"");
  const bsig=broadcastId || (bcast.active?String(bcast.type||""):"");
  if(!animationBooted){previousBroadcastSignature=bsig;previousEventSignature=Array.isArray(d.events)?String(d.events.length)+"|"+String(d.events[d.events.length-1]||""):"";animationBooted=true;return;}
  if(bcast.active&&bsig&&bsig!==previousBroadcastSignature){
    const t=String(bcast.type||"").toLowerCase();
    if(t.includes("free hit"))showAnimation("freehit");else if(t.includes("hat"))showAnimation("hattrick");else if(t.includes("run out"))showAnimation("runout");else if(t.includes("six"))showAnimation("six");else if(t.includes("four"))showAnimation("four");else if(t.includes("wicket"))showAnimation("wicket");
    previousBroadcastSignature=bsig;
  }
  const events=Array.isArray(d.events)?d.events:[];
  const last=String(events[events.length-1]||"");
  const sig=String(events.length)+"|"+last;
  if(sig!==previousEventSignature){
    const t=last.toLowerCase();
    if(t.includes("free hit"))showAnimation("freehit");else if(t.includes("hat-trick")||t.includes("hattrick"))showAnimation("hattrick");else if(t.includes("run out"))showAnimation("runout");else if(t.includes("wicket"))showAnimation("wicket");else if(/\b6\s*run/.test(t))showAnimation("six");else if(/\b4\s*run/.test(t))showAnimation("four");
    previousEventSignature=sig;
  }
}

function bannerText(d){
  const t=d.overlay||{};
  const showTournament=!!(t.showTournament??d.showTournament??false);
  const showMatch=!!(t.showMatch??d.showMatch??false);
  const showToss=!!(t.showToss??d.showToss??false);
  const showResult=!!(t.showResult??d.showResult??false);
  const playerLower=t.playerLower||{};
  const partnership=t.partnership||{};

  const bTournament=$("bannerTournament"), bMatch=$("bannerMatch"), bToss=$("bannerToss");
  const bResult=$("bannerResult"), bPlayer=$("bannerPlayer"), bPartnership=$("bannerPartnership");
  bTournament.textContent=escapeText(d.tournament||"TOURNAMENT");
  bTournament.classList.toggle("show",showTournament&&!!d.tournament);

  bMatch.textContent=escapeText((d.matchName||((d.teamA||"TEAM A")+" VS "+(d.teamB||"TEAM B"))));
  bMatch.classList.toggle("show",showMatch);

  let toss="";
  if(d.tossWinner){const tw=teamName(d,d.tossWinner);toss=tw+" WON THE TOSS AND ELECTED TO "+(d.tossDecision==="bat"?"BAT FIRST":"BOWL FIRST");}
  bToss.textContent=toss; bToss.classList.toggle("show",showToss&&!!toss);

  let playerText="";
  if(playerLower.active){
    const isB1=playerLower.slot!=="b2"; const playerName=isB1?(d.b1||d.striker||playerLower.player):(d.b2||d.nonStriker||playerLower.player);
    if(playerName){const st=batterStats(d,playerName), balls=num(st.balls), runs=num(st.runs); const fours=num(st.fours), sixes=num(st.sixes); const sr=balls?((runs/balls)*100).toFixed(2):"0.00"; playerText=(isB1?"B1":"B2")+" • "+playerName+"  |  "+runs+" ("+balls+")  •  4s "+fours+"  •  6s "+sixes+"  •  SR "+sr;}
  }
  bPlayer.textContent=playerText; bPlayer.classList.toggle("show",!!playerText);

  const pRuns=num(d.partnershipRuns ?? (num((d.batters||{})[d.striker]?.runs)+num((d.batters||{})[d.nonStriker]?.runs)));
  const pBalls=num(d.partnershipBalls ?? d.legalBalls);
  const pNames=[d.striker,d.nonStriker].filter(Boolean).join(" & ");
  const pText=pNames?`PARTNERSHIP • ${pNames} • ${pRuns} RUNS (${oversFromBalls(pBalls)} OV)` : "PARTNERSHIP";
  bPartnership.textContent=pText; bPartnership.classList.toggle("show",!!partnership.active&&!!pNames);

  const result=deriveResult(d);
  bResult.textContent=result; bResult.classList.toggle("show",showResult&&!!result);

  const anyBanner=[bTournament,bMatch,bToss,bResult,bPlayer,bPartnership].some(el=>el.classList.contains("show"));
  $("overlay").classList.toggle("bannerMode",anyBanner);
  stackFooterBanners();
}

function customLower(d){
  const c=d.customLower||{}; const message=c.active?c.text:(typeof d.customLowerThird==="string"?d.customLowerThird:"");
  const customEl=$("custom"), overlay=$("overlay");
  if(message){customEl.textContent=message;customEl.classList.add("show");overlay.classList.add("customMode");}
  else{customEl.textContent="";customEl.classList.remove("show");overlay.classList.remove("customMode");}
}

// ---- Center every lower-third graphic and keep the newest visible item nearest the bottom ----
function stackFooterBanners(){
  const items=["bannerTournament","bannerMatch","bannerToss","bannerResult","bannerPlayer","bannerPartnership"].map(id=>$(id)).filter(el=>el&&el.classList.contains("show"));
  let bottomOffset=14;
  for(const el of items.slice().reverse()){el.style.bottom=bottomOffset+"px";el.style.left="50%";el.style.transform="translateX(-50%)";bottomOffset+=el.offsetHeight+8;}
}

// ---- Full scorecard render ----
function renderFullScorecard(d){
  const container = document.getElementById('scContent');
  if(!container) return;
  const inn = d.innings === 1 ? d : (d.firstInnings || {});
  const runs = num(d.runs || inn.runs || 0);
  const wickets = num(d.wickets || inn.wickets || 0);
  const balls = num(d.legalBalls || inn.balls || 0);
  const overs = oversFromBalls(balls);
  const battingTeam = d.battingTeam === "A" ? (d.teamA || "TEAM A") : (d.teamB || "TEAM B");
  const extras = num(d.extras || inn.extras || 0);
  const wide = num(d.extraDetail?.wide || 0);
  const noball = num(d.extraDetail?.noball || 0);
  const bye = num(d.extraDetail?.bye || 0);
  const legbye = num(d.extraDetail?.legbye || 0);
  const fours = num(d.fours || inn.fours || 0);
  const sixes = num(d.sixes || inn.sixes || 0);

  const batters = d.batters || {};
  const batterNames = Object.keys(batters);
  batterNames.sort((a,b) => (batters[b].runs || 0) - (batters[a].runs || 0));

  const bowlers = d.bowlers || {};
  const bowlerNames = Object.keys(bowlers);
  bowlerNames.sort((a,b) => (bowlers[b].wickets || 0) - (bowlers[a].wickets || 0));

  const events = Array.isArray(d.events) ? d.events : [];
  const dismissalMap = {};
  events.forEach(ev => {
    const m = ev.match(/WICKET — ([^(]+) \(([^)]+)\)/);
    if(m) dismissalMap[m[1].trim()] = m[2].trim();
  });

  let html = '';
  html += `
    <div class="sc-header">
      <div>
        <span class="team-name">${escapeText(battingTeam)} <small>INNINGS</small></span>
        <span style="font-size:clamp(14px,1.1vw,20px);color:var(--muted);margin-left:12px;">${d.innings || 1}ST</span>
      </div>
      <div>
        <span class="score-total">${runs}<small> / ${wickets}</small></span>
        <span class="overs-info" style="margin-left:16px;">OVERS ${overs}</span>
      </div>
    </div>
  `;

  html += `<div class="sc-table-wrap"><table>
    <thead><tr>
      <th style="width:28%;">BATTER</th>
      <th style="width:10%;text-align:center;">R</th>
      <th style="width:10%;text-align:center;">B</th>
      <th style="width:10%;text-align:center;">4s</th>
      <th style="width:10%;text-align:center;">6s</th>
      <th style="width:15%;text-align:center;">SR</th>
      <th style="width:17%;text-align:left;">DISMISSAL</th>
    </tr></thead><tbody>`;

  if(batterNames.length === 0) {
    html += `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:20px 0;">No batting data available</td></tr>`;
  } else {
    batterNames.forEach(name => {
      const st = batters[name] || {};
      const r = num(st.runs);
      const b = num(st.balls);
      const f = num(st.fours);
      const s = num(st.sixes);
      const sr = b > 0 ? ((r/b)*100).toFixed(1) : "0.0";
      const isOut = st.out !== false;
      const outStatus = isOut ? 'out' : 'notout';
      const dismissal = dismissalMap[name] || (isOut ? 'b' : 'not out');
      const nameDisplay = isOut ? escapeText(name) : escapeText(name) + '*';
      html += `<tr>
        <td><span class="${outStatus}">${nameDisplay}</span></td>
        <td style="text-align:center;font-weight:700;">${r}</td>
        <td style="text-align:center;">${b}</td>
        <td style="text-align:center;">${f}</td>
        <td style="text-align:center;">${s}</td>
        <td style="text-align:center;">${sr}</td>
        <td style="text-align:left;color:var(--muted);font-size:clamp(10px,0.8vw,14px);">${escapeText(dismissal)}</td>
      </tr>`;
    });
  }

  html += `<tr class="extras-row"><td colspan="7">
    <span style="font-weight:600;">EXTRAS</span> 
    ${extras} <span style="color:var(--muted);font-weight:400;margin-left:12px;">
    (b ${bye}, lb ${legbye}, w ${wide}, nb ${noball})
  </span></td></tr>`;

  html += `<tr class="total-row"><td colspan="7">
    <span style="font-weight:900;">TOTAL</span> 
    ${runs} <span style="color:var(--muted);font-weight:400;">/ ${wickets}</span>
    <span style="margin-left:24px;font-weight:600;color:var(--muted);">OVERS ${overs}</span>
    <span style="margin-left:24px;font-weight:600;color:var(--muted);">RR ${calcCRR(d)}</span>
  </td></tr>`;

  html += `</tbody></table></div>`;

  if(bowlerNames.length > 0) {
    html += `<div style="margin-top:20px;border-top:1px solid rgba(255,255,255,0.06);padding-top:16px;">
      <h3 style="font-size:clamp(16px,1.4vw,24px);font-weight:800;color:var(--cyan);margin:0 0 8px;">BOWLING</h3>
      <div class="sc-table-wrap"><table>
        <thead><tr>
          <th style="width:25%;">BOWLER</th>
          <th style="width:12%;text-align:center;">O</th>
          <th style="width:12%;text-align:center;">M</th>
          <th style="width:12%;text-align:center;">R</th>
          <th style="width:12%;text-align:center;">W</th>
          <th style="width:15%;text-align:center;">ECON</th>
        </tr></thead><tbody>`;

    bowlerNames.forEach(name => {
      const st = bowlers[name] || {};
      const oversBowled = Math.floor((st.balls || 0) / 6);
      const partial = (st.balls || 0) % 6;
      const o = oversBowled + (partial > 0 ? '.' + partial : '');
      const r = num(st.runs);
      const w = num(st.wickets);
      const econ = st.balls > 0 ? ((r / (st.balls / 6)).toFixed(2)) : "0.00";
      html += `<tr>
        <td style="font-weight:600;">${escapeText(name)}</td>
        <td style="text-align:center;">${o}</td>
        <td style="text-align:center;">${num(st.maidens || 0)}</td>
        <td style="text-align:center;font-weight:700;">${r}</td>
        <td style="text-align:center;font-weight:700;color:var(--yellow);">${w}</td>
        <td style="text-align:center;">${econ}</td>
      </tr>`;
    });

    html += `</tbody></table></div></div>`;
  }

  html += `<div class="sc-footer">
    <div class="extras-detail">
      <span>EXTRAS: <strong>${extras}</strong></span>
      <span>W: ${wide}</span>
      <span>NB: ${noball}</span>
      <span>B: ${bye}</span>
      <span>LB: ${legbye}</span>
      <span>4s: ${fours}</span>
      <span>6s: ${sixes}</span>
    </div>
    <div class="crr-rrr">
      <span>CRR: <strong>${calcCRR(d)}</strong></span>
      <span>RRR: <strong>${calcRRR(d)}</strong></span>
    </div>
  </div>`;

  container.innerHTML = html;
}

onValue(liveRef, snap => {
 const d=snap.val(); if(!d) return;
 const scoreVisible = d.overlay && d.overlay.scoreVisible !== undefined ? d.overlay.scoreVisible : true;
 $("overlay").classList.toggle("hidden", scoreVisible === false);
 applyTheme(d.theme, d.customColors);

 // Scorecard overlay
 if(d.mode === 'scorecard'){
   renderFullScorecard(d);
   toggleScorecardOverlay(true);
 } else {
   toggleScorecardOverlay(false);
 }

 const bat=d.battingTeam||"A", bowl=d.bowlingTeam||(bat==="A"?"B":"A");
 $("batTeam").textContent=teamName(d,bat);
 $("bowlTeam").textContent=teamName(d,bowl);

 const b1n=d.b1||d.striker||d.batsman1||"STRIKER";
 const b2n=d.b2||d.nonStriker||d.batsman2||"NON-STRIKER";
 const b1=batterStats(d,b1n), b2=batterStats(d,b2n);
 $("b1name").textContent=b1n; $("b2name").textContent=b2n;
 $("b1runs").textContent=num(b1.runs??d.batsman1Runs);
 $("b1balls").textContent=num(b1.balls??d.batsman1Balls);
 $("b2runs").textContent=num(b2.runs??d.batsman2Runs);
 $("b2balls").textContent=num(b2.balls??d.batsman2Balls);
 $("batter1").classList.toggle("striker", !!b1n && b1n===d.striker);
 $("batter2").classList.toggle("striker", !!b2n && b2n===d.striker);

 const runs=num(d.runs), w=num(d.wickets), balls=num(d.legalBalls);
 const directResult = deriveResult(d) || (d.matchWinner ? d.matchWinner+" WON" : "");
 const isCompleted = d.status === 'completed' || d.matchWinner || !!directResult;
 if(isCompleted && directResult){
   $("scorePill").textContent = directResult;
   $("scorePill").style.background = "linear-gradient(90deg, #00c853, #00e676)";
   $("scorePill").style.color = "#000";
   $("rrr").textContent = "—";
   $("inningsLabel").textContent = "MATCH DECIDED";
 } else {
   $("scorePill").textContent = runs+"-"+w;
   $("scorePill").style.background = "";
   $("scorePill").style.color = "";
   $("inningsLabel").textContent = "INNINGS "+num(d.innings||1);
   $("rrr").textContent = calcRRR(d);
 }
 $("overs").textContent = oversFromBalls(balls)+" ("+balls+")";
 $("crr").textContent = calcCRR(d);
 const title=d.matchName||"League Match"; $("matchTitle").textContent=title;
 const bow=d.bowler||"BOWLER", bo=bowlerStats(d,bow);
 $("bowler").textContent=bow;
 $("bowlerStats").textContent=oversFromBalls(bo.balls)+" O • "+num(bo.runs)+" R • "+num(bo.wickets)+" W";

 updateTarget(d);
 renderBalls(d);
 customLower(d);
 bannerText(d);
 detectAnimation(d);
});
</script>
