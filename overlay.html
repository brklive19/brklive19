<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BRKLIVE19 Live Overlay</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent !important;
    overflow: hidden;
}

body {
    font-family: Arial, sans-serif;
}

.scoreboard {
    position: absolute;
    left: 3%;
    right: 3%;
    bottom: 5%;

    padding: 14px 20px;

    border-radius: 15px;

    background: rgba(0, 0, 0, 0.78);

    color: white;
}

.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.team {
    font-size: 22px;
    font-weight: 700;
}

.vs {
    font-size: 13px;
    color: rgba(255,255,255,0.65);
    margin-top: 3px;
}

.score {
    font-size: 42px;
    font-weight: 900;
}

.overs {
    font-size: 17px;
    font-weight: 600;
}

.live {
    color: #ff3333;
    font-size: 13px;
    font-weight: 800;
    white-space: nowrap;
}

@media (max-width: 500px) {

    .scoreboard {
        padding: 10px 12px;
    }

    .team {
        font-size: 16px;
    }

    .score {
        font-size: 30px;
    }

    .overs {
        font-size: 13px;
    }

    .live {
        font-size: 10px;
    }

}

</style>

</head>

<body>

<div class="scoreboard">

    <div class="top">

        <div>
            <div id="teamA" class="team">TEAM A</div>
            <div id="teamB" class="vs">vs TEAM B</div>
        </div>

        <div id="score" class="score">0/0</div>

        <div id="overs" class="overs">0.0 OV</div>

        <div class="live">
            🔴 LIVE
        </div>

    </div>


    <!-- BATSMEN -->

    <div class="batting">

        <div class="batsman">

            <span class="bat-icon">🏏</span>

            <span id="batsman1">
                Striker
            </span>

            <strong>
                <span id="batsman1Runs">0</span>
                (<span id="batsman1Balls">0</span>)
            </strong>

            <span class="bat-stats">
                4s: <span id="batsman1Fours">0</span>
                |
                6s: <span id="batsman1Sixes">0</span>
            </span>

        </div>


        <div class="batsman">

            <span class="bat-icon">🏏</span>

            <span id="batsman2">
                Non-Striker
            </span>

            <strong>
                <span id="batsman2Runs">0</span>
                (<span id="batsman2Balls">0</span>)
            </strong>

            <span class="bat-stats">
                4s: <span id="batsman2Fours">0</span>
                |
                6s: <span id="batsman2Sixes">0</span>
            </span>

        </div>

    </div>


    <!-- BOWLER -->

    <div class="bowling">

        <span>🎯</span>

        <strong id="bowler">
            Bowler
        </strong>

        <span>
            <span id="bowlerOvers">0.0</span> O
        </span>

        <span>
            <span id="bowlerRuns">0</span> R
        </span>

        <span>
            <span id="bowlerWickets">0</span> W
        </span>

        <span>
            ECO:
            <span id="bowlerEconomy">0.00</span>
        </span>

    </div>


    <!-- MATCH INFORMATION -->

    <div class="match-info">

        <span>
            CRR:
            <strong id="currentRunRate">0.00</strong>
        </span>

        <span>
            RRR:
            <strong id="requiredRunRate">0.00</strong>
        </span>

        <span>
            TARGET:
            <strong id="target">-</strong>
        </span>

        <span>
            OVER:
            <strong id="currentOver">0.0</strong>
        </span>

        <span>
            EXTRAS:
            <strong id="extras">0</strong>
        </span>

    </div>

</div>

<script type="module">

/* ==================================================
   FIREBASE
================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getDatabase,
    ref,
    onValue
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* ==================================================
   FIREBASE CONFIG
   USE THE EXACT SAME CONFIG AS scorer.html
================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyBLWq1bqJ32F2cg3mqYQ0uwXcS3zvTA3A4",
  authDomain: "brklive19-2bab4.firebaseapp.com",
  databaseURL: "https://brklive19-2bab4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "brklive19-2bab4",
  storageBucket: "brklive19-2bab4.firebasestorage.app",
  messagingSenderId: "294058533898",
  appId: "1:294058533898:web:4996705937e969939cabf3",
  measurementId: "G-RW18E7LVEX"
};



/* ==================================================
   START FIREBASE
================================================== */

const app =
    initializeApp(firebaseConfig);

const database =
    getDatabase(app);


/* ==================================================
   LIVE SCORE LOCATION
================================================== */

const scoreRef =
    ref(
        database,
        "liveScore"
    );


/* ==================================================
   RECEIVE LIVE SCORE
================================================== */

onValue(

    scoreRef,

    function(snapshot) {

        const data =
            snapshot.val();


        if (!data) {
            return;
        }


        /* TEAM A */

        document.getElementById("teamA")
            .innerText =
            data.teamA || "TEAM A";


        /* TEAM B */

        document.getElementById("teamB")
            .innerText =
            "vs " +
            (data.teamB || "TEAM B");


        /* SCORE */

        document.getElementById("score")
            .innerText =
            (data.runs || 0) +
            "/" +
            (data.wickets || 0);


        /* OVERS */

        document.getElementById("overs")
            .innerText =
            (data.overs || "0.0") +
            " OV";

    },

    function(error) {

        console.log(
            "Firebase error:",
            error
        );

    }

);

</script>

</body>

</html>
