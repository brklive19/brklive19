<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRKLIVE19 V5 • 3D Broadcast Overlay</title>
<style>
:root{
  --cyan:#00b8e8;--cyan2:#08d7ff;--navy:#071a58;--navy2:#102875;
  --pink:#d600ff;--yellow:#ffd900;--green:#16b86a;--red:#f3274f;
  --white:#fff;--muted:#d7def1;--dark:#08163e;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#fff}
body{display:flex;align-items:flex-end;justify-content:center;padding:2.4vw 3vw}

.overlay{
  width:min(1760px,96vw);position:relative;overflow:visible;
}
.overlay.hidden{display:none}

.frame{position:relative;height:142px;overflow:hidden;background:var(--navy);box-shadow:0 0 0 1px #ffffff30 inset}
.frame:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.08),rgba(255,255,255,.03) 50%,rgba(0,0,0,.12));pointer-events:none}

/* angled team ends */
.teamPanel{position:absolute;top:0;bottom:0;width:18%;display:flex;align-items:center;padding:0 24px;z-index:2;overflow:hidden}
.teamPanel.left{left:0;background:linear-gradient(100deg,var(--cyan),#08a8d1);clip-path:polygon(0 0,100% 0,84% 100%,0 100%)}
.teamPanel.right{right:0;background:linear-gradient(80deg,var(--yellow),#f1ce00);clip-path:polygon(16% 0,100% 0,100% 100%,0 100%);justify-content:flex-end;text-align:right}
.teamPanel .teamName{font-size:clamp(20px,2.15vw,40px);font-weight:1000;text-transform:uppercase;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:0 2px 2px #0005}
.teamPanel.right .teamName{color:#071029;text-shadow:none}

/* center content area */
.content{position:absolute;left:16.5%;right:16.5%;top:0;bottom:0;display:grid;grid-template-columns:30% 31% 39%;z-index:3}

/* batters */
.batters{background:linear-gradient(90deg,#0b1d65,#12266c);padding:13px 18px 8px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.batter{height:49%;display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:7px;border-bottom:1px solid #ffffff16}
.batter:last-child{border-bottom:0}
.batter.striker{background:linear-gradient(90deg,rgba(255,255,255,.10),transparent)}
.strike{font-size:18px;color:transparent;font-weight:1000;text-align:center}
.striker .strike{color:var(--yellow)}
.batterName{font-size:clamp(15px,1.5vw,26px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.batterScore{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.batterScore b{font-size:clamp(21px,2vw,34px);color:var(--yellow)}
.batterScore span{font-size:clamp(12px,1vw,18px);font-weight:800;color:#fff}

/* score block */
.scorePanel{background:#fff;color:#142052;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:7px 8px}
.scorePanel:before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:4px;background:linear-gradient(#00b9ed,#d800ff)}
.scorePanel:after{content:"";position:absolute;right:-1px;top:0;bottom:0;width:4px;background:linear-gradient(#d800ff,#00b9ed)}
.matchTitle{font-size:clamp(13px,1.25vw,23px);font-weight:900;margin-bottom:7px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.scorePill{min-width:78%;padding:7px 20px;border-radius:15px;background:linear-gradient(90deg,#00b9ee,#d700ff);color:#fff;text-align:center;font-size:clamp(31px,3.3vw,58px);line-height:.95;font-weight:1000;letter-spacing:-1px;box-shadow:0 7px 14px #c900ff2e}
.scoreMeta{display:flex;align-items:center;gap:28px;margin-top:7px;font-size:clamp(12px,1.15vw,21px);font-weight:900}
.crrRrr{display:flex;gap:30px;margin-top:7px;font-size:clamp(10px,.95vw,17px);font-weight:900}
.crrRrr b{color:#17205a}

/* bowler end */
.bowlerPanel{background:linear-gradient(90deg,#10246b,#091a58);padding:12px 18px 7px;display:flex;flex-direction:column;justify-content:center;min-width:0;position:relative}
.bowlerTop{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px}
.bowlerName{font-size:clamp(16px,1.65vw,29px);font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.bowlerStats{font-size:clamp(12px,1.1vw,19px);font-weight:800;white-space:nowrap;color:#fff}
.live{color:#ff3158;font-size:12px;font-weight:1000;white-space:nowrap}
.live:before{content:"●";margin-right:5px}

/* CURRENT OVER BALLS */
.currentOver{margin-top:10px;display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden}
.currentOverLabel{font-size:10px;font-weight:1000;color:#bfcceb;letter-spacing:.7px;white-space:nowrap;margin-right:2px}
.ballList{display:flex;gap:6px;min-width:0;overflow:hidden;align-items:center}
.ball{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:#18367f;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:1000;box-shadow:inset 0 0 0 1px #ffffff16}
.ball.four{background:#7b35d7}.ball.six{background:#08a8f5}.ball.wicket{background:var(--red)}.ball.extra{background:#e7a500;color:#111}.ball.zero{background:#25437e}.ball.latest{box-shadow:0 0 0 2px #fff,0 0 12px #fff8}

/* ============================================================
   FULL FRAME MATCH SUMMARY OVERLAY
   ============================================================ */
.summary-overlay{position:fixed;inset:0;display:none;z-index:500;background:var(--summary-bg,#07101f);color:#111;overflow:hidden;padding:22px;box-sizing:border-box}
.summary-overlay.show{display:block}
.summary-shell{width:100%;height:100%;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.summary-head{height:11%;min-height:70px;display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;border:2px solid #8b8b8b;border-radius:10px;overflow:hidden;background:#111b2b;box-shadow:0 8px 25px #0007}
.summary-head .side{height:100%;display:flex;align-items:center;padding:0 28px;font-size:clamp(22px,2.5vw,48px);font-weight:1000;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.summary-head .side.a{justify-content:flex-start;background:linear-gradient(100deg,var(--cyan),#07377f)}
.summary-head .side.b{justify-content:flex-end;text-align:right;background:linear-gradient(260deg,#a80000,#4b0909)}
.summary-head .center{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d1525;color:#fff;text-align:center}
.summary-head .center .title{font-size:clamp(20px,2vw,38px);font-weight:1000;letter-spacing:.04em;text-transform:uppercase}
.summary-head .center .sub{font-size:clamp(10px,1vw,18px);font-weight:800;opacity:.9;margin:2px 0 0}
.summary-meta{display:flex;flex-direction:column;gap:6px;height:10%;min-height:60px}
.summary-meta .meta{background:#fff;border:2px solid #aab2bd;border-radius:8px;padding:7px 14px;display:flex;align-items:center;gap:8px;font-size:clamp(12px,1vw,19px);font-weight:800;box-shadow:0 4px 14px #0004}
.summary-meta .meta b{color:#0b2e76}
.summary-team{flex:1;min-height:0;background:#f4f5f7;border:2px solid #9aa2ac;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 18px #0005}
.summary-team-head{height:14%;min-height:52px;display:grid;grid-template-columns:1fr auto;align-items:center;padding:0 18px;color:#fff;background:linear-gradient(90deg,var(--navy),var(--cyan));font-weight:1000}
.summary-team-head .name{font-size:clamp(18px,1.8vw,34px);text-transform:uppercase}
.summary-team-head .score{font-size:clamp(25px,2.7vw,50px);padding:2px 18px;border-radius:8px;background:#ffffff22;white-space:nowrap}
.summary-columns{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.summary-box{min-height:0;background:#fff;border:1px solid #c3c8cf;border-radius:8px;overflow:hidden}
.summary-box .box-head{background:#102f78;color:#fff;padding:7px 10px;font-size:clamp(12px,1vw,18px);font-weight:1000;text-transform:uppercase}
.summary-box table{width:100%;height:calc(100% - 34px);border-collapse:collapse;font-size:clamp(10px,.95vw,17px)}
.summary-box th{background:#e4e7ec;color:#111;padding:5px 7px;text-align:left;border-bottom:1px solid #c2c6cc;font-weight:1000}
.summary-box td{padding:5px 7px;border-bottom:1px solid #d6d9de;color:#111;font-weight:800}
.summary-box td.num,.summary-box th.num{text-align:center}
.summary-status{height:9%;min-height:50px;display:flex;align-items:center;justify-content:center;border-radius:9px;border:2px solid #7c8da9;background:linear-gradient(90deg,#142c66,#07152e);color:#fff;font-size:clamp(15px,1.5vw,29px);font-weight:1000;text-transform:uppercase;letter-spacing:.02em;text-align:center;padding:0 18px}
.summary-result{height:9%;min-height:50px;display:flex;align-items:center;justify-content:center;border-radius:9px;border:2px solid #77b97d;background:linear-gradient(90deg,#075d20,#0a9d39);color:#fff;font-size:clamp(15px,1.5vw,29px);font-weight:1000;text-transform:uppercase;text-align:center;padding:0 18px;box-sizing:border-box}
.summary-result.progress{background:linear-gradient(90deg,#172d5e,#274f9c);border-color:#6f91d3}
@media(max-width:900px){.summary-overlay{padding:7px}.summary-shell{gap:5px}.summary-head{grid-template-columns:1fr 70px 1fr;min-height:45px}.summary-head .side{padding:0 7px;font-size:11px}.summary-head .center .title{font-size:12px}.summary-head .center .sub{font-size:6px}.summary-meta{gap:5px;min-height:34px}.summary-meta .meta{padding:4px 7px;font-size:8px}.summary-team-head{min-height:35px;padding:0 8px}.summary-team-head .name{font-size:12px}.summary-team-head .score{font-size:18px;padding:1px 7px}.summary-columns{gap:5px;padding:5px}.summary-box .box-head{padding:4px 6px;font-size:8px}.summary-box table{font-size:7px}.summary-box th,.summary-box td{padding:3px 4px}.summary-status,.summary-result{min-height:30px;font-size:9px}}

/* ============================================================
   FULL FRAME SCORECARD OVERLAY
   ============================================================ */
.scorecard-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:200;
  padding:40px;
  font-family:Arial,Helvetica,sans-serif;
}
.scorecard-overlay.show{display:flex}
.scorecard-overlay .card{
  background:rgba(10,22,50,0.92);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;
  padding:28px 32px;
  max-width:1200px;
  width:100%;
  max-height:85vh;
  overflow-y:auto;
  box-shadow:0 30px 80px rgba(0,0,0,0.8);
  position:relative;
}
.scorecard-overlay .card::-webkit-scrollbar{width:4px}
.scorecard-overlay .card::-webkit-scrollbar-track{background:transparent}
.scorecard-overlay .card::-webkit-scrollbar-thumb{background:var(--cyan);border-radius:10px}

.scorecard-overlay .close-btn{
  position:absolute;
  top:12px;
  right:16px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:30px;
  color:#fff;
  padding:6px 18px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  z-index:5;
  transition:all .2s;
}
.scorecard-overlay .close-btn:hover{
  background:rgba(255,255,255,0.15);
  transform:scale(1.04);
}

.scorecard-overlay .sc-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:14px;
  border-bottom:2px solid rgba(255,255,255,0.06);
  margin-bottom:18px;
  flex-wrap:wrap;
  gap:8px;
}
.scorecard-overlay .sc-header .team-name{
  font-size:clamp(28px,3.5vw,48px);
  font-weight:1000;
  color:#fff;
  letter-spacing:-0.5px;
}
.scorecard-overlay .sc-header .team-name small{
  font-size:clamp(14px,1.2vw,22px);
  font-weight:600;
  color:var(--cyan);
  margin-left:10px;
}
.scorecard-overlay .sc-header .score-total{
  font-size:clamp(32px,4vw,56px);
  font-weight:1000;
  color:var(--yellow);
}
.scorecard-overlay .sc-header .score-total small{
  font-size:clamp(16px,1.5vw,26px);
  color:var(--muted);
  font-weight:600;
}
.scorecard-overlay .sc-header .overs-info{
  font-size:clamp(14px,1.2vw,20px);
  color:var(--muted);
  font-weight:600;
}

.scorecard-overlay .sc-table-wrap{
  overflow-x:auto;
  margin:6px 0 14px;
}
.scorecard-overlay table{
  width:100%;
  border-collapse:collapse;
  font-size:clamp(13px,1.1vw,18px);
}
.scorecard-overlay table th{
  text-align:left;
  color:var(--muted);
  font-weight:600;
  padding:8px 8px 6px 8px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  font-size:clamp(11px,0.9vw,15px);
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.scorecard-overlay table td{
  padding:6px 8px;
  border-bottom:1px solid rgba(255,255,255,0.03);
  color:var(--white);
}
.scorecard-overlay table tr:hover td{
  background:rgba(255,255,255,0.04);
}
.scorecard-overlay table .out{color:var(--red);font-weight:600}
.scorecard-overlay table .notout{color:var(--green);font-weight:600}
.scorecard-overlay table .dismissal{
  color:var(--muted);
  font-size:clamp(10px,0.8vw,14px);
  font-weight:400;
}
.scorecard-overlay table .extras-row td{
  color:var(--muted);
  font-style:italic;
  font-size:clamp(11px,0.9vw,15px);
  padding-top:10px;
  border-top:1px solid rgba(255,255,255,0.04);
}
.scorecard-overlay table .total-row td{
  font-weight:800;
  color:#fff;
  font-size:clamp(15px,1.2vw,20px);
  padding-top:10px;
  border-top:2px solid rgba(255,255,255,0.08);
}
.scorecard-overlay .sc-footer{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  padding-top:14px;
  border-top:1px solid rgba(255,255,255,0.04);
  font-size:clamp(12px,1vw,16px);
  color:var(--muted);
}
.scorecard-overlay .sc-footer .extras-detail span{margin-right:14px}
.scorecard-overlay .sc-footer .crr-rrr span{margin-right:20px;font-weight:600;color:#fff}

/* ===== SCORECARD PREFERENCE LAYOUT ===== */
.scorecard-overlay{padding:0;background:rgba(2,8,20,.96);backdrop-filter:none;align-items:stretch;justify-content:stretch;z-index:300}
.scorecard-overlay .card{width:100vw;height:100vh;max-width:none;max-height:none;overflow:hidden;border:0;border-radius:0;padding:18px 22px 16px;background:linear-gradient(180deg,#07101f,#0a1324);box-shadow:none}
.scorecard-overlay .close-btn{top:10px;right:14px;background:#18233a;border-color:#7183a8;padding:7px 15px}
.scorecard-overlay #scContent{height:100%;display:flex;flex-direction:column;gap:9px}
.scorecard-overlay .pref-header{height:11%;min-height:66px;display:grid;grid-template-columns:1fr 130px 1fr;align-items:center;border:2px solid #8b8b8b;border-radius:8px;overflow:hidden;background:#111b2b}
.scorecard-overlay .pref-team{height:100%;display:flex;align-items:center;padding:0 28px;font-size:clamp(22px,2.4vw,48px);font-weight:1000;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scorecard-overlay .pref-team.a{justify-content:flex-start;background:linear-gradient(100deg,#063a91,#071d56)}
.scorecard-overlay .pref-team.b{justify-content:flex-end;text-align:right;background:linear-gradient(260deg,#a90000,#4a0909)}
.scorecard-overlay .pref-vs{height:100%;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,2.8vw,52px);font-weight:1000;background:#101010;border-left:2px solid #aaa;border-right:2px solid #aaa}
.scorecard-overlay .pref-innings{height:5%;min-height:28px;text-align:center;font-size:clamp(18px,1.5vw,30px);font-weight:1000;letter-spacing:.04em}
.scorecard-overlay .pref-main{flex:1;min-height:0;display:grid;grid-template-columns:66% 34%;gap:12px}
.scorecard-overlay .pref-left,.scorecard-overlay .pref-right{min-height:0;display:flex;flex-direction:column;gap:9px}
.scorecard-overlay .pref-panel{background:#f5f5f5;color:#111;border:2px solid #9aa2ac;border-radius:9px;overflow:hidden;box-shadow:0 2px 8px #0007}
.scorecard-overlay .pref-title{height:32px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#113b91,#062260);color:#fff;font-size:clamp(14px,1.2vw,23px);font-weight:1000;text-transform:uppercase}
.scorecard-overlay .pref-title.red{background:linear-gradient(180deg,#d51a10,#8d0905)}
.scorecard-overlay .pref-title.purple{background:linear-gradient(180deg,#4c176b,#25033c)}
.scorecard-overlay .pref-title.green{background:linear-gradient(180deg,#07811a,#00590d)}
.scorecard-overlay .pref-table{width:100%;border-collapse:collapse;font-size:clamp(10px,.9vw,17px)}
.scorecard-overlay .pref-table th{background:#173d89;color:#fff;padding:5px 7px;font-weight:1000;border-right:1px solid #aab1ba}
.scorecard-overlay .pref-table td{padding:4px 7px;border-bottom:1px solid #c9cdd2;border-right:1px solid #d2d5d9;font-weight:700;white-space:nowrap;color:#000}
.scorecard-overlay .pref-table tr:last-child td{border-bottom:0}
.scorecard-overlay .pref-table .blue-total td{background:linear-gradient(90deg,#123d98,#09245d);color:#fff;font-size:clamp(15px,1.25vw,24px);font-weight:1000}
.scorecard-overlay .pref-table .dark-total td{background:#10275e;color:#fff;font-weight:1000}
.scorecard-overlay .pref-table .extra-row td{background:#15377e;color:#fff;font-weight:800}
.scorecard-overlay .pref-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;background:#eef0f3}
.scorecard-overlay .pref-box{background:#f7f7f7;border:2px solid #8f99a6;border-radius:8px;text-align:center;overflow:hidden}
.scorecard-overlay .pref-box.wide{grid-column:1/-1}
.scorecard-overlay .pref-box .box-title{background:#0b2e76;color:#fff;padding:5px;font-weight:1000;font-size:clamp(11px,.9vw,17px);text-transform:uppercase}
.scorecard-overlay .pref-box .box-value{padding:7px 4px;color:#0c2a6b;font-size:clamp(19px,2.1vw,39px);font-weight:1000}
.scorecard-overlay .pref-box .box-sub{padding:0 4px 6px;color:#111;font-weight:800;font-size:clamp(10px,.85vw,15px)}
.scorecard-overlay .pref-fall{flex:1;min-height:0}
.scorecard-overlay .pref-recent{height:23%;min-height:86px}
.scorecard-overlay .pref-bowling{height:31%;min-height:130px}
.scorecard-overlay .pref-batting{flex:1;min-height:0}
.scorecard-overlay .pref-scroll{height:calc(100% - 32px);overflow:hidden}
.scorecard-overlay .pref-footer{height:6%;min-height:34px;display:flex;align-items:center;justify-content:space-between;background:#071b46;border:1px solid #56709d;border-radius:7px;padding:0 14px;font-weight:900;font-size:clamp(10px,1vw,17px)}
.scorecard-overlay .dot{display:inline-flex;width:clamp(20px,2vw,34px);height:clamp(20px,2vw,34px);border-radius:50%;border:2px solid #111;align-items:center;justify-content:center;background:#fff;margin:0 3px;font-size:clamp(8px,.7vw,13px);color:#111}
.scorecard-overlay .fall-cell{display:flex;align-items:center;justify-content:center;gap:3px;min-width:0}
@media(max-width:900px){.scorecard-overlay .card{padding:8px}.scorecard-overlay .pref-main{grid-template-columns:62% 38%;gap:6px}.scorecard-overlay .pref-header{grid-template-columns:1fr 72px 1fr}.scorecard-overlay .pref-team{padding:0 8px}.scorecard-overlay .pref-table th,.scorecard-overlay .pref-table td{padding:3px 4px}.scorecard-overlay .pref-title{height:24px}.scorecard-overlay .pref-footer{font-size:9px}}

/* ===== TARGET LOWER THIRD ===== */
.target{position:fixed;left:50%;bottom:14px;transform:translateX(-50%) translateZ(25px);width:min(1760px,96vw);height:142px;background:linear-gradient(90deg,#4e217e,#173d89);color:#fff;padding:0 28px;border:2px solid #d7b3ff;border-radius:10px;font-size:clamp(24px,3vw,54px);font-weight:1000;letter-spacing:.02em;white-space:nowrap;display:none;align-items:center;justify-content:center;text-align:center;z-index:150;box-shadow:0 10px 30px #0008;box-sizing:border-box;text-transform:uppercase}
.overlay.targetMode .frame{visibility:hidden}
@media(max-width:900px){.target{height:92px;width:96vw;font-size:clamp(14px,2.5vw,24px);padding:0 12px}}

/* ============================================================
   LOWER THIRD BANNERS – same size as overlayer
   ============================================================ */
.banner{
  position:fixed;
  left:50%;
  transform:translateX(-50%) translateZ(25px);
  bottom:14px;
  width:min(1760px,96vw);
  height:142px;
  padding:0 40px;
  border-radius:10px;
  background:linear-gradient(135deg,#071a58,#102875);
  border:2px solid var(--cyan2);
  font-size:clamp(24px,3vw,54px);
  font-weight:1000;
  white-space:nowrap;
  overflow:hidden;

  const pRuns=num(d.partnershipRuns ?? (num((d.batters||{})[d.striker]?.runs)+num((d.batters||{})[d.nonStriker]?.runs)));
  const pBalls=num(d.partnershipBalls ?? d.legalBalls);
  const pNames=[d.striker,d.nonStriker].filter(Boolean).join(" & ");
  const pText=pNames?`PARTNERSHIP • ${pNames} • ${pRuns} RUNS (${oversFromBalls(pBalls)} OV)` : "PARTNERSHIP";
  bPartnership.textContent=pText; bPartnership.classList.toggle("show",!!partnership.active&&!!pNames);

  const result=deriveResult(d);
  bResult.textContent=result; bResult.classList.toggle("show",showResult&&!!result);

  const bowlerName=String(d.bowler||"").trim();
  if(bBowler){
    const bs=bowlerStats(d,bowlerName);
    const econ=bs.balls?((num(bs.runs)/(num(bs.balls)/6)).toFixed(2)):"0.00";
    bBowler.textContent=bowlerName ? `BOWLER • ${bowlerName}  |  ${oversFromBalls(bs.balls)} O • ${num(bs.runs)} R • ${num(bs.wickets)} W • ECON ${econ}` : "BOWLER";
    bBowler.classList.toggle("show",!!(t.showBowler??d.showBowler??false)&&!!bowlerName);
  }

  const anyBanner=[bTournament,bMatch,venueEl,bToss,bResult,bPlayer,bBowler,bPartnership].filter(Boolean).some(el=>el.classList.contains("show"));
  $("overlay").classList.toggle("bannerMode",anyBanner);
  stackFooterBanners();
}

function customLower(d){
  const c=d.customLower||{}; 
  const message=c.active?c.text:(typeof d.customLowerThird==="string"?d.customLowerThird:"");
  const customEl=$("custom"), overlay=$("overlay");
  if(message && message.trim()){
    customEl.textContent=message;
    customEl.classList.add("show");
    overlay.classList.add("customMode");
  } else {
    customEl.textContent="";
    customEl.classList.remove("show");
    overlay.classList.remove("customMode");
  }
}

// ---- Center every lower-third graphic and keep the newest visible item nearest the bottom ----
function stackFooterBanners(){
  const items=["bannerTournament","bannerMatch","bannerVenue","bannerToss","bannerResult","bannerPlayer","bannerBowler","bannerPartnership"].map(id=>$(id)).filter(el=>el&&el.classList.contains("show"));
  let bottomOffset=14;
  for(const el of items.slice().reverse()){el.style.bottom=bottomOffset+"px";el.style.left="50%";el.style.transform="translateX(-50%)";bottomOffset+=el.offsetHeight+8;}
}

// ---- Full-frame match summary ----
function inningsData(d, no){
  if(no===1){
    const f=d.firstInnings||{};
    if(f && (f.runs!==undefined || f.batters || f.bowlers)) return f;
    return Number(d.innings||1)===1 ? d : {};
  }
  if(Number(d.innings||1)===2) return d;
  const firstSide=(d.firstInnings&&d.firstInnings.team)||d.battingTeam||'A';
  return {team:firstSide==='A'?'B':'A',runs:0,wickets:0,legalBalls:0,balls:0,extras:0,batters:{},bowlers:{}};
}
function summaryTopBatters(inn){
  return Object.entries(inn.batters||{}).sort((a,b)=>num(b[1]?.runs)-num(a[1]?.runs)||num(a[1]?.balls)-num(b[1]?.balls)).slice(0,3);
}
function summaryTopBowlers(inn){
  return Object.entries(inn.bowlers||{}).sort((a,b)=>num(b[1]?.wickets)-num(a[1]?.wickets)||num(a[1]?.runs)-num(b[1]?.runs)||num(b[1]?.balls)-num(a[1]?.balls)).slice(0,3);
}
function summaryTeamSide(d,no){
  const inn=inningsData(d,no); const side=inn.team||inn.battingTeam||(no===1?d.firstInnings?.team:d.battingTeam)||'';
  return side==='A'?d.teamA||'TEAM A':side==='B'?d.teamB||'TEAM B':(inn.teamName||'TEAM');
}
function summaryScore(inn){return `${num(inn.runs)}/${num(inn.wickets)} (${oversFromBalls(inn.legalBalls??inn.balls)} OV)`}
function renderSummary(d){
  const el=$("summaryContent"); if(!el)return;
  const team1=summaryTeamSide(d,1), team2=summaryTeamSide(d,2);
  const i1=inningsData(d,1), i2=inningsData(d,2);
  const toss=d.tossWinner ? `${teamName(d,d.tossWinner)} WON THE TOSS AND ELECTED TO ${d.tossDecision==='bat'?'BAT FIRST':'BOWL FIRST'}` : 'TOSS —';
  const completed=d.status==='completed'||!!d.matchWinner||!!deriveResult(d);
  const result=deriveResult(d)||d.resultText||d.matchResult||'';
  const status=completed ? result : (Number(d.innings||1)===2 ? `MATCH IN PROGRESS • ${team2} ${num(d.runs)}/${num(d.wickets)} (${oversFromBalls(d.legalBalls)} OV)` : `MATCH IN PROGRESS • ${team1} ${num(i1.runs)}/${num(i1.wickets)} (${oversFromBalls(i1.legalBalls??i1.balls)} OV)`);
  function teamBlock(no,inn,team){
    const bats=summaryTopBatters(inn), bowls=summaryTopBowlers(inn);
    const batRows=bats.length?bats.map(([n,x],i)=>`<tr><td>${i+1}. ${escapeText(n)}</td><td class="num">${num(x.runs)}</td><td class="num">${num(x.balls)}</td></tr>`).join(''):`<tr><td colspan="3">NO BATTING DATA</td></tr>`;
    const bowlRows=bowls.length?bowls.map(([n,x],i)=>`<tr><td>${i+1}. ${escapeText(n)}</td><td class="num">${oversFromBalls(x.balls)}</td><td class="num">${num(x.wickets)}</td><td class="num">${num(x.runs)}</td></tr>`).join(''):`<tr><td colspan="4">NO BOWLING DATA</td></tr>`;
    return `<section class="summary-team"><div class="summary-team-head"><div class="name">${escapeText(team)}</div><div class="score">${summaryScore(inn)}</div></div><div class="summary-columns"><div class="summary-box"><div class="box-head">TOP 3 BATTER RUN SCORERS</div><table><thead><tr><th>BATTER</th><th class="num">RUNS</th><th class="num">BALLS</th></tr></thead><tbody>${batRows}</tbody></table></div><div class="summary-box"><div class="box-head">TOP 3 BOWLING FIGURES</div><table><thead><tr><th>BOWLER</th><th class="num">OVERS</th><th class="num">W</th><th class="num">R</th></tr></thead><tbody>${bowlRows}</tbody></table></div></div></section>`;
  }
  el.innerHTML=`<div class="summary-head"><div class="side a">${escapeText(d.teamA||'TEAM A')}</div><div class="center"><div class="title">MATCH SUMMARY</div><div class="sub">${escapeText(d.matchName||'MATCH')}</div></div><div class="side b">${escapeText(d.teamB||'TEAM B')}</div></div><div class="summary-meta"><div class="meta"><b>TOURNAMENT:</b> ${escapeText(d.tournament||'—')}</div><div class="meta"><b>TOSS:</b> ${escapeText(toss)}</div></div>${teamBlock(1,i1,team1)}${teamBlock(2,i2,team2)}<div class="${completed?'summary-result':'summary-result progress'}">${escapeText(status)}</div>`;
}

// ---- Full scorecard render ----
function renderFullScorecard(d){
  const container=document.getElementById('scContent'); if(!container) return;
  const mode=String(d.mode||'scorecard1');
  const isFirst=mode==='scorecard1' || (mode==='scorecard' && Number(d.innings||1)===1);
  const inn=isFirst ? (Number(d.innings||1)===1 ? d : (d.firstInnings||{})) : d;
  const runs=num(inn.runs), wickets=num(inn.wickets), balls=num(inn.legalBalls??inn.balls), overs=oversFromBalls(balls);
  const side=inn.team||inn.battingTeam||'A';
  const teamA=d.teamA||'TEAM A', teamB=d.teamB||'TEAM B';
  const battingTeam=side==='A'?teamA:side==='B'?teamB:(side||'TEAM');
  const bowlingTeam=side==='A'?teamB:side==='B'?teamA:'';
  const batters=inn.batters||{};
  const xi=Array.isArray(inn.xi)?inn.xi:(side==='A'?(d.xiA||[]):(d.xiB||[]));
  const names=[...Object.keys(batters)]; xi.forEach(n=>{if(n&&!names.includes(n))names.push(n)});
  const dismissalMap={}; (inn.fallWickets||[]).forEach(f=>dismissalMap[f.player]=`${f.type||'OUT'}`);
  const batterRows=names.length?names.map(name=>{const st=batters[name]||{};const r=num(st.runs),b=num(st.balls),f=num(st.fours),s=num(st.sixes);const out=st.out===true;const sr=b?((r/b)*100).toFixed(1):'-';const dis=st.dismissal||dismissalMap[name]||(out?'OUT':'not out');return `<tr><td>${escapeText(name)}${!out&&b>0?' *':''}</td><td style="text-align:center">${b>0||r>0?r:'-'}</td><td style="text-align:center">${b||'-'}</td><td style="text-align:center">${b>0||f>0?f:'-'}</td><td style="text-align:center">${b>0||s>0?s:'-'}</td><td style="text-align:center">${sr}</td><td>${escapeText(dis)}</td></tr>`}).join(''):`<tr><td colspan="7" style="text-align:center">NO BATTING DATA</td></tr>`;
  const bowlers=inn.bowlers||{};
  const bowlRows=Object.keys(bowlers).map(name=>{const st=bowlers[name]||{};const ob=Math.floor(num(st.balls)/6)+'.'+(num(st.balls)%6);const r=num(st.runs),w=num(st.wickets),eco=st.balls?(r/(st.balls/6)).toFixed(2):'0.00';return `<tr><td>${escapeText(name)}</td><td style="text-align:center">${ob}</td><td style="text-align:center">${num(st.maidens||0)}</td><td style="text-align:center">${r}</td><td style="text-align:center">${w}</td><td style="text-align:center">${eco}</td></tr>`}).join('')||`<tr><td colspan="6" style="text-align:center">NO BOWLING DATA</td></tr>`;
  const ex=inn.extraDetail||{}; const extras=num(inn.extras), rr=balls?(runs/(balls/6)).toFixed(2):'0.00';
  const target=num(d.target), need=Math.max(target-runs,0), ballsLeft=Math.max(num(d.maxOvers)*6-num(d.legalBalls),0), rrr=target&&Number(d.innings)===2&&ballsLeft?((need/ballsLeft)*6).toFixed(2):'-';
  const fall=Array.isArray(inn.fallWickets)?inn.fallWickets:[];
  const recent=Array.isArray(inn.recentBalls)?inn.recentBalls.slice(-12):[];
  const dots=recent.map(x=>{let cls='dot';let label=x.label||'-';if(x.wicket)cls+='';else if(String(label)==='4')label='4';else if(String(label)==='6')label='6';return `<span class="${cls}">${escapeText(label)}</span>`}).join('')||Array.from({length:12},()=>'<span class="dot">-</span>').join('');
  const partnershipRuns=num(inn.partnershipRuns), partnershipBalls=num(inn.partnershipBalls);
  const result=deriveResult(d);
  const inningsNo=isFirst?1:2;
  const shortA=teamA.split(/\s+/).map(x=>x[0]).join('').slice(0,4).toUpperCase(), shortB=teamB.split(/\s+/).map(x=>x[0]).join('').slice(0,4).toUpperCase();
  container.innerHTML=`
    <div class="pref-header"><div class="pref-team a">${escapeText(teamA)}</div><div class="pref-vs">VS</div><div class="pref-team b">${escapeText(teamB)}</div></div>
    <div class="pref-innings">${inningsNo===1?"1ST":"2ND"} INNINGS</div>
    <div class="pref-main">
      <div class="pref-left">
        <div class="pref-panel pref-batting"><div class="pref-title">BATTER</div><div class="pref-scroll"><table class="pref-table"><thead><tr><th style="width:27%">BATTER</th><th style="width:18%">DISMISSAL</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead><tbody>${batterRows}<tr class="extra-row"><td colspan="2">EXTRAS</td><td>${extras}</td><td colspan="4">nb ${num(ex.noball)} • w ${num(ex.wide)} • b ${num(ex.bye)} • lb ${num(ex.legbye)}</td></tr><tr class="blue-total"><td colspan="2">TOTAL</td><td colspan="2">${runs}/${wickets}</td><td colspan="3">${overs} OV • RR ${rr}</td></tr></tbody></table></div></div>
        <div class="pref-panel pref-bowling"><div class="pref-title red">BOWLER</div><div class="pref-scroll"><table class="pref-table"><thead><tr><th>BOWLER</th><th>O</th><th>M</th><th>R</th><th>W</th><th>ECON</th></tr></thead><tbody>${bowlRows}</tbody></table></div></div>
      </div>
      <div class="pref-right">
        <div class="pref-panel"><div class="pref-title">SCORE</div><div class="pref-summary"><div class="pref-box wide"><div class="box-value">${runs}/${wickets}</div><div class="box-sub">(${overs} OVERS) • ${escapeText(battingTeam)}</div></div><div class="pref-box"><div class="box-title">RUN RATE</div><div class="box-value">${rr}</div></div><div class="pref-box"><div class="box-title">REQ RUN RATE</div><div class="box-value">${rrr}</div></div><div class="pref-box"><div class="box-title">OVERS</div><div class="box-value">${overs}</div></div><div class="pref-box"><div class="box-title">EXTRAS</div><div class="box-value">${extras}</div></div><div class="pref-box wide"><div class="box-title">PARTNERSHIP</div><div class="box-value">${partnershipRuns} <span style="font-size:.55em">(${partnershipBalls})</span></div></div></div></div>
        <div class="pref-panel pref-fall"><div class="pref-title purple">FALL OF WICKETS</div><div class="pref-scroll"><table class="pref-table"><thead><tr>${Array.from({length:10},(_,i)=>`<th style="text-align:center">${i+1}</th>`).join('')}</tr></thead><tbody><tr>${Array.from({length:10},(_,i)=>{const f=fall[i];return `<td><div class="fall-cell">${f?`${escapeText(f.score)} • ${escapeText(f.player)}`:'-'}</div></td>`}).join('')}</tr></tbody></table></div></div>
        <div class="pref-panel pref-recent"><div class="pref-title green">RECENT OVERS</div><div style="height:calc(100% - 32px);display:flex;align-items:center;justify-content:center;gap:2px;overflow:hidden">${dots}</div></div>
      </div>
    </div>
    <div class="pref-footer"><span>DATE: ${escapeText(d.date||'--/--/----')}</span><span>VENUE: ${escapeText(d.venue||'----------------')}</span><span>${result?escapeText(result):`INNINGS ${inningsNo} • ${escapeText(battingTeam)} ${runs}/${wickets}`}</span><span>LIVE</span></div>`;
}

// ---- Close scorecard ----
document.getElementById('closeScorecardBtn').addEventListener('click', async () => {
  try {
    await set(ref(db, 'liveScore/mode'), 'default');
  } catch(e) { console.error('Error resetting mode:', e); }
});

// ---- Toggle overlay ----
function toggleScorecardOverlay(show){
  document.getElementById('scorecardOverlay').classList.toggle('show', show);
}

// ============================================================
// FIREBASE LISTENER
// ============================================================
onValue(liveRef, snap => {
 const d=snap.val();
 if(!d) return;
 if(requestedMatchId && d.matchId && d.matchId !== requestedMatchId) return;
 const scoreVisible = d.overlay && d.overlay.scoreVisible !== undefined ? d.overlay.scoreVisible : true;
 $("overlay").classList.toggle("hidden", scoreVisible === false);
 applyTheme(d.theme, d.customColors);

 // Full-frame modes
 const summaryOn = d.mode === 'summary';
 if(summaryOn){
   renderSummary(d);
   $("summaryOverlay").classList.add('show');
 }else{
   $("summaryOverlay").classList.remove('show');
 }
 if(d.mode === 'scorecard' || d.mode === 'scorecard1' || d.mode === 'scorecard2'){
   renderFullScorecard(d);
   toggleScorecardOverlay(true);
 } else {
   toggleScorecardOverlay(false);
 }

 const bat=d.battingTeam||"A", bowl=d.bowlingTeam||(bat==="A"?"B":"A");
 $("batTeam").textContent=teamName(d,bat);
 $("bowlTeam").textContent=teamName(d,bowl);

 const b1n=d.b1||d.striker||d.batsman1||"STRIKER";
 const b2n=d.b2||d.nonStriker||d.batsman2||"NON-STRIKER";
 const b1=batterStats(d,b1n), b2=batterStats(d,b2n);
 $("b1name").textContent=b1n; $("b2name").textContent=b2n;
 $("b1runs").textContent=num(b1.runs??d.batsman1Runs);
 $("b1balls").textContent=num(b1.balls??d.batsman1Balls);
 $("b2runs").textContent=num(b2.runs??d.batsman2Runs);
 $("b2balls").textContent=num(b2.balls??d.batsman2Balls);
 $("batter1").classList.toggle("striker", !!b1n && b1n===d.striker);
 $("batter2").classList.toggle("striker", !!b2n && b2n===d.striker);

 const runs=num(d.runs), w=num(d.wickets), balls=num(d.legalBalls);
 const directResult = deriveResult(d) || (d.matchWinner ? d.matchWinner+" WON" : "");
 const isCompleted = d.status === 'completed' || d.matchWinner || !!directResult;
 if(isCompleted && directResult){
   $("scorePill").textContent = directResult;
   $("scorePill").style.background = "linear-gradient(90deg, #00c853, #00e676)";
   $("scorePill").style.color = "#000";
   $("rrr").textContent = "—";
   $("inningsLabel").textContent = "MATCH DECIDED";
 } else {
   $("scorePill").textContent = runs+"-"+w;
   $("scorePill").style.background = "";
   $("scorePill").style.color = "";
   $("inningsLabel").textContent = "INNINGS "+num(d.innings||1);
   $("rrr").textContent = calcRRR(d);
 }
 $("overs").textContent = oversFromBalls(balls)+" ("+balls+")";
 $("crr").textContent = calcCRR(d);
 const title=d.matchName||"League Match"; $("matchTitle").textContent=title;
 const bow=d.bowler||"BOWLER", bo=bowlerStats(d,bow);
 $("bowler").textContent=bow;
 $("bowlerStats").textContent=oversFromBalls(bo.balls)+" O • "+num(bo.runs)+" R • "+num(bo.wickets)+" W";

 updateTarget(d);
 renderBalls(d);
 customLower(d);
 bannerText(d);
 detectAnimation(d);
});
</script>
